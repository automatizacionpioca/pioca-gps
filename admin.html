<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca Panel de Seguimiento</title>

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      box-sizing:border-box;
    }

    .panel{
      max-width:520px;
      margin:0 auto;
      background:#fff;
      padding:22px;
      border-radius:14px;
      border:1px solid #ddd;
      box-sizing:border-box;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    body.piocaListo .panel{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .titulo{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:6px;
    }

    .subtitulo{
      text-align:center;
      font-size:14px;
      color:#555;
      margin-bottom:20px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-top:14px;
      margin-bottom:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:13px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:8px;
      box-sizing:border-box;
      background:#fff;
      font-family:Arial,sans-serif;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:8px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
    }

    button:disabled{
      opacity:.55;
      cursor:default;
    }

    .btnAzul{
      background:#1769aa;
      color:#fff;
    }

    .btnVerde{
      background:#2d7a38;
      color:#fff;
    }

    .btnOscuro{
      background:#333;
      color:#fff;
    }

    .estado{
      display:none;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
      font-size:14px;
      line-height:1.5;
    }

    .ok{
      background:#e5f6e8;
      border:1px solid #a6d8ad;
    }

    .error{
      background:#fff1f1;
      border:1px solid #e4aaaa;
    }

    .info{
      background:#eef5fb;
      border:1px solid #bdd1e4;
    }

    #panelAdmin{
      display:none;
    }

    #verificandoBox{
      display:none;
      text-align:center;
      padding:16px 10px;
      background:#eef5fb;
      border-radius:9px;
      color:#234;
      font-size:14px;
      line-height:1.5;
      margin-bottom:14px;
    }

    .ayuda{
      font-size:12px;
      color:#666;
      margin-top:6px;
      line-height:1.4;
    }

    #btnEmergencia{
      background:#fff;
      color:#b00020;
      border:1px solid #d89ba7;
      padding:10px 12px;
      font-size:12px;
      margin-top:22px;
    }

    #emergenciaAyuda{
      text-align:center;
      font-size:11px;
      color:#777;
      margin-top:6px;
      line-height:1.35;
    }

    /* ==========================================================
       ESTADO DEL AUTODIAGNOSTICO
       ========================================================== */

    #systemTestBox{
      margin-top:18px;
      padding:12px 14px;
      border-radius:9px;
      border:1px solid #d5d5d5;
      background:#f8f8f8;
      text-align:center;
      font-size:12px;
      line-height:1.5;
      color:#555;
      cursor:default;
    }

    #systemTestBox.testOk{
      background:#e5f6e8;
      border-color:#a6d8ad;
      color:#235b2b;
    }

    #systemTestBox.testError{
      background:#fff1f1;
      border-color:#e4aaaa;
      color:#9a1625;
      cursor:pointer;
    }

    #systemTestBox.testRunning{
      background:#fff7dc;
      border-color:#e3cf82;
      color:#705c13;
    }

    #systemTestTitulo{
      font-weight:700;
      margin-bottom:3px;
    }

    #systemTestDetalle{
      display:none;
      margin-top:9px;
      padding-top:9px;
      border-top:1px solid rgba(0,0,0,.12);
      font-size:11px;
      line-height:1.45;
      text-align:left;
    }


    /* ==========================================================
       NUEVO DISEÑO DEL PANEL
       ========================================================== */

    .cabeceraSuperior{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .logoPanel{
      width:82px;
      flex:0 0 82px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logoPanel img{
      width:76px;
      max-width:100%;
      height:auto;
      display:block;
    }

    #systemTestBox{
      flex:1;
      min-width:0;
      margin-top:0;
      padding:11px 12px;
      text-align:left;
    }

    #systemTestTitulo{
      font-size:12px;
      margin-bottom:4px;
    }

    #systemTestEstado{
      font-size:11px;
      line-height:1.35;
    }

    .nombreContactoFila{
      display:grid;
      grid-template-columns:minmax(0,1fr) 92px;
      gap:10px;
      align-items:stretch;
    }

    #btnContacto{
      width:92px;
      margin-top:0;
      padding:8px 6px;
      min-height:52px;
      font-size:11px;
      line-height:1.15;
      border-radius:8px;
    }

    #btnContacto .contactoIcono{
      display:block;
      font-size:18px;
      margin-bottom:2px;
    }

    #accionesSeguimiento{
      display:none;
      gap:10px;
      margin-top:18px;
    }

    #accionesSeguimiento button{
      flex:1;
      width:auto;
      min-height:86px;
      margin-top:0;
      padding:12px 8px;
      border-radius:10px;
      font-size:14px;
      line-height:1.25;
    }

    #btnCrear{
      background:#2d7a38;
      color:#fff;
    }

    #btnEmergencia{
      background:#c62828;
      color:#fff;
      border:0;
      padding:12px 8px;
      font-size:14px;
      margin-top:0;
    }

    #emergenciaAyuda{
      margin-top:8px;
    }

    #btnLogout{
      margin-top:18px;
    }

    @media(max-width:420px){

      body{
        padding:10px;
      }

      .panel{
        padding:16px;
      }

      .cabeceraSuperior{
        gap:9px;
      }

      .logoPanel{
        width:68px;
        flex-basis:68px;
      }

      .logoPanel img{
        width:64px;
      }

      #systemTestBox{
        padding:9px 10px;
      }

      #systemTestTitulo{
        font-size:11px;
      }

      #systemTestEstado{
        font-size:10px;
      }

      .nombreContactoFila{
        grid-template-columns:minmax(0,1fr) 82px;
        gap:8px;
      }

      #btnContacto{
        width:82px;
        font-size:10px;
      }

      #accionesSeguimiento{
        gap:8px;
      }

      #accionesSeguimiento button,
      #btnEmergencia{
        min-height:80px;
        font-size:13px;
      }
    }

    /* ==========================================================
       PANTALLA DE CARGA / RECUPERACION
       Evita el parpadeo del panel mientras Supabase recupera
       el seguimiento activo.
       ========================================================== */

    #splashPioca{
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f5f5f5;
      opacity:1;
      visibility:visible;
      transition:
        opacity .25s ease,
        visibility .25s ease;
      will-change:opacity,visibility;
    }

    #splashPioca.splashOculto{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .splashContenido{
      width:100%;
      padding:24px;
      box-sizing:border-box;
      text-align:center;
    }

    #splashLogo{
      width:88vw;
      max-width:460px;
      height:auto;
      display:block;
      margin:0 auto 22px auto;
    }

    #splashTexto{
      font-size:16px;
      font-weight:700;
      color:#555;
      letter-spacing:.2px;
    }

    @media(max-width:600px){
      #splashLogo{
        width:88vw;
        max-width:none;
      }

      #splashTexto{
        font-size:15px;
      }
    }

  </style>
</head>

<body>


<div id="splashPioca">

  <div class="splashContenido">

    <img
      id="splashLogo"
      src="logo-pioca.png"
      alt="piOca"
    >

    <div id="splashTexto">
      Cargando…
    </div>

  </div>

</div>


<div class="panel">

  <div class="cabeceraSuperior">

    <div class="logoPanel">

      <img
        src="logo-pioca.png"
        alt="piOca"
      >

    </div>

    <div id="systemTestBox">

      <div id="systemTestTitulo">
        Último test automático
      </div>

      <div id="systemTestEstado">
        Verificando...
      </div>

      <div id="systemTestDetalle"></div>

    </div>

  </div>

  <div id="loginBox">

    <label>Email</label>

    <input
      id="email"
      type="email"
      autocomplete="username"
    >

    <label>Contraseña</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <button
      id="btnLogin"
      class="btnAzul"
      type="button">
      INGRESAR
    </button>

    <div
      id="loginEstado"
      class="estado">
    </div>

  </div>

  <div id="panelAdmin">

    <div id="verificandoBox">
      Verificando si existe un seguimiento activo...
    </div>

    <div id="formNuevo" style="display:none;">

      <label>
        Nombre del cliente (opcional)
      </label>

      <div class="nombreContactoFila">

        <input
          id="clientName"
          type="text"
          autocomplete="name"
          placeholder="Nombre del cliente"
        >

        <button
          id="btnContacto"
          class="btnAzul"
          type="button">

          <span class="contactoIcono">
            👤
          </span>

          CONTACTO
        </button>

      </div>

      <div class="ayuda">
        Si no está agendado, cargá los datos manualmente.
      </div>

      <div
        id="contactoEstado"
        class="estado">
      </div>

      <label>
        Teléfono
      </label>

      <input
        id="clientPhone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Ej: 1155555555"
      >

      <label>
        Hora estimada de llegada
      </label>

      <select id="estimatedArrival"></select>

      <label>
        Información adicional
      </label>

      <textarea
        id="additionalInfo"
        placeholder="Opcional. Ej: Por favor dejar libre el acceso al portón."
        maxlength="500"></textarea>

      <div class="ayuda">
        Si lo dejás vacío, no se agrega nada al mensaje de WhatsApp.
      </div>

    </div>

    <div id="accionesSeguimiento">

      <button
        id="btnCrear"
        class="btnVerde"
        type="button">
        🚐 INICIAR<br>SEGUIMIENTO
      </button>

      <button
        id="btnEmergencia"
        type="button">
        ⛔ DETENER<br>SEGUIMIENTO
      </button>

    </div>

    <div
      id="adminEstado"
      class="estado">
    </div>

    <div id="emergenciaAyuda">
      Botón de seguridad. Busca y finaliza el último seguimiento que todavía figure activo.
    </div>

    <div
      id="emergenciaEstado"
      class="estado">
    </div>

    <button
      id="btnLogout"
      class="btnOscuro"
      type="button">
      CERRAR SESIÓN
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){

  const splashPioca =
    document.getElementById(
      "splashPioca"
    );

  const splashInicio =
    Date.now();

  const SPLASH_MINIMO_MS =
    1000;

  let splashCerrando =
    false;

  function ocultarSplash(){

    if(
      splashCerrando ||
      !splashPioca
    ){
      return;
    }

    splashCerrando =
      true;

    const transcurrido =
      Date.now() -
      splashInicio;

    const espera =
      Math.max(
        0,
        SPLASH_MINIMO_MS -
        transcurrido
      );

    setTimeout(
      function(){

        /*
          Primero habilitamos el panel ya resuelto y
          recién después retiramos el splash.
          Así nunca queda visible un estado intermedio.
        */
        document.body.classList.add(
          "piocaListo"
        );

        requestAnimationFrame(
          function(){

            splashPioca.classList.add(
              "splashOculto"
            );

          }
        );

      },
      espera
    );
  }

  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loginBox =
    document.getElementById("loginBox");

  const panelAdmin =
    document.getElementById("panelAdmin");

  const verificandoBox =
    document.getElementById("verificandoBox");

  const formNuevo =
    document.getElementById("formNuevo");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const btnLogin =
    document.getElementById("btnLogin");

  const btnLogout =
    document.getElementById("btnLogout");

  const btnContacto =
    document.getElementById("btnContacto");

  const contactoEstado =
    document.getElementById("contactoEstado");

  const clientName =
    document.getElementById("clientName");

  const clientPhone =
    document.getElementById("clientPhone");

  const estimatedArrival =
    document.getElementById("estimatedArrival");

  const additionalInfo =
    document.getElementById("additionalInfo");

  const btnCrear =
    document.getElementById("btnCrear");

  const btnEmergencia =
    document.getElementById("btnEmergencia");

  const accionesSeguimiento =
    document.getElementById("accionesSeguimiento");

  const loginEstado =
    document.getElementById("loginEstado");

  const adminEstado =
    document.getElementById("adminEstado");

  const emergenciaEstado =
    document.getElementById("emergenciaEstado");

  const systemTestBox =
    document.getElementById("systemTestBox");

  const systemTestEstado =
    document.getElementById("systemTestEstado");

  const systemTestDetalle =
    document.getElementById("systemTestDetalle");

  let ultimoTestTieneProblema =
    false;

  function mostrarEstado(el,texto,tipo){
    el.textContent = texto;
    el.className = "estado " + tipo;
    el.style.display = "block";
  }

  function ocultarEstado(el){
    el.style.display = "none";
    el.textContent = "";
  }

  function formatearFechaTest(valor){

    if(!valor){
      return "-";
    }

    const d =
      new Date(valor);

    if(
      !Number.isFinite(
        d.getTime()
      )
    ){
      return "-";
    }

    return d.toLocaleString(
      "es-AR",
      {
        timeZone:
          "America/Argentina/Buenos_Aires",

        day:"2-digit",
        month:"2-digit",
        year:"numeric",

        hour:"2-digit",
        minute:"2-digit",

        hour12:false
      }
    );
  }

  async function cargarUltimoTest(){

    systemTestBox.className =
      "";

    systemTestEstado.textContent =
      "Verificando...";

    systemTestDetalle.style.display =
      "none";

    systemTestDetalle.textContent =
      "";

    ultimoTestTieneProblema =
      false;

    try{

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_latest_system_test_summary"
        );

      if(error){
        throw error;
      }

      if(
        !Array.isArray(data) ||
        data.length === 0
      ){

        systemTestEstado.textContent =
          "Todavía no hay tests registrados.";

        return;
      }

      const t =
        data[0];

      const fecha =
        formatearFechaTest(
          t.started_at
        );

      if(
        t.status ===
        "ok" &&
        Number(t.positions_written) ===
        Number(t.positions_expected)
      ){

        systemTestBox.className =
          "testOk";

        systemTestEstado.textContent =
          fecha +
          " · ✅ TODO OK · " +
          t.positions_written +
          "/" +
          t.positions_expected +
          " posiciones";

        return;
      }

      if(
        t.status ===
        "running"
      ){

        systemTestBox.className =
          "testRunning";

        systemTestEstado.textContent =
          fecha +
          " · TEST EN CURSO · " +
          t.positions_written +
          "/" +
          t.positions_expected +
          " posiciones";

        return;
      }

      ultimoTestTieneProblema =
        true;

      systemTestBox.className =
        "testError";

      systemTestEstado.textContent =
        fecha +
        " · ⚠️ PROBLEMA · " +
        t.positions_written +
        "/" +
        t.positions_expected +
        " posiciones · Tocá para ver detalle";

    }catch(error){

      systemTestBox.className =
        "testError";

      systemTestEstado.textContent =
        "⚠️ No se pudo consultar el último test.";

      ultimoTestTieneProblema =
        false;
    }
  }

  async function mostrarDetalleUltimoTest(){

    if(
      !ultimoTestTieneProblema
    ){
      return;
    }

    const {
      data:
      sessionData
    } =
      await supabaseClient.auth
      .getSession();

    if(
      !sessionData ||
      !sessionData.session
    ){

      systemTestDetalle.textContent =
        "Ingresá con usuario y contraseña para ver el detalle técnico.";

      systemTestDetalle.style.display =
        "block";

      return;
    }

    systemTestDetalle.textContent =
      "Consultando detalle...";

    systemTestDetalle.style.display =
      "block";

    try{

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_latest_system_test_detail"
        );

      if(error){
        throw error;
      }

      if(
        !Array.isArray(data) ||
        data.length === 0
      ){

        systemTestDetalle.textContent =
          "No hay detalle disponible.";

        return;
      }

      const t =
        data[0];

      systemTestDetalle.textContent =

        "Resultado: " +
        t.positions_written +
        " de " +
        t.positions_expected +
        " posiciones." +

        (
          t.detail
            ? "\n\nDetalle: " +
              t.detail
            : ""
        );

      systemTestDetalle.style.whiteSpace =
        "pre-line";

    }catch(error){

      systemTestDetalle.textContent =
        "No se pudo recuperar el detalle técnico.";
    }
  }

  systemTestBox.addEventListener(
    "click",
    mostrarDetalleUltimoTest
  );

  function redondearProximo5(fecha){
    const d = new Date(fecha);
    d.setSeconds(0);
    d.setMilliseconds(0);

    const minutos = d.getMinutes();
    const resto = minutos % 5;

    if(resto === 0){
      d.setMinutes(minutos + 5);
    }else{
      d.setMinutes(minutos + (5 - resto));
    }

    return d;
  }

  function cargarHorarios(){
    estimatedArrival.innerHTML = "";

    const inicio =
      redondearProximo5(new Date());

    /*
      Horarios iniciales cada 5 minutos.
      Conservamos aproximadamente la misma ventana futura
      que antes: 20 opciones = 100 minutos.
    */
    for(let i = 0; i < 20; i++){
      const h = new Date(
        inicio.getTime() +
        i * 5 * 60 * 1000
      );

      const option =
        document.createElement("option");

      option.value =
        h.toISOString();

      option.textContent =
        h.toLocaleTimeString(
          "es-AR",
          {
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
          }
        );

      estimatedArrival.appendChild(option);
    }
  }

  function limpiarTelefono(numero){
    return String(numero || "")
      .replace(/\D/g,"");
  }

  function limpiarEstadoLocal(){
    localStorage.removeItem("pioca_tracking_code");
    localStorage.removeItem("pioca_tracking_active");
    localStorage.removeItem("pioca_tracking_expires_at");
    localStorage.removeItem("pioca_client_name");
    localStorage.removeItem("pioca_client_phone");
    localStorage.removeItem("pioca_client_link");
    localStorage.removeItem("pioca_additional_info");
  }

  function guardarSeguimientoLocal(s){
    const codigo = String(s.tracking_code || "")
      .trim()
      .toUpperCase();

    localStorage.setItem(
      "pioca_tracking_code",
      codigo
    );

    localStorage.setItem(
      "pioca_tracking_active",
      "1"
    );

    localStorage.setItem(
      "pioca_tracking_expires_at",
      s.expires_at || ""
    );

    localStorage.setItem(
      "pioca_client_name",
      s.client_name || ""
    );

    localStorage.setItem(
      "pioca_client_phone",
      s.client_phone || ""
    );

    localStorage.setItem(
      "pioca_additional_info",
      s.additional_info || ""
    );

    localStorage.setItem(
      "pioca_client_link",
      "https://automatizacionpioca.github.io/pioca-gps/cliente.html?id=" +
      encodeURIComponent(codigo)
    );
  }

  function abrirPanelActivo(s){
    guardarSeguimientoLocal(s);

    window.location.replace(
      "index.html?tracking=" +
      encodeURIComponent(
        String(s.tracking_code || "")
          .trim()
          .toUpperCase()
      )
    );
  }

  async function seleccionarContacto(){
    ocultarEstado(contactoEstado);

    if(
      window.PiocaNative &&
      typeof window.PiocaNative.pickContact === "function"
    ){
      window.PiocaNative.pickContact();
      return;
    }

    const soportado =
      ("contacts" in navigator) &&
      navigator.contacts &&
      typeof navigator.contacts.select === "function";

    if(!soportado){
      mostrarEstado(
        contactoEstado,
        "No se pudo abrir la agenda. Cargá los datos manualmente.",
        "error"
      );
      return;
    }

    try{
      const contactos =
        await navigator.contacts.select(
          ["name","tel"],
          {multiple:false}
        );

      if(!contactos || contactos.length === 0){
        return;
      }

      const contacto = contactos[0];

      if(contacto.name && contacto.name.length){
        clientName.value = contacto.name[0];
      }

      if(contacto.tel && contacto.tel.length){
        clientPhone.value = contacto.tel[0];
      }

      mostrarEstado(
        contactoEstado,
        "✅ Contacto cargado.",
        "ok"
      );

    }catch(e){
      mostrarEstado(
        contactoEstado,
        "No se seleccionó ningún contacto.",
        "error"
      );
    }
  }

  function esErrorJwtFuture(error){

    const partes = [
      error && error.message,
      error && error.details,
      error && error.hint,
      error && error.code
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return (
      partes.includes("jwt issued at future") ||
      partes.includes("issued at future")
    );
  }

  function esperar(ms){
    return new Promise(
      function(resolve){
        setTimeout(resolve,ms);
      }
    );
  }

  async function consultarSeguimientoActivoConRecuperacion(){

    let intento = 0;

    while(intento < 2){

      const {data,error} =
        await supabaseClient.rpc(
          "get_my_active_tracking"
        );

      if(!error){
        return {
          data:data,
          error:null
        };
      }

      if(
        intento === 0 &&
        esErrorJwtFuture(error)
      ){

        try{
          await supabaseClient.auth.refreshSession();
        }catch(e){}

        await esperar(1200);

        intento++;
        continue;
      }

      return {
        data:null,
        error:error
      };
    }

    return {
      data:null,
      error:new Error(
        "No se pudo recuperar la sesión."
      )
    };
  }


  async function verificarSeguimientoActivo(){
    formNuevo.style.display = "none";

    accionesSeguimiento.style.display = "flex";
    btnCrear.style.display = "none";
    btnEmergencia.style.display = "block";

    verificandoBox.style.display = "block";
    verificandoBox.textContent =
      "Verificando si existe un seguimiento activo...";

    try{
      const {data,error} =
        await consultarSeguimientoActivoConRecuperacion();

      if(error){
        throw error;
      }

      if(Array.isArray(data) && data.length > 0){
        abrirPanelActivo(data[0]);
        return;
      }

      limpiarEstadoLocal();

      /*
        SOLO despues de confirmar con el servidor
        que no hay seguimiento activo, detenemos
        cualquier servicio GPS nativo residual.
      */
      if(
        window.PiocaNative &&
        typeof window.PiocaNative.stopTracking === "function"
      ){
        try{
          window.PiocaNative.stopTracking();
        }catch(e){}
      }

      verificandoBox.style.display = "none";
      formNuevo.style.display = "block";

      accionesSeguimiento.style.display = "flex";
      btnCrear.style.display = "block";
      btnEmergencia.style.display = "block";

      cargarHorarios();

      ocultarSplash();

    }catch(error){

      verificandoBox.style.display =
        "block";

      verificandoBox.textContent =
        "No se pudo verificar el estado del seguimiento.";

      const detalle =
        error &&
        (
          error.message ||
          error.details ||
          error.hint ||
          error.code
        )
          ? (
              " Error del servidor: " +
              String(
                error.message ||
                error.details ||
                error.hint ||
                error.code
              )
            )
          : "";

      accionesSeguimiento.style.display = "flex";
      btnCrear.style.display = "none";
      btnEmergencia.style.display = "block";

      mostrarEstado(
        emergenciaEstado,
        "No se habilita un seguimiento nuevo hasta recuperar conexión con el servidor." +
        detalle,
        "error"
      );

      ocultarSplash();
    }
  }

  async function mostrarPanelAutenticado(){
    loginBox.style.display = "none";
    panelAdmin.style.display = "block";
    await verificarSeguimientoActivo();
  }

  async function comprobarSesion(){
    const {data} =
      await supabaseClient.auth.getSession();

    if(
      data &&
      data.session
    ){

      await mostrarPanelAutenticado();

      return;
    }

    ocultarSplash();
  }

  btnContacto.addEventListener(
    "click",
    seleccionarContacto
  );

  btnLogin.addEventListener(
    "click",
    async function(){
      ocultarEstado(loginEstado);

      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email:email.value.trim(),
          password:password.value
        });

      if(error){
        mostrarEstado(
          loginEstado,
          "Usuario o contraseña incorrectos.",
          "error"
        );
        return;
      }

      if(data.session){
        password.value = "";
        await mostrarPanelAutenticado();
      }
    }
  );

  btnLogout.addEventListener(
    "click",
    async function(){
      await supabaseClient.auth.signOut();
      panelAdmin.style.display = "none";
      formNuevo.style.display = "none";
      accionesSeguimiento.style.display = "none";
      verificandoBox.style.display = "none";
      loginBox.style.display = "block";
    }
  );

  btnCrear.addEventListener(
    "click",
    async function(){
      ocultarEstado(adminEstado);

      const nombre = clientName.value.trim();
      const telefono = limpiarTelefono(clientPhone.value);
      const informacion = additionalInfo.value.trim();

      if(!telefono){
        mostrarEstado(
          adminEstado,
          "Completá el teléfono.",
          "error"
        );
        return;
      }

      btnCrear.disabled = true;
      btnCrear.textContent = "CREANDO SEGUIMIENTO...";

      try{
        /*
          Doble proteccion:
          antes de crear, el servidor vuelve a verificar
          que no exista otro seguimiento activo.
        */
        const {data,error} =
          await supabaseClient.rpc(
            "create_tracking_service",
            {
              p_client_name:nombre,
              p_client_phone:telefono,
              p_estimated_arrival:new Date(
                estimatedArrival.value
              ).toISOString(),
              p_additional_info:informacion || null
            }
          );

        if(error){
          throw error;
        }

        if(!Array.isArray(data) || data.length === 0){
          throw new Error("Respuesta vacía del servidor.");
        }

        const s = data[0];

        if(
          s.success === false &&
          s.message === "ACTIVE_EXISTS"
        ){
          abrirPanelActivo(s);
          return;
        }

        if(s.success !== true){
          throw new Error("No se pudo crear el seguimiento.");
        }

        abrirPanelActivo(s);

      }catch(error){
        btnCrear.disabled = false;
        btnCrear.innerHTML = "🚐 INICIAR<br>SEGUIMIENTO";

        mostrarEstado(
          adminEstado,
          "No se pudo crear el seguimiento. Volvé a intentar cuando haya conexión con el servidor.",
          "error"
        );
      }
    }
  );

  btnEmergencia.addEventListener(
    "click",
    async function(){
      ocultarEstado(emergenciaEstado);

      const confirmar = window.confirm(
        "¿Querés detener el seguimiento activo?\n\nEsto invalidará el link del cliente y detendrá la transmisión GPS asociada."
      );

      if(!confirmar){
        return;
      }

      btnEmergencia.disabled = true;
      btnEmergencia.textContent = "DETENIENDO...";

      try{
        const {data,error} =
          await supabaseClient.rpc(
            "finish_latest_active_tracking"
          );

        if(error){
          throw error;
        }

        const r =
          Array.isArray(data) && data.length
            ? data[0]
            : null;

        if(!r || r.success !== true){
          mostrarEstado(
            emergenciaEstado,
            "No hay seguimientos activos para detener.",
            "info"
          );

          formNuevo.style.display = "block";
          accionesSeguimiento.style.display = "flex";
          btnCrear.style.display = "block";

          cargarHorarios();

          limpiarEstadoLocal();

          if(
            window.PiocaNative &&
            typeof window.PiocaNative.stopTracking === "function"
          ){
            try{
              window.PiocaNative.stopTracking();
            }catch(e){}
          }

        }else{
          limpiarEstadoLocal();

          if(
            window.PiocaNative &&
            typeof window.PiocaNative.stopTracking === "function"
          ){
            try{
              window.PiocaNative.stopTracking();
            }catch(e){}
          }

          mostrarEstado(
            emergenciaEstado,
            "Seguimiento detenido. El cliente ya no puede ver la ubicación de la camioneta.",
            "ok"
          );

          formNuevo.style.display = "block";

          accionesSeguimiento.style.display = "flex";
          btnCrear.style.display = "block";

          cargarHorarios();
        }

      }catch(error){
        mostrarEstado(
          emergenciaEstado,
          "No se pudo confirmar el cierre con el servidor. No asumas que el seguimiento está detenido hasta obtener confirmación.",
          "error"
        );

      }finally{
        btnEmergencia.disabled = false;
        btnEmergencia.innerHTML = "⛔ DETENER<br>SEGUIMIENTO";
      }
    }
  );

  cargarUltimoTest();

  comprobarSesion();

})();
</script>
