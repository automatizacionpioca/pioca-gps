<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>piOca - Panel de Seguimiento</title>

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      box-sizing:border-box;
    }

    .panel{
      max-width:520px;
      margin:0 auto;
      background:#fff;
      padding:22px;
      border-radius:14px;
      border:1px solid #ddd;
      box-sizing:border-box;
    }

    .titulo{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:6px;
    }

    .subtitulo{
      text-align:center;
      font-size:14px;
      color:#555;
      margin-bottom:20px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-top:14px;
      margin-bottom:6px;
    }

    input,select{
      width:100%;
      padding:13px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:8px;
      box-sizing:border-box;
      background:#fff;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:8px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
    }

    .btnAzul{
      background:#1769aa;
      color:#fff;
    }

    .btnVerde{
      background:#2d7a38;
      color:#fff;
    }

    .btnOscuro{
      background:#333;
      color:#fff;
    }

    .estado{
      display:none;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
      font-size:14px;
      line-height:1.5;
    }

    .ok{
      background:#e5f6e8;
      border:1px solid #a6d8ad;
    }

    .error{
      background:#fff1f1;
      border:1px solid #e4aaaa;
    }

    #panelAdmin{
      display:none;
    }

    .ayuda{
      font-size:12px;
      color:#666;
      margin-top:6px;
      line-height:1.4;
    }
  </style>
</head>

<body>

<div class="panel">

  <div class="titulo">piOca®</div>
  <div class="subtitulo">Panel de seguimiento</div>

  <div id="loginBox">

    <label>Email</label>
    <input id="email" type="email" autocomplete="username">

    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="btnLogin" class="btnAzul" type="button">
      INGRESAR
    </button>

    <div id="loginEstado" class="estado"></div>

  </div>


  <div id="panelAdmin">

    <button id="btnContacto" class="btnAzul" type="button">
      👤 SELECCIONAR CONTACTO
    </button>

    <div class="ayuda">
      Si el navegador no permite abrir contactos,
      cargá los datos manualmente.
    </div>

    <div id="contactoEstado" class="estado"></div>

    <label>Nombre del cliente</label>

    <input
      id="clientName"
      type="text"
      autocomplete="name"
      placeholder="Nombre del cliente"
    >

    <label>Teléfono</label>

    <input
      id="clientPhone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="Ej: 1155555555"
    >

    <label>Hora estimada de llegada</label>

    <select id="estimatedArrival"></select>

    <button id="btnCrear" class="btnVerde" type="button">
      🚐 INICIAR SEGUIMIENTO
    </button>

    <button id="btnLogout" class="btnOscuro" type="button">
      CERRAR SESIÓN
    </button>

    <div id="adminEstado" class="estado"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){

  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loginBox =
    document.getElementById("loginBox");

  const panelAdmin =
    document.getElementById("panelAdmin");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const btnLogin =
    document.getElementById("btnLogin");

  const btnLogout =
    document.getElementById("btnLogout");

  const btnContacto =
    document.getElementById("btnContacto");

  const contactoEstado =
    document.getElementById("contactoEstado");

  const clientName =
    document.getElementById("clientName");

  const clientPhone =
    document.getElementById("clientPhone");

  const estimatedArrival =
    document.getElementById("estimatedArrival");

  const btnCrear =
    document.getElementById("btnCrear");

  const loginEstado =
    document.getElementById("loginEstado");

  const adminEstado =
    document.getElementById("adminEstado");


  function mostrarEstado(el,texto,tipo){

    el.textContent = texto;
    el.className = "estado " + tipo;
    el.style.display = "block";

  }


  function ocultarEstado(el){

    el.style.display = "none";

  }


  function redondearProximo10(fecha){

    const d = new Date(fecha);

    d.setSeconds(0);
    d.setMilliseconds(0);

    const minutos = d.getMinutes();
    const resto = minutos % 10;

    if(resto === 0){

      d.setMinutes(
        minutos + 10
      );

    }else{

      d.setMinutes(
        minutos + (10 - resto)
      );

    }

    return d;
  }


  function cargarHorarios(){

    estimatedArrival.innerHTML = "";

    const inicio =
      redondearProximo10(
        new Date()
      );

    for(let i=0;i<=9;i++){

      const h =
        new Date(
          inicio.getTime() +
          i * 10 * 60 * 1000
        );

      const option =
        document.createElement("option");

      option.value =
        h.toISOString();

      option.textContent =
        h.toLocaleTimeString(
          "es-AR",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

      estimatedArrival.appendChild(
        option
      );

    }
  }


  function limpiarTelefono(numero){

    return String(
      numero || ""
    ).replace(/\D/g,"");

  }


  async function seleccionarContacto(){

    ocultarEstado(
      contactoEstado
    );

    const soportado =
      ("contacts" in navigator) &&
      navigator.contacts &&
      typeof navigator.contacts.select === "function";

    if(!soportado){

      mostrarEstado(
        contactoEstado,
        "Este navegador no permite seleccionar contactos. Cargalo manualmente.",
        "error"
      );

      return;
    }

    try{

      const contactos =
        await navigator.contacts.select(
          ["name","tel"],
          {
            multiple:false
          }
        );

      if(
        !contactos ||
        contactos.length === 0
      ){
        return;
      }

      const contacto =
        contactos[0];

      if(
        contacto.name &&
        contacto.name.length
      ){

        clientName.value =
          contacto.name[0];

      }

      if(
        contacto.tel &&
        contacto.tel.length
      ){

        clientPhone.value =
          contacto.tel[0];

      }

      mostrarEstado(
        contactoEstado,
        "✅ Contacto cargado.",
        "ok"
      );

    }catch(e){

      mostrarEstado(
        contactoEstado,
        "No se seleccionó ningún contacto.",
        "error"
      );

    }
  }


  async function comprobarSesion(){

    const {data} =
      await supabaseClient.auth
      .getSession();

    if(
      data &&
      data.session
    ){

      loginBox.style.display =
        "none";

      panelAdmin.style.display =
        "block";

      cargarHorarios();

    }
  }


  btnContacto.addEventListener(
    "click",
    seleccionarContacto
  );


  btnLogin.addEventListener(
    "click",
    async function(){

      ocultarEstado(
        loginEstado
      );

      const {
        data,
        error
      } =
        await supabaseClient.auth
        .signInWithPassword({

          email:
            email.value.trim(),

          password:
            password.value

        });

      if(error){

        mostrarEstado(
          loginEstado,
          "Usuario o contraseña incorrectos.",
          "error"
        );

        return;

      }

      if(data.session){

        loginBox.style.display =
          "none";

        panelAdmin.style.display =
          "block";

        password.value = "";

        cargarHorarios();

      }

    }
  );


  btnLogout.addEventListener(
    "click",
    async function(){

      await supabaseClient.auth
        .signOut();

      panelAdmin.style.display =
        "none";

      loginBox.style.display =
        "block";

    }
  );


  btnCrear.addEventListener(
    "click",
    async function(){

      ocultarEstado(
        adminEstado
      );

      const nombre =
        clientName.value.trim();

      const telefono =
        limpiarTelefono(
          clientPhone.value
        );

      if(
        !nombre ||
        !telefono
      ){

        mostrarEstado(
          adminEstado,
          "Completá nombre y teléfono.",
          "error"
        );

        return;
      }


      btnCrear.disabled = true;

      btnCrear.textContent =
        "CREANDO SEGUIMIENTO...";


      const llegada =
        new Date(
          estimatedArrival.value
        );

      const vence =
        new Date(
          llegada.getTime() +
          10 * 60 * 1000
        );


      const {
        data,
        error
      } =
        await supabaseClient
        .from("services")
        .insert({

          client_name:
            nombre,

          client_phone:
            telefono,

          estimated_arrival:
            llegada.toISOString(),

          expires_at:
            vence.toISOString(),

          status:
            "active"

        })
        .select()
        .single();


      if(error){

        btnCrear.disabled =
          false;

        btnCrear.textContent =
          "🚐 INICIAR SEGUIMIENTO";

        mostrarEstado(
          adminEstado,
          "Error al crear seguimiento: " +
          error.message,
          "error"
        );

        return;
      }


      const codigo =
        data.tracking_code;


      /*
        Guardamos TODO lo necesario
        para la pantalla GPS.
      */

      localStorage.setItem(
        "pioca_tracking_code",
        codigo
      );

      localStorage.setItem(
        "pioca_tracking_active",
        "1"
      );

      localStorage.setItem(
        "pioca_client_name",
        nombre
      );

      localStorage.setItem(
        "pioca_client_phone",
        telefono
      );


      const linkCliente =

        "https://automatizacionpioca.github.io/pioca-gps/cliente.html?id=" +
        encodeURIComponent(
          codigo
        );


      localStorage.setItem(
        "pioca_client_link",
        linkCliente
      );


      /*
        Al iniciar seguimiento,
        vamos DIRECTAMENTE al GPS.

        No existe posibilidad de mandar
        WhatsApp antes de activar GPS.
      */

      window.location.href =

        "index.html?tracking=" +
        encodeURIComponent(
          codigo
        );

    }
  );


  comprobarSesion();

})();
</script>

</body>
</html>
