<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title></title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      font-family:Arial,sans-serif;
      background:#ffffff;
      color:#1d2a36;
    }

    body{
      box-sizing:border-box;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(8px, env(safe-area-inset-bottom))
        12px;
    }

    .panel{
      width:100%;
      max-width:620px;
      height:100%;
      margin:0 auto;
      background:#fff;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .cabeceraCliente{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:center;
      margin-bottom:22px;
      flex:0 0 auto;
    }

    .logo{
      text-align:center;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:150px;
    }

    .logo::after{
      content:"";
      position:absolute;
      right:-9px;
      top:16%;
      bottom:16%;
      width:1px;
      background:#e7edf3;
    }

    .logo img{
      width:168px;
      max-width:95%;
      height:auto;
      display:block;
    }

    .cabeceraCliente.finalizado{
      grid-template-columns:1fr;
      justify-items:center;
      margin-bottom:18px;
    }

    .cabeceraCliente.finalizado .logo{
      width:100%;
      min-height:150px;
    }

    .cabeceraCliente.finalizado .logo::after{
      display:none;
    }

    .cabeceraCliente.finalizado #horaLlegadaBox{
      display:none !important;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      flex:0 0 auto;
      min-height:58px;
      padding:10px 14px;
      box-sizing:border-box;
      background:#fff;
      border:1px solid #e3e8ee;
      border-radius:14px;
      text-align:left;
      font-size:15px;
      font-weight:700;
      margin:0 0 16px 0;
      box-shadow:
        0 5px 16px rgba(25,45,65,.07),
        0 1px 3px rgba(25,45,65,.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .estadoEnVivo{
      width:100%;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
    }

    .puntoEnVivo{
      position:relative;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#28bf59;
      flex:0 0 10px;
      margin-left:4px;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(40,191,89,.34);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    .estadoTexto{
      color:#22364a;
      font-weight:700;
      font-size:15px;
      letter-spacing:.05px;
    }

    .estadoBadge{
      justify-self:end;
      padding:6px 10px;
      border-radius:999px;
      background:#e8f8ed;
      color:#28a84f;
      font-size:10px;
      font-weight:700;
      letter-spacing:.35px;
      white-space:nowrap;
    }

    @keyframes piocaLivePulse{
      0%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }
    }

    #horaLlegadaBox{
      display:none;
      width:92%;
      max-width:275px;
      justify-self:center;
      overflow:hidden;
      border:1px solid #e1e7ed;
      border-radius:16px;
      background:#fff;
      box-shadow:
        0 8px 22px rgba(24,45,65,.10),
        0 2px 5px rgba(24,45,65,.05);
    }

    #horaLlegadaTitulo{
      min-height:56px;
      padding:10px 14px 9px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:left;
      color:#5a6671;
      font-size:11px;
      line-height:1.25;
      font-weight:700;
      letter-spacing:.55px;
      text-transform:uppercase;
      background:#fff;
    }

    #horaLlegadaTitulo::before{
      content:"◷";
      width:34px;
      height:34px;
      border-radius:50%;
      background:#1769aa;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      line-height:1;
      flex:0 0 34px;
      box-shadow:0 3px 9px rgba(23,105,170,.22);
    }

    #horaLlegada{
      min-height:86px;
      padding:10px 14px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(
        135deg,
        #182b3c 0%,
        #243d53 100%
      );
      color:#fff;
      font-size:34px;
      font-weight:700;
      letter-spacing:.7px;
      animation:piocaHoraBlink 1.7s ease-in-out infinite;
    }

    @keyframes piocaHoraBlink{
      0%{
        opacity:1;
      }

      50%{
        opacity:.48;
      }

      100%{
        opacity:1;
      }
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      flex-direction:column;
    }

    #mapaContenedor{
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      display:flex;
    }

    #mapa{
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      height:auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #e0e5ea;
      box-sizing:border-box;
      box-shadow:
        0 6px 18px rgba(20,45,65,.07);
    }

    #btnRefrescarPosicion{
      position:absolute;
      right:12px;
      bottom:12px;
      z-index:1002;
      border:1px solid rgba(32,50,70,.16);
      background:rgba(255,255,255,.95);
      color:#203246;
      border-radius:999px;
      padding:9px 12px;
      font-family:Arial,sans-serif;
      font-size:11px;
      font-weight:700;
      line-height:1;
      box-shadow:0 4px 12px rgba(0,0,0,.14);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      backdrop-filter:blur(5px);
    }

    #btnRefrescarPosicion:active{
      transform:scale(.97);
    }

    #btnRefrescarPosicion:disabled{
      opacity:.62;
      cursor:default;
    }

    #fraseServicio{
      flex:0 0 auto;
      margin-top:12px;
      margin-bottom:0;
      padding:12px 14px;
      text-align:center;
      font-size:12px;
      line-height:1.35;
      color:#4e5963;
      font-weight:400;
      background:#fff;
      border:1px solid #e2e8ee;
      border-radius:14px;
      box-shadow:
        0 5px 16px rgba(25,45,65,.06);
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    #fraseServicio::before{
      content:"◷";
      width:28px;
      height:28px;
      border:2px solid #9ec1e5;
      color:#1769aa;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 28px;
      box-sizing:border-box;
    }

    #fraseServicio strong{
      color:#1769aa;
      font-weight:700;
    }

    /* ==========================================================
       INDICADOR DE VEHÍCULO PIOCA
       - camioneta vista desde arriba
       - punto azul EXACTAMENTE en la trompa = posición GPS real
       - cono azul nace desde ese punto y apunta hacia el rumbo
       ========================================================== */

    .piocaVehiculoIcon{
      background:transparent !important;
      border:0 !important;
      overflow:visible !important;
    }

    .piocaVehiculoWrap{
      position:relative;
      width:100%;
      height:100%;
      overflow:visible;
      pointer-events:none;
      transform-origin:50% 20%;
    }

    .piocaRumboCono{
      position:absolute;
      left:50%;
      top:20%;
      width:50%;
      height:62%;
      transform:translate(-50%,-100%);
      transform-origin:50% 100%;
      clip-path:polygon(50% 100%, 8% 0%, 92% 0%);
      background:linear-gradient(
        to top,
        rgba(47,111,232,.52) 0%,
        rgba(68,132,248,.24) 55%,
        rgba(68,132,248,.04) 100%
      );
      z-index:1;
    }

    .piocaRumboCono::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:0;
      width:18%;
      height:100%;
      transform:translateX(-50%);
      background:linear-gradient(
        to top,
        rgba(38,97,222,.52),
        rgba(68,132,248,.02)
      );
    }

    .piocaPuntoTrompa{
      position:absolute;
      left:50%;
      top:20%;
      width:11px;
      height:11px;
      border-radius:50%;
      background:#2d6fe8;
      border:2px solid #ffffff;
      box-sizing:border-box;
      transform:translate(-50%,-50%);
      box-shadow:
        0 0 0 3px rgba(45,111,232,.20),
        0 2px 5px rgba(0,0,0,.20);
      z-index:5;
    }

    .piocaCamionetaTop{
      position:absolute;
      left:50%;
      top:20%;
      width:44%;
      height:72%;
      transform:translate(-50%,0);
      z-index:3;
      filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));
    }

    .piocaCamionetaTop svg{
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
    }

    .leaflet-control-attribution{
      background:rgba(255,255,255,.72) !important;
      color:#6f7880 !important;
      font-size:8px !important;
      line-height:1.15 !important;
      padding:2px 4px !important;
      border-radius:0 5px 0 0 !important;
      box-shadow:none !important;
      opacity:.62;
      backdrop-filter:blur(3px);
    }

    .leaflet-control-attribution a{
      color:#6f7880 !important;
      text-decoration:none !important;
    }

    .leaflet-popup-content{
      width:145px !important;
      max-width:145px;
      text-align:center;
      line-height:1.2;
      margin:10px 12px;
      font-size:11px;
      color:#203246;
      font-weight:700;
    }

    .leaflet-popup-content-wrapper{
      border-radius:13px;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    #actualizacionBox{
      position:absolute;
      top:14px;
      right:14px;
      z-index:1000;
      background:linear-gradient(
        135deg,
        rgba(22,39,54,.96) 0%,
        rgba(30,54,74,.96) 100%
      );
      color:#4ee07d;
      padding:10px 13px;
      border-radius:12px;
      font-size:11px;
      font-weight:700;
      line-height:1.25;
      text-align:left;
      box-shadow:0 5px 14px rgba(0,0,0,.20);
      pointer-events:none;
      min-width:145px;
    }

    #actualizacionBox::before{
      content:"⌖";
      display:inline-block;
      margin-right:6px;
      color:#4ee07d;
      font-size:16px;
      vertical-align:-1px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }



    /* Estado especial cuando faltan 3 minutos o menos */
    #estado.estadoProximo{
      background:#fff4d6 !important;
      border-color:#f0c45b;
      color:#8a5a00;
      animation:piocaLlegandoPulse 1.15s ease-in-out infinite;
    }

    @keyframes piocaLlegandoPulse{
      0%,100%{ box-shadow:0 5px 16px rgba(25,45,65,.07),0 1px 3px rgba(25,45,65,.04); }
      50%{ box-shadow:0 0 0 5px rgba(240,196,91,.22),0 5px 18px rgba(25,45,65,.10); }
    }

    .leaflet-popup.popupProximo .leaflet-popup-content-wrapper{
      background:#fff1b8;
      border:2px solid #f0b429;
      animation:piocaPopupPulse 1.05s ease-in-out infinite;
    }

    .leaflet-popup.popupProximo .leaflet-popup-tip{
      background:#fff1b8;
    }

    .leaflet-popup.popupLlegado .leaflet-popup-content-wrapper{
      background:#dff5e1;
      border:2px solid #47b864;
      animation:piocaPopupLlegado 1.15s ease-in-out infinite;
    }

    .leaflet-popup.popupLlegado .leaflet-popup-tip{
      background:#dff5e1;
    }

    @keyframes piocaPopupPulse{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.055);}
    }

    @keyframes piocaPopupLlegado{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.04);}
    }

    #estado.estadoLlegado{
      background:#dff5e1 !important;
      border-color:#9fd4aa;
      color:#236b34;
    }

    .llegadaFinal{
      width:100%;
      text-align:center;
      padding:8px 4px;
      box-sizing:border-box;
    }

    .llegadaFinalTitulo{
      font-size:21px;
      font-weight:700;
      color:#246b35;
      margin-bottom:8px;
    }

    .llegadaFinalGracias{
      font-size:15px;
      font-weight:700;
      color:#22364a;
      margin-bottom:5px;
    }

    .marcaRegistrada{
      display:inline-block;
      font-size:.38em;
      line-height:1;
      position:relative;
      top:-0.78em;
      margin-left:1px;
      font-weight:700;
    }

    .llegadaFinalFrase{
      font-size:12px;
      font-weight:400;
      color:#596672;
      line-height:1.4;
    }

    @media(max-height:760px){

      .cabeceraCliente{
        gap:12px;
        margin-bottom:12px;
      }

      .logo img{
        width:135px;
      }

      #estado{
        padding:10px 8px;
        margin-bottom:10px;
        font-size:14px;
      }

      #horaLlegadaTitulo{
        min-height:36px;

        font-size:9px;
      }

      #horaLlegada{
        min-height:46px;

        font-size:21px;
      }

      #fraseServicio{

        font-size:11.5px;
      }
    }

    @media(max-width:600px){

      body{
        padding:
          max(8px, env(safe-area-inset-top))

      }

      #horaLlegadaTitulo::before{

      }

      }

      }

      }

        padding:5px 8px;

      }

      }

        font-size:10px;
      }

      }

      }
    }

(function(){

  let ultimaVelocidadValidaKmh =

  const VELOCIDAD_MAXIMA_VALIDA_KMH =

  const DISTANCIA_DETENIDO_METROS =

  /*

    con un tope corto para no inventar recorrido.

  const VELOCIDAD_MICROPROYECCION_KMH =
    20;

  const VELOCIDAD_MICROPROYECCION_MS =

  const DISTANCIA_MAXIMA_MICROPROYECCION_METROS =
    15;

  let ultimoRumboVisual =
    0;

  /*
    Mientras todavía no existe un rumbo real confirmado,
    la camioneta se muestra alineada con la orientación
    actual del mapa (visualmente apunta hacia arriba).

    Una vez confirmado movimiento real, se utiliza rumbo GPS.
  */
  let rumboRealConfirmado =
    false;

  let candidatoRumboPendiente =
    null;

  let candidatosMovimientoConsecutivos =
    0;

  const MOVIMIENTOS_CONSECUTIVOS_PARA_RUMBO =
    2;

  const DIFERENCIA_MAXIMA_CANDIDATOS_RUMBO =
    38;

  function dimensionesVehiculoPorZoom(){

    const zoom =
      mapa &&
      typeof mapa.getZoom === "function"
        ? mapa.getZoom()
        : 16;

    if(zoom >= 18){
      return {ancho:68, alto:88};
    }

    if(zoom >= 16){
      return {ancho:62, alto:80};
    }

    if(zoom >= 14){
      return {ancho:56, alto:72};
    }

    if(zoom >= 12){
      return {ancho:50, alto:64};
    }

    return {ancho:45, alto:58};
  }

  function obtenerBearingMapa(){

    if(
      !mapa
    ){
      return 0;
    }

    try{

      if(
        typeof mapa.getBearing === "function"
      ){
        const bearing =
          Number(
            mapa.getBearing()
          );

        if(
          Number.isFinite(
            bearing
          )
        ){
          return bearing;
        }
      }

    }catch(e){}

    /*
      Fallback defensivo para versiones del plugin
      que expongan el bearing internamente.
    */
    const interno =
      Number(
        mapa._bearing
      );

    return Number.isFinite(
      interno
    )
      ? interno
      : 0;
  }

  function rumboVisualEnPantalla(){

    const bearingMapa =
      obtenerBearingMapa();

    /*
      Al iniciar, todavía no conocemos el sentido real de marcha.
      En ese momento la camioneta queda alineada con el mapa:
      visualmente apunta hacia arriba, acompañando la orientación
      que tenga el mapa en pantalla.

      Cuando ya existe rumbo real confirmado:
          rumbo visual = rumbo real - bearing del mapa
    */
    if(
      !rumboRealConfirmado
    ){
      return 0;
    }

    return (
      ultimoRumboVisual -
      bearingMapa +
      360
    ) % 360;
  }

  function crearIconoVehiculoPioca(){

    const dimensiones =

    const rumboPantalla =

    const html =

        '<div class="piocaRumboCono"></div>' +

        '<div class="piocaCamionetaTop">' +

            '<rect x="7" y="5" width="28" height="71" rx="9" ' +
            'fill="#ffffff" stroke="#1c2731" stroke-width="2"/>' +

            '<path d="M10 18 Q21 12 32 18 L30.5 27 ' +
            'Q21 23.5 11.5 27 Z" fill="#1f252a"/>' +

            '<path d="M11.5 61 Q21 64.5 30.5 61 L31.5 69 ' +
            'Q21 72.5 10.5 69 Z" fill="#2d3439"/>' +

            '<rect x="3.5" y="28" width="4" height="10" rx="1.5" ' +
            'fill="#20272d"/>' +
            '<rect x="34.5" y="28" width="4" height="10" rx="1.5" ' +
            'fill="#20272d"/>' +

            '<rect x="8.5" y="63" width="3" height="7" rx="1" ' +
            'fill="#e33b32"/>' +
            '<rect x="30.5" y="63" width="3" height="7" rx="1" ' +
            'fill="#e33b32"/>' +

            '<text x="21" y="48" text-anchor="middle" ' +
            'font-family="Arial,sans-serif" font-size="10" ' +
            'font-weight="700" fill="#1769aa">piOca</text>' +

          '</svg>' +
        '</div>' +

      '</div>';

    return L.divIcon({
      className:"piocaVehiculoIcon",
      html:html,
      iconSize:[

        dimensiones.alto
      ],

      /*
        La coordenada GPS queda clavada en el punto azul

      iconAnchor:[
        dimensiones.ancho / 2,

      ],

    });
  }

  function actualizarIconoVehiculo(){

    if(!marcador){
      return;
    }

    marcador.setIcon(
      crearIconoVehiculoPioca()
    );
  }

  function detenerReloj(){

    if(
      relojEstado !== null
    ){

      clearInterval(
        relojEstado
      );

      relojEstado =
        null;
    }
  }

  function detenerConsultas(){

    if(
      consultaId !== null
    ){

      clearInterval(
        consultaId
      );

      consultaId =
        null;
    }

    if(
      watchdogConsultaId !== null
    ){

      clearInterval(
        watchdogConsultaId
      );

      watchdogConsultaId =
        null;
    }

    if(
      consultaAbortController
    ){

      try{
        consultaAbortController.abort();
      }catch(e){}

      consultaAbortController =
        null;
    }

    consultaEnCurso =
      false;
  }

  function iniciarCicloConsultas(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    if(
      consultaId !== null
    ){
      clearInterval(
        consultaId
      );
    }

    consultaId =
      setInterval(
        function(){
          consultar(false);
        },
        3000
      );

    if(
      watchdogConsultaId === null
    ){

      watchdogConsultaId =
        setInterval(
          function(){

            if(
              terminado ||
              !codigo
            ){
              return;
            }

            const demora =
              Date.now() -
              ultimaConsultaFinalizadaMs;

            /*
              Si la pantalla dejó de completar consultas
              durante 20 segundos, se reconstruye el ciclo.
            */
            if(
              demora >= 20000
            ){

              if(
                consultaAbortController
              ){
                try{
                  consultaAbortController.abort();
                }catch(e){}
              }

              consultaEnCurso =
                false;

              ultimaConsultaFinalizadaMs =
                Date.now();

              iniciarCicloConsultas();

              consultar(true);
            }
          },
          5000
        );
    }
  }

  function refrescarConsultaManual(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    btnRefrescarPosicion.disabled =
      true;

    btnRefrescarPosicion.textContent =
      "↻ ACTUALIZANDO...";

    iniciarCicloConsultas();

    consultar(true)
      .finally(
        function(){

          setTimeout(
            function(){

              btnRefrescarPosicion.disabled =
                false;

              btnRefrescarPosicion.textContent =
                "↻ REFRESCAR POSICIÓN";

            },
            700
          );
        }
      );
  }

  function detenerAnimacionMarcador(){

    if(
      animacionMarcadorId !== null
    ){

      cancelAnimationFrame(
        animacionMarcadorId
      );

      animacionMarcadorId =
        null;
    }
  }

  function ocultarHoraLlegada(){

    horaLlegadaBox.style.display =
      "none";

    horaLlegada.textContent =
      "--:--";
  }

  function mostrarHoraLlegada(
    valor
  ){

    if(
      !valor
    ){

      ocultarHoraLlegada();

      return;
    }

    const fecha =
      new Date(
        valor
      );

    if(
      !Number.isFinite(
        fecha.getTime()
      )
    ){

      ocultarHoraLlegada();

      return;
    }

    horaLlegada.textContent =

      fecha.toLocaleTimeString(
        "es-AR",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      );

    horaLlegadaBox.style.display =
      "grid";

    llegadaClienteMs =
      fecha.getTime();
  }

  function aplicarClasePopup(
    clase
  ){

    if(!marcador){ return; }

    try{
      const popup = marcador.getPopup();
      if(!popup){ return; }

      const elemento = popup.getElement();
      if(!elemento){ return; }

      elemento.classList.remove(
        "popupProximo",
        "popupLlegado"
      );

      if(clase){
        elemento.classList.add(clase);
      }

    }catch(e){}
  }

  function actualizarPopupLlegada(
    modo
  ){

    if(!marcador){ return; }

    try{

      if(modo === "llegado"){
        marcador.setPopupContent(
          "<strong>¡HEMOS LLEGADO!</strong>"
        );
        aplicarClasePopup("popupLlegado");
        return;
      }

      if(modo === "proximo"){
        marcador.setPopupContent(
          "<strong>¡Estamos próximos a llegar!</strong>"
        );
        aplicarClasePopup("popupProximo");
        return;
      }

      marcador.setPopupContent(
        "<strong>¡Estamos en camino!</strong>"
      );
      aplicarClasePopup("");

    }catch(e){}
  }

  function pintarEstadoNormalEnVivo(){

    estado.classList.remove(
      "estadoProximo",
      "estadoLlegado"
    );

    estado.innerHTML =
      '<span class="estadoEnVivo">' +
        '<span class="puntoEnVivo"></span>' +
        '<span class="estadoTexto">Seguimiento en tiempo real</span>' +
        '<span class="estadoBadge">EN VIVO</span>' +
      '</span>';

    estado.style.background =
      "#dff5e1";
  }

  function actualizarEstadoLlegada(){

    if(
      terminado ||
      !llegadaClienteMs ||
      !Number.isFinite(llegadaClienteMs)
    ){
      return;
    }

    const faltanMs =
      llegadaClienteMs - Date.now();

    if(
      faltanMs <= 60 * 1000 &&
      faltanMs > -20 * 60 * 1000
    ){

      estado.classList.remove("estadoProximo");
      estado.classList.add("estadoLlegado");
      estado.textContent = "✅ HEMOS LLEGADO";
      actualizarPopupLlegada("llegado");
      return;
    }

    if(
      faltanMs <= 5 * 60 * 1000 &&
      faltanMs > 60 * 1000
    ){

      estado.classList.remove("estadoLlegado");
      estado.classList.add("estadoProximo");
      estado.textContent = "📍 ¡Estamos próximos a llegar!";
      actualizarPopupLlegada("proximo");
      return;
    }

    pintarEstadoNormalEnVivo();
    actualizarPopupLlegada("normal");
  }

  async function enviarHeartbeatCliente(){

    if(
      terminado ||
      !codigo ||
      document.visibilityState !== "visible"
    ){
      return;
    }

    const ahora = Date.now();

    if(
      ahora - ultimoHeartbeatClienteMs < 8000
    ){
      return;
    }

    ultimoHeartbeatClienteMs = ahora;

    try{
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/client_tracking_heartbeat",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            p_code:codigo
          })
        }
      );
    }catch(e){}
  }

  function iniciarHeartbeatCliente(){
    if(heartbeatClienteId !== null){
      return;

    enviarHeartbeatCliente();

    heartbeatClienteId =
      setInterval(
        enviarHeartbeatCliente,
        10000
      );
  }

    if(

      marcador

      try{

        mapa.removeLayer(

      marcador =
        null;

  function mostrarFinalizado(){

    terminado =

    detenerReloj();

    detenerConsultas();

    detenerAnimacionMarcador();

    ultimaActualizacionMs =

    ultimoCreatedAtServidor =

    ultimaVelocidadValidaKmh =

    ultimoRumboVisual =

    candidatoRumboPendiente =

    candidatosMovimientoConsecutivos =

      "none";

      cabeceraCliente

    estado.classList.remove(

    estado.innerHTML =

        '<div class="llegadaFinalFrase">Respetar tu tiempo también es parte de nuestro servicio.</div>' +
      '</div>';

    estado.style.background =
      "#e5f6e8";

    if(heartbeatClienteId !== null){
      clearInterval(heartbeatClienteId);
      heartbeatClienteId = null;
    }
  }

  function ocultarTodo(){

    if(
      terminado
    ){

      return;
    }

    if(
      cabeceraCliente
    ){
      cabeceraCliente.classList.remove(
        "finalizado"
      );
    }

    estado.textContent =
      "Seguimiento no disponible";

    estado.style.background =
      "#eeeeee";

    mapaWrap.style.display =
      "none";

    ocultarHoraLlegada();

    ultimaActualizacionMs =
      null;

    ultimoCreatedAtServidor =
      null;

    ultimoPuntoServidor =
      null;

    penultimoPuntoServidor =
      null;

    ultimaVelocidadValidaKmh =
      null;

    ultimoRumboVisual =
      0;

    rumboRealConfirmado =
      false;

    candidatoRumboPendiente =
      null;

    candidatosMovimientoConsecutivos =
      0;

    detenerReloj();

    detenerAnimacionMarcador();

    quitarMarcador();
  }

  function actualizarIndicador(){

    if(
      !ultimaActualizacionMs ||
      terminado
    ){

      return;
    }

    const diferencia =

      Math.max(

        0,

        Math.floor(

          (
            Date.now() -
            ultimaActualizacionMs
          ) / 1000

        )

      );

    actualizacionSegundos.textContent =
      "hace " +
      diferencia +
      " s";

    if(
      diferencia <=
      15
    ){

      actualizacionBox.className =
        "actualizacionOk";

      actualizacionTexto.textContent =
        "UBICACIÓN ACTUALIZADA";

    }else{

      actualizacionBox.className =
        "actualizacionError";

      actualizacionTexto.textContent =
        "SIN ACTUALIZACIÓN";
    }
  }

  function iniciarReloj(){

    if(
      relojEstado !== null ||
      terminado
    ){

      return;
    }

    actualizarIndicador();
    actualizarEstadoLlegada();

    relojEstado =
      setInterval(
        function(){
          actualizarIndicador();
          actualizarEstadoLlegada();
        },
        1000
      );
  }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 - lat1
      );

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +
      Math.cos(gradosARadianes(lat1)) *
      Math.cos(gradosARadianes(lat2)) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function proyectarPuntoPorRumbo(
    lat,
    lon,
    rumbo,
    distancia
  ){

    const radioTierra =
      6371000;

    const angular =
      distancia /
      radioTierra;

    const rumboRad =
      gradosARadianes(
        rumbo
      );

    const latRad =
      gradosARadianes(
        lat
      );

    const lonRad =
      gradosARadianes(
        lon
      );

    const latDestino =
      Math.asin(
        Math.sin(latRad) *
        Math.cos(angular) +
        Math.cos(latRad) *
        Math.sin(angular) *
        Math.cos(rumboRad)
      );

    const lonDestino =
      lonRad +
      Math.atan2(
        Math.sin(rumboRad) *
        Math.sin(angular) *
        Math.cos(latRad),
        Math.cos(angular) -
        Math.sin(latRad) *
        Math.sin(latDestino)
      );

    return {
      lat:
        latDestino *
        180 /
        Math.PI,
      lon:
        lonDestino *
        180 /
        Math.PI
    };
  }

  function interpolar(
    valor,
    x1,
    y1,
    x2,
    y2
  ){

    if(
      x2 === x1
    ){
      return y2;
    }

    const t =
      Math.max(
        0,
        Math.min(
          1,
          (
            valor -
            x1
          ) /
          (
            x2 -
            x1
          )
        )
      );

    return y1 +
      (
        y2 -
        y1
      ) *
      t;
  }

  function rumboGrados(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const phi1 =
      gradosARadianes(lat1);

    const phi2 =
      gradosARadianes(lat2);

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const y =
      Math.sin(dLon) *
      Math.cos(phi2);

    const x =
      Math.cos(phi1) *
      Math.sin(phi2) -
      Math.sin(phi1) *
      Math.cos(phi2) *
      Math.cos(dLon);

    let grados =
      Math.atan2(y,x) *
      180 /
      Math.PI;

    grados =
      (grados + 360) % 360;

    return grados;
  }

  function diferenciaRumboGrados(
    rumbo1,
    rumbo2
  ){

    let diferencia =
      Math.abs(
        rumbo2 -
        rumbo1
      );

    if(
      diferencia >
        180
    ){
      diferencia =
        360 -
        diferencia;
    }

    return diferencia;
  }

  function suavizarRumboVisual(
    rumboActual,
    rumboObjetivo
  ){

    if(
      !Number.isFinite(
        rumboActual
      )
    ){
      return rumboObjetivo;
    }

    let delta =
      (
        rumboObjetivo -
        rumboActual +
        540
      ) %
      360 -
      180;

    delta =
      Math.max(
        -55,
        Math.min(
          55,
          delta
        )
      );

    return (
      rumboActual +
      delta +
      360
    ) % 360;
  }

  function evaluarRumboReal(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !ultimoPuntoServidor
    ){
      return ultimoRumboVisual;
    }

    const distancia =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    /*
      Si está parado o casi parado, NO tocamos el rumbo.
      Además descartamos cualquier candidato pendiente.
      La camioneta queda mirando exactamente hacia donde venía.
    */
    if(
      !Number.isFinite(
        distancia
      ) ||
      distancia <
        DISTANCIA_MINIMA_CAMBIO_RUMBO_METROS ||
      !Number.isFinite(
        velocidadKmh
      ) ||
      velocidadKmh <
        VELOCIDAD_MINIMA_CAMBIO_RUMBO_KMH
    ){

      candidatoRumboPendiente =
        null;

      candidatosMovimientoConsecutivos =
        0;

      return ultimoRumboVisual;
    }

    const rumboCalculado =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    /*
      Para evitar que una deriva GPS aislada haga girar
      la camioneta, exigimos dos segmentos consecutivos
      compatibles antes de aceptar un rumbo nuevo.
    */
    if(
      candidatoRumboPendiente ===
        null
    ){

      candidatoRumboPendiente =
        rumboCalculado;

      candidatosMovimientoConsecutivos =
        1;

      return ultimoRumboVisual;
    }

    const diferenciaCandidatos =
      diferenciaRumboGrados(
        candidatoRumboPendiente,
        rumboCalculado
      );

    if(
      diferenciaCandidatos >
        DIFERENCIA_MAXIMA_CANDIDATOS_RUMBO
    ){

      candidatoRumboPendiente =
        rumboCalculado;

      candidatosMovimientoConsecutivos =
        1;

      return ultimoRumboVisual;
    }

    candidatosMovimientoConsecutivos +=
      1;

    candidatoRumboPendiente =
      rumboCalculado;

    if(
      candidatosMovimientoConsecutivos <
        MOVIMIENTOS_CONSECUTIVOS_PARA_RUMBO
    ){
      return ultimoRumboVisual;
    }

    /*
      Primer rumbo real confirmado:
      lo tomamos directamente para que la camioneta se alinee
      rápido con la calle/sentido de circulación.

      Luego los cambios normales siguen suavizados.
    */
    if(
      !rumboRealConfirmado
    ){

      rumboRealConfirmado =
        true;

      candidatosMovimientoConsecutivos =
        0;

      candidatoRumboPendiente =
        null;

      return rumboCalculado;
    }

    candidatosMovimientoConsecutivos =
      0;

    candidatoRumboPendiente =
      null;

    return suavizarRumboVisual(
      ultimoRumboVisual,
      rumboCalculado
    );
  }

  function esGiroProtegidoBajaVelocidad(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      ) ||
      velocidadKmh >=
        VELOCIDAD_GIRO_PROTEGIDO_KMH ||
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      return false;
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_GIRO_METROS ||
      distanciaNueva <
        DISTANCIA_MINIMA_GIRO_METROS
    ){
      return false;
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    return diferenciaRumboGrados(
      rumboAnterior,
      rumboNuevo
    ) >=
      ANGULO_GIRO_PROTEGIDO_GRADOS;
  }

  function porcentajeBaseOriginal(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.85;
    }

    if(
      velocidadKmh <=
      20
    ){
      return interpolar(
        velocidadKmh,
        0,
        0.70,
        20,
        0.76
      );
    }

    if(
      velocidadKmh <=
      50
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.76,
        50,
        0.84
      );
    }

    if(
      velocidadKmh <=
      80
    ){
      return interpolar(
        velocidadKmh,
        50,
        0.84,
        80,
        0.90
      );
    }

    if(
      velocidadKmh <=
      120
    ){
      return interpolar(
        velocidadKmh,
        80,
        0.90,
        120,
        0.95
      );
    }

    return 0.95;
  }

  function porcentajeAnimacionSegunVelocidad(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.95;
    }

    if(
      velocidadKmh <=
      10
    ){
      return 0.99;
    }

    if(
      velocidadKmh <=
      20
    ){
      return interpolar(
        velocidadKmh,
        10,
        0.99,
        20,
        0.97
      );
    }

    if(
      velocidadKmh <=
      30
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.97,
        30,
        0.94
      );
    }

    if(
      velocidadKmh <
        40
    ){
      return interpolar(
        velocidadKmh,
        30,
        0.94,
        40,
        0.90
      );
    }

    if(
      velocidadKmh <=
        60
    ){

      const base =
        porcentajeBaseOriginal(
          velocidadKmh
        );

      const ajuste =
        interpolar(
          velocidadKmh,
          40,
          0.025,
          60,
          0
        );

      return Math.min(
        0.96,
        base +
        ajuste
      );
    }

    return porcentajeBaseOriginal(
      velocidadKmh
    );
  }

  function calcularVelocidadInterna(
    latNuevo,
    lonNuevo,
    createdAtNuevo
  ){

    if(
      !ultimoPuntoServidor ||
      !ultimoCreatedAtServidor
    ){
      return ultimaVelocidadValidaKmh;
    }

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervaloSegundos =
      (
        nuevoMs -
        anteriorMs
      ) /
      1000;

    if(
      !Number.isFinite(
        intervaloSegundos
      ) ||
      intervaloSegundos <=
        0
    ){
      return ultimaVelocidadValidaKmh;
    }

    const distancia =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    /*
      Si prácticamente no se desplazó,
      consideramos velocidad real 0 km/h.
    */
    if(
      distancia <=
        DISTANCIA_DETENIDO_METROS
    ){

      ultimaVelocidadValidaKmh =
        0;

      return 0;
    }

    const velocidadCalculada =
      (
        distancia /
        intervaloSegundos
      ) *
      3.6;

    /*
      Si el salto implicaría una velocidad absurda,
      NO contaminamos la estimación:
      reutilizamos la última velocidad válida.
    */
    if(
      !Number.isFinite(
        velocidadCalculada
      ) ||
      velocidadCalculada >
        VELOCIDAD_MAXIMA_VALIDA_KMH
    ){

      return ultimaVelocidadValidaKmh;
    }

    ultimaVelocidadValidaKmh =
      velocidadCalculada;

    return velocidadCalculada;
  }

  function calcularDuracionAnimacion(
    latNuevo,
    lonNuevo,
    createdAtNuevo,
    velocidadInterna
  ){

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    if(
      !Number.isFinite(
        nuevoMs
      ) ||
      !ultimoCreatedAtServidor
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervalo =
      nuevoMs -
      anteriorMs;

    if(
      !Number.isFinite(
        intervalo
      ) ||
      intervalo <=
        0
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const velocidad =
      Number.isFinite(
        velocidadInterna
      )
        ? velocidadInterna
        : calcularVelocidadInterna(
            latNuevo,
            lonNuevo,
            createdAtNuevo
          );

    const porcentaje =
      porcentajeAnimacionSegunVelocidad(
        velocidad
      );

    return Math.max(
      1200,
      Math.min(
        9800,
        intervalo *
        porcentaje
      )
    );
  }

  function iniciarMicroproyeccionPostGiro(
    latBase,
    lonBase,
    rumbo
  ){

    if(
      !mapa ||
      !marcador ||
      !Number.isFinite(
        rumbo
      )
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicio =
      performance.now();

    const duracionMaximaMs =
      (
        DISTANCIA_MAXIMA_MICROPROYECCION_METROS /
        VELOCIDAD_MICROPROYECCION_MS
      ) *
      1000;

    function pasoMicro(
      ahora
    ){

      const transcurrido =
        Math.max(
          0,
          ahora -
          inicio
        );

      const distancia =
        Math.min(
          DISTANCIA_MAXIMA_MICROPROYECCION_METROS,
          VELOCIDAD_MICROPROYECCION_MS *
          (
            transcurrido /
            1000
          )
        );

      const punto =
        proyectarPuntoPorRumbo(
          latBase,
          lonBase,
          rumbo,
          distancia
        );

      marcador.setLatLng(
        [
          punto.lat,
          punto.lon
        ]
      );

      mapa.panTo(
        [
          punto.lat,
          punto.lon
        ],
        {
          animate:false
        }
      );

      if(
        transcurrido <
          duracionMaximaMs
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            pasoMicro
          );

      }else{

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        pasoMicro
      );
  }

  function animarMarcadorHasta(
    latDestino,
    lonDestino,
    duracionMs
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distancia =
      distanciaMetros(
        latInicio,
        lonInicio,
        latDestino,
        lonDestino
      );

    if(
      distancia >
        DISTANCIA_MAXIMA_ANIMACION_METROS
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      mapa.panTo(
        [latDestino, lonDestino],
        {
          animate:true,
          duration:0.8
        }
      );

      return;
    }

    if(
      distancia <
        2
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      return;
    }

    const inicio =
      performance.now();

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionMs
        );

      const t =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      const latActual =
        latInicio +
        (
          latDestino -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonDestino -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      /*
        Acompaña la camioneta sin modificar
        la orientación elegida por el cliente.
      */
      mapa.panTo(
        [latActual, lonActual],
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            paso
          );

      }else{

        marcador.setLatLng(
          [latDestino, lonDestino]
        );

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        paso
      );
  }

  function animarMarcadorConGiroProtegido(
    latEsquina,
    lonEsquina,
    latDestino,
    lonDestino,
    duracionTotalMs
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distanciaHastaEsquina =
      distanciaMetros(
        latInicio,
        lonInicio,
        latEsquina,
        lonEsquina
      );

    const distanciaDesdeEsquina =
      distanciaMetros(
        latEsquina,
        lonEsquina,
        latDestino,
        lonDestino
      );

    const total =
      distanciaHastaEsquina +
      distanciaDesdeEsquina;

    if(
      !Number.isFinite(total) ||
      total <= 0
    ){
      animarMarcadorHasta(
        latDestino,
        lonDestino,
        duracionTotalMs
      );
      return;
    }

    const proporcionPrimera =
      Math.max(
        0.18,
        Math.min(
          0.72,
          distanciaHastaEsquina /
          total
        )
      );

    const duracionPrimera =
      Math.max(
        450,
        duracionTotalMs *
        proporcionPrimera
      );

    const duracionSegunda =
      Math.max(
        700,
        duracionTotalMs -
        duracionPrimera
      );

    const inicio =
      performance.now();

    function primerTramo(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionPrimera
        );

      const t =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      const latActual =
        latInicio +
        (
          latEsquina -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonEsquina -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      mapa.panTo(
        [latActual, lonActual],
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            primerTramo
          );

      }else{

        marcador.setLatLng(
          [latEsquina, lonEsquina]
        );

        const inicioSegundo =
          performance.now();

        function segundoTramo(
          ahoraSegundo
        ){

          const progresoSegundo =
            Math.min(
              1,
              (
                ahoraSegundo -
                inicioSegundo
              ) /
              duracionSegunda
            );

          const t2 =
            progresoSegundo *
            progresoSegundo *
            (
              3 -
              2 *
              progresoSegundo
            );

          const latActual2 =
            latEsquina +
            (
              latDestino -
              latEsquina
            ) *
            t2;

          const lonActual2 =
            lonEsquina +
            (
              lonDestino -
              lonEsquina
            ) *
            t2;

          marcador.setLatLng(
            [latActual2, lonActual2]
          );

          mapa.panTo(
            [latActual2, lonActual2],
            {
              animate:false
            }
          );

          if(
            progresoSegundo <
              1
          ){

            animacionMarcadorId =
              requestAnimationFrame(
                segundoTramo
              );

          }else{

            marcador.setLatLng(
              [latDestino, lonDestino]
            );

            animacionMarcadorId =
              null;
          }
        }

        animacionMarcadorId =
          requestAnimationFrame(
            segundoTramo
          );
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        primerTramo
      );
  }

  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "flex";

    if(
      mapa
    ){
      requestAnimationFrame(
        function(){
          try{
            mapa.invalidateSize();
          }catch(e){}
        }
      );
    }

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:true,
            rotateControl:false,
            attributionControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.control.attribution({
        position:"bottomleft",
        prefix:false
      })
      .addTo(
        mapa
      );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100
      );

      mapa.on(
        "zoomend",
        function(){
          actualizarIconoVehiculo();
        }
      );

      /*
        Mientras el usuario rota el mapa con los dedos,
        la camioneta y el cono se compensan en tiempo real
        para conservar su rumbo geográfico real.
      */
      mapa.on(
        "rotate",
        function(){
          actualizarIconoVehiculo();
        }
      );

      mapa.on(
        "rotateend",
        function(){
          actualizarIconoVehiculo();
        }
      );
    }
  }

  function actualizarMarcador(
    lat,
    lon,
    createdAt
  ){

    crearMapa(
      lat,
      lon
    );

    const createdMs =
      new Date(
        createdAt
      )
      .getTime();

    if(
      ultimoCreatedAtServidor
    ){

      const ultimoMs =
        new Date(
          ultimoCreatedAtServidor
        )
        .getTime();

      if(
        Number.isFinite(
          createdMs
        ) &&
        Number.isFinite(
          ultimoMs
        ) &&
        createdMs <=
          ultimoMs
      ){
        return;
      }
    }

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [lat, lon],
          {
            icon:
              crearIconoVehiculoPioca(),
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        )
        .bindPopup(
          "<strong>¡Estamos en camino!</strong>"
        );

      marcador.openPopup();

      actualizarEstadoLlegada();

      ultimoPuntoServidor = {
        lat:lat,
        lon:lon
      };

      ultimoCreatedAtServidor =
        createdAt;

      return;
    }

    const velocidadInterna =
      calcularVelocidadInterna(
        lat,
        lon,
        createdAt
      );

    const rumboNuevo =
      evaluarRumboReal(
        lat,
        lon,
        velocidadInterna
      );

    ultimoRumboVisual =
      rumboNuevo;

    actualizarIconoVehiculo();

    const duracion =
      calcularDuracionAnimacion(
        lat,
        lon,
        createdAt,
        velocidadInterna
      );

    const giroProtegido =
      esGiroProtegidoBajaVelocidad(
        lat,
        lon,
        velocidadInterna
      );

    if(
      giroProtegido
    ){

      /*
        Giro protegido real (< 40 km/h):
        1) evitamos la diagonal por la manzana;
        2) saltamos al nuevo GPS confirmado;
        3) desde allí avanzamos visualmente a 20 km/h
           sobre el nuevo rumbo, con máximo 15 m;
        4) el siguiente GPS real cancela esta microproyección.
      */
      detenerAnimacionMarcador();

      marcador.setLatLng(
        [lat, lon]
      );

      mapa.panTo(
        [lat, lon],
        {
          animate:false
        }
      );

      iniciarMicroproyeccionPostGiro(
        lat,
        lon,
        rumboNuevo
      );

    }else{

      animarMarcadorHasta(
        lat,
        lon,
        duracion
      );
    }

    penultimoPuntoServidor =
      ultimoPuntoServidor
        ? {
            lat:
              ultimoPuntoServidor.lat,
            lon:
              ultimoPuntoServidor.lon
          }
        : null;

    ultimoPuntoServidor = {
      lat:lat,
      lon:lon
    };

    ultimoCreatedAtServidor =
      createdAt;
  }

  async function consultar(
    forzar
  ){

    forzar =
      forzar === true;

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    /*
      Evita consultas simultáneas.
      Si el usuario fuerza un refresco, se cancela
      una consulta anterior que pudiera haber quedado colgada.
    */
    if(
      consultaEnCurso
    ){

      if(
        !forzar
      ){
        return;
      }

      if(
        consultaAbortController
      ){
        try{
          consultaAbortController.abort();
        }catch(e){}
      }

      consultaEnCurso =
        false;
    }

    consultaEnCurso =
      true;

    const controlador =
      new AbortController();

    consultaAbortController =
      controlador;

    const timeoutConsulta =
      setTimeout(
        function(){
          try{
            controlador.abort();
          }catch(e){}
        },
        10000
      );

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              }),

            signal:
              controlador.signal

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        estado.textContent =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimoCreatedAtServidor =
          null;

        ultimoPuntoServidor =
          null;

        penultimoPuntoServidor =
          null;

        ultimaVelocidadValidaKmh =
          null;

        detenerReloj();

        detenerAnimacionMarcador();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon,
        p.created_at
      );

      pintarEstadoNormalEnVivo();

      actualizarEstadoLlegada();

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Timeout, pérdida de Internet o suspensión
        del navegador no finalizan el seguimiento.
        Se conserva la última pantalla válida.
      */

    }finally{

      clearTimeout(
        timeoutConsulta
      );

      if(
        consultaAbortController ===
        controlador
      ){

        consultaAbortController =
          null;

        consultaEnCurso =
          false;
      }

      ultimaConsultaFinalizadaMs =
        Date.now();
    }
  }

  btnRefrescarPosicion.addEventListener(
    "click",
    refrescarConsultaManual
  );

  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.visibilityState ===
          "visible" &&
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "pageshow",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "online",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar(true);

    iniciarCicloConsultas();

    iniciarHeartbeatCliente();
  }

})();

</script>
