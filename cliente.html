<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca | Seguimiento en tiempo real</title>

  <meta
    name="description"
    content="Seguimiento de visita piOca. Ver ubicación de la camioneta."
  >

  <meta
    property="og:title"
    content="piOca | Seguimiento en tiempo real"
  >

  <meta
    property="og:description"
    content="Ver ubicación de la camioneta."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="piOca"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
      background:#fff;
    }

    body{
      padding:18px;
      box-sizing:border-box;
    }

    .panel{
      max-width:620px;
      margin:0 auto;
      background:#fff;
    }

    .logo{
      text-align:center;
      margin-bottom:12px;
    }

    .logo img{
      width:150px;
      max-width:44vw;
      height:auto;
      display:inline-block;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      padding:14px 10px;
      background:#eeeeee;
      border-radius:9px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      margin-bottom:10px;
    }

    .estadoEnVivo{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
    }

    .puntoEnVivo{
      position:relative;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#24b84a;
      flex:0 0 10px;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(36,184,74,.38);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    @keyframes piocaLivePulse{
      0%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.6);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.6);
      }
    }

    #horaLlegadaBox{
      display:none;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:14px;
    }

    #horaLlegadaTitulo,
    #horaLlegada{
      min-height:72px;
      box-sizing:border-box;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    #horaLlegadaTitulo{
      padding:10px 12px;
      background:#f3f8fc;
      border:1px solid #d5e2ee;
      font-size:12px;
      line-height:1.25;
      color:#555;
      font-weight:700;
    }

    #horaLlegada{
      padding:10px 12px;
      background:#f3f8fc;
      border:1px solid #d5e2ee;
      font-size:22px;
      color:#1769aa;
      font-weight:700;
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
    }

    #mapa{
      width:100%;
      height:390px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #d7d7d7;
      box-sizing:border-box;
    }

    #fraseServicio{
      margin-top:8px;
      margin-bottom:8px;
      padding:10px 12px;
      text-align:center;
      font-size:13px;
      line-height:1.3;
      color:#2f5f88;
      font-weight:700;
      background:#f4f8fc;
      border:1px solid #d6e3ef;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(23,105,170,.08);
      box-sizing:border-box;
    }

    .leaflet-popup-content{
      width:165px !important;
      max-width:165px;
      text-align:center;
      line-height:1.25;
      margin:10px 12px;
      font-size:12px;
    }

    .leaflet-popup-content-wrapper{
      border-radius:11px;
    }

    #actualizacionBox{
      position:absolute;
      top:10px;
      right:10px;
      z-index:1000;
      background:rgba(0,0,0,.84);
      color:#38e06f;
      padding:8px 11px;
      border-radius:7px;
      font-size:12px;
      font-weight:700;
      line-height:1.25;
      text-align:center;
      box-shadow:0 2px 7px rgba(0,0,0,.25);
      pointer-events:none;
      min-width:115px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }

    @media(max-width:600px){

      body{
        padding:10px 10px 6px 10px;
      }

      .logo img{
        width:136px;
        max-width:42vw;
      }

      #mapa{
        height:395px;
      }

      #actualizacionBox{
        top:8px;
        right:8px;
        padding:7px 9px;
        font-size:11px;
        min-width:105px;
      }

      #actualizacionSegundos{
        font-size:10px;
      }

      #horaLlegadaTitulo,
      #horaLlegada{
        min-height:64px;
      }

      #horaLlegadaTitulo{
        font-size:11px;
        padding:8px 10px;
      }

      #horaLlegada{
        font-size:20px;
        padding:8px 10px;
      }

      #fraseServicio{
        font-size:13px;
      }

    }

  </style>

</head>

<body>

<div class="panel">

  <div class="logo">

    <img
      src="logo-pioca.png"
      alt="piOca"
    >

  </div>

  <div id="estado">
    Seguimiento no disponible
  </div>

  <div id="horaLlegadaBox">

    <div id="horaLlegadaTitulo">
      HORA ESTIMADA DE LLEGADA
    </div>

    <div id="horaLlegada">
      --:--
    </div>

  </div>

  <div id="mapaWrap">

    <div id="mapa"></div>

    <div
      id="actualizacionBox"
      class="actualizacionOk">

      <span id="actualizacionTexto">
        UBICACIÓN ACTUALIZADA
      </span>

      <span id="actualizacionSegundos">
        hace 0 s
      </span>

    </div>

    <div id="fraseServicio">
      Tu tiempo también forma parte de un buen servicio.
    </div>

  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
  src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js">
</script>

<script>

(function(){

  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  const estado =
    document.getElementById(
      "estado"
    );

  const horaLlegadaBox =
    document.getElementById(
      "horaLlegadaBox"
    );

  const horaLlegada =
    document.getElementById(
      "horaLlegada"
    );

  const mapaWrap =
    document.getElementById(
      "mapaWrap"
    );

  const actualizacionBox =
    document.getElementById(
      "actualizacionBox"
    );

  const actualizacionTexto =
    document.getElementById(
      "actualizacionTexto"
    );

  const actualizacionSegundos =
    document.getElementById(
      "actualizacionSegundos"
    );

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  let codigo =
    parametros.get(
      "id"
    );

  let mapa =
    null;

  let marcador =
    null;

  let ultimaActualizacionMs =
    null;

  let relojEstado =
    null;

  let consultaId =
    null;

  let terminado =
    false;

  /*
    Datos usados únicamente para orientar
    el mapa según el sentido real de marcha.
  */
  let ultimaPosicionRumbo =
    null;

  let rumboActual =
    0;

  let animacionRumboId =
    null;

  /*
    Evita que el mapa "baile" por pequeños
    errores del GPS cuando el vehículo está
    detenido o apenas se movió.
  */
  const DISTANCIA_MINIMA_RUMBO_METROS =
    20;

  function detenerReloj(){

    if(
      relojEstado !== null
    ){

      clearInterval(
        relojEstado
      );

      relojEstado =
        null;
    }
  }

  function detenerConsultas(){

    if(
      consultaId !== null
    ){

      clearInterval(
        consultaId
      );

      consultaId =
        null;
    }
  }

  function detenerAnimacionRumbo(){

    if(
      animacionRumboId !== null
    ){

      cancelAnimationFrame(
        animacionRumboId
      );

      animacionRumboId =
        null;
    }
  }

  function ocultarHoraLlegada(){

    horaLlegadaBox.style.display =
      "none";

    horaLlegada.textContent =
      "--:--";
  }

  function mostrarHoraLlegada(
    valor
  ){

    if(
      !valor
    ){

      ocultarHoraLlegada();

      return;
    }

    const fecha =
      new Date(
        valor
      );

    if(
      !Number.isFinite(
        fecha.getTime()
      )
    ){

      ocultarHoraLlegada();

      return;
    }

    horaLlegada.textContent =

      fecha.toLocaleTimeString(
        "es-AR",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      ) +

      " hs";

    horaLlegadaBox.style.display =
      "grid";
  }

  function quitarMarcador(){

    if(
      mapa &&
      marcador
    ){

      try{

        mapa.removeLayer(
          marcador
        );

      }catch(e){}

      marcador =
        null;
    }
  }

  function mostrarFinalizado(){

    terminado =
      true;

    detenerReloj();

    detenerConsultas();

    detenerAnimacionRumbo();

    ultimaActualizacionMs =
      null;

    ultimaPosicionRumbo =
      null;

    quitarMarcador();

    mapaWrap.style.display =
      "none";

    horaLlegadaBox.style.display =
      "none";

    estado.textContent =
      "✅ SEGUIMIENTO FINALIZADO";

    estado.style.background =
      "#eeeeee";
  }

  function ocultarTodo(){

    if(
      terminado
    ){

      return;
    }

    estado.textContent =
      "Seguimiento no disponible";

    estado.style.background =
      "#eeeeee";

    mapaWrap.style.display =
      "none";

    ocultarHoraLlegada();

    ultimaActualizacionMs =
      null;

    ultimaPosicionRumbo =
      null;

    detenerReloj();

    detenerAnimacionRumbo();

    quitarMarcador();
  }

  function actualizarIndicador(){

    if(
      !ultimaActualizacionMs ||
      terminado
    ){

      return;
    }

    const diferencia =

      Math.max(

        0,

        Math.floor(

          (
            Date.now() -
            ultimaActualizacionMs
          ) / 1000

        )

      );

    actualizacionSegundos.textContent =
      "hace " +
      diferencia +
      " s";

    if(
      diferencia <=
      15
    ){

      actualizacionBox.className =
        "actualizacionOk";

      actualizacionTexto.textContent =
        "UBICACIÓN ACTUALIZADA";

    }else{

      actualizacionBox.className =
        "actualizacionError";

      actualizacionTexto.textContent =
        "SIN ACTUALIZACIÓN";
    }
  }

  function iniciarReloj(){

    if(
      relojEstado !== null ||
      terminado
    ){

      return;
    }

    actualizarIndicador();

    relojEstado =
      setInterval(
        actualizarIndicador,
        1000
      );
  }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function radianesAGrados(
    radianes
  ){

    return radianes *
      180 /
      Math.PI;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 -
        lat1
      );

    const dLon =
      gradosARadianes(
        lon2 -
        lon1
      );

    const a =

      Math.sin(
        dLat / 2
      ) *
      Math.sin(
        dLat / 2
      ) +

      Math.cos(
        gradosARadianes(
          lat1
        )
      ) *

      Math.cos(
        gradosARadianes(
          lat2
        )
      ) *

      Math.sin(
        dLon / 2
      ) *
      Math.sin(
        dLon / 2
      );

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function calcularRumbo(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const phi1 =
      gradosARadianes(
        lat1
      );

    const phi2 =
      gradosARadianes(
        lat2
      );

    const deltaLon =
      gradosARadianes(
        lon2 -
        lon1
      );

    const y =
      Math.sin(
        deltaLon
      ) *
      Math.cos(
        phi2
      );

    const x =

      Math.cos(
        phi1
      ) *
      Math.sin(
        phi2
      ) -

      Math.sin(
        phi1
      ) *
      Math.cos(
        phi2
      ) *
      Math.cos(
        deltaLon
      );

    const rumbo =
      radianesAGrados(
        Math.atan2(
          y,
          x
        )
      );

    return (
      rumbo +
      360
    ) % 360;
  }

  function diferenciaAngular(
    desde,
    hasta
  ){

    return (
      (
        hasta -
        desde +
        540
      ) % 360
    ) - 180;
  }

  function animarRumboMapa(
    rumboDestino
  ){

    if(
      !mapa ||
      typeof mapa.setBearing !==
        "function"
    ){

      return;
    }

    detenerAnimacionRumbo();

    const inicio =
      performance.now();

    const rumboInicio =
      rumboActual;

    const diferencia =
      diferenciaAngular(
        rumboInicio,
        rumboDestino
      );

    const duracion =
      700;

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracion
        );

      /*
        Suavizado para que el giro no sea brusco.
      */
      const suavizado =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      rumboActual =
        (
          rumboInicio +
          diferencia *
          suavizado +
          360
        ) % 360;

      mapa.setBearing(
        rumboActual
      );

      if(
        progreso <
        1
      ){

        animacionRumboId =
          requestAnimationFrame(
            paso
          );

      }else{

        rumboActual =
          (
            rumboDestino +
            360
          ) % 360;

        mapa.setBearing(
          rumboActual
        );

        animacionRumboId =
          null;
      }
    }

    animacionRumboId =
      requestAnimationFrame(
        paso
      );
  }

  function actualizarRumbo(
    lat,
    lon
  ){

    if(
      !ultimaPosicionRumbo
    ){

      ultimaPosicionRumbo = {
        lat:lat,
        lon:lon
      };

      return;
    }

    const distancia =
      distanciaMetros(
        ultimaPosicionRumbo.lat,
        ultimaPosicionRumbo.lon,
        lat,
        lon
      );

    if(
      distancia <
      DISTANCIA_MINIMA_RUMBO_METROS
    ){

      return;
    }

    const nuevoRumbo =
      calcularRumbo(
        ultimaPosicionRumbo.lat,
        ultimaPosicionRumbo.lon,
        lat,
        lon
      );

    ultimaPosicionRumbo = {
      lat:lat,
      lon:lon
    };

    animarRumboMapa(
      nuevoRumbo
    );
  }

  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "block";

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:false,
            rotateControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100
      );
    }
  }

  function actualizarMarcador(
    lat,
    lon
  ){

    crearMapa(
      lat,
      lon
    );

    actualizarRumbo(
      lat,
      lon
    );

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [
            lat,
            lon
          ],
          {
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        )
        .bindPopup(

          "<strong>Ya estamos en camino<br>a tu domicilio.</strong>"

        );

      marcador.openPopup();

    }else{

      marcador.setLatLng(
        [
          lat,
          lon
        ]
      );
    }

    mapa.panTo(
      [
        lat,
        lon
      ],
      {
        animate:true,
        duration:0.8
      }
    );
  }

  async function consultar(){

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              })

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      /*
        Si el servidor informa que terminó,
        desaparece inmediatamente el mapa.
      */
      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        estado.textContent =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimaPosicionRumbo =
          null;

        detenerReloj();

        detenerAnimacionRumbo();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon
      );

      estado.innerHTML =
        '<span class="estadoEnVivo">' +
          '<span class="puntoEnVivo"></span>' +
          '<span>Seguimiento en tiempo real</span>' +
        '</span>';

      estado.style.background =
        "#dff5e1";

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Si se corta Internet,
        conservamos la última posición
        y no damos por finalizado el seguimiento.
      */

    }
  }

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar();

    consultaId =
      setInterval(
        consultar,
        3000
      );
  }

})();

</script>

</body>

</html>
