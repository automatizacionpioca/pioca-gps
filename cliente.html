<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca® Seguimiento de Visita</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
      background:#fff;
    }

    body{
      padding:18px;
      box-sizing:border-box;
    }

    .panel{
      max-width:620px;
      margin:0 auto;
      background:#fff;
    }

    .titulo{
      text-align:center;
      font-size:25px;
      font-weight:700;
      margin-bottom:5px;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      padding:13px 10px;
      background:#eee;
      border-radius:9px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      margin-bottom:14px;
    }

    #mapa{
      width:100%;
      height:420px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #d7d7d7;
      box-sizing:border-box;
    }

    .ultima{
      text-align:center;
      margin-top:13px;
      font-size:14px;
      color:#555;
    }

    #error{
      display:none;
      margin-top:15px;
      padding:12px;
      background:#fff1f1;
      border:1px solid #e4aaaa;
      border-radius:8px;
      font-size:13px;
    }

    @media(max-width:600px){

      body{
        padding:10px;
      }

      #mapa{
        height:430px;
      }

    }

  </style>

</head>


<body>


<div class="panel">

  <div class="titulo">
    piOca®
  </div>

  <div class="subtitulo">
    SEGUIMIENTO DE VISITA
  </div>

  <div id="estado">
    Verificando seguimiento...
  </div>

  <div id="mapa"></div>

  <div class="ultima">
    Última actualización:
    <strong id="hora">-</strong>
  </div>

  <div id="error"></div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

(function(){

  var SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  var SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";


  var parametros =
    new URLSearchParams(
      window.location.search
    );


  var trackingCode =
    parametros.get("id");


  if(trackingCode){

    trackingCode =
      trackingCode
      .trim()
      .toUpperCase();

  }


  var estado =
    document.getElementById("estado");

  var hora =
    document.getElementById("hora");

  var errorBox =
    document.getElementById("error");


  var mapa =
    L.map(
      "mapa",
      {
        zoomControl:true
      }
    )
    .setView(
      [-34.5146, -58.5796],
      16
    );


  L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom:19,

      attribution:
        '&copy; OpenStreetMap contributors'
    }

  ).addTo(mapa);


  var marcador = null;

  var primeraPosicion = true;

  var seguimientoValido = false;


  function mostrarError(
    texto
  ){

    errorBox.innerHTML =
      texto;

    errorBox.style.display =
      "block";

  }


  function ocultarError(){

    errorBox.innerHTML =
      "";

    errorBox.style.display =
      "none";

  }


  function seguimientoFinalizado(){

    seguimientoValido =
      false;

    estado.innerHTML =
      "Seguimiento no disponible";

    estado.style.background =
      "#eeeeee";

    hora.innerHTML =
      "-";

    if(marcador){

      mapa.removeLayer(
        marcador
      );

      marcador =
        null;

    }

  }


  function verificarSeguimiento(){

    if(!trackingCode){

      seguimientoFinalizado();

      mostrarError(
        "Código de seguimiento inexistente."
      );

      return Promise.resolve(
        false
      );

    }


    var consulta =

      SUPABASE_URL +

      "/rest/v1/services" +

      "?select=tracking_code,status,estimated_arrival,expires_at" +

      "&tracking_code=eq." +

      encodeURIComponent(
        trackingCode
      ) +

      "&limit=1";


    return fetch(

      consulta,

      {

        method:"GET",

        headers:{
          "apikey":
            SUPABASE_KEY
        }

      }

    )


    .then(function(respuesta){

      if(!respuesta.ok){

        throw new Error(
          "No se pudo validar el seguimiento."
        );

      }

      return respuesta.json();

    })


    .then(function(datos){

      if(
        !datos ||
        datos.length === 0
      ){

        seguimientoFinalizado();

        return false;

      }


      var seguimiento =
        datos[0];


      var vencimiento =
        new Date(
          seguimiento.expires_at
        );


      var vencido =
        Date.now() >=
        vencimiento.getTime();


      if(
        seguimiento.status !== "active" ||
        vencido
      ){

        seguimientoFinalizado();

        return false;

      }


      seguimientoValido =
        true;


      ocultarError();


      return true;

    })


    .catch(function(error){

      seguimientoValido =
        false;

      estado.innerHTML =
        "Ubicación momentáneamente no disponible";

      estado.style.background =
        "#ffe0e0";

      mostrarError(
        error.message
      );

      return false;

    });

  }


  function cargarPosicion(){

    if(
      !seguimientoValido ||
      !trackingCode
    ){

      return;

    }


    var consulta =

      SUPABASE_URL +

      "/rest/v1/gps_test" +

      "?select=latitude,longitude,accuracy,created_at" +

      "&tracking_code=eq." +

      encodeURIComponent(
        trackingCode
      ) +

      "&order=created_at.desc" +

      "&limit=1";


    fetch(

      consulta,

      {

        method:"GET",

        headers:{
          "apikey":
            SUPABASE_KEY
        }

      }

    )


    .then(function(respuesta){

      if(!respuesta.ok){

        throw new Error(
          "Supabase respondió " +
          respuesta.status
        );

      }

      return respuesta.json();

    })


    .then(function(datos){

      if(
        !datos ||
        datos.length === 0
      ){

        estado.innerHTML =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        return;

      }


      var p =
        datos[0];


      var lat =
        Number(
          p.latitude
        );


      var lon =
        Number(
          p.longitude
        );


      if(!marcador){

        marcador =

          L.marker(
            [lat,lon]
          )

          .addTo(
            mapa
          )

          .bindPopup(
            "<strong>piOca®</strong><br>Técnico en camino"
          );

      }else{

        marcador.setLatLng(
          [lat,lon]
        );

      }


      if(
        primeraPosicion
      ){

        mapa.setView(
          [lat,lon],
          16
        );

        marcador.openPopup();

        primeraPosicion =
          false;

      }


      hora.innerHTML =

        new Date(
          p.created_at
        )

        .toLocaleTimeString(
          "es-AR"
        );


      estado.innerHTML =
        "🟢 Técnico en camino";


      estado.style.background =
        "#dff5e1";


      ocultarError();

    })


    .catch(function(error){

      estado.innerHTML =
        "Ubicación momentáneamente no disponible";

      estado.style.background =
        "#ffe0e0";

      mostrarError(
        error.message
      );

    });

  }


  function actualizar(){

    verificarSeguimiento()

    .then(function(ok){

      if(ok){

        cargarPosicion();

      }

    });

  }


  actualizar();


  setInterval(
    actualizar,
    3000
  );


})();

</script>


</body>

</html>
