<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca® Seguimiento de Visita</title>


  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body{

      margin:0;
      padding:0;

      font-family:
        Arial,
        sans-serif;

      background:#fff;

    }


    body{

      padding:18px;

      box-sizing:
        border-box;

    }


    .panel{

      max-width:620px;

      margin:0 auto;

      background:#fff;

    }


    .titulo{

      text-align:center;

      font-size:25px;

      font-weight:700;

      margin-bottom:5px;

    }


    .subtitulo{

      text-align:center;

      font-size:16px;

      color:#444;

      margin-bottom:18px;

    }


    #estado{

      padding:14px 10px;

      background:#eeeeee;

      border-radius:9px;

      text-align:center;

      font-size:15px;

      font-weight:700;

      margin-bottom:14px;

    }


    #mapa{

      display:none;

      width:100%;

      height:420px;

      border-radius:14px;

      overflow:hidden;

      border:1px solid #d7d7d7;

      box-sizing:border-box;

    }


    #ultima{

      display:none;

      text-align:center;

      margin-top:13px;

      font-size:14px;

      color:#555;

    }


    @media(
      max-width:600px
    ){

      body{

        padding:10px;

      }


      #mapa{

        height:430px;

      }

    }

  </style>

</head>


<body>


<div class="panel">


  <div class="titulo">
    piOca®
  </div>


  <div class="subtitulo">
    SEGUIMIENTO DE VISITA
  </div>


  <div id="estado">
    Seguimiento no disponible
  </div>


  <div id="mapa"></div>


  <div id="ultima">

    Última actualización:

    <strong id="hora">
      -
    </strong>

  </div>


</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

(function(){


  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";


  const estado =
    document.getElementById(
      "estado"
    );


  const mapaDiv =
    document.getElementById(
      "mapa"
    );


  const ultimaDiv =
    document.getElementById(
      "ultima"
    );


  const hora =
    document.getElementById(
      "hora"
    );


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  let codigo =
    parametros.get(
      "id"
    );


  let mapa =
    null;


  let marcador =
    null;


  /*
    ------------------------------------------------------
    ESTADO NEUTRO

    Misma respuesta para:
    - sin código
    - código falso
    - código vencido
    - código finalizado
    ------------------------------------------------------
  */

  function ocultarTodo(){


    estado.textContent =
      "Seguimiento no disponible";


    estado.style.background =
      "#eeeeee";


    mapaDiv.style.display =
      "none";


    ultimaDiv.style.display =
      "none";


    hora.textContent =
      "-";


    if(
      mapa &&
      marcador
    ){

      mapa.removeLayer(
        marcador
      );


      marcador =
        null;

    }

  }


  /*
    ------------------------------------------------------
    MAPA

    Sólo se crea cuando Supabase
    ya confirmó seguimiento válido.
    ------------------------------------------------------
  */

  function crearMapa(
    lat,
    lon
  ){


    mapaDiv.style.display =
      "block";


    ultimaDiv.style.display =
      "block";


    if(!mapa){


      mapa =

        L.map(
          "mapa",
          {
            zoomControl:true
          }
        )

        .setView(
          [lat,lon],
          16
        );


      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          maxZoom:19,

          attribution:
            '&copy; OpenStreetMap contributors'

        }

      )

      .addTo(
        mapa
      );

    }

  }


  function actualizarMarcador(
    lat,
    lon
  ){


    crearMapa(
      lat,
      lon
    );


    if(!marcador){


      marcador =

        L.marker(
          [lat,lon]
        )

        .addTo(
          mapa
        )

        .bindPopup(

          "<strong>piOca®</strong><br>Técnico en camino"

        );


      marcador.openPopup();


    }else{


      marcador.setLatLng(
        [lat,lon]
      );

    }

  }


  /*
    ------------------------------------------------------
    CONSULTA SEGURA

    cliente.html NO consulta tablas.

    Sólo llama a una función
    controlada de Supabase.
    ------------------------------------------------------
  */

  async function consultar(){


    if(!codigo){


      ocultarTodo();

      return;

    }


    codigo =

      codigo
      .trim()
      .toUpperCase();


    /*
      Una longitud absurda tampoco
      merece siquiera consulta.
    */

    if(
      codigo.length < 8 ||
      codigo.length > 32
    ){

      ocultarTodo();

      return;

    }


    try{


      const respuesta =

        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              })

          }

        );


      if(
        !respuesta.ok
      ){

        ocultarTodo();

        return;

      }


      const datos =
        await respuesta.json();


      /*
        Vacío significa:

        - inexistente
        - finalizado
        - vencido

        Todos reciben exactamente
        la misma pantalla.
      */

      if(
        !Array.isArray(
          datos
        ) ||

        datos.length === 0
      ){

        ocultarTodo();

        return;

      }


      const p =
        datos[0];


      /*
        El seguimiento es válido,
        pero todavía no llegó
        la primera posición GPS.
      */

      if(
        p.latitude === null ||
        p.longitude === null
      ){


        estado.textContent =
          "Esperando ubicación del técnico...";


        estado.style.background =
          "#fff3cd";


        mapaDiv.style.display =
          "none";


        ultimaDiv.style.display =
          "none";


        return;

      }


      const lat =
        Number(
          p.latitude
        );


      const lon =
        Number(
          p.longitude
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ){

        ocultarTodo();

        return;

      }


      actualizarMarcador(
        lat,
        lon
      );


      estado.textContent =
        "🟢 Técnico en camino";


      estado.style.background =
        "#dff5e1";


      hora.textContent =

        new Date(
          p.created_at
        )

        .toLocaleTimeString(
          "es-AR"
        );


    }

    catch(error){


      /*
        Tampoco mostramos
        mensajes técnicos al público.
      */

      ocultarTodo();

    }

  }


  /*
    Sin ID no hacemos
    absolutamente ninguna consulta.
  */

  if(!codigo){


    ocultarTodo();


  }else{


    consultar();


    setInterval(
      consultar,
      3000
    );

  }


})();

</script>


</body>

</html>
