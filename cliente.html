<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca Seguimiento de Visita</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
      background:#fff;
    }

    body{
      padding:18px;
      box-sizing:border-box;
    }

    .panel{
      max-width:620px;
      margin:0 auto;
      background:#fff;
    }

    .logo{
      text-align:center;
      margin-bottom:8px;
    }

    .logo img{
      width:170px;
      max-width:48vw;
      height:auto;
      display:inline-block;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      padding:14px 10px;
      background:#eeeeee;
      border-radius:9px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      margin-bottom:14px;
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
    }

    #mapa{
      width:100%;
      height:420px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #d7d7d7;
      box-sizing:border-box;
    }

    #actualizacionBox{
      position:absolute;
      top:10px;
      right:10px;
      z-index:1000;

      background:rgba(0,0,0,.82);

      color:#38e06f;

      padding:8px 11px;

      border-radius:7px;

      font-size:12px;
      font-weight:700;

      line-height:1.25;

      text-align:center;

      box-shadow:
        0 2px 7px rgba(0,0,0,.25);

      pointer-events:none;

      min-width:115px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:
        piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:
        piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }

    @media(max-width:600px){

      body{
        padding:10px;
      }

      .logo img{
        width:150px;
        max-width:46vw;
      }

      #mapa{
        height:430px;
      }

      #actualizacionBox{
        top:8px;
        right:8px;
        padding:7px 9px;
        font-size:11px;
        min-width:105px;
      }

      #actualizacionSegundos{
        font-size:10px;
      }

    }

  </style>

</head>


<body>


<div class="panel">

  <div class="logo">

    <img
      src="logo-pioca.png"
      alt="piOca"
    >

  </div>

  <div class="subtitulo">
    SEGUIMIENTO DE VISITA
  </div>


  <div id="estado">
    Seguimiento no disponible
  </div>


  <div id="mapaWrap">

    <div id="mapa"></div>

    <div
      id="actualizacionBox"
      class="actualizacionOk">

      <span id="actualizacionTexto">
        UBICACIÓN ACTUALIZADA
      </span>

      <span id="actualizacionSegundos">
        hace 0 s
      </span>

    </div>

  </div>


</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

(function(){


  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";


  const estado =
    document.getElementById(
      "estado"
    );


  const mapaWrap =
    document.getElementById(
      "mapaWrap"
    );


  const mapaDiv =
    document.getElementById(
      "mapa"
    );


  const actualizacionBox =
    document.getElementById(
      "actualizacionBox"
    );


  const actualizacionTexto =
    document.getElementById(
      "actualizacionTexto"
    );


  const actualizacionSegundos =
    document.getElementById(
      "actualizacionSegundos"
    );


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  let codigo =
    parametros.get(
      "id"
    );


  let mapa =
    null;


  let marcador =
    null;


  let ultimaActualizacionMs =
    null;


  let relojEstado =
    null;


  function detenerReloj(){

    if(
      relojEstado !== null
    ){

      clearInterval(
        relojEstado
      );

      relojEstado =
        null;

    }

  }


  function ocultarTodo(){


    estado.textContent =
      "Seguimiento no disponible";


    estado.style.background =
      "#eeeeee";


    mapaWrap.style.display =
      "none";


    ultimaActualizacionMs =
      null;


    detenerReloj();


    if(
      mapa &&
      marcador
    ){

      mapa.removeLayer(
        marcador
      );


      marcador =
        null;

    }

  }


  function actualizarIndicador(){


    if(
      !ultimaActualizacionMs
    ){

      return;

    }


    const diferencia =

      Math.max(

        0,

        Math.floor(

          (
            Date.now() -
            ultimaActualizacionMs
          ) / 1000

        )

      );


    actualizacionSegundos.textContent =
      "hace " +
      diferencia +
      " s";


    if(
      diferencia <= 15
    ){


      actualizacionBox.className =
        "actualizacionOk";


      actualizacionTexto.textContent =
        "UBICACIÓN ACTUALIZADA";


    }else{


      actualizacionBox.className =
        "actualizacionError";


      actualizacionTexto.textContent =
        "SIN ACTUALIZACIÓN";

    }

  }


  function iniciarReloj(){


    if(
      relojEstado !== null
    ){

      return;

    }


    actualizarIndicador();


    relojEstado =

      setInterval(

        actualizarIndicador,

        1000

      );

  }


  function crearMapa(
    lat,
    lon
  ){


    mapaWrap.style.display =
      "block";


    if(!mapa){


      mapa =

        L.map(
          "mapa",
          {
            zoomControl:true
          }
        )

        .setView(
          [lat,lon],
          16
        );


      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          maxZoom:19,

          attribution:
            '&copy; OpenStreetMap contributors'

        }

      )

      .addTo(
        mapa
      );


      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100

      );

    }

  }


  function actualizarMarcador(
    lat,
    lon
  ){


    crearMapa(
      lat,
      lon
    );


    if(!marcador){


      marcador =

        L.marker(
          [lat,lon]
        )

        .addTo(
          mapa
        )

        .bindPopup(

          "<strong>piOca</strong><br>Técnico en camino"

        );


      marcador.openPopup();


    }else{


      marcador.setLatLng(
        [lat,lon]
      );

    }

  }


  async function consultar(){


    if(!codigo){


      ocultarTodo();

      return;

    }


    codigo =

      codigo
      .trim()
      .toUpperCase();


    if(
      codigo.length < 8 ||
      codigo.length > 32
    ){

      ocultarTodo();

      return;

    }


    try{


      const respuesta =

        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              })

          }

        );


      if(
        !respuesta.ok
      ){

        ocultarTodo();

        return;

      }


      const datos =
        await respuesta.json();


      if(
        !Array.isArray(
          datos
        ) ||

        datos.length === 0
      ){

        ocultarTodo();

        return;

      }


      const p =
        datos[0];


      if(
        p.latitude === null ||
        p.longitude === null
      ){


        estado.textContent =
          "Esperando ubicación del técnico...";


        estado.style.background =
          "#fff3cd";


        mapaWrap.style.display =
          "none";


        ultimaActualizacionMs =
          null;


        detenerReloj();


        return;

      }


      const lat =
        Number(
          p.latitude
        );


      const lon =
        Number(
          p.longitude
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ){

        ocultarTodo();

        return;

      }


      actualizarMarcador(
        lat,
        lon
      );


      estado.textContent =
        "🟢 Técnico en camino";


      estado.style.background =
        "#dff5e1";


      /*
        IMPORTANTE:

        No usamos la hora del teléfono
        del cliente.

        Tomamos created_at
        guardado en Supabase.
      */

      ultimaActualizacionMs =

        new Date(
          p.created_at
        )
        .getTime();


      iniciarReloj();


      actualizarIndicador();

    }

    catch(error){


      /*
        Ante error temporal NO movemos
        el marcador ni mentimos con
        una actualización nueva.

        El contador sigue avanzando
        y automáticamente pasará
        a rojo después de 15 segundos.
      */

    }

  }


  if(!codigo){


    ocultarTodo();


  }else{


    consultar();


    setInterval(
      consultar,
      3000
    );

  }


})();

</script>


</body>

</html>
