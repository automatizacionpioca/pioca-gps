<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seguimiento piOca</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      font-family:Arial,sans-serif;
      background:#ffffff;
      color:#1d2a36;
    }

    body{
      box-sizing:border-box;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(8px, env(safe-area-inset-bottom))
        12px;
    }

    .panel{
      width:100%;
      max-width:620px;
      height:100%;
      margin:0 auto;
      background:#fff;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .cabeceraCliente{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:center;
      margin-bottom:22px;
      flex:0 0 auto;
    }

    .logo{
      text-align:center;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:150px;
    }

    .logo::after{
      content:"";
      position:absolute;
      right:-9px;
      top:16%;
      bottom:16%;
      width:1px;
      background:#e7edf3;
    }

    .logo img{
      width:168px;
      max-width:95%;
      height:auto;
      display:block;
    }

    .cabeceraCliente.finalizado{
      grid-template-columns:1fr;
      justify-items:center;
      margin-bottom:18px;
    }

    .cabeceraCliente.finalizado .logo{
      width:100%;
      min-height:150px;
    }

    .cabeceraCliente.finalizado .logo::after{
      display:none;
    }

    .cabeceraCliente.finalizado #horaLlegadaBox{
      display:none !important;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      flex:0 0 auto;
      min-height:58px;
      padding:10px 14px;
      box-sizing:border-box;
      background:#fff;
      border:1px solid #e3e8ee;
      border-radius:14px;
      text-align:left;
      font-size:15px;
      font-weight:700;
      margin:0 0 16px 0;
      box-shadow:
        0 5px 16px rgba(25,45,65,.07),
        0 1px 3px rgba(25,45,65,.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .estadoEnVivo{
      width:100%;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
    }

    .puntoEnVivo{
      position:relative;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#28bf59;
      flex:0 0 10px;
      margin-left:4px;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(40,191,89,.34);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    .estadoTexto{
      color:#22364a;
      font-weight:700;
      font-size:15px;
      letter-spacing:.05px;
    }

    .estadoBadge{
      justify-self:end;
      padding:6px 10px;
      border-radius:999px;
      background:#e8f8ed;
      color:#28a84f;
      font-size:10px;
      font-weight:700;
      letter-spacing:.35px;
      white-space:nowrap;
    }

    @keyframes piocaLivePulse{
      0%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }
    }

    #horaLlegadaBox{
      display:none;
      width:92%;
      max-width:275px;
      justify-self:center;
      overflow:hidden;
      border:1px solid #e1e7ed;
      border-radius:16px;
      background:#fff;
      box-shadow:
        0 8px 22px rgba(24,45,65,.10),
        0 2px 5px rgba(24,45,65,.05);
    }

    #horaLlegadaTitulo{
      min-height:56px;
      padding:10px 14px 9px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:left;
      color:#5a6671;
      font-size:11px;
      line-height:1.25;
      font-weight:700;
      letter-spacing:.55px;
      text-transform:uppercase;
      background:#fff;
    }

    #horaLlegadaTitulo::before{
      content:"◷";
      width:34px;
      height:34px;
      border-radius:50%;
      background:#1769aa;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      line-height:1;
      flex:0 0 34px;
      box-shadow:0 3px 9px rgba(23,105,170,.22);
    }

    #horaLlegada{
      min-height:86px;
      padding:10px 14px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(
        135deg,
        #182b3c 0%,
        #243d53 100%
      );
      color:#fff;
      font-size:34px;
      font-weight:700;
      letter-spacing:.7px;
      animation:piocaHoraBlink 1.7s ease-in-out infinite;
    }

    @keyframes piocaHoraBlink{
      0%{
        opacity:1;
      }

      50%{
        opacity:.48;
      }

      100%{
        opacity:1;
      }
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      flex-direction:column;
    }

    #mapaContenedor{
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      display:flex;
    }

    #mapa{
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      height:auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #e0e5ea;
      box-sizing:border-box;
      box-shadow:
        0 6px 18px rgba(20,45,65,.07);
    }

    #btnRefrescarPosicion{
      position:absolute;
      right:12px;
      bottom:12px;
      z-index:1002;
      border:1px solid rgba(32,50,70,.16);
      background:rgba(255,255,255,.95);
      color:#203246;
      border-radius:999px;
      padding:9px 12px;
      font-family:Arial,sans-serif;
      font-size:11px;
      font-weight:700;
      line-height:1;
      box-shadow:0 4px 12px rgba(0,0,0,.14);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      backdrop-filter:blur(5px);
    }

    #btnRefrescarPosicion:active{
      transform:scale(.97);
    }

    #btnRefrescarPosicion:disabled{
      opacity:.62;
      cursor:default;
    }

    #fraseServicio{
      flex:0 0 auto;
      margin-top:12px;
      margin-bottom:0;
      padding:12px 14px;
      text-align:center;
      font-size:12px;
      line-height:1.35;
      color:#4e5963;
      font-weight:400;
      background:#fff;
      border:1px solid #e2e8ee;
      border-radius:14px;
      box-shadow:
        0 5px 16px rgba(25,45,65,.06);
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    #fraseServicio::before{
      content:"◷";
      width:28px;
      height:28px;
      border:2px solid #9ec1e5;
      color:#1769aa;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 28px;
      box-sizing:border-box;
    }

    #fraseServicio strong{
      color:#1769aa;
      font-weight:700;
    }

    /* ==========================================================
       PIN ROJO DEFINITIVO
       La punta inferior representa la posición GPS.
       ========================================================== */

    .piocaPinIcon{
      background:transparent !important;
      border:0 !important;
    }

    .pinBase{
      position:relative;
      box-sizing:border-box;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));
    }

    /* 1 - R15 ACTUAL */
    .pin1{
      width:30px;
      height:30px;
      background:#e94235;
      border:2px solid #fff;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      overflow:visible;
    }

    .pin1::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      left:8px;
      top:8px;
      background:#fff;
      border-radius:50%;
    }

    /*
      Punto rojo de posición:
      queda exactamente en la punta inferior del pin
      y pulsa como señal de ubicación.
    */
    .pinPosicionPunto{
      position:absolute;

      /*
        Ajuste fino:
        - apenas más a la izquierda
        - un poco más abajo
        - deja una pequeña luz entre la punta del pin
          y el punto rojo de señal
      */
      left:-14px;
      top:28px;

      width:13px;
      height:13px;

      border-radius:50%;
      background:#e94235;
      border:2px solid #fff;

      /*
        Compensamos la rotación del pin padre para que
        el punto se vea circular y no rotado.
      */
      transform:rotate(45deg);

      box-sizing:border-box;
      z-index:6;

      box-shadow:
        0 1px 3px rgba(0,0,0,.25);
    }

    .pinPosicionPunto::after{
      content:"";
      position:absolute;

      left:50%;
      top:50%;

      width:8px;
      height:8px;

      border-radius:50%;
      background:rgba(233,66,53,.34);

      transform:
        translate(-50%,-50%)
        scale(1);

      animation:
        piocaPinPulse
        1.55s
        ease-out
        infinite;
    }

    @keyframes piocaPinPulse{
      0%{
        opacity:.75;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(3.1);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(3.1);
      }
    }

    .leaflet-control-attribution{
      background:rgba(255,255,255,.72) !important;
      color:#6f7880 !important;
      font-size:8px !important;
      line-height:1.15 !important;
      padding:2px 4px !important;
      border-radius:0 5px 0 0 !important;
      box-shadow:none !important;
      opacity:.62;
      backdrop-filter:blur(3px);
    }

    .leaflet-control-attribution a{
      color:#6f7880 !important;
      text-decoration:none !important;
    }

    .leaflet-popup-content{
      width:145px !important;
      max-width:145px;
      text-align:center;
      line-height:1.2;
      margin:10px 12px;
      font-size:11px;
      color:#203246;
      font-weight:700;
    }

    .leaflet-popup-content-wrapper{
      border-radius:13px;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    #actualizacionBox{
      position:absolute;
      top:14px;
      right:14px;
      z-index:1000;
      background:linear-gradient(
        135deg,
        rgba(22,39,54,.96) 0%,
        rgba(30,54,74,.96) 100%
      );
      color:#4ee07d;
      padding:10px 13px;
      border-radius:12px;
      font-size:11px;
      font-weight:700;
      line-height:1.25;
      text-align:left;
      box-shadow:0 5px 14px rgba(0,0,0,.20);
      pointer-events:none;
      min-width:145px;
    }

    #actualizacionBox::before{
      content:"⌖";
      display:inline-block;
      margin-right:6px;
      color:#4ee07d;
      font-size:16px;
      vertical-align:-1px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }



    /* Estado especial cuando faltan 3 minutos o menos */

    .leaflet-popup.popupProximo .leaflet-popup-content-wrapper{

    /* ==========================================================
       AJUSTE FINAL CABECERA - 16/08/2026 R6
       Panel de hora:
       - apenas más grande
       - levemente desplazado hacia la derecha
       - mantiene título arriba y hora abajo con "hs"
       - sin tocar pin, mapa ni lógica de rumbo

    .cabeceraCliente{

  const VELOCIDAD_MICROPROYECCION_KMH =

      fechaMs

    .toLocaleTimeString(

      }

  function pintarEtapaTrayecto(
    etapa
  ){

    /*
      Etapas visuales solicitadas:
      2 = viaje normal
      3 = desde 5 minutos antes de ETA
      4 = desde 2 minutos antes de ETA

      Si la ETA vuelve a alejarse, la camioneta vuelve hacia atrás.
      No modifica estado del seguimiento ni GPS.
    */
    etapa =
      Math.max(
        2,
        Math.min(
          4,
          etapa
        )
      );

    const posiciones = {
      2:35,
      3:65,
      4:95
    };

    const rellenos = {
      2:30,
      3:60,
      4:90
    };

    piocaCamionetaProgreso.style.left =
      posiciones[etapa] +
      "%";

    piocaLineaProgreso.style.width =
      rellenos[etapa] +
      "%";

    for(
      let i = 0;
      i < piocaEtapas.length;
      i++
    ){

      const numeroEtapa =
        i + 1;

      piocaEtapas[i]
      .classList
      .toggle(
        "completa",
        numeroEtapa <
          etapa
      );

      piocaEtapas[i]
      .classList
      .toggle(
        "actual",
        numeroEtapa ===
          etapa
      );
    }
  }

    const ahora =

    */
    piocaEtaHora.textContent =

    piocaHoraEtapa3.textContent =

    piocaHoraEtapa4.textContent =
      formatearHoraTrayecto(

    /*
      Lógica pedida:

      <= 5 min => etapa 3
      <= 2 min => etapa 4

      Si el técnico aumenta la ETA, esta lógica vuelve a mover
      visualmente la camioneta a la etapa correspondiente.
    */
    let etapa =
      2;

    if(
      faltanMin <= 2
    ){
      etapa = 4;

    ){

  function iniciarCicloConsultas(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    if(
      consultaId !== null
    ){
      clearInterval(
        consultaId
      );
    }

    consultaId =
      setInterval(
        function(){
          consultar(false);
        },
        1500
      );

    if(
      watchdogConsultaId === null
    ){

      watchdogConsultaId =
        setInterval(
          function(){

            if(
              terminado ||
              !codigo
            ){
              return;
            }

            const demora =
              Date.now() -
              ultimaConsultaFinalizadaMs;

            /*
              Si la pantalla dejó de completar consultas
              durante 20 segundos, se reconstruye el ciclo.
            */
            if(
              demora >= 20000
            ){

              if(
                consultaAbortController
              ){
                try{
                  consultaAbortController.abort();
                }catch(e){}
              }

              consultaEnCurso =
                false;

              ultimaConsultaFinalizadaMs =
                Date.now();

              iniciarCicloConsultas();

              consultar(true);
            }
          },
          5000
        );
    }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 - lat1
      );

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +
      Math.cos(gradosARadianes(lat1)) *
      Math.cos(gradosARadianes(lat2)) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function proyectarPuntoPorRumbo(
    lat,
    lon,
    rumbo,
    distancia
  ){

    const radioTierra =
      6371000;

    const angular =
      distancia /
      radioTierra;

    const rumboRad =
      gradosARadianes(
        rumbo
      );

    const latRad =
      gradosARadianes(
        lat
      );

    const lonRad =
      gradosARadianes(
        lon
      );

    const latDestino =
      Math.asin(
        Math.sin(latRad) *
        Math.cos(angular) +
        Math.cos(latRad) *
        Math.sin(angular) *
        Math.cos(rumboRad)
      );

    const lonDestino =
      lonRad +
      Math.atan2(
        Math.sin(rumboRad) *
        Math.sin(angular) *
        Math.cos(latRad),
        Math.cos(angular) -
        Math.sin(latRad) *
        Math.sin(latDestino)
      );

    return {
      lat:
        latDestino *
        180 /
        Math.PI,
      lon:
        lonDestino *
        180 /
        Math.PI
    };
  }

  function interpolar(
    valor,
    x1,
    y1,
    x2,
    y2
  ){

    if(
      x2 === x1
    ){
      return y2;
    }

    const t =
      Math.max(
        0,
        Math.min(
          1,
          (
            valor -
            x1
          ) /
          (
            x2 -
            x1
          )
        )
      );

    return y1 +
      (
        y2 -
        y1
      ) *
      t;
  }

  function rumboGrados(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const phi1 =
      gradosARadianes(lat1);

    const phi2 =
      gradosARadianes(lat2);

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const y =
      Math.sin(dLon) *
      Math.cos(phi2);

    const x =
      Math.cos(phi1) *
      Math.sin(phi2) -
      Math.sin(phi1) *
      Math.cos(phi2) *
      Math.cos(dLon);

    let grados =
      Math.atan2(y,x) *
      180 /
      Math.PI;

    grados =
      (grados + 360) % 360;

    return grados;
  }

  function diferenciaRumboGrados(
    rumbo1,
    rumbo2
  ){

    let diferencia =
      Math.abs(
        rumbo2 -
        rumbo1
      );

    if(
      diferencia >
        180
    ){
      diferencia =
        360 -
        diferencia;
    }

    return diferencia;
  }


  function promedioCircularRumbos(
    rumbos
  ){

    if(
      !Array.isArray(rumbos) ||
      rumbos.length === 0
    ){
      return null;
    }

    let sumaX = 0;
    let sumaY = 0;
    let cantidad = 0;

    for(
      const rumbo of rumbos
    ){

      if(
        !Number.isFinite(rumbo)
      ){
        continue;
      }

      const rad =
        gradosARadianes(
          rumbo
        );

      sumaX += Math.cos(rad);
      sumaY += Math.sin(rad);
      cantidad++;
    }

    if(
      cantidad === 0 ||
      (
        Math.abs(sumaX) < 0.000001 &&
        Math.abs(sumaY) < 0.000001
      )
    ){
      return null;
    }

    let grados =
      Math.atan2(
        sumaY,
        sumaX
      ) *
      180 /
      Math.PI;

    grados =
      (
        grados +
        360
      ) %
      360;

    return grados;
  }


  function registrarRumboAltaVelocidad(
    rumbo
  ){

    if(
      !Number.isFinite(
        rumbo
      )
    ){
      return;
    }

    historialRumbosAltaVelocidad.push(
      rumbo
    );

    while(
      historialRumbosAltaVelocidad.length >
        HISTORIAL_RUMBO_MAX
    ){
      historialRumbosAltaVelocidad.shift();
    }
  }


  function estabilizarPuntoAltaVelocidad(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      ) ||
      velocidadKmh <
        VELOCIDAD_CONTINUA_DESDE_KMH ||
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      desviosAltaVelocidadConsecutivos =
        0;

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_FILTRO_LATERAL_METROS ||
      distanciaNueva <
        DISTANCIA_MINIMA_FILTRO_LATERAL_METROS ||
      distanciaNueva >
        DISTANCIA_MAXIMA_FILTRO_LATERAL_METROS
    ){
      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    registrarRumboAltaVelocidad(
      rumboAnterior
    );

    const rumboEstable =
      promedioCircularRumbos(
        historialRumbosAltaVelocidad
      );

    if(
      !Number.isFinite(
        rumboEstable
      )
    ){
      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const diferencia =
      diferenciaRumboGrados(
        rumboEstable,
        rumboNuevo
      );

    if(
      diferencia <=
        ANGULO_DESVIO_ALTA_VELOCIDAD_GRADOS
    ){
      desviosAltaVelocidadConsecutivos =
        0;

      registrarRumboAltaVelocidad(
        rumboNuevo
      );

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    desviosAltaVelocidadConsecutivos++;

    if(
      desviosAltaVelocidadConsecutivos >=
        3
    ){
      historialRumbosAltaVelocidad = [
        rumboNuevo
      ];

      desviosAltaVelocidadConsecutivos =
        0;

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const proyectado =
      proyectarPuntoPorRumbo(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        rumboEstable,
        distanciaNueva
      );

    let factorLateral =
      desviosAltaVelocidadConsecutivos === 1
        ? FACTOR_LATERAL_PRIMER_DESVIO
        : FACTOR_LATERAL_SEGUNDO_DESVIO;

    if(
      diferencia <
        ANGULO_GIRO_REAL_ALTA_VELOCIDAD_GRADOS
    ){
      factorLateral =
        Math.max(
          factorLateral,
          0.45
        );
    }

    return {
      lat:
        proyectado.lat +
        (
          latNuevo -
          proyectado.lat
        ) *
        factorLateral,
      lon:
        proyectado.lon +
        (
          lonNuevo -
          proyectado.lon
        ) *
        factorLateral,
      filtrado:true
    };
  }

  function esGiroProtegidoBajaVelocidad(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      ) ||

        VELOCIDAD_GIRO_PROTEGIDO_KMH ||
      !penultimoPuntoServidor ||

    ){

    }

    const distanciaAnterior =

      );

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,

        latNuevo,

      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_GIRO_METROS ||
      distanciaNueva <

    ){

    }

    const rumboAnterior =

      );

        latNuevo,

      );

    return diferenciaRumboGrados(
      rumboAnterior,
      rumboNuevo
    ) >=
      ANGULO_GIRO_PROTEGIDO_GRADOS;
  }

  function porcentajeBaseOriginal(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.85;
    }

    if(
      velocidadKmh <=
      20
    ){
      return interpolar(
        velocidadKmh,
        0,
        0.70,
        20,
        0.76
      );
    }

    if(
      velocidadKmh <=
      50
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.76,
        50,
        0.84
      );
    }

    if(
      velocidadKmh <=
      80
    ){
      return interpolar(
        velocidadKmh,
        50,
        0.84,
        80,
        0.90
      );
    }

    if(
      velocidadKmh <=
      120
    ){
      return interpolar(
        velocidadKmh,
        80,
        0.90,
        120,
        0.95
      );
    }

    return 0.95;
  }

  function porcentajeAnimacionSegunVelocidad(
    velocidadKmh
  ){

    /*
      V9 / posiciones cada 2 s:
      dejamos una pequeña "ventana de aire" antes del próximo punto.
      A baja velocidad usamos más porcentaje para que no parezca
      que el pin se detiene entre lecturas.
    */
    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.84;
    }

    if(
      velocidadKmh <= 5
    ){
      return 0.90;
    }

    if(
      velocidadKmh <= 20
    ){
      return interpolar(
        velocidadKmh,
        5,
        0.90,
        20,
        0.86
      );
    }

    if(
      velocidadKmh <= 50
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.86,
        50,
        0.80
      );
    }

    if(
      velocidadKmh <= 100
    ){
      return interpolar(
        velocidadKmh,
        50,
        0.80,
        100,
        0.74
      );
    }

    return 0.70;
  }

  function calcularVelocidadInterna(
    latNuevo,
    lonNuevo,
    createdAtNuevo
  ){

    if(
      !ultimoPuntoServidor ||
      !ultimoCreatedAtServidor
    ){
      return ultimaVelocidadValidaKmh;
    }

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervaloSegundos =
      (
        nuevoMs -
        anteriorMs
      ) /
      1000;

    if(
      !Number.isFinite(
        intervaloSegundos
      ) ||
      intervaloSegundos <=
        0
    ){
      return ultimaVelocidadValidaKmh;
    }

    const distancia =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    /*
      Si prácticamente no se desplazó,
      consideramos velocidad real 0 km/h.
    */
    if(
      distancia <=
        DISTANCIA_DETENIDO_METROS
    ){

      ultimaVelocidadValidaKmh =
        0;

      return 0;
    }

    const velocidadCalculada =
      (
        distancia /
        intervaloSegundos
      ) *
      3.6;

    /*
      Si el salto implicaría una velocidad absurda,
      NO contaminamos la estimación:
      reutilizamos la última velocidad válida.
    */
    if(
      !Number.isFinite(
        velocidadCalculada
      ) ||
      velocidadCalculada >
        VELOCIDAD_MAXIMA_VALIDA_KMH
    ){

      return ultimaVelocidadValidaKmh;
    }

    ultimaVelocidadValidaKmh =
      velocidadCalculada;

    return velocidadCalculada;
  }

  function factorContinuoSegunVelocidad(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return FACTOR_CONTINUO_80_KMH;
    }

    if(
      velocidadKmh <= 60
    ){
      return FACTOR_CONTINUO_60_KMH;
    }

    if(
      velocidadKmh <= 80
    ){
      return interpolar(
        velocidadKmh,
        60,
        FACTOR_CONTINUO_60_KMH,
        80,
        FACTOR_CONTINUO_80_KMH
      );
    }

    if(
      velocidadKmh <= 100
    ){
      return interpolar(
        velocidadKmh,
        80,
        FACTOR_CONTINUO_80_KMH,
        100,
        FACTOR_CONTINUO_100_KMH
      );
    }

    return FACTOR_CONTINUO_100_KMH;
  }


  function calcularDuracionAnimacion(
    latNuevo,
    lonNuevo,
    createdAtNuevo,
    velocidadInterna
  ){

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    if(
      !Number.isFinite(
        nuevoMs
      ) ||
      !ultimoCreatedAtServidor
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervalo =
      nuevoMs -
      anteriorMs;

    if(
      !Number.isFinite(
        intervalo
      ) ||
      intervalo <=
        0
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const velocidad =
      Number.isFinite(
        velocidadInterna
      )
        ? velocidadInterna
        : calcularVelocidadInterna(
            latNuevo,
            lonNuevo,
            createdAtNuevo
          );

    /*
      A partir de 60 km/h usamos una ventana continua.
      La animación dura apenas más que el intervalo GPS,
      por lo que el próximo punto normalmente llega mientras
      el pin todavía está avanzando.
    */
    if(
      Number.isFinite(
        velocidad
      ) &&
      velocidad >=
        VELOCIDAD_CONTINUA_DESDE_KMH
    ){

      const factorContinuo =
        factorContinuoSegunVelocidad(
          velocidad
        );

      return Math.max(
        DURACION_CONTINUA_MIN_MS,
        Math.min(
          DURACION_CONTINUA_MAX_MS,
          intervalo *
          factorContinuo
        )
      );
    }

    const porcentaje =
      porcentajeAnimacionSegunVelocidad(
        velocidad
      );

    return Math.max(
      650,
      Math.min(
        2200,
        intervalo *
        porcentaje
      )
    );
  }

  function esRetrocesoProbablePorRuido(
    latNuevo,
    lonNuevo
  ){

    if(
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      return false;
    }

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      !Number.isFinite(
        distanciaNueva
      ) ||
      distanciaNueva >
        DISTANCIA_MAXIMA_RETROCESO_RUIDO_METROS
    ){
      return false;
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_GIRO_METROS
    ){
      return false;
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    return diferenciaRumboGrados(
      rumboAnterior,
      rumboNuevo
    ) >=
      ANGULO_RETROCESO_RUIDO_GRADOS;
  }

  function iniciarMicroproyeccionPostGiro(
    latBase,
    lonBase,
    rumbo
  ){

    if(
      !mapa ||
      !marcador ||
      !Number.isFinite(
        rumbo
      )
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicio =
      performance.now();

    const duracionMaximaMs =
      (
        DISTANCIA_MAXIMA_MICROPROYECCION_METROS /
        VELOCIDAD_MICROPROYECCION_MS
      ) *
      1000;

    function pasoMicro(
      ahora
    ){

      const transcurrido =
        Math.max(
          0,
          ahora -
          inicio
        );

      const distancia =
        Math.min(
          DISTANCIA_MAXIMA_MICROPROYECCION_METROS,
          VELOCIDAD_MICROPROYECCION_MS *
          (
            transcurrido /
            1000
          )
        );

      const punto =
        proyectarPuntoPorRumbo(
          latBase,
          lonBase,
          rumbo,
          distancia
        );

      marcador.setLatLng(
        [
          punto.lat,
          punto.lon
        ]
      );

      mapa.panTo(
        [
          punto.lat,
          punto.lon
        ],
        {
          animate:false
        }
      );

      if(
        transcurrido <
          duracionMaximaMs
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            pasoMicro
          );

      }else{

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        pasoMicro
      );
  }

  function animarMarcadorHasta(
    latDestino,
    lonDestino,
    duracionMs,
    velocidadKmh
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    /*
      Cada GPS nuevo cancela la transición anterior y continúa
      desde la posición visual exacta donde estaba el pin.
      Nunca rebobinamos al último punto dibujado.
    */
    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distancia =
      distanciaMetros(
        latInicio,
        lonInicio,
        latDestino,
        lonDestino
      );

    if(
      distancia >
        DISTANCIA_MAXIMA_ANIMACION_METROS
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      mapa.panTo(
        [latDestino, lonDestino],
        {
          animate:true,
          duration:0.8
        }
      );

      return;
    }

    if(
      distancia <
        2
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      return;
    }

    const inicio =
      performance.now();

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionMs
        );

      /*
        Alta velocidad:
        t lineal = velocidad visual constante.
        No frenamos al final de cada paquete GPS.

        Baja/media velocidad:
        mantenemos smoothstep porque sigue dando una sensación
        más natural en maniobras urbanas y aproximaciones.
      */
      const t =
        (
          Number.isFinite(
            velocidadKmh
          ) &&
          velocidadKmh >=
            VELOCIDAD_CONTINUA_DESDE_KMH
        )
          ? progreso
          : (
              progreso *
              progreso *
              (
                3 -
                2 *
                progreso
              )
            );

      const latActual =
        latInicio +
        (
          latDestino -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonDestino -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      /*
        Acompaña la camioneta sin modificar
        la orientación elegida por el cliente.
      */
      mapa.panTo(
        [latActual, lonActual],
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            paso
          );

      }else{

        marcador.setLatLng(
          [latDestino, lonDestino]
        );

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        paso
      );
  }

  function animarMarcadorConGiroProtegido(
    latEsquina,
    lonEsquina,
    latDestino,
    lonDestino,
    duracionTotalMs
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distanciaHastaEsquina =
      distanciaMetros(
        latInicio,
        lonInicio,
        latEsquina,
        lonEsquina
      );

    const distanciaDesdeEsquina =
      distanciaMetros(
        latEsquina,
        lonEsquina,
        latDestino,
        lonDestino
      );

    const total =
      distanciaHastaEsquina +
      distanciaDesdeEsquina;

    if(
      !Number.isFinite(total) ||
      total <= 0
    ){
      animarMarcadorHasta(
        latDestino,
        lonDestino,
        duracionTotalMs
      );
      return;
    }

    const proporcionPrimera =
      Math.max(
        0.18,
        Math.min(
          0.72,
          distanciaHastaEsquina /
          total
        )
      );

    const duracionPrimera =
      Math.max(
        450,
        duracionTotalMs *
        proporcionPrimera
      );

    const duracionSegunda =
      Math.max(
        700,
        duracionTotalMs -
        duracionPrimera
      );

    const inicio =
      performance.now();

    function primerTramo(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionPrimera
        );

      const t =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      const latActual =
        latInicio +
        (
          latEsquina -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonEsquina -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      mapa.panTo(
        [latActual, lonActual],
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            primerTramo
          );

      }else{

        marcador.setLatLng(
          [latEsquina, lonEsquina]
        );

        const inicioSegundo =
          performance.now();

        function segundoTramo(
          ahoraSegundo
        ){

          const progresoSegundo =
            Math.min(
              1,
              (
                ahoraSegundo -
                inicioSegundo
              ) /
              duracionSegunda
            );

          const t2 =
            progresoSegundo *
            progresoSegundo *
            (
              3 -
              2 *
              progresoSegundo
            );

          const latActual2 =
            latEsquina +
            (
              latDestino -
              latEsquina
            ) *
            t2;

          const lonActual2 =
            lonEsquina +
            (
              lonDestino -
              lonEsquina
            ) *
            t2;

          marcador.setLatLng(
            [latActual2, lonActual2]
          );

          mapa.panTo(
            [latActual2, lonActual2],
            {
              animate:false
            }
          );

          if(
            progresoSegundo <
              1
          ){

            animacionMarcadorId =
              requestAnimationFrame(
                segundoTramo
              );

          }else{

            marcador.setLatLng(
              [latDestino, lonDestino]
            );

            animacionMarcadorId =
              null;
          }
        }

        animacionMarcadorId =
          requestAnimationFrame(
            segundoTramo
          );
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        primerTramo
      );
  }

  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "flex";
if(
      mapa
    ){
      requestAnimationFrame(
        function(){
          try{
            mapa.invalidateSize();
          }catch(e){}
        }
      );
    }

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:true,
            rotateControl:false,
            attributionControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.control.attribution({
        position:"bottomleft",
        prefix:false
      })
      .addTo(
        mapa
      );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100
      );


    }
  }

  function actualizarMarcador(
    lat,
    lon,
    createdAt
  ){

    crearMapa(
      lat,
      lon
    );

    const createdMs =
      new Date(
        createdAt
      )
      .getTime();

    if(
      ultimoCreatedAtServidor
    ){

      const ultimoMs =
        new Date(
          ultimoCreatedAtServidor
        )
        .getTime();

      if(
        Number.isFinite(
          createdMs
        ) &&
        Number.isFinite(
          ultimoMs
        ) &&
        createdMs <=
          ultimoMs
      ){
        return;
      }
    }

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [lat, lon],
          {
            icon:
              iconoPioca,
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        )
        .bindPopup(
          "<strong>¡Estamos en camino!</strong>"
        );

      marcador.openPopup();

      actualizarEstadoLlegada();

      ultimoPuntoServidor = {
        lat:lat,
        lon:lon
      };

      ultimoCreatedAtServidor =
        createdAt;

      return;
    }

    const velocidadInterna =
      calcularVelocidadInterna(
        lat,
        lon,
        createdAt
      );

    /*
      El punto bruto sigue alimentando velocidad y memoria real.
      Sólo el destino VISUAL puede ser estabilizado a alta velocidad.
    */
    const puntoVisual =
      estabilizarPuntoAltaVelocidad(
        lat,
        lon,
        velocidadInterna
      );

    const latVisual =
      puntoVisual.lat;

    const lonVisual =
      puntoVisual.lon;

    const duracion =
      calcularDuracionAnimacion(
        latVisual,
        lonVisual,
        createdAt,
        velocidadInterna
      );

    const giroProtegido =
      esGiroProtegidoBajaVelocidad(
        lat,
        lon,
        velocidadInterna
      );

    const retrocesoRuido =
      esRetrocesoProbablePorRuido(
        lat,
        lon
      );

    const distanciaDesdeUltimo =
      ultimoPuntoServidor
        ? distanciaMetros(
            ultimoPuntoServidor.lat,
            ultimoPuntoServidor.lon,
            latVisual,
            lonVisual
          )
        : Infinity;

    if(
      retrocesoRuido
    ){

      /*
        No hacemos retroceder visualmente el pin por una oscilación
        corta y casi opuesta del GPS.

        IMPORTANTE:
        no descartamos el timestamp del servidor. Simplemente
        preservamos la posición visual estable y esperamos el
        siguiente punto, que llegará aproximadamente en 2 s.
      */
      detenerAnimacionMarcador();

    }else if(
      Number.isFinite(
        distanciaDesdeUltimo
      ) &&
      distanciaDesdeUltimo <
        DISTANCIA_MINIMA_MOVIMIENTO_VISUAL_METROS
    ){

      /*
        Deriva mínima: no dibujamos una mini-animación nerviosa.
      */
      detenerAnimacionMarcador();

    }else if(
      giroProtegido &&
      ultimoPuntoServidor
    ){

      /*
        V9 - giro protegido con GPS cada 2 s.

        El último punto confirmado funciona como vértice intermedio:
        marcador -> último punto real -> nuevo punto real.

        Así evitamos la diagonal directa entre dos calles y,
        gracias a la frecuencia de 2 s, ese vértice suele quedar
        mucho más cerca de la esquina real.
      */
      animarMarcadorConGiroProtegido(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        lat,
        lon,
        duracion
      );

    }else{

      /*
        En 60–100 km/h esta llamada entra en modo continuo:
        - duración ligeramente superior al intervalo GPS;
        - interpolación lineal;
        - el nuevo punto corrige el objetivo en vuelo;
        - nunca reinicia desde el último GPS, sino desde el punto
          visual exacto donde estaba el marcador.
      */
      animarMarcadorHasta(
        latVisual,
        lonVisual,
        duracion,
        velocidadInterna
      );
    }

    penultimoPuntoServidor =
      ultimoPuntoServidor
        ? {
            lat:
              ultimoPuntoServidor.lat,
            lon:
              ultimoPuntoServidor.lon
          }
        : null;

    ultimoPuntoServidor = {
      lat:lat,
      lon:lon
    };

    ultimoCreatedAtServidor =
      createdAt;
  }

  async function consultar(
    forzar
  ){

    forzar =
      forzar === true;

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    /*
      Evita consultas simultáneas.
      Si el usuario fuerza un refresco, se cancela
      una consulta anterior que pudiera haber quedado colgada.
    */
    if(
      consultaEnCurso
    ){

      if(
        !forzar
      ){
        return;
      }

      if(
        consultaAbortController
      ){
        try{
          consultaAbortController.abort();
        }catch(e){}
      }

      consultaEnCurso =
        false;
    }

    consultaEnCurso =
      true;

    const controlador =
      new AbortController();

    consultaAbortController =
      controlador;

    const timeoutConsulta =
      setTimeout(
        function(){
          try{
            controlador.abort();
          }catch(e){}
        },
        10000
      );

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              }),

            signal:
              controlador.signal

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        estado.textContent =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimoCreatedAtServidor =
          null;

        ultimoPuntoServidor =
          null;

        penultimoPuntoServidor =
          null;

        ultimaVelocidadValidaKmh =
          null;

        detenerReloj();

        detenerAnimacionMarcador();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon,
        p.created_at
      );

      pintarEstadoNormalEnVivo();

      actualizarEstadoLlegada();

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Timeout, pérdida de Internet o suspensión
        del navegador no finalizan el seguimiento.
        Se conserva la última pantalla válida.
      */

    }finally{

      clearTimeout(
        timeoutConsulta
      );

      if(
        consultaAbortController ===
        controlador
      ){

        consultaAbortController =
          null;

        consultaEnCurso =
          false;
      }

      ultimaConsultaFinalizadaMs =
        Date.now();
    }
  }

  btnRefrescarPosicion.addEventListener(
    "click",
    refrescarConsultaManual
  );

  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.visibilityState ===
          "visible" &&
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "pageshow",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "online",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar(true);

    iniciarCicloConsultas();

    iniciarHeartbeatCliente();
  }

})();

</script>
