<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title></title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root{
      --pioca-azul:#0833A2;
      --pioca-verde:#249447;
      --pioca-rojo:#e94235;
      --texto:#22303d;
    }

    *{ box-sizing:border-box; }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Arial,sans-serif;
      background:#eef1f3;
      color:var(--texto);
    }

    body{
      height:100dvh;
      min-height:100dvh;
    }

    .panel{
      position:fixed;
      inset:0;
      width:100%;
      height:100dvh;
      margin:0;
      padding:0;
      background:transparent;
      overflow:hidden;
    }

    /* ==========================================================
       MAPA FULLSCREEN
       ========================================================== */

    #mapaWrap{
      display:none;
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      min-height:100%;
      z-index:1;
    }

    #mapaContenedor{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      min-height:100%;
    }

    #mapa{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      min-height:100%;
      border:0;
      border-radius:0;
    }

    /* Bajamos los controles + / - para que nunca se pisen con el logo */
    .leaflet-top.leaflet-left{
      top:138px !important;
      left:9px !important;
    }

    .leaflet-control-zoom{
      margin:0 !important;
      box-shadow:0 4px 12px rgba(0,0,0,.15) !important;
    }

    .leaflet-control-attribution{
      background:rgba(255,255,255,.68) !important;
      color:#6f7880 !important;
      font-size:7px !important;
      padding:2px 4px !important;
      opacity:.58;
    }

    .leaflet-control-attribution a{
      color:#6f7880 !important;
      text-decoration:none !important;
    }

    /* Popup del pin completamente anulado */
    .leaflet-popup,
    .leaflet-popup-pane{
      display:none !important;
      visibility:hidden !important;
      pointer-events:none !important;
    }

    /* ==========================================================
       LOGO SUPERIOR
       ========================================================== */

    .cabeceraCliente{
      position:absolute;
      z-index:1200;
      top:max(13px, env(safe-area-inset-top));
      left:max(13px, env(safe-area-inset-left));
      width:auto;
      height:auto;
      margin:0;
      display:block;
      pointer-events:none;
    }

    .logo{
      width:124px;
      height:124px;
      min-height:124px;
      margin:0;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.94);
      box-shadow:0 6px 20px rgba(20,35,50,.16);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      overflow:hidden;
    }

    .logo::after{ display:none; }

    .logo img{
      width:120px;
      height:120px;
      max-width:120px;
      object-fit:contain;
      display:block;
    }

    #horaLlegadaBox{
      display:none !important;
    }

    /* ==========================================================
       SEGUIMIENTO EN VIVO - MISMO CONCEPTO ACTUAL, MÁS COMPACTO
       ========================================================== */

    #estado{
      position:absolute;
      z-index:1202;
      top:max(14px, env(safe-area-inset-top));
      right:max(12px, env(safe-area-inset-right));
      width:230px;
      max-width:calc(100vw - 158px);
      min-height:43px;
      margin:0;
      padding:7px 9px;
      border:1px solid #bfe4ca;
      border-radius:13px;
      background:rgba(237,249,240,.95);
      box-shadow:0 5px 15px rgba(25,45,65,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      font-weight:700;
    }

    .estadoEnVivo{
      width:100%;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:7px;
    }

    .puntoEnVivo{
      position:relative;
      width:20px;
      height:20px;
      flex:0 0 20px;
      border-radius:50%;
      background:#2db45a;
    }

    .puntoEnVivo::before{
      content:"✓";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:11px;
      font-weight:700;
      z-index:1;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:20px;
      height:20px;
      border-radius:50%;
      background:rgba(40,191,89,.25);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    .estadoTexto{
      min-width:0;
      color:#1f6f3a;
      font-size:11px;
      line-height:1.05;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .estadoBadge{
      position:relative;
      justify-self:end;
      padding:4px 18px 4px 5px;
      color:#29994c;
      background:transparent;
      font-size:7.5px;
      font-weight:800;
      letter-spacing:.15px;
      white-space:nowrap;
    }

    .estadoBadge::after{
      content:"";
      position:absolute;
      right:4px;
      top:50%;
      width:7px;
      height:7px;
      border-radius:50%;
      background:#28bf59;
      transform:translateY(-50%);
      box-shadow:0 0 0 3px rgba(40,191,89,.10);
      animation:piocaLiveDot 1.7s ease-in-out infinite;
    }

    @keyframes piocaLivePulse{
      0%{opacity:.8;transform:translate(-50%,-50%) scale(1);}
      70%,100%{opacity:0;transform:translate(-50%,-50%) scale(2.4);}
    }

    @keyframes piocaLiveDot{
      0%,100%{opacity:1;}
      50%{opacity:.45;}
    }

    /* ==========================================================
       UBICACIÓN ACTUALIZADA - CONSERVA EL LOOK ACTUAL
       ========================================================== */

    #actualizacionBox{
      position:absolute;
      z-index:1201;
      top:67px;
      right:max(12px, env(safe-area-inset-right));
      width:176px;
      min-width:176px;
      padding:9px 11px;
      border-radius:12px;
      background:linear-gradient(
        135deg,
        rgba(22,39,54,.96) 0%,
        rgba(30,54,74,.96) 100%
      );
      color:#4ee07d;
      box-shadow:0 5px 14px rgba(0,0,0,.20);
      font-size:10px;
      font-weight:700;
      line-height:1.22;
      pointer-events:none;
    }

    #actualizacionBox::before{
      content:"⌖";
      display:inline-block;
      margin-right:5px;
      color:#4ee07d;
      font-size:15px;
      vertical-align:-1px;
    }

    #actualizacionTexto{ display:block; }

    #actualizacionSegundos{
      display:block;
      margin-top:2px;
      font-size:10px;
    }

    .actualizacionOk{ color:#38e06f !important; }
    .actualizacionError{ color:#ff4b4b !important; }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaBlink 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{
      0%,100%{opacity:1;}
      50%{opacity:.48;}
    }

    /* ==========================================================
       PIN ACTUAL - EXACTAMENTE EL VIGENTE
       ========================================================== */

    .piocaPinIcon{
      background:transparent !important;
      border:0 !important;
    }

    .pinBase{
      position:relative;
      box-sizing:border-box;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));
    }

    .pin1{
      width:30px;
      height:30px;
      background:transparent;
      border:0;
      border-radius:0;
      transform:rotate(-45deg);
      overflow:visible;
    }

    .pin1::after{
      display:none;
    }

    .pinMapaPiocaImagen{
      position:absolute;
      left:-15px;
      top:-15px;
      width:50px;
      height:50px;
      max-width:none;
      object-fit:contain;
      display:block;
      transform:rotate(45deg);
      transform-origin:center center;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .pinPosicionPunto{
      position:absolute;
      left:-20px;
      top:30px;
      width:13px;
      height:13px;
      border-radius:50%;
      background:#155EA7;
      border:2px solid #fff;
      transform:rotate(45deg);
      box-sizing:border-box;
      z-index:6;
      box-shadow:0 1px 3px rgba(0,0,0,.25);
    }

    .pinPosicionPunto::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(21,94,167,.34);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaPinPulse 1.55s ease-out infinite;
    }

    @keyframes piocaPinPulse{
      0%{opacity:.75;transform:translate(-50%,-50%) scale(1);}
      70%,100%{opacity:0;transform:translate(-50%,-50%) scale(3.1);}
    }

    /* ==========================================================
       BOTÓN REFRESCAR
       Se ancla respecto del panel inferior mediante variable CSS.
       JS actualiza la variable con la altura real del panel.
       ========================================================== */

    #btnRefrescarPosicion{
      position:absolute;
      right:14px;
      bottom:calc(
        var(--pioca-panel-height, 245px) +
        max(16px, env(safe-area-inset-bottom))
      );
      z-index:1210;
      width:auto;
      margin:0;
      padding:8px 11px;
      border:1px solid rgba(32,50,70,.16);
      border-radius:999px;
      background:rgba(255,255,255,.91);
      color:#203246;
      box-shadow:0 4px 12px rgba(0,0,0,.14);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      font-family:Arial,sans-serif;
      font-size:9.5px;
      line-height:1;
      font-weight:800;
      cursor:pointer;
    }

    #btnRefrescarPosicion:active{ transform:scale(.97); }
    #btnRefrescarPosicion:disabled{ opacity:.62; }

    /* ==========================================================
       PANEL INFERIOR SEMITRANSPARENTE
       ========================================================== */

    #piocaTrayectoPanel{
      position:absolute;
      z-index:1200;
      left:16px;
      right:16px;
      bottom:max(10px, env(safe-area-inset-bottom));
      padding:16px 16px 12px;
      border:1px solid rgba(255,255,255,.92);
      border-radius:20px;
      background:rgba(255,255,255,.83);
      box-shadow:0 9px 28px rgba(17,30,45,.18);
      backdrop-filter:blur(13px);
      -webkit-backdrop-filter:blur(13px);
    }

    #piocaTrayectoCabecera{
      display:block;
      width:100%;
      margin:0 0 15px;
    }

    #piocaTrayectoTitulo{
      margin:0;
      text-align:left;
      color:#202c38;
      font-size:18px;
      line-height:1.08;
      font-weight:900;
      letter-spacing:.15px;
      text-transform:uppercase;
    }

    #piocaTrayectoTitulo::before{
      content:"⌁";
      display:inline-block;
      margin-right:7px;
      color:var(--pioca-azul);
      font-size:23px;
      font-weight:900;
      vertical-align:-2px;
    }

    #piocaEtaLinea{
      display:block;
      margin-top:8px;
      text-align:center;
      color:#39434d;
      font-size:12.5px;
      line-height:1.15;
    }

    #piocaEtaHora{
      display:inline-block;
      margin-left:7px;
      color:#1955A3;
      font-size:27px;
      line-height:1;
      font-weight:900;
      vertical-align:-2px;
      white-space:nowrap;
    }

    /* ==========================================================
       4 ETAPAS - GRID FIJO, SIN SELECTORES AMBIGUOS
       ========================================================== */

    #piocaTrayecto{
      position:relative;
      width:100%;
      height:119px;
      margin:0;
    }

    #piocaLineaBase{
      position:absolute;
      left:8%;
      right:8%;
      top:25px;
      height:4px;
      border-radius:999px;
      background:rgba(82,92,104,.26);
    }

    #piocaLineaProgreso{
      position:absolute;
      left:8%;
      top:25px;
      width:28%;
      height:4px;
      border-radius:999px;
      background:var(--pioca-azul);
      transition:width .55s cubic-bezier(.22,.75,.25,1);
    }

    .piocaEtapa{
      position:absolute;
      top:17px;
      width:23%;
      transform:translateX(-50%);
      text-align:center;
      color:#2d3741;
    }

    #piocaEtapa1{ left:8%; }
    #piocaEtapa2{ left:36%; }
    #piocaEtapa3{ left:64%; }
    #piocaEtapa4{ left:92%; }

    .piocaEtapaPunto{
      width:18px;
      height:18px;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.96);
      border-radius:50%;
      background:#b8bdc4;
      box-shadow:0 1px 4px rgba(0,0,0,.14);
      transition:background .35s ease,transform .35s ease;
    }

    .piocaEtapa.completa .piocaEtapaPunto,
    .piocaEtapa.actual .piocaEtapaPunto{
      background:var(--pioca-azul);
    }

    .piocaEtapa.actual .piocaEtapaPunto{
      transform:scale(1.12);
    }

    .piocaEtapaNumero{
      display:block;
      margin:0 0 4px;
      color:#27323c;
      font-size:10.5px;
      font-weight:800;
    }

    .piocaEtapa.actual .piocaEtapaNumero{
      color:var(--pioca-azul);
    }

    .piocaEtapaTexto{
      display:block;
      min-height:31px;
      padding:0 2px;
      color:#27323c;
      font-size:9.6px;
      line-height:1.18;
      font-weight:600;
    }

    .piocaEtapaHora{
      display:block;
      min-height:14px;
      margin-top:4px;
      color:#53606c;
      font-size:9px;
      line-height:1;
      font-weight:700;
      white-space:nowrap;
    }

    .piocaEtapa.actual .piocaEtapaHora{
      color:var(--pioca-azul);
      font-weight:900;
    }

    /* En etapas 1 y 2 no inventamos horarios */
    #piocaHoraEtapa1,
    #piocaHoraEtapa2{
      visibility:hidden;
    }

    /* Camioneta sobre la línea */
    #piocaCamionetaProgreso{
      position:absolute;
      z-index:6;
      top:-4px;
      left:36%;
      width:58px;
      height:58px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.95);
      border-radius:50%;
      background:rgba(255,255,255,.91);
      box-shadow:0 4px 13px rgba(24,40,60,.16);
      transition:left .58s cubic-bezier(.22,.75,.25,1);
      overflow:hidden;
    }

    #piocaCamionetaProgreso img{
      width:56px;
      height:56px;
      object-fit:contain;
      display:block;
    }

    /* ==========================================================
       FRASE FINAL - MISMA FRASE, SIN LOGO EXTRA
       ========================================================== */

    #fraseServicio{
      width:100%;
      margin:10px 0 0;
      padding:11px 5px 1px;
      border:0;
      border-top:1px solid rgba(65,75,88,.16);
      border-radius:0;
      background:transparent;
      box-shadow:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      color:#4e5963;
      text-align:center;
      font-size:11px;
      line-height:1.28;
    }

    #fraseServicio::before{
      content:"◷";
      width:25px;
      height:25px;
      flex:0 0 25px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid rgba(8,51,162,.35);
      border-radius:50%;
      color:var(--pioca-azul);
      font-size:14px;
    }

    /* Estado próximo: no transforma el panel superior; el cambio principal vive abajo */
    #estado.estadoProximo{
      background:rgba(237,249,240,.95) !important;
      border-color:#bfe4ca !important;
      color:#1f6f3a !important;
      animation:none !important;
    }

    /* Finalización existente */
    .llegadaFinal{
      width:100%;
      text-align:center;
      padding:8px 4px;
    }

    .llegadaFinalTitulo{
      font-size:21px;
      font-weight:700;
      color:#246b35;
      margin-bottom:8px;
    }

    .llegadaFinalGracias{
      font-size:15px;
      font-weight:700;
      color:#22364a;
      margin-bottom:5px;
    }

    .marcaRegistrada{
      display:inline-block;
      font-size:.38em;
      line-height:1;
      position:relative;
      top:-.78em;
      margin-left:1px;
      font-weight:700;
    }

    .llegadaFinalFrase{
      font-size:12px;
      color:#596672;
    }

    .cabeceraCliente.finalizado{
      position:relative;
      top:auto;
      left:auto;
      width:100%;
      padding-top:24px;
      display:flex;
      justify-content:center;
    }

    .cabeceraCliente.finalizado .logo{
      width:132px;
      height:132px;
    }

    .cabeceraCliente.finalizado .logo img{
      width:128px;
      height:128px;
      max-width:128px;
    }

    /* ==========================================================
       RESPONSIVE
       ========================================================== */

    @media(max-width:430px){

      .logo{
        width:110px;
        height:110px;
        min-height:110px;
      }

      .logo img{
        width:106px;
        height:106px;
        max-width:106px;
      }

      .leaflet-top.leaflet-left{
        top:126px !important;
      }

      #estado{
        width:210px;
        max-width:calc(100vw - 137px);
        min-height:40px;
        padding:6px 8px;
      }

      .estadoTexto{
        font-size:10px;
      }

      .estadoBadge{
        font-size:7px;
        padding-right:17px;
      }

      #actualizacionBox{
        top:61px;
        width:166px;
        min-width:166px;
        padding:8px 10px;
        font-size:9.4px;
      }

      #actualizacionSegundos{
        font-size:9.4px;
      }

      #piocaTrayectoPanel{
        left:10px;
        right:10px;
        padding:14px 11px 10px;
        border-radius:18px;
      }

      #piocaTrayectoTitulo{
        font-size:16px;
      }

      #piocaEtaLinea{
        margin-top:7px;
        font-size:11.5px;
      }

      #piocaEtaHora{
        font-size:24px;
      }

      #piocaTrayecto{
        height:114px;
      }

      .piocaEtapaTexto{
        font-size:8.6px;
      }

      .piocaEtapaHora{
        font-size:8.4px;
      }

      #piocaCamionetaProgreso{
        width:54px;
        height:54px;
      }

      #piocaCamionetaProgreso img{
        width:52px;
        height:52px;
      }

      #fraseServicio{
        margin-top:8px;
        padding-top:9px;
        font-size:10px;
      }
    }

    @media(max-height:690px){

      #piocaTrayectoPanel{
        padding-top:11px;
        padding-bottom:8px;
      }

      #piocaTrayectoCabecera{
        margin-bottom:10px;
      }

      #piocaTrayecto{
        height:103px;
      }

      .piocaEtapaTexto{
        min-height:27px;
      }

      #fraseServicio{
        margin-top:5px;
        padding-top:7px;
      }
    }
  

    /* ==========================================================
       cliente_diseño_nuevo_R4
       Ajustes finales de proximidad / iPhone
       ========================================================== */

    /*
      La camioneta queda más alta respecto de la línea.
      Esto evita que Safari/iPhone la superponga sobre los textos
      de las etapas al pasar por 2, 3 o 4.
    */
    #piocaCamionetaProgreso{
      top:-16px !important;
      width:56px !important;
      height:56px !important;
    }

    #piocaCamionetaProgreso img{
      width:54px !important;
      height:54px !important;
    }

    /*
      Etapa 3 no muestra hora.
      La única hora dentro de las etapas queda en la etapa 4.
    */
    #piocaHoraEtapa3{
      visibility:hidden !important;
    }

    /*
      Garantizamos un pequeño aire entre línea/camioneta
      y el bloque de textos en todos los navegadores.
    */
    .piocaEtapaNumero{
      margin-top:2px !important;
    }

    @media(max-width:430px){

      #piocaCamionetaProgreso{
        top:-19px !important;
        width:52px !important;
        height:52px !important;
      }

      #piocaCamionetaProgreso img{
        width:50px !important;
        height:50px !important;
      }
    }




    /* ==========================================================
       cliente_diseño_nuevo_R5
       Rastreo compacto + icono trayecto + centro visual útil
       ========================================================== */

    #estado{
      width:205px !important;
      max-width:calc(100vw - 150px) !important;
    }

    .estadoTexto{
      font-size:10.4px !important;
      letter-spacing:.05px !important;
      overflow:visible !important;
      text-overflow:clip !important;
    }

    .estadoBadge{
      font-size:7px !important;
      padding-right:16px !important;
    }

    @media(max-width:430px){

      #estado{
        width:194px !important;
        max-width:calc(100vw - 133px) !important;
      }

      .estadoTexto{
        font-size:9.6px !important;
      }

      .estadoBadge{
        font-size:6.6px !important;
      }
    }




    /* ==========================================================
       cliente_diseño_nuevo_R6
       Icono de trayecto PNG + estado inicial sin flash
       ========================================================== */

    /*
      El estado superior nace oculto.

  const VELOCIDAD_MICROPROYECCION_KMH =

    de dirección cuando el desplazamiento es corto, porque suele

  const ANGULO_RETROCESO_RUIDO_GRADOS =

  const DURACION_CONTINUA_MIN_MS =

  function pintarEtapaTrayecto(
    etapa,
    posicionPorcentaje,
    progresoEnCurso
  ){

    etapa =
      Math.max(
        2,
        Math.min(
          4,
          etapa
        )
      );

    const posiciones = {
      2:36,
      3:64,
      4:92
    };

    if(
      !Number.isFinite(
        posicionPorcentaje
      )
    ){
      posicionPorcentaje =
        posiciones[etapa];
    }

    posicionPorcentaje =
      Math.max(
        36,
        Math.min(
          92,
          posicionPorcentaje
        )
      );

    piocaCamionetaProgreso.style.left =
      posicionPorcentaje +
      "%";

    /*
      La línea nace en 8%, por eso el ancho visual es
      posición absoluta menos 8.
    */
    piocaLineaProgreso.style.width =
      Math.max(
        28,
        posicionPorcentaje - 8
      ) +
      "%";

    piocaLineaProgreso.classList.toggle(
      "piocaProgresoEnCurso",
      progresoEnCurso === true
    );

    piocaCamionetaProgreso.classList.toggle(
      "piocaCamionetaEnCurso",
      progresoEnCurso === true
    );

    for(
      let i = 0;
      i < piocaEtapas.length;
      i++
    ){

      const numero =
        i + 1;

      piocaEtapas[i]
      .classList
      .toggle(
        "completa",
        numero <
          etapa
      );

      piocaEtapas[i]
      .classList
      .toggle(
        "actual",
        numero ===
          etapa
      );
    }
  }


  function actualizarPanelTrayecto(){

    if(
      terminado ||
      !llegadaClienteMs ||
      !Number.isFinite(
        llegadaClienteMs
      )
    ){
      return;
    }

    const ahoraMs =
      Date.now();

    const faltanMin =
      (
        llegadaClienteMs -
        ahoraMs
      ) /
      60000;

    piocaEtaHora.textContent =
      formatearHoraTrayecto(
        llegadaClienteMs
      );

    piocaHoraEtapa3.textContent =
      "";

    piocaHoraEtapa4.textContent =
      "";

    /*
      R15 - AVANCE CONTINUO

      36% = etapa 2
      64% = etapa 3
      92% = etapa 4

      De etapa 2 a 3:
      se reparte el recorrido desde la ETA de referencia hasta
      que quedan 5 minutos.

      De etapa 3 a 4:
      los 3 minutos comprendidos entre 5 y 2 minutos restantes
      llenan progresivamente el último tramo.
    */
    let etapa =
      2;

    let posicion =
      36;

    let progresoEnCurso =
      false;

    if(
      faltanMin <= 2
    ){

      etapa =
        4;

      posicion =
        92;

    }else if(
      faltanMin <= 5
    ){

      etapa =
        3;

      const progreso34 =
        Math.max(
          0,
          Math.min(
            1,
            (
              5 -
              faltanMin
            ) /
            3
          )
        );

      posicion =
        64 +
        (
          28 *
          progreso34
        );

      progresoEnCurso =
        progreso34 <
          1;

    }else{

      etapa =
        2;

      /*
        Si la sesión empezó con más de 5 minutos, usamos ese
        tiempo inicial como referencia. Si empezó ya dentro de
        los últimos 5 minutos, este tramo queda directamente
        completado por la lógica superior.
      */
      const referenciaMin =
        (
          llegadaReferenciaTrayectoMs -
          ahoraMs
        ) /
        60000;

      const duracionTramo23 =
        Math.max(
          0.25,
          referenciaMin -
          5
        );

      const progreso23 =
        Math.max(
          0,
          Math.min(
            1,
            (
              referenciaMin -
              faltanMin
            ) /
            duracionTramo23
          )
        );

      posicion =
        36 +
        (
          28 *
          progreso23
        );

      progresoEnCurso =
        progreso23 <
          1;
    }

    pintarEtapaTrayecto(
      etapa,
      posicion,
      progresoEnCurso
    );

    piocaTrayectoTitulo.textContent =
      etapa >= 3
        ? "ESTAMOS PRÓXIMOS A LLEGAR"
        : "ESTAMOS EN CAMINO";

    requestAnimationFrame(
      actualizarAnclajeRefrescar
    );
  }

  function iniciarCicloConsultas(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    if(
      consultaId !== null
    ){
      clearInterval(
        consultaId
      );
    }

    consultaId =
      setInterval(
        function(){
          consultar(false);
        },
        1500
      );

    if(
      watchdogConsultaId === null
    ){

      watchdogConsultaId =
        setInterval(
          function(){

            if(
              terminado ||
              !codigo
            ){
              return;
            }

            const demora =
              Date.now() -
              ultimaConsultaFinalizadaMs;

            /*
              Si la pantalla dejó de completar consultas
              durante 20 segundos, se reconstruye el ciclo.
            */
            if(
              demora >= 20000
            ){

              if(
                consultaAbortController
              ){
                try{
                  consultaAbortController.abort();
                }catch(e){}
              }

              consultaEnCurso =
                false;

              ultimaConsultaFinalizadaMs =
                Date.now();

              iniciarCicloConsultas();

              consultar(true);
            }
          },
          5000
        );
    }
  }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 - lat1
      );

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +
      Math.cos(gradosARadianes(lat1)) *
      Math.cos(gradosARadianes(lat2)) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function proyectarPuntoPorRumbo(
    lat,
    lon,
    rumbo,
    distancia
  ){

    const radioTierra =
      6371000;

    const angular =
      distancia /
      radioTierra;

    const rumboRad =
      gradosARadianes(
        rumbo
      );

    const latRad =
      gradosARadianes(
        lat
      );

    const lonRad =
      gradosARadianes(
        lon
      );

    const latDestino =
      Math.asin(
        Math.sin(latRad) *
        Math.cos(angular) +
        Math.cos(latRad) *
        Math.sin(angular) *
        Math.cos(rumboRad)
      );

    const lonDestino =
      lonRad +
      Math.atan2(
        Math.sin(rumboRad) *
        Math.sin(angular) *
        Math.cos(latRad),
        Math.cos(angular) -
        Math.sin(latRad) *
        Math.sin(latDestino)
      );

    return {
      lat:
        latDestino *
        180 /
        Math.PI,
      lon:
        lonDestino *
        180 /
        Math.PI
    };
  }

  function interpolar(
    valor,
    x1,
    y1,
    x2,
    y2
  ){

    if(
      x2 === x1
    ){
      return y2;
    }

    const t =
      Math.max(
        0,
        Math.min(
          1,
          (
            valor -
            x1
          ) /
          (
            x2 -
            x1
          )
        )
      );

    return y1 +
      (
        y2 -
        y1
      ) *
      t;
  }

  function rumboGrados(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const phi1 =
      gradosARadianes(lat1);

    const phi2 =
      gradosARadianes(lat2);

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const y =
      Math.sin(dLon) *
      Math.cos(phi2);

    const x =
      Math.cos(phi1) *
      Math.sin(phi2) -
      Math.sin(phi1) *
      Math.cos(phi2) *
      Math.cos(dLon);

    let grados =
      Math.atan2(y,x) *
      180 /
      Math.PI;

    grados =
      (grados + 360) % 360;

    return grados;
  }

  function diferenciaRumboGrados(
    rumbo1,
    rumbo2
  ){

    let diferencia =
      Math.abs(
        rumbo2 -
        rumbo1
      );

    if(
      diferencia >
        180
    ){
      diferencia =
        360 -
        diferencia;
    }

    return diferencia;
  }


  function promedioCircularRumbos(
    rumbos
  ){

    if(
      !Array.isArray(rumbos) ||
      rumbos.length === 0
    ){
      return null;
    }

    let sumaX = 0;
    let sumaY = 0;
    let cantidad = 0;

    for(
      const rumbo of rumbos
    ){

      if(
        !Number.isFinite(rumbo)
      ){
        continue;
      }

      const rad =
        gradosARadianes(
          rumbo
        );

      sumaX += Math.cos(rad);
      sumaY += Math.sin(rad);
      cantidad++;
    }

    if(
      cantidad === 0 ||
      (
        Math.abs(sumaX) < 0.000001 &&
        Math.abs(sumaY) < 0.000001
      )
    ){
      return null;
    }

    let grados =
      Math.atan2(
        sumaY,
        sumaX
      ) *
      180 /
      Math.PI;

    grados =
      (
        grados +
        360
      ) %
      360;

    return grados;
  }


  function registrarRumboAltaVelocidad(
    rumbo
  ){

    if(
      !Number.isFinite(
        rumbo
      )
    ){
      return;
    }

    historialRumbosAltaVelocidad.push(
      rumbo
    );

    while(
      historialRumbosAltaVelocidad.length >
        HISTORIAL_RUMBO_MAX
    ){
      historialRumbosAltaVelocidad.shift();
    }
  }


  function estabilizarPuntoAltaVelocidad(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      ) ||
      velocidadKmh <
        VELOCIDAD_CONTINUA_DESDE_KMH ||
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      desviosAltaVelocidadConsecutivos =
        0;

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_FILTRO_LATERAL_METROS ||
      distanciaNueva <
        DISTANCIA_MINIMA_FILTRO_LATERAL_METROS ||
      distanciaNueva >
        DISTANCIA_MAXIMA_FILTRO_LATERAL_METROS
    ){
      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    registrarRumboAltaVelocidad(
      rumboAnterior
    );

    const rumboEstable =
      promedioCircularRumbos(
        historialRumbosAltaVelocidad
      );

    if(
      !Number.isFinite(
        rumboEstable
      )
    ){
      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const diferencia =
      diferenciaRumboGrados(
        rumboEstable,
        rumboNuevo
      );

    if(
      diferencia <=
        ANGULO_DESVIO_ALTA_VELOCIDAD_GRADOS
    ){
      desviosAltaVelocidadConsecutivos =
        0;

      registrarRumboAltaVelocidad(
        rumboNuevo
      );

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    desviosAltaVelocidadConsecutivos++;

    if(
      desviosAltaVelocidadConsecutivos >=
        3
    ){
      historialRumbosAltaVelocidad = [
        rumboNuevo
      ];

      desviosAltaVelocidadConsecutivos =
        0;

      return {
        lat:latNuevo,
        lon:lonNuevo,
        filtrado:false
      };
    }

    const proyectado =
      proyectarPuntoPorRumbo(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        rumboEstable,
        distanciaNueva
      );

    let factorLateral =
      desviosAltaVelocidadConsecutivos === 1
        ? FACTOR_LATERAL_PRIMER_DESVIO
        : FACTOR_LATERAL_SEGUNDO_DESVIO;

    if(
      diferencia <
        ANGULO_GIRO_REAL_ALTA_VELOCIDAD_GRADOS
    ){
      factorLateral =
        Math.max(
          factorLateral,
          0.45
        );
    }

    return {
      lat:
        proyectado.lat +
        (
          latNuevo -
          proyectado.lat
        ) *
        factorLateral,
      lon:
        proyectado.lon +
        (
          lonNuevo -
          proyectado.lon
        ) *
        factorLateral,
      filtrado:true
    };
  }

  function esGiroProtegidoBajaVelocidad(
    latNuevo,
    lonNuevo,
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      ) ||
      velocidadKmh >=
        VELOCIDAD_GIRO_PROTEGIDO_KMH ||
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      return false;
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_GIRO_METROS ||
      distanciaNueva <
        DISTANCIA_MINIMA_GIRO_METROS
    ){
      return false;
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    return diferenciaRumboGrados(
      rumboAnterior,
      rumboNuevo
    ) >=
      ANGULO_GIRO_PROTEGIDO_GRADOS;
  }

  function porcentajeBaseOriginal(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.85;
    }

    if(
      velocidadKmh <=
      20
    ){
      return interpolar(
        velocidadKmh,
        0,
        0.70,
        20,
        0.76
      );
    }

    if(
      velocidadKmh <=
      50
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.76,
        50,
        0.84
      );
    }

    if(
      velocidadKmh <=
      80
    ){
      return interpolar(
        velocidadKmh,
        50,
        0.84,
        80,
        0.90
      );
    }

    if(
      velocidadKmh <=
      120
    ){
      return interpolar(
        velocidadKmh,
        80,
        0.90,
        120,
        0.95
      );
    }

    return 0.95;
  }

  function porcentajeAnimacionSegunVelocidad(
    velocidadKmh
  ){

    /*
      V9 / posiciones cada 2 s:
      dejamos una pequeña "ventana de aire" antes del próximo punto.
      A baja velocidad usamos más porcentaje para que no parezca
      que el pin se detiene entre lecturas.
    */
    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return 0.84;
    }

    if(
      velocidadKmh <= 5
    ){
      return 0.90;
    }

    if(
      velocidadKmh <= 20
    ){
      return interpolar(
        velocidadKmh,
        5,
        0.90,
        20,
        0.86
      );
    }

    if(
      velocidadKmh <= 50
    ){
      return interpolar(
        velocidadKmh,
        20,
        0.86,
        50,
        0.80
      );
    }

    if(
      velocidadKmh <= 100
    ){
      return interpolar(
        velocidadKmh,
        50,
        0.80,
        100,
        0.74
      );
    }

    return 0.70;
  }

  function calcularVelocidadInterna(
    latNuevo,
    lonNuevo,
    createdAtNuevo
  ){

    if(
      !ultimoPuntoServidor ||
      !ultimoCreatedAtServidor
    ){
      return ultimaVelocidadValidaKmh;
    }

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervaloSegundos =
      (
        nuevoMs -
        anteriorMs
      ) /
      1000;

    if(
      !Number.isFinite(
        intervaloSegundos
      ) ||
      intervaloSegundos <=
        0
    ){
      return ultimaVelocidadValidaKmh;
    }

    const distancia =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    /*
      Si prácticamente no se desplazó,
      consideramos velocidad real 0 km/h.
    */
    if(
      distancia <=
        DISTANCIA_DETENIDO_METROS
    ){

      ultimaVelocidadValidaKmh =
        0;

      return 0;
    }

    const velocidadCalculada =
      (
        distancia /
        intervaloSegundos
      ) *
      3.6;

    /*
      Si el salto implicaría una velocidad absurda,
      NO contaminamos la estimación:
      reutilizamos la última velocidad válida.
    */
    if(
      !Number.isFinite(
        velocidadCalculada
      ) ||
      velocidadCalculada >
        VELOCIDAD_MAXIMA_VALIDA_KMH
    ){

      return ultimaVelocidadValidaKmh;
    }

    ultimaVelocidadValidaKmh =
      velocidadCalculada;

    return velocidadCalculada;
  }

  function factorContinuoSegunVelocidad(
    velocidadKmh
  ){

    if(
      !Number.isFinite(
        velocidadKmh
      )
    ){
      return FACTOR_CONTINUO_80_KMH;
    }

    if(
      velocidadKmh <= 60
    ){
      return FACTOR_CONTINUO_60_KMH;
    }

    if(
      velocidadKmh <= 80
    ){
      return interpolar(
        velocidadKmh,
        60,
        FACTOR_CONTINUO_60_KMH,
        80,
        FACTOR_CONTINUO_80_KMH
      );
    }

    if(
      velocidadKmh <= 100
    ){
      return interpolar(
        velocidadKmh,
        80,
        FACTOR_CONTINUO_80_KMH,
        100,
        FACTOR_CONTINUO_100_KMH
      );
    }

    return FACTOR_CONTINUO_100_KMH;
  }


  function calcularDuracionAnimacion(
    latNuevo,
    lonNuevo,
    createdAtNuevo,
    velocidadInterna
  ){

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    if(
      !Number.isFinite(
        nuevoMs
      ) ||
      !ultimoCreatedAtServidor
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const anteriorMs =
      new Date(
        ultimoCreatedAtServidor
      )
      .getTime();

    const intervalo =
      nuevoMs -
      anteriorMs;

    if(
      !Number.isFinite(
        intervalo
      ) ||
      intervalo <=
        0
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const velocidad =
      Number.isFinite(
        velocidadInterna
      )
        ? velocidadInterna
        : calcularVelocidadInterna(
            latNuevo,
            lonNuevo,
            createdAtNuevo
          );

    /*
      A partir de 60 km/h usamos una ventana continua.
      La animación dura apenas más que el intervalo GPS,
      por lo que el próximo punto normalmente llega mientras
      el pin todavía está avanzando.
    */
    if(
      Number.isFinite(
        velocidad
      ) &&
      velocidad >=
        VELOCIDAD_CONTINUA_DESDE_KMH
    ){

      const factorContinuo =
        factorContinuoSegunVelocidad(
          velocidad
        );

      return Math.max(
        DURACION_CONTINUA_MIN_MS,
        Math.min(
          DURACION_CONTINUA_MAX_MS,
          intervalo *
          factorContinuo
        )
      );
    }

    const porcentaje =
      porcentajeAnimacionSegunVelocidad(
        velocidad
      );

    return Math.max(
      650,
      Math.min(
        2200,
        intervalo *
        porcentaje
      )
    );
  }

  function esRetrocesoProbablePorRuido(
    latNuevo,
    lonNuevo
  ){

    if(
      !penultimoPuntoServidor ||
      !ultimoPuntoServidor
    ){
      return false;
    }

    const distanciaNueva =
      distanciaMetros(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    if(
      !Number.isFinite(
        distanciaNueva
      ) ||
      distanciaNueva >
        DISTANCIA_MAXIMA_RETROCESO_RUIDO_METROS
    ){
      return false;
    }

    const distanciaAnterior =
      distanciaMetros(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    if(
      distanciaAnterior <
        DISTANCIA_MINIMA_GIRO_METROS
    ){
      return false;
    }

    const rumboAnterior =
      rumboGrados(
        penultimoPuntoServidor.lat,
        penultimoPuntoServidor.lon,
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon
      );

    const rumboNuevo =
      rumboGrados(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        latNuevo,
        lonNuevo
      );

    return diferenciaRumboGrados(
      rumboAnterior,
      rumboNuevo
    ) >=
      ANGULO_RETROCESO_RUIDO_GRADOS;
  }

  function iniciarMicroproyeccionPostGiro(
    latBase,
    lonBase,
    rumbo
  ){

    if(
      !mapa ||
      !marcador ||
      !Number.isFinite(
        rumbo
      )
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicio =
      performance.now();

    const duracionMaximaMs =
      (
        DISTANCIA_MAXIMA_MICROPROYECCION_METROS /
        VELOCIDAD_MICROPROYECCION_MS
      ) *
      1000;

    function pasoMicro(
      ahora
    ){

      const transcurrido =
        Math.max(
          0,
          ahora -
          inicio
        );

      const distancia =
        Math.min(
          DISTANCIA_MAXIMA_MICROPROYECCION_METROS,
          VELOCIDAD_MICROPROYECCION_MS *
          (
            transcurrido /
            1000
          )
        );

      const punto =
        proyectarPuntoPorRumbo(
          latBase,
          lonBase,
          rumbo,
          distancia
        );

      marcador.setLatLng(
        [
          punto.lat,
          punto.lon
        ]
      );

      centrarMapaEnAreaUtil(
        punto.lat,
        punto.lon,
        {
          animate:false
        }
      );

      if(
        transcurrido <
          duracionMaximaMs
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            pasoMicro
          );

      }else{

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        pasoMicro
      );
  }

  function animarMarcadorHasta(
    latDestino,
    lonDestino,
    duracionMs,
    velocidadKmh
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    /*
      Cada GPS nuevo cancela la transición anterior y continúa
      desde la posición visual exacta donde estaba el pin.
      Nunca rebobinamos al último punto dibujado.
    */
    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distancia =
      distanciaMetros(
        latInicio,
        lonInicio,
        latDestino,
        lonDestino
      );

    if(
      distancia >
        DISTANCIA_MAXIMA_ANIMACION_METROS
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      centrarMapaEnAreaUtil(
        latDestino,
        lonDestino,
        {
          animate:true,
          duration:0.8
        }
      );

      return;
    }

    if(
      distancia <
        2
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      return;
    }

    const inicio =
      performance.now();

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionMs
        );

      /*
        Alta velocidad:
        t lineal = velocidad visual constante.
        No frenamos al final de cada paquete GPS.

        Baja/media velocidad:
        mantenemos smoothstep porque sigue dando una sensación
        más natural en maniobras urbanas y aproximaciones.
      */
      const t =
        (
          Number.isFinite(
            velocidadKmh
          ) &&
          velocidadKmh >=
            VELOCIDAD_CONTINUA_DESDE_KMH
        )
          ? progreso
          : (
              progreso *
              progreso *
              (
                3 -
                2 *
                progreso
              )
            );

      const latActual =
        latInicio +
        (
          latDestino -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonDestino -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      /*
        Acompaña la camioneta sin modificar
        la orientación elegida por el cliente.
      */
      centrarMapaEnAreaUtil(
        latActual,
        lonActual,
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            paso
          );

      }else{

        marcador.setLatLng(
          [latDestino, lonDestino]
        );

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        paso
      );
  }

  function animarMarcadorConGiroProtegido(
    latEsquina,
    lonEsquina,
    latDestino,
    lonDestino,
    duracionTotalMs
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distanciaHastaEsquina =
      distanciaMetros(
        latInicio,
        lonInicio,
        latEsquina,
        lonEsquina
      );

    const distanciaDesdeEsquina =
      distanciaMetros(
        latEsquina,
        lonEsquina,
        latDestino,
        lonDestino
      );

    const total =
      distanciaHastaEsquina +
      distanciaDesdeEsquina;

    if(
      !Number.isFinite(total) ||
      total <= 0
    ){
      animarMarcadorHasta(
        latDestino,
        lonDestino,
        duracionTotalMs
      );
      return;
    }

    const proporcionPrimera =
      Math.max(
        0.18,
        Math.min(
          0.72,
          distanciaHastaEsquina /
          total
        )
      );

    const duracionPrimera =
      Math.max(
        450,
        duracionTotalMs *
        proporcionPrimera
      );

    const duracionSegunda =
      Math.max(
        700,
        duracionTotalMs -
        duracionPrimera
      );

    const inicio =
      performance.now();

    function primerTramo(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionPrimera
        );

      const t =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      const latActual =
        latInicio +
        (
          latEsquina -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonEsquina -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      centrarMapaEnAreaUtil(
        latActual,
        lonActual,
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            primerTramo
          );

      }else{

        marcador.setLatLng(
          [latEsquina, lonEsquina]
        );

        const inicioSegundo =
          performance.now();

        function segundoTramo(
          ahoraSegundo
        ){

          const progresoSegundo =
            Math.min(
              1,
              (
                ahoraSegundo -
                inicioSegundo
              ) /
              duracionSegunda
            );

          const t2 =
            progresoSegundo *
            progresoSegundo *
            (
              3 -
              2 *
              progresoSegundo
            );

          const latActual2 =
            latEsquina +
            (
              latDestino -
              latEsquina
            ) *
            t2;

          const lonActual2 =
            lonEsquina +
            (
              lonDestino -
              lonEsquina
            ) *
            t2;

          marcador.setLatLng(
            [latActual2, lonActual2]
          );

          centrarMapaEnAreaUtil(
            latActual2,
            lonActual2,
            {
              animate:false
            }
          );

          if(
            progresoSegundo <
              1
          ){

            animacionMarcadorId =
              requestAnimationFrame(
                segundoTramo
              );

          }else{

            marcador.setLatLng(
              [latDestino, lonDestino]
            );

            animacionMarcadorId =
              null;
          }
        }

        animacionMarcadorId =
          requestAnimationFrame(
            segundoTramo
          );
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        primerTramo
      );
  }


  function centrarMapaEnAreaUtil(
    lat,
    lon,
    opciones
  ){

    if(
      !mapa ||
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ){
      return;
    }

    opciones =
      opciones ||
      {};

    let altoPanel = 0;

    if(
      piocaTrayectoPanel
    ){
      altoPanel =
        piocaTrayectoPanel
        .getBoundingClientRect()
        .height;
    }

    const altoMapa =
      mapa
      .getSize()
      .y;

    /*
      El panel inferior ocupa parte del mapa.
      Desplazamos el centro del mapa hacia abajo la mitad
      de la altura del panel para que el pin quede más arriba,
      centrado en el área realmente visible.
    */
    const offsetY =
      Math.max(
        0,
        Math.min(
          altoPanel * 0.50,
          altoMapa * 0.32
        )
      );

    try{

      const zoom =
        mapa.getZoom();

      const puntoPin =
        mapa.project(
          [lat,lon],
          zoom
        );

      const centroObjetivo =
        mapa.unproject(
          [
            puntoPin.x,
            puntoPin.y +
            offsetY
          ],
          zoom
        );

      mapa.panTo(
        centroObjetivo,
        {
          animate:
            opciones.animate === true,
          duration:
            Number.isFinite(
              opciones.duration
            )
              ? opciones.duration
              : 0.35
        }
      );

    }catch(e){}
  }


  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "flex";

    requestAnimationFrame(
      actualizarAnclajeRefrescar
    );
if(
      mapa
    ){
      requestAnimationFrame(
        function(){
          try{
            mapa.invalidateSize();
          }catch(e){}
        }
      );
    }

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:true,
            rotateControl:false,
            attributionControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.control.attribution({
        position:"bottomleft",
        prefix:false
      })
      .addTo(
        mapa
      );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

          requestAnimationFrame(
            function(){
              centrarMapaEnAreaUtil(
                lat,
                lon,
                {
                  animate:false
                }
              );
            }
          );

        },

        100
      );


    }
  }

  function actualizarMarcador(
    lat,
    lon,
    createdAt
  ){

    crearMapa(
      lat,
      lon
    );

    const createdMs =
      new Date(
        createdAt
      )
      .getTime();

    if(
      ultimoCreatedAtServidor
    ){

      const ultimoMs =
        new Date(
          ultimoCreatedAtServidor
        )
        .getTime();

      if(
        Number.isFinite(
          createdMs
        ) &&
        Number.isFinite(
          ultimoMs
        ) &&
        createdMs <=
          ultimoMs
      ){
        return;
      }
    }

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [lat, lon],
          {
            icon:
              iconoPioca,
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        );

      /*
        Diseño nuevo:
        el pin no lleva globo/popup.
      */
      actualizarEstadoLlegada();

      ultimoPuntoServidor = {
        lat:lat,
        lon:lon
      };

      ultimoCreatedAtServidor =
        createdAt;

      return;
    }

    const velocidadInterna =
      calcularVelocidadInterna(
        lat,
        lon,
        createdAt
      );

    /*
      El punto bruto sigue alimentando velocidad y memoria real.
      Sólo el destino VISUAL puede ser estabilizado a alta velocidad.
    */
    const puntoVisual =
      estabilizarPuntoAltaVelocidad(
        lat,
        lon,
        velocidadInterna
      );

    const latVisual =
      puntoVisual.lat;

    const lonVisual =
      puntoVisual.lon;

    const duracion =
      calcularDuracionAnimacion(
        latVisual,
        lonVisual,
        createdAt,
        velocidadInterna
      );

    const giroProtegido =
      esGiroProtegidoBajaVelocidad(
        lat,
        lon,
        velocidadInterna
      );

    const retrocesoRuido =
      esRetrocesoProbablePorRuido(
        lat,
        lon
      );

    const distanciaDesdeUltimo =
      ultimoPuntoServidor
        ? distanciaMetros(
            ultimoPuntoServidor.lat,
            ultimoPuntoServidor.lon,
            latVisual,
            lonVisual
          )
        : Infinity;

    if(
      retrocesoRuido
    ){

      /*
        No hacemos retroceder visualmente el pin por una oscilación
        corta y casi opuesta del GPS.

        IMPORTANTE:
        no descartamos el timestamp del servidor. Simplemente
        preservamos la posición visual estable y esperamos el
        siguiente punto, que llegará aproximadamente en 2 s.
      */
      detenerAnimacionMarcador();

    }else if(
      Number.isFinite(
        distanciaDesdeUltimo
      ) &&
      distanciaDesdeUltimo <
        DISTANCIA_MINIMA_MOVIMIENTO_VISUAL_METROS
    ){

      /*
        Deriva mínima: no dibujamos una mini-animación nerviosa.
      */
      detenerAnimacionMarcador();

    }else if(
      giroProtegido &&
      ultimoPuntoServidor
    ){

      /*
        V9 - giro protegido con GPS cada 2 s.

        El último punto confirmado funciona como vértice intermedio:
        marcador -> último punto real -> nuevo punto real.

        Así evitamos la diagonal directa entre dos calles y,
        gracias a la frecuencia de 2 s, ese vértice suele quedar
        mucho más cerca de la esquina real.
      */
      animarMarcadorConGiroProtegido(
        ultimoPuntoServidor.lat,
        ultimoPuntoServidor.lon,
        lat,
        lon,
        duracion
      );

    }else{

      /*
        En 60–100 km/h esta llamada entra en modo continuo:
        - duración ligeramente superior al intervalo GPS;
        - interpolación lineal;
        - el nuevo punto corrige el objetivo en vuelo;
        - nunca reinicia desde el último GPS, sino desde el punto
          visual exacto donde estaba el marcador.
      */
      animarMarcadorHasta(
        latVisual,
        lonVisual,
        duracion,
        velocidadInterna
      );
    }

    penultimoPuntoServidor =
      ultimoPuntoServidor
        ? {
            lat:
              ultimoPuntoServidor.lat,
            lon:
              ultimoPuntoServidor.lon
          }
        : null;

    ultimoPuntoServidor = {
      lat:lat,
      lon:lon
    };

    ultimoCreatedAtServidor =
      createdAt;
  }

  async function consultar(
    forzar
  ){

    forzar =
      forzar === true;

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    /*
      Evita consultas simultáneas.
      Si el usuario fuerza un refresco, se cancela
      una consulta anterior que pudiera haber quedado colgada.
    */
    if(
      consultaEnCurso
    ){

      if(
        !forzar
      ){
        return;
      }

      if(
        consultaAbortController
      ){
        try{
          consultaAbortController.abort();
        }catch(e){}
      }

      consultaEnCurso =
        false;
    }

    consultaEnCurso =
      true;

    const controlador =
      new AbortController();

    consultaAbortController =
      controlador;

    const timeoutConsulta =
      setTimeout(
        function(){
          try{
            controlador.abort();
          }catch(e){}
        },
        10000
      );

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              }),

            signal:
              controlador.signal

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        pintarEstadoNormalEnVivo();

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimoCreatedAtServidor =
          null;

        ultimoPuntoServidor =
          null;

        penultimoPuntoServidor =
          null;

        ultimaVelocidadValidaKmh =
          null;

        detenerReloj();

        detenerAnimacionMarcador();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon,
        p.created_at
      );

      pintarEstadoNormalEnVivo();

      actualizarEstadoLlegada();

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Timeout, pérdida de Internet o suspensión
        del navegador no finalizan el seguimiento.
        Se conserva la última pantalla válida.
      */

    }finally{

      clearTimeout(
        timeoutConsulta
      );

      if(
        consultaAbortController ===
        controlador
      ){

        consultaAbortController =
          null;

        consultaEnCurso =
          false;
      }

      ultimaConsultaFinalizadaMs =
        Date.now();
    }
  }

  btnRefrescarPosicion.addEventListener(
    "click",
    refrescarConsultaManual
  );


  window.addEventListener(
    "resize",
    function(){
      requestAnimationFrame(
        function(){
          actualizarAnclajeRefrescar();

          if(
            mapa &&
            marcador
          ){
            const p =
              marcador.getLatLng();

            centrarMapaEnAreaUtil(
              p.lat,
              p.lng,
              {
                animate:false
              }
            );
          }
        }
      );
    }
  );

  window.addEventListener(
    "orientationchange",
    function(){
      setTimeout(
        actualizarAnclajeRefrescar,
        150
      );
    }
  );

  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.visibilityState ===
          "visible" &&
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "pageshow",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "online",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        iniciarHeartbeatCliente();

        enviarHeartbeatCliente();

        consultar(true);
      }
    }
  );

  ocultarEstadoSuperior();

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar(true);

    iniciarCicloConsultas();

    iniciarHeartbeatCliente();
  }

})();

</script>
