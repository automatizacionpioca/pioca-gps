<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title></title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      font-family:Arial,sans-serif;
      background:#ffffff;
      color:#1d2a36;
    }

    body{
      box-sizing:border-box;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(8px, env(safe-area-inset-bottom))
        12px;
    }

    .panel{
      width:100%;
      max-width:620px;
      height:100%;
      margin:0 auto;
      background:#fff;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .cabeceraCliente{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:center;
      margin-bottom:22px;
      flex:0 0 auto;
    }

    .logo{
      text-align:center;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:150px;
    }

    .logo::after{
      content:"";
      position:absolute;
      right:-9px;
      top:16%;
      bottom:16%;
      width:1px;
      background:#e7edf3;
    }

    .logo img{
      width:168px;
      max-width:95%;
      height:auto;
      display:block;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      flex:0 0 auto;
      min-height:58px;
      padding:10px 14px;
      box-sizing:border-box;
      background:#fff;
      border:1px solid #e3e8ee;
      border-radius:14px;
      text-align:left;
      font-size:15px;
      font-weight:700;
      margin:0 0 16px 0;
      box-shadow:
        0 5px 16px rgba(25,45,65,.07),
        0 1px 3px rgba(25,45,65,.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .estadoEnVivo{
      width:100%;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
    }

    .puntoEnVivo{
      position:relative;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#28bf59;
      flex:0 0 10px;
      margin-left:4px;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(40,191,89,.34);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    .estadoTexto{
      color:#22364a;
      font-weight:700;
      font-size:15px;
      letter-spacing:.05px;
    }

    .estadoBadge{
      justify-self:end;
      padding:6px 10px;
      border-radius:999px;
      background:#e8f8ed;
      color:#28a84f;
      font-size:10px;
      font-weight:700;
      letter-spacing:.35px;
      white-space:nowrap;
    }

    @keyframes piocaLivePulse{
      0%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }
    }

    #horaLlegadaBox{
      display:none;
      width:92%;
      max-width:275px;
      justify-self:center;
      overflow:hidden;
      border:1px solid #e1e7ed;
      border-radius:16px;
      background:#fff;
      box-shadow:
        0 8px 22px rgba(24,45,65,.10),
        0 2px 5px rgba(24,45,65,.05);
    }

    #horaLlegadaTitulo{
      min-height:56px;
      padding:10px 14px 9px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:left;
      color:#5a6671;
      font-size:11px;
      line-height:1.25;
      font-weight:700;
      letter-spacing:.55px;
      text-transform:uppercase;
      background:#fff;
    }

    #horaLlegadaTitulo::before{
      content:"◷";
      width:34px;
      height:34px;
      border-radius:50%;
      background:#1769aa;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      line-height:1;
      flex:0 0 34px;
      box-shadow:0 3px 9px rgba(23,105,170,.22);
    }

    #horaLlegada{
      min-height:86px;
      padding:10px 14px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(
        135deg,
        #182b3c 0%,
        #243d53 100%
      );
      color:#fff;
      font-size:34px;
      font-weight:700;
      letter-spacing:.7px;
      animation:piocaHoraBlink 1.7s ease-in-out infinite;
    }

    @keyframes piocaHoraBlink{
      0%{
        opacity:1;
      }

      50%{
        opacity:.48;
      }

      100%{
        opacity:1;
      }
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      flex-direction:column;
    }

    #mapa{
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      height:auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #e0e5ea;
      box-sizing:border-box;
      box-shadow:
        0 6px 18px rgba(20,45,65,.07);
    }

    #fraseServicio{
      flex:0 0 auto;
      margin-top:12px;
      margin-bottom:0;
      padding:12px 14px;
      text-align:center;
      font-size:12px;
      line-height:1.35;
      color:#4e5963;
      font-weight:400;
      background:#fff;
      border:1px solid #e2e8ee;
      border-radius:14px;
      box-shadow:
        0 5px 16px rgba(25,45,65,.06);
      box-sizing:border-box;
      display:flex;
      align-items:center;
      gap:10px;
    }

    #fraseServicio::before{
      content:"◷";
      width:28px;
      height:28px;
      border:2px solid #9ec1e5;
      color:#1769aa;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 28px;
      box-sizing:border-box;
    }

    #fraseServicio strong{
      color:#1769aa;
      font-weight:700;
    }

    .leaflet-popup-content{
      width:145px !important;
      max-width:145px;
      text-align:center;
      line-height:1.2;
      margin:10px 12px;
      font-size:11px;
      color:#203246;
      font-weight:700;
    }

    .leaflet-popup-content-wrapper{
      border-radius:13px;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    #actualizacionBox{
      position:absolute;
      top:14px;
      right:14px;
      z-index:1000;
      background:linear-gradient(
        135deg,
        rgba(22,39,54,.96) 0%,
        rgba(30,54,74,.96) 100%
      );
      color:#4ee07d;
      padding:10px 13px;
      border-radius:12px;
      font-size:11px;
      font-weight:700;
      line-height:1.25;
      text-align:left;
      box-shadow:0 5px 14px rgba(0,0,0,.20);
      pointer-events:none;
      min-width:145px;
    }

    #actualizacionBox::before{
      content:"⌖";
      display:inline-block;
      margin-right:6px;
      color:#4ee07d;
      font-size:16px;
      vertical-align:-1px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }


    @media(max-height:760px){

      .cabeceraCliente{
        gap:12px;
        margin-bottom:12px;
      }

      .logo img{
        width:135px;
      }

      #estado{
        padding:10px 8px;
        margin-bottom:10px;
        font-size:14px;
      }

      #horaLlegadaTitulo{
        min-height:36px;
        padding:7px 9px;
        font-size:9px;
      }

      #horaLlegada{
        min-height:46px;
        padding:7px 9px;
        font-size:21px;
      }

      #fraseServicio{
        margin-top:7px;
        padding:8px 9px;
        font-size:11.5px;
      }
    }

    @media(max-width:600px){

      body{
        padding:
          max(8px, env(safe-area-inset-top))
          10px
          max(5px, env(safe-area-inset-bottom))
          10px;
      }

      .cabeceraCliente{
        grid-template-columns:1fr 1fr;
        gap:14px;
        margin-bottom:18px;
      }

      .logo{
        min-height:136px;
      }

      .logo img{
        width:152px;
        max-width:95%;
      }

      #horaLlegadaBox{
        width:94%;
        max-width:235px;
      }

      #horaLlegadaTitulo{
        min-height:50px;
        padding:8px 10px;
        font-size:9.5px;
      }

      #horaLlegadaTitulo::before{
        width:30px;
        height:30px;
        flex-basis:30px;
        font-size:18px;
      }

      #horaLlegada{
        min-height:76px;
        font-size:31px;
      }

      #estado{
        min-height:54px;
        padding:9px 12px;
        margin-bottom:13px;
      }

      .estadoTexto{
        font-size:14px;
      }

      .estadoBadge{
        padding:5px 8px;
        font-size:9px;
      }

      #actualizacionBox{
        top:10px;
        right:10px;
        padding:9px 10px;
        font-size:10px;
        min-width:132px;
      }

      #actualizacionSegundos{
        font-size:10px;
      }

      #fraseServicio{
        margin-top:9px;
        padding:10px 11px;
        font-size:11.5px;
      }
    }

  </style>

</head>

<div class="panel">

    </div>

  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
  src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js">
</script>

<script>

(function(){

  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  const estado =
    document.getElementById(
      "estado"
    );

  const horaLlegadaBox =
    document.getElementById(
      "horaLlegadaBox"
    );

  const horaLlegada =
    document.getElementById(
      "horaLlegada"
    );

  const mapaWrap =
    document.getElementById(
      "mapaWrap"
    );

  const actualizacionBox =
    document.getElementById(
      "actualizacionBox"
    );

  const actualizacionTexto =
    document.getElementById(
      "actualizacionTexto"
    );

  const actualizacionSegundos =
    document.getElementById(
      "actualizacionSegundos"
    );

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  let codigo =
    parametros.get(
      "id"
    );

  let mapa =
    null;

  let marcador =
    null;

  let ultimaActualizacionMs =
    null;

  let relojEstado =
    null;

  let consultaId =
    null;

  let terminado =
    false;

  /*
    Datos usados únicamente para orientar
    el mapa según el sentido real de marcha.
  */
  let ultimaPosicionRumbo =
    null;

  let rumboActual =
    0;

  let animacionRumboId =
    null;

  /*
    Si el cliente rota manualmente el mapa con dos dedos,
    dejamos de modificar automáticamente la orientación.
    La posición y el centrado siguen actualizándose.
  */
  let rotacionManual =
    false;

  /*
    Evita que el mapa "baile" por pequeños
    errores del GPS cuando el vehículo está
    detenido o apenas se movió.
  */
  const DISTANCIA_MINIMA_RUMBO_METROS =
    20;

  function detenerReloj(){

    if(
      relojEstado !== null
    ){

      clearInterval(
        relojEstado
      );

      relojEstado =
        null;
    }
  }

  function detenerConsultas(){

    if(
      consultaId !== null
    ){

      clearInterval(
        consultaId
      );

      consultaId =
        null;
    }
  }

  function detenerAnimacionRumbo(){

    if(
      animacionRumboId !== null
    ){

      cancelAnimationFrame(
        animacionRumboId
      );

      animacionRumboId =
        null;
    }
  }

  function ocultarHoraLlegada(){

    horaLlegadaBox.style.display =
      "none";

    horaLlegada.textContent =
      "--:--";
  }

  function mostrarHoraLlegada(
    valor
  ){

    if(
      !valor
    ){

      ocultarHoraLlegada();

      return;
    }

    const fecha =
      new Date(
        valor
      );

    if(
      !Number.isFinite(
        fecha.getTime()
      )
    ){

      ocultarHoraLlegada();

      return;
    }

    horaLlegada.textContent =

      fecha.toLocaleTimeString(
        "es-AR",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      ) +

      " hs";

    horaLlegadaBox.style.display =
      "grid";
  }

  function quitarMarcador(){

    if(
      mapa &&
      marcador
    ){

      try{

        mapa.removeLayer(
          marcador
        );

      }catch(e){}

      marcador =
        null;
    }
  }

  function mostrarFinalizado(){

    terminado =
      true;

    detenerReloj();

    detenerConsultas();

    detenerAnimacionRumbo();

    ultimaActualizacionMs =
      null;

    ultimaPosicionRumbo =
      null;

    quitarMarcador();

    mapaWrap.style.display =
      "none";

    horaLlegadaBox.style.display =
      "none";

    estado.textContent =
      "✅ SEGUIMIENTO FINALIZADO";

    estado.style.background =
      "#eeeeee";
  }

  function ocultarTodo(){

    if(
      terminado
    ){

      return;
    }

    estado.textContent =
      "Seguimiento no disponible";

    estado.style.background =
      "#eeeeee";

    mapaWrap.style.display =
      "none";

    ocultarHoraLlegada();

    ultimaActualizacionMs =
      null;

    ultimaPosicionRumbo =
      null;

    detenerReloj();

    detenerAnimacionRumbo();

    quitarMarcador();
  }

  function actualizarIndicador(){

    if(
      !ultimaActualizacionMs ||
      terminado
    ){

      return;
    }

    const diferencia =

      Math.max(

        0,

        Math.floor(

          (
            Date.now() -
            ultimaActualizacionMs
          ) / 1000

        )

      );

    actualizacionSegundos.textContent =
      "hace " +
      diferencia +
      " s";

    if(
      diferencia <=
      15
    ){

      actualizacionBox.className =
        "actualizacionOk";

      actualizacionTexto.textContent =
        "UBICACIÓN ACTUALIZADA";

    }else{

      actualizacionBox.className =
        "actualizacionError";

      actualizacionTexto.textContent =
        "SIN ACTUALIZACIÓN";
    }
  }

  function iniciarReloj(){

    if(
      relojEstado !== null ||
      terminado
    ){

      return;
    }

    actualizarIndicador();

    relojEstado =
      setInterval(
        actualizarIndicador,
        1000
      );
  }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function radianesAGrados(
    radianes
  ){

    return radianes *
      180 /
      Math.PI;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 -
        lat1
      );

    const dLon =
      gradosARadianes(
        lon2 -
        lon1
      );

    const a =

      Math.sin(
        dLat / 2
      ) *
      Math.sin(
        dLat / 2
      ) +

      Math.cos(
        gradosARadianes(
          lat1
        )
      ) *

      Math.cos(
        gradosARadianes(
          lat2
        )
      ) *

      Math.sin(
        dLon / 2
      ) *
      Math.sin(
        dLon / 2
      );

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function calcularRumbo(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const phi1 =
      gradosARadianes(
        lat1
      );

    const phi2 =
      gradosARadianes(
        lat2
      );

    const deltaLon =
      gradosARadianes(
        lon2 -
        lon1
      );

    const y =
      Math.sin(
        deltaLon
      ) *
      Math.cos(
        phi2
      );

    const x =

      Math.cos(
        phi1
      ) *
      Math.sin(
        phi2
      ) -

      Math.sin(
        phi1
      ) *
      Math.cos(
        phi2
      ) *
      Math.cos(
        deltaLon
      );

    const rumbo =
      radianesAGrados(
        Math.atan2(
          y,
          x
        )
      );

    return (
      rumbo +
      360
    ) % 360;
  }

  function diferenciaAngular(
    desde,
    hasta
  ){

    return (
      (
        hasta -
        desde +
        540
      ) % 360
    ) - 180;
  }

  function animarRumboMapa(
    rumboDestino
  ){

    if(
      rotacionManual
    ){
      return;
    }

    if(
      !mapa ||
      typeof mapa.setBearing !==
        "function"
    ){

      return;
    }

    detenerAnimacionRumbo();

    const inicio =
      performance.now();

    const rumboInicio =
      rumboActual;

    const diferencia =
      diferenciaAngular(
        rumboInicio,
        rumboDestino
      );

    const duracion =
      700;

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracion
        );

      /*
        Suavizado para que el giro no sea brusco.
      */
      const suavizado =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      rumboActual =
        (
          rumboInicio +
          diferencia *
          suavizado +
          360
        ) % 360;

      mapa.setBearing(
        rumboActual
      );

      if(
        progreso <
        1
      ){

        animacionRumboId =
          requestAnimationFrame(
            paso
          );

      }else{

        rumboActual =
          (
            rumboDestino +
            360
          ) % 360;

        mapa.setBearing(
          rumboActual
        );

        animacionRumboId =
          null;
      }
    }

    animacionRumboId =
      requestAnimationFrame(
        paso
      );
  }

  function actualizarRumbo(
    lat,
    lon
  ){

    if(
      !ultimaPosicionRumbo
    ){

      ultimaPosicionRumbo = {
        lat:lat,
        lon:lon
      };

      return;
    }

    const distancia =
      distanciaMetros(
        ultimaPosicionRumbo.lat,
        ultimaPosicionRumbo.lon,
        lat,
        lon
      );

    if(
      distancia <
      DISTANCIA_MINIMA_RUMBO_METROS
    ){

      return;
    }

    const nuevoRumbo =
      calcularRumbo(
        ultimaPosicionRumbo.lat,
        ultimaPosicionRumbo.lon,
        lat,
        lon
      );

    ultimaPosicionRumbo = {
      lat:lat,
      lon:lon
    };

    animarRumboMapa(
      nuevoRumbo
    );
  }

  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "flex";

    if(
      mapa
    ){
      requestAnimationFrame(
        function(){
          try{
            mapa.invalidateSize();
          }catch(e){}
        }
      );
    }

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:true,
            rotateControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      /*
        En cuanto el cliente usa dos dedos sobre el mapa,
        consideramos que eligió una orientación manual.
        Desde ese momento el GPS sigue moviendo y centrando
        el marcador, pero no vuelve a girar el mapa.
      */
      const contenedorMapa =
        mapa.getContainer();

      contenedorMapa.addEventListener(
        "touchstart",
        function(evento){

          if(
            evento.touches &&
            evento.touches.length >= 2
          ){

            rotacionManual =
              true;

            detenerAnimacionRumbo();
          }
        },
        {
          passive:true
        }
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100
      );
    }
  }

  function actualizarMarcador(
    lat,
    lon
  ){

    crearMapa(
      lat,
      lon
    );

    actualizarRumbo(
      lat,
      lon
    );

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [
            lat,
            lon
          ],
          {
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        )
        .bindPopup(

          "<strong>¡Estamos en camino!</strong>"

        );

      marcador.openPopup();

    }else{

      marcador.setLatLng(
        [
          lat,
          lon
        ]
      );
    }

    mapa.panTo(
      [
        lat,
        lon
      ],
      {
        animate:true,
        duration:0.8
      }
    );
  }

  async function consultar(){

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              })

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      /*
        Si el servidor informa que terminó,
        desaparece inmediatamente el mapa.
      */
      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        estado.textContent =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimaPosicionRumbo =
          null;

        detenerReloj();

        detenerAnimacionRumbo();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon
      );

      estado.innerHTML =
        '<span class="estadoEnVivo">' +
          '<span class="puntoEnVivo"></span>' +
          '<span class="estadoTexto">Seguimiento en tiempo real</span>' +
          '<span class="estadoBadge">EN VIVO</span>' +
        '</span>';

      estado.style.background =
        "#dff5e1";

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Si se corta Internet,
        conservamos la última posición
        y no damos por finalizado el seguimiento.
      */

    }
  }

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar();

    consultaId =
      setInterval(
        consultar,
        3000
      );
  }

})();

</script>
