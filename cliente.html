<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title></title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      font-family:Arial,sans-serif;
      background:#ffffff;
      color:#1d2a36;
    }

    body{
      box-sizing:border-box;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(8px, env(safe-area-inset-bottom))
        12px;
    }

    .panel{
      width:100%;
      max-width:620px;
      height:100%;
      margin:0 auto;
      background:#fff;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .cabeceraCliente{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:center;
      margin-bottom:22px;
      flex:0 0 auto;
    }

    .logo{
      text-align:center;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      min-height:150px;
    }

    .logo::after{
      content:"";
      position:absolute;
      right:-9px;
      top:16%;
      bottom:16%;
      width:1px;
      background:#e7edf3;
    }

    .logo img{
      width:168px;
      max-width:95%;
      height:auto;
      display:block;
    }

    .cabeceraCliente.finalizado{
      grid-template-columns:1fr;
      justify-items:center;
      margin-bottom:18px;
    }

    .cabeceraCliente.finalizado .logo{
      width:100%;
      min-height:150px;
    }

    .cabeceraCliente.finalizado .logo::after{
      display:none;
    }

    .cabeceraCliente.finalizado #horaLlegadaBox{
      display:none !important;
    }

    .subtitulo{
      text-align:center;
      font-size:16px;
      color:#444;
      margin-bottom:18px;
    }

    #estado{
      flex:0 0 auto;
      min-height:58px;
      padding:10px 14px;
      box-sizing:border-box;
      background:#fff;
      border:1px solid #e3e8ee;
      border-radius:14px;
      text-align:left;
      font-size:15px;
      font-weight:700;
      margin:0 0 16px 0;
      box-shadow:
        0 5px 16px rgba(25,45,65,.07),
        0 1px 3px rgba(25,45,65,.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .estadoEnVivo{
      width:100%;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
    }

    .puntoEnVivo{
      position:relative;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#28bf59;
      flex:0 0 10px;
      margin-left:4px;
    }

    .puntoEnVivo::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(40,191,89,.34);
      transform:translate(-50%,-50%) scale(1);
      animation:piocaLivePulse 1.7s ease-out infinite;
    }

    .estadoTexto{
      color:#22364a;
      font-weight:700;
      font-size:15px;
      letter-spacing:.05px;
    }

    .estadoBadge{
      justify-self:end;
      padding:6px 10px;
      border-radius:999px;
      background:#e8f8ed;
      color:#28a84f;
      font-size:10px;
      font-weight:700;
      letter-spacing:.35px;
      white-space:nowrap;
    }

    @keyframes piocaLivePulse{
      0%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1);
      }

      70%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.7);
      }
    }

    #horaLlegadaBox{
      display:none;
      width:92%;
      max-width:275px;
      justify-self:center;
      overflow:hidden;
      border:1px solid #e1e7ed;
      border-radius:16px;
      background:#fff;
      box-shadow:
        0 8px 22px rgba(24,45,65,.10),
        0 2px 5px rgba(24,45,65,.05);
    }

    #horaLlegadaTitulo{
      min-height:56px;
      padding:10px 14px 9px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:left;
      color:#5a6671;
      font-size:11px;
      line-height:1.25;
      font-weight:700;
      letter-spacing:.55px;
      text-transform:uppercase;
      background:#fff;
    }

    #horaLlegadaTitulo::before{
      content:"◷";
      width:34px;
      height:34px;
      border-radius:50%;
      background:#1769aa;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      line-height:1;
      flex:0 0 34px;
      box-shadow:0 3px 9px rgba(23,105,170,.22);
    }

    #horaLlegada{
      min-height:86px;
      padding:10px 14px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(
        135deg,
        #182b3c 0%,
        #243d53 100%
      );
      color:#fff;
      font-size:34px;
      font-weight:700;
      letter-spacing:.7px;
      animation:piocaHoraBlink 1.7s ease-in-out infinite;
    }

    @keyframes piocaHoraBlink{
      0%{
        opacity:1;
      }

      50%{
        opacity:.48;
      }

      100%{
        opacity:1;
      }
    }

    #mapaWrap{
      display:none;
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      flex-direction:column;
    }

    #mapaContenedor{
      position:relative;
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      display:flex;
    }

    #mapa{
      width:100%;
      flex:1 1 auto;
      min-height:220px;
      height:auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #e0e5ea;
      box-sizing:border-box;
      box-shadow:
        0 6px 18px rgba(20,45,65,.07);
    }

    #btnRefrescarPosicion{
      position:absolute;
      right:12px;
      bottom:12px;
      z-index:1002;
      border:1px solid rgba(32,50,70,.16);
      background:rgba(255,255,255,.95);
      color:#203246;
      border-radius:999px;
      padding:9px 12px;
      font-family:Arial,sans-serif;
      font-size:11px;
      font-weight:700;
      line-height:1;
      box-shadow:0 4px 12px rgba(0,0,0,.14);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      backdrop-filter:blur(5px);
    }

    #btnRefrescarPosicion:active{
      transform:scale(.97);
    }

    #btnRefrescarPosicion:disabled{
      opacity:.62;
      cursor:default;
    }

    #fraseServicio{
      flex:0 0 auto;
      margin-top:12px;
      margin-bottom:0;
      padding:12px 14px;
      text-align:center;
      font-size:12px;
      line-height:1.35;
      color:#4e5963;
      font-weight:400;
      background:#fff;
      border:1px solid #e2e8ee;
      border-radius:14px;
      box-shadow:
        0 5px 16px rgba(25,45,65,.06);
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    #fraseServicio::before{
      content:"◷";
      width:28px;
      height:28px;
      border:2px solid #9ec1e5;
      color:#1769aa;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 28px;
      box-sizing:border-box;
    }

    #fraseServicio strong{
      color:#1769aa;
      font-weight:700;
    }

    /* ==========================================================
       PIN CLÁSICO TIPO MAPA
       Marcador rojo en forma de gota, sin imagen externa.
       ========================================================== */

    .piocaPinIcon{
      background:transparent !important;
      border:0 !important;
    }

    .piocaPin{
      position:relative;
      width:30px;
      height:30px;
      background:#e94235;
      border:2px solid #ffffff;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      box-sizing:border-box;
      box-shadow:
        0 2px 5px rgba(0,0,0,.34),
        0 1px 2px rgba(0,0,0,.18);
    }

    .piocaPin::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      left:8px;
      top:8px;
      background:#ffffff;
      border-radius:50%;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    }

    .leaflet-control-attribution{
      background:rgba(255,255,255,.72) !important;
      color:#6f7880 !important;
      font-size:8px !important;
      line-height:1.15 !important;
      padding:2px 4px !important;
      border-radius:0 5px 0 0 !important;
      box-shadow:none !important;
      opacity:.62;
      backdrop-filter:blur(3px);
    }

    .leaflet-control-attribution a{
      color:#6f7880 !important;
      text-decoration:none !important;
    }

    .leaflet-popup-content{
      width:145px !important;
      max-width:145px;
      text-align:center;
      line-height:1.2;
      margin:10px 12px;
      font-size:11px;
      color:#203246;
      font-weight:700;
    }

    .leaflet-popup-content-wrapper{
      border-radius:13px;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    #actualizacionBox{
      position:absolute;
      top:14px;
      right:14px;
      z-index:1000;
      background:linear-gradient(
        135deg,
        rgba(22,39,54,.96) 0%,
        rgba(30,54,74,.96) 100%
      );
      color:#4ee07d;
      padding:10px 13px;
      border-radius:12px;
      font-size:11px;
      font-weight:700;
      line-height:1.25;
      text-align:left;
      box-shadow:0 5px 14px rgba(0,0,0,.20);
      pointer-events:none;
      min-width:145px;
    }

    #actualizacionBox::before{
      content:"⌖";
      display:inline-block;
      margin-right:6px;
      color:#4ee07d;
      font-size:16px;
      vertical-align:-1px;
    }

    #actualizacionTexto{
      display:block;
    }

    #actualizacionSegundos{
      display:block;
      font-size:11px;
      margin-top:2px;
    }

    .actualizacionOk{
      color:#38e06f !important;
    }

    .actualizacionOk #actualizacionTexto{
      animation:piocaBlink 1.2s ease-in-out infinite;
    }

    .actualizacionError{
      color:#ff4b4b !important;
    }

    .actualizacionError #actualizacionTexto{
      animation:piocaPulse 1.1s ease-in-out infinite;
    }

    @keyframes piocaBlink{

      0%{
        opacity:1;
      }

      50%{
        opacity:.45;
      }

      100%{
        opacity:1;
      }

    }

    @keyframes piocaPulse{

      0%{
        opacity:1;
      }

      50%{
        opacity:.65;
      }

      100%{
        opacity:1;
      }

    }


    @media(max-height:760px){

      .cabeceraCliente{
        gap:12px;
        margin-bottom:12px;
      }

      .logo img{
        width:135px;
      }

      #estado{
        padding:10px 8px;
        margin-bottom:10px;
        font-size:14px;
      }

      #horaLlegadaTitulo{
        min-height:36px;
        padding:7px 9px;
        font-size:9px;
      }

      #horaLlegada{
        min-height:46px;
        padding:7px 9px;
        font-size:21px;
      }

      #fraseServicio{
        margin-top:7px;
        padding:8px 9px;
        font-size:11.5px;
      }
    }

    @media(max-width:600px){

      body{
        padding:
          max(8px, env(safe-area-inset-top))
          10px
          max(5px, env(safe-area-inset-bottom))
          10px;
      }

      .cabeceraCliente{
        grid-template-columns:1fr 1fr;
        gap:14px;
        margin-bottom:18px;
      }

      .logo{
        min-height:136px;
      }

      .logo img{
        width:152px;
        max-width:95%;
      }

      #horaLlegadaBox{
        width:94%;
        max-width:235px;
      }

      #horaLlegadaTitulo{
        min-height:50px;
        padding:8px 10px;
        font-size:9.5px;
      }

      #horaLlegadaTitulo::before{
        width:30px;
        height:30px;
        flex-basis:30px;
        font-size:18px;
      }

      #horaLlegada{
        min-height:76px;
        font-size:31px;
      }

      #estado{
        min-height:54px;
        padding:9px 12px;
        margin-bottom:13px;
      }

      .estadoTexto{
        font-size:14px;
      }

      .estadoBadge{
        padding:5px 8px;
        font-size:9px;
      }

      #actualizacionBox{
        top:10px;
        right:10px;
        padding:9px 10px;
        font-size:10px;
        min-width:132px;
      }

      #actualizacionSegundos{
        font-size:10px;
      }

      #btnRefrescarPosicion{
        right:10px;
        bottom:10px;
        padding:8px 10px;
        font-size:10px;
      }

      #fraseServicio{
        margin-top:9px;
        padding:10px 11px;
        font-size:11.5px;
      }
    }

  </style>

</head>

<body>

<div class="panel">

  <div class="cabeceraCliente">

    <div class="logo">

      <img
        src="logo-pioca.png"
        alt="piOca"
      >

    </div>

    <div id="horaLlegadaBox">

      <div id="horaLlegadaTitulo">
        HORA DE LLEGADA APROXIMADA
      </div>

      <div id="horaLlegada">
        --:--
      </div>

    </div>

  </div>

  <div id="estado">
    Seguimiento no disponible
  </div>

  <div id="mapaWrap">

    <div id="mapaContenedor">

      <div id="mapa"></div>

      <div
        id="actualizacionBox"
        class="actualizacionOk">

        <span id="actualizacionTexto">
          UBICACIÓN ACTUALIZADA
        </span>

        <span id="actualizacionSegundos">
          hace 0 s
        </span>

      </div>

      <button
        id="btnRefrescarPosicion"
        type="button">
        ↻ REFRESCAR POSICIÓN
      </button>

    </div>

    <div id="fraseServicio">
      Respetar tu tiempo también es parte de nuestro servicio.
    </div>

  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
  src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js">
</script>

<script>

(function(){

  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  const cabeceraCliente =
    document.querySelector(
      ".cabeceraCliente"
    );

  const estado =
    document.getElementById(
      "estado"
    );

  const horaLlegadaBox =
    document.getElementById(
      "horaLlegadaBox"
    );

  const horaLlegada =
    document.getElementById(
      "horaLlegada"
    );

  const mapaWrap =
    document.getElementById(
      "mapaWrap"
    );

  const actualizacionBox =
    document.getElementById(
      "actualizacionBox"
    );

  const actualizacionTexto =
    document.getElementById(
      "actualizacionTexto"
    );

  const actualizacionSegundos =
    document.getElementById(
      "actualizacionSegundos"
    );

  const btnRefrescarPosicion =
    document.getElementById(
      "btnRefrescarPosicion"
    );

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  let codigo =
    parametros.get(
      "id"
    );

  let mapa =
    null;

  let marcador =
    null;

  let ultimaActualizacionMs =
    null;

  let relojEstado =
    null;

  let consultaId =
    null;

  let watchdogConsultaId =
    null;

  let consultaEnCurso =
    false;

  let consultaAbortController =
    null;

  let ultimaConsultaFinalizadaMs =
    Date.now();

  let terminado =
    false;

  /*
    Animación visual del marcador.
    No genera posiciones nuevas ni aumenta consultas.
  */
  let animacionMarcadorId =
    null;

  let ultimoCreatedAtServidor =
    null;

  const DURACION_ANIMACION_DEFAULT_MS =
    8000;

  const DISTANCIA_MAXIMA_ANIMACION_METROS =
    500;

  const iconoPioca =
    L.divIcon({
      className:"piocaPinIcon",
      html:'<div class="piocaPin"></div>',
      iconSize:[30,42],
      iconAnchor:[15,39],
      popupAnchor:[0,-38]
    });

  function detenerReloj(){

    if(
      relojEstado !== null
    ){

      clearInterval(
        relojEstado
      );

      relojEstado =
        null;
    }
  }

  function detenerConsultas(){

    if(
      consultaId !== null
    ){

      clearInterval(
        consultaId
      );

      consultaId =
        null;
    }

    if(
      watchdogConsultaId !== null
    ){

      clearInterval(
        watchdogConsultaId
      );

      watchdogConsultaId =
        null;
    }

    if(
      consultaAbortController
    ){

      try{
        consultaAbortController.abort();
      }catch(e){}

      consultaAbortController =
        null;
    }

    consultaEnCurso =
      false;
  }

  function iniciarCicloConsultas(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    if(
      consultaId !== null
    ){
      clearInterval(
        consultaId
      );
    }

    consultaId =
      setInterval(
        function(){
          consultar(false);
        },
        3000
      );

    if(
      watchdogConsultaId === null
    ){

      watchdogConsultaId =
        setInterval(
          function(){

            if(
              terminado ||
              !codigo
            ){
              return;
            }

            const demora =
              Date.now() -
              ultimaConsultaFinalizadaMs;

            /*
              Si la pantalla dejó de completar consultas
              durante 20 segundos, se reconstruye el ciclo.
            */
            if(
              demora >= 20000
            ){

              if(
                consultaAbortController
              ){
                try{
                  consultaAbortController.abort();
                }catch(e){}
              }

              consultaEnCurso =
                false;

              ultimaConsultaFinalizadaMs =
                Date.now();

              iniciarCicloConsultas();

              consultar(true);
            }
          },
          5000
        );
    }
  }

  function refrescarConsultaManual(){

    if(
      terminado ||
      !codigo
    ){
      return;
    }

    btnRefrescarPosicion.disabled =
      true;

    btnRefrescarPosicion.textContent =
      "↻ ACTUALIZANDO...";

    iniciarCicloConsultas();

    consultar(true)
      .finally(
        function(){

          setTimeout(
            function(){

              btnRefrescarPosicion.disabled =
                false;

              btnRefrescarPosicion.textContent =
                "↻ REFRESCAR POSICIÓN";

            },
            700
          );
        }
      );
  }

  function detenerAnimacionMarcador(){

    if(
      animacionMarcadorId !== null
    ){

      cancelAnimationFrame(
        animacionMarcadorId
      );

      animacionMarcadorId =
        null;
    }
  }

  function ocultarHoraLlegada(){

    horaLlegadaBox.style.display =
      "none";

    horaLlegada.textContent =
      "--:--";
  }

  function mostrarHoraLlegada(
    valor
  ){

    if(
      !valor
    ){

      ocultarHoraLlegada();

      return;
    }

    const fecha =
      new Date(
        valor
      );

    if(
      !Number.isFinite(
        fecha.getTime()
      )
    ){

      ocultarHoraLlegada();

      return;
    }

    horaLlegada.textContent =

      fecha.toLocaleTimeString(
        "es-AR",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      ) +

      " hs";

    horaLlegadaBox.style.display =
      "grid";
  }

  function quitarMarcador(){

    if(
      mapa &&
      marcador
    ){

      try{

        mapa.removeLayer(
          marcador
        );

      }catch(e){}

      marcador =
        null;
    }
  }

  function mostrarFinalizado(){

    terminado =
      true;

    detenerReloj();

    detenerConsultas();

    detenerAnimacionMarcador();

    ultimaActualizacionMs =
      null;

    ultimoCreatedAtServidor =
      null;

    quitarMarcador();

    mapaWrap.style.display =
      "none";

    horaLlegadaBox.style.display =
      "none";

    if(
      cabeceraCliente
    ){
      cabeceraCliente.classList.add(
        "finalizado"
      );
    }

    estado.textContent =
      "✅ SEGUIMIENTO FINALIZADO";

    estado.style.background =
      "#eeeeee";
  }

  function ocultarTodo(){

    if(
      terminado
    ){

      return;
    }

    if(
      cabeceraCliente
    ){
      cabeceraCliente.classList.remove(
        "finalizado"
      );
    }

    estado.textContent =
      "Seguimiento no disponible";

    estado.style.background =
      "#eeeeee";

    mapaWrap.style.display =
      "none";

    ocultarHoraLlegada();

    ultimaActualizacionMs =
      null;

    ultimoCreatedAtServidor =
      null;

    detenerReloj();

    detenerAnimacionMarcador();

    quitarMarcador();
  }

  function actualizarIndicador(){

    if(
      !ultimaActualizacionMs ||
      terminado
    ){

      return;
    }

    const diferencia =

      Math.max(

        0,

        Math.floor(

          (
            Date.now() -
            ultimaActualizacionMs
          ) / 1000

        )

      );

    actualizacionSegundos.textContent =
      "hace " +
      diferencia +
      " s";

    if(
      diferencia <=
      15
    ){

      actualizacionBox.className =
        "actualizacionOk";

      actualizacionTexto.textContent =
        "UBICACIÓN ACTUALIZADA";

    }else{

      actualizacionBox.className =
        "actualizacionError";

      actualizacionTexto.textContent =
        "SIN ACTUALIZACIÓN";
    }
  }

  function iniciarReloj(){

    if(
      relojEstado !== null ||
      terminado
    ){

      return;
    }

    actualizarIndicador();

    relojEstado =
      setInterval(
        actualizarIndicador,
        1000
      );
  }

  function gradosARadianes(
    grados
  ){

    return grados *
      Math.PI /
      180;
  }

  function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
  ){

    const radioTierra =
      6371000;

    const dLat =
      gradosARadianes(
        lat2 - lat1
      );

    const dLon =
      gradosARadianes(
        lon2 - lon1
      );

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +
      Math.cos(gradosARadianes(lat1)) *
      Math.cos(gradosARadianes(lat2)) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return radioTierra * c;
  }

  function calcularDuracionAnimacion(
    createdAtNuevo
  ){

    const nuevoMs =
      new Date(
        createdAtNuevo
      )
      .getTime();

    if(
      !Number.isFinite(nuevoMs) ||
      !ultimoCreatedAtServidor
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    const intervalo =
      nuevoMs -
      ultimoCreatedAtServidor;

    if(
      !Number.isFinite(intervalo) ||
      intervalo <= 0
    ){
      return DURACION_ANIMACION_DEFAULT_MS;
    }

    return Math.max(
      1800,
      Math.min(
        8500,
        intervalo * 0.85
      )
    );
  }

  function animarMarcadorHasta(
    latDestino,
    lonDestino,
    duracionMs
  ){

    if(
      !mapa ||
      !marcador
    ){
      return;
    }

    detenerAnimacionMarcador();

    const inicioLatLng =
      marcador.getLatLng();

    const latInicio =
      Number(inicioLatLng.lat);

    const lonInicio =
      Number(inicioLatLng.lng);

    const distancia =
      distanciaMetros(
        latInicio,
        lonInicio,
        latDestino,
        lonDestino
      );

    if(
      distancia >
        DISTANCIA_MAXIMA_ANIMACION_METROS
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      mapa.panTo(
        [latDestino, lonDestino],
        {
          animate:true,
          duration:0.8
        }
      );

      return;
    }

    if(
      distancia <
        2
    ){

      marcador.setLatLng(
        [latDestino, lonDestino]
      );

      return;
    }

    const inicio =
      performance.now();

    function paso(
      ahora
    ){

      const progreso =
        Math.min(
          1,
          (
            ahora -
            inicio
          ) /
          duracionMs
        );

      const t =
        progreso *
        progreso *
        (
          3 -
          2 *
          progreso
        );

      const latActual =
        latInicio +
        (
          latDestino -
          latInicio
        ) *
        t;

      const lonActual =
        lonInicio +
        (
          lonDestino -
          lonInicio
        ) *
        t;

      marcador.setLatLng(
        [latActual, lonActual]
      );

      /*
        Acompaña la camioneta sin modificar
        la orientación elegida por el cliente.
      */
      mapa.panTo(
        [latActual, lonActual],
        {
          animate:false
        }
      );

      if(
        progreso <
          1
      ){

        animacionMarcadorId =
          requestAnimationFrame(
            paso
          );

      }else{

        marcador.setLatLng(
          [latDestino, lonDestino]
        );

        animacionMarcadorId =
          null;
      }
    }

    animacionMarcadorId =
      requestAnimationFrame(
        paso
      );
  }

  function crearMapa(
    lat,
    lon
  ){

    mapaWrap.style.display =
      "flex";

    if(
      mapa
    ){
      requestAnimationFrame(
        function(){
          try{
            mapa.invalidateSize();
          }catch(e){}
        }
      );
    }

    if(
      !mapa
    ){

      mapa =
        L.map(
          "mapa",
          {
            zoomControl:true,
            rotate:true,
            bearing:0,
            touchRotate:true,
            rotateControl:false,
            attributionControl:false
          }
        )
        .setView(
          [
            lat,
            lon
          ],
          16
        );

      L.control.attribution({
        position:"bottomleft",
        prefix:false
      })
      .addTo(
        mapa
      );

      L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          maxZoom:19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }

      )
      .addTo(
        mapa
      );

      setTimeout(

        function(){

          mapa.invalidateSize();

        },

        100
      );
    }
  }

  function actualizarMarcador(
    lat,
    lon,
    createdAt
  ){

    crearMapa(
      lat,
      lon
    );

    /*
      Si la posición del servidor no cambió,
      no reiniciamos la animación.
    */
    if(
      ultimoCreatedAtServidor ===
        createdAt
    ){
      return;
    }

    if(
      !marcador
    ){

      marcador =
        L.marker(
          [lat, lon],
          {
            icon:iconoPioca,
            rotateWithView:false
          }
        )
        .addTo(
          mapa
        )
        .bindPopup(
          "<strong>¡Estamos en camino!</strong>"
        );

      marcador.openPopup();

      ultimoCreatedAtServidor =
        createdAt;

      return;
    }

    const duracion =
      calcularDuracionAnimacion(
        createdAt
      );

    animarMarcadorHasta(
      lat,
      lon,
      duracion
    );

    ultimoCreatedAtServidor =
      createdAt;
  }

  async function consultar(
    forzar
  ){

    forzar =
      forzar === true;

    if(
      terminado
    ){

      return;
    }

    if(
      !codigo
    ){

      ocultarTodo();

      return;
    }

    codigo =
      codigo
      .trim()
      .toUpperCase();

    if(
      codigo.length <
        8 ||
      codigo.length >
        32
    ){

      ocultarTodo();

      return;
    }

    /*
      Evita consultas simultáneas.
      Si el usuario fuerza un refresco, se cancela
      una consulta anterior que pudiera haber quedado colgada.
    */
    if(
      consultaEnCurso
    ){

      if(
        !forzar
      ){
        return;
      }

      if(
        consultaAbortController
      ){
        try{
          consultaAbortController.abort();
        }catch(e){}
      }

      consultaEnCurso =
        false;
    }

    consultaEnCurso =
      true;

    const controlador =
      new AbortController();

    consultaAbortController =
      controlador;

    const timeoutConsulta =
      setTimeout(
        function(){
          try{
            controlador.abort();
          }catch(e){}
        },
        10000
      );

    try{

      const respuesta =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/rpc/get_tracking_snapshot",

          {

            method:
              "POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                p_code:
                  codigo

              }),

            signal:
              controlador.signal

          }

        );

      if(
        !respuesta.ok
      ){

        /*
          Si hay un corte momentáneo de Internet,
          conservamos la última pantalla válida.
        */

        return;
      }

      const datos =
        await respuesta.json();

      if(
        !Array.isArray(
          datos
        ) ||
        datos.length ===
          0
      ){

        ocultarTodo();

        return;
      }

      const p =
        datos[0];

      if(
        p.state ===
          "finished"
      ){

        mostrarFinalizado();

        return;
      }

      if(
        p.state !==
          "active"
      ){

        ocultarTodo();

        return;
      }

      mostrarHoraLlegada(
        p.client_arrival
      );

      if(
        p.latitude ===
          null ||
        p.longitude ===
          null
      ){

        estado.textContent =
          "Esperando ubicación del técnico...";

        estado.style.background =
          "#fff3cd";

        mapaWrap.style.display =
          "none";

        ultimaActualizacionMs =
          null;

        ultimoCreatedAtServidor =
          null;

        detenerReloj();

        detenerAnimacionMarcador();

        return;
      }

      const lat =
        Number(
          p.latitude
        );

      const lon =
        Number(
          p.longitude
        );

      if(
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ){

        return;
      }

      actualizarMarcador(
        lat,
        lon,
        p.created_at
      );

      estado.innerHTML =
        '<span class="estadoEnVivo">' +
          '<span class="puntoEnVivo"></span>' +
          '<span class="estadoTexto">Seguimiento en tiempo real</span>' +
          '<span class="estadoBadge">EN VIVO</span>' +
        '</span>';

      estado.style.background =
        "#dff5e1";

      ultimaActualizacionMs =
        new Date(
          p.created_at
        )
        .getTime();

      iniciarReloj();

      actualizarIndicador();

    }catch(error){

      /*
        Timeout, pérdida de Internet o suspensión
        del navegador no finalizan el seguimiento.
        Se conserva la última pantalla válida.
      */

    }finally{

      clearTimeout(
        timeoutConsulta
      );

      if(
        consultaAbortController ===
        controlador
      ){

        consultaAbortController =
          null;

        consultaEnCurso =
          false;
      }

      ultimaConsultaFinalizadaMs =
        Date.now();
    }
  }

  btnRefrescarPosicion.addEventListener(
    "click",
    refrescarConsultaManual
  );

  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.visibilityState ===
          "visible" &&
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "pageshow",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        consultar(true);
      }
    }
  );

  window.addEventListener(
    "online",
    function(){

      if(
        !terminado &&
        codigo
      ){

        iniciarCicloConsultas();

        consultar(true);
      }
    }
  );

  if(
    !codigo
  ){

    ocultarTodo();

  }else{

    consultar(true);

    iniciarCicloConsultas();
  }

})();

</script>
