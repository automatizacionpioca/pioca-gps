name: Compilar piOca Android APK V8 Silencio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generar proyecto base V7
        shell: bash
        run: |
          set -e
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          source = Path(".github/workflows/build-android-apk.yml")

          with source.open("r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          script = None

          for step in data["jobs"]["build"]["steps"]:
              name = str(step.get("name", ""))
              if name.startswith("Crear proyecto Android v7"):
                  script = step.get("run")
                  break

          if not script:
              raise SystemExit(
                  "ERROR: No encontré el bloque de generación V7 en build-android-apk.yml"
              )

          Path("/tmp/pioca-genera-v7.sh").write_text(
              script,
              encoding="utf-8"
          )
          PY
          bash /tmp/pioca-genera-v7.sh

      - name: Aplicar V8 silencio No molestar
        run: python3 .github/scripts/patch_android_v8_silencio.py

      - name: Compilar APK debug
        working-directory: android-pioca
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          cp \
            android-pioca/app/build/outputs/apk/debug/app-debug.apk \
            piOca-Seguimiento-v8-silencio.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-APK-v8-silencio
          path: piOca-Seguimiento-v8-silencio.apk
          retention-days: 90
