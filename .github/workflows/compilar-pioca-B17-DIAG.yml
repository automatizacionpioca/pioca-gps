      - name: Validar sintaxis de las 3 vistas diagnósticas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYJS'
          from pathlib import Path
          import re,subprocess,tempfile
          for name in ('admin-diag.html','index-diag.html','cliente-diag.html'):
              html=Path(name).read_text(encoding='utf-8')
              fragments=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              assert fragments, name+' sin scripts'
              for js in fragments:
                  if not js.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js') as tmp:
                      tmp.write(js);tmp.flush()
                      subprocess.run(['node','--check',tmp.name],check=True)
              print('JavaScript válido:',name)
          PYJS

      - name: Compilar APK B17-DIAG sin tocar B17
        shell: bash
        working-directory: android-b17-diag
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Publicar SOLO las 3 vistas diag para el WebView
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-diag.html index-diag.html cliente-diag.html
          if ! git diff --cached --quiet; then
            git commit -m 'B17-DIAG: vistas aisladas de diagnóstico, sin tocar B17'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          # NO subir android-b17-diag: queda como fuente temporaria del build.

      - name: Preparar archivo APK
        shell: bash
        run: |
          set -euo pipefail
          cp android-b17-diag/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-B17-DIAG.apk
          test -s piOca-Seguimiento-B17-DIAG.apk

      - name: Publicar APK B17-DIAG
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-B17-DIAG
          path: piOca-Seguimiento-B17-DIAG.apk
          retention-days: 15
