name: piOca Seguimiento B17 - DIAGNOSTICO (APK separada)

# B17 estable: NO SE MODIFICA. Construye desde android-b17/.
# Páginas separadas admin-diag.html, index-diag.html, cliente-diag.html.
# Requiere instalar previamente la tabla SQL pioca_diag_metrics.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pioca-b17-diag
  cancel-in-progress: false

jobs:
  compilar-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener fuente B17 consolidada
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node para validar sintaxis JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar fuente diagnóstica separada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pioca-b17-diag
