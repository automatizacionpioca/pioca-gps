name: Compilar piOca Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Crear proyecto Android v4 con icono
        shell: bash
        run: |
          set -e
          mkdir -p android-pioca/app/src/main/java/ar/com/pioca/seguimiento
          mkdir -p android-pioca/app/src/main/res/values
          mkdir -p android-pioca/app/src/main/res/mipmap-mdpi
          mkdir -p android-pioca/app/src/main/res/mipmap-hdpi
          mkdir -p android-pioca/app/src/main/res/mipmap-xhdpi
          mkdir -p android-pioca/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-pioca/app/src/main/res/mipmap-xxxhdpi

          cat > android-pioca/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "piOca Seguimiento"
          include ":app"
          EOF

          cat > android-pioca/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.7.3" apply false }
          EOF

          cat > android-pioca/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "ar.com.pioca.seguimiento"
              compileSdk 35
              defaultConfig {
                  applicationId "ar.com.pioca.seguimiento"
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName "0.4-prueba"
              }
          }
          EOF

          cat > android-pioca/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">piOca Seguimiento</string></resources>
          EOF

          cat > android-pioca/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1769aa</item>
              <item name="android:statusBarColor">#1769aa</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          # ------------------------------------------------------------
          # ICONO PERSONALIZADO piOca
          # Toma un único archivo de la raíz del repositorio:
          # icono-pioca.png
          # y genera automáticamente todos los tamaños Android.
          # ------------------------------------------------------------

          if [ ! -f "icono-pioca.png" ]; then
            echo "ERROR: Falta icono-pioca.png en la raíz del repositorio."
            exit 1
          fi

          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          convert "icono-pioca.png" \
            -background white \
            -gravity center \
            -resize 48x48 \
            -extent 48x48 \
            android-pioca/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "icono-pioca.png" \
            -background white \
            -gravity center \
            -resize 72x72 \
            -extent 72x72 \
            android-pioca/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "icono-pioca.png" \
            -background white \
            -gravity center \
            -resize 96x96 \
            -extent 96x96 \
            android-pioca/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "icono-pioca.png" \
            -background white \
            -gravity center \
            -resize 144x144 \
            -extent 144x144 \
            android-pioca/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "icono-pioca.png" \
            -background white \
            -gravity center \
            -resize 192x192 \
            -extent 192x192 \
            android-pioca/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > android-pioca/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:theme="@style/AppTheme" android:label="piOca Seguimiento" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".TrackingService" android:foregroundServiceType="location" android:exported="false"/>
            </application>
          </manifest>
          EOF

          cat > android-pioca/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java <<'EOF'
          package ar.com.pioca.seguimiento;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;

          public class MainActivity extends Activity {

              private static final String ADMIN =
                      "https://automatizacionpioca.github.io/pioca-gps/admin.html";

              private static final String AUTH_KEY =
                      "sb-apxrmkdegjnblkbyjsbp-auth-token";

              private static final int REQ_PERMISSIONS = 100;
              private static final int REQ_CONTACT = 200;

              private WebView web;

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings =
                          web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);

                  web.addJavascriptInterface(
                          new NativeBridge(),
                          "PiocaNative");

                  web.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public void onGeolocationPermissionsShowPrompt(
                                      String origin,
                                      GeolocationPermissions.Callback callback) {

                                  boolean ok =
                                          checkSelfPermission(
                                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                          == PackageManager.PERMISSION_GRANTED;

                                  callback.invoke(
                                          origin,
                                          ok,
                                          false);
                              }
                          });

                  web.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  Uri uri =
                                          request.getUrl();

                                  String scheme =
                                          uri.getScheme() == null
                                                  ? ""
                                                  : uri.getScheme();

                                  if ("intent".equalsIgnoreCase(scheme)) {

                                      try {

                                          startActivity(
                                                  Intent.parseUri(
                                                          uri.toString(),
                                                          Intent.URI_INTENT_SCHEME));

                                      } catch (Exception ignored) {
                                      }

                                      return true;
                                  }

                                  return false;
                              }

                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url);

                                  Uri uri =
                                          Uri.parse(url);

                                  if (url.contains(
                                          "/pioca-gps/index.html")) {

                                      String code =
                                              uri.getQueryParameter(
                                                      "tracking");

                                      if (code != null
                                              && !code.trim().isEmpty()) {

                                          String safeCode =
                                                  JSONObject.quote(
                                                          code.trim()
                                                                  .toUpperCase());

                                          String js =
                                                  "(function(){try{"
                                                  + "var raw=localStorage.getItem("
                                                  + JSONObject.quote(AUTH_KEY)
                                                  + ");"
                                                  + "if(!raw)return;"
                                                  + "var s=JSON.parse(raw);"
                                                  + "if(s&&s.access_token){"
                                                  + "PiocaNative.startTracking("
                                                  + safeCode
                                                  + ",String(s.access_token||''),"
                                                  + "String(s.refresh_token||''),"
                                                  + "String(localStorage.getItem('pioca_client_name')||''),"
                                                  + "String(localStorage.getItem('pioca_tracking_expires_at')||''));"
                                                  + "}"
                                                  + "}catch(e){}})();";

                                          view.evaluateJavascript(
                                                  js,
                                                  null);
                                      }
                                  }

                                  if (url.contains(
                                          "/pioca-gps/admin.html")) {

                                      view.evaluateJavascript(
                                              "(function(){try{"
                                              + "if(!localStorage.getItem('pioca_tracking_active'))"
                                              + "PiocaNative.stopTracking();"
                                              + "}catch(e){}})();",
                                              null);
                                  }
                              }
                          });

                  requestRuntimePermissions();
                  web.loadUrl(ADMIN);
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (web != null) {
                      web.postDelayed(
                              this::showPendingEndDialog,
                              350);
                  }
              }

              private void requestRuntimePermissions() {

                  if (Build.VERSION.SDK_INT >= 33) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.READ_CONTACTS,
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              REQ_PERMISSIONS);

                  } else {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.READ_CONTACTS
                              },
                              REQ_PERMISSIONS);
                  }
              }

              private void launchContactPicker() {

                  try {

                      Intent i =
                              new Intent(
                                      Intent.ACTION_PICK,
                                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI);

                      startActivityForResult(
                              i,
                              REQ_CONTACT);

                  } catch (Exception e) {

                      if (web != null) {

                          web.evaluateJavascript(
                                  "(function(){"
                                  + "var e=document.getElementById('contactoEstado');"
                                  + "if(e){e.textContent='No se pudo abrir la agenda.';"
                                  + "e.className='estado error';e.style.display='block';}"
                                  + "})();",
                                  null);
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (requestCode != REQ_CONTACT
                          || resultCode != RESULT_OK
                          || data == null
                          || data.getData() == null) {

                      return;
                  }

                  Uri uri =
                          data.getData();

                  String name = "";
                  String phone = "";

                  Cursor cursor = null;

                  try {

                      cursor =
                              getContentResolver().query(
                                      uri,
                                      new String[]{
                                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                              ContactsContract.CommonDataKinds.Phone.NUMBER
                                      },
                                      null,
                                      null,
                                      null);

                      if (cursor != null
                              && cursor.moveToFirst()) {

                          int nameIndex =
                                  cursor.getColumnIndex(
                                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME);

                          int phoneIndex =
                                  cursor.getColumnIndex(
                                          ContactsContract.CommonDataKinds.Phone.NUMBER);

                          if (nameIndex >= 0) {
                              name =
                                      cursor.getString(
                                              nameIndex);
                          }

                          if (phoneIndex >= 0) {
                              phone =
                                      cursor.getString(
                                              phoneIndex);
                          }
                      }

                  } catch (Exception ignored) {

                  } finally {

                      if (cursor != null) {
                          cursor.close();
                      }
                  }

                  final String safeName =
                          JSONObject.quote(
                                  name == null ? "" : name);

                  final String safePhone =
                          JSONObject.quote(
                                  phone == null ? "" : phone);

                  web.evaluateJavascript(
                          "(function(){"
                          + "var n=document.getElementById('clientName');"
                          + "var p=document.getElementById('clientPhone');"
                          + "if(n)n.value=" + safeName + ";"
                          + "if(p)p.value=" + safePhone + ";"
                          + "var e=document.getElementById('contactoEstado');"
                          + "if(e){e.textContent='✅ Contacto cargado.';"
                          + "e.className='estado ok';e.style.display='block';}"
                          + "})();",
                          null);
              }

              private void showPendingEndDialog() {

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "pioca_tracking",
                                  MODE_PRIVATE);

                  boolean pending =
                          prefs.getBoolean(
                                  "pending_finished_dialog",
                                  false);

                  if (!pending) {
                      return;
                  }

                  String name =
                          prefs.getString(
                                  "finished_client_name",
                                  "");

                  String who =
                          name == null
                                  || name.trim().isEmpty()
                                  ? "Este cliente"
                                  : name.trim();

                  prefs.edit()
                          .putBoolean(
                                  "pending_finished_dialog",
                                  false)
                          .apply();

                  new AlertDialog.Builder(this)
                          .setTitle(
                                  "Seguimiento finalizado")
                          .setMessage(
                                  "El seguimiento de "
                                  + who
                                  + " ya no está activo.\n\n"
                                  + "El cliente ya no puede ver la ubicación de la camioneta.")
                          .setPositiveButton(
                                  "ACEPTAR",
                                  null)
                          .show();
              }

              public class NativeBridge {

                  @JavascriptInterface
                  public void pickContact() {

                      runOnUiThread(
                              MainActivity.this::launchContactPicker);
                  }

                  @JavascriptInterface
                  public void startTracking(
                          String code,
                          String accessToken,
                          String refreshToken,
                          String clientName,
                          String expiresAt) {

                      runOnUiThread(() -> {

                          if (checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED) {

                              requestRuntimePermissions();
                              return;
                          }

                          Intent service =
                                  new Intent(
                                          MainActivity.this,
                                          TrackingService.class);

                          service.putExtra(
                                  "tracking",
                                  code);

                          service.putExtra(
                                  "access_token",
                                  accessToken);

                          service.putExtra(
                                  "refresh_token",
                                  refreshToken);

                          service.putExtra(
                                  "client_name",
                                  clientName);

                          service.putExtra(
                                  "expires_at",
                                  expiresAt);

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(service);
                          } else {
                              startService(service);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopTracking() {

                      runOnUiThread(() ->
                              stopService(
                                      new Intent(
                                              MainActivity.this,
                                              TrackingService.class)));
                  }
              }

              @Override
              public void onBackPressed() {

                  if (web != null
                          && web.canGoBack()) {

                      web.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android-pioca/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java <<'EOF'
          package ar.com.pioca.seguimiento;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.time.Instant;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class TrackingService
                  extends Service
                  implements LocationListener {

              private static final String CH =
                      "pioca_tracking";

              private static final String BASE =
                      "https://apxrmkdegjnblkbyjsbp.supabase.co";

              private static final String KEY =
                      "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

              private volatile String code;
              private volatile String accessToken;
              private volatile String refreshToken;
              private volatile String clientName;

              private volatile long expiresAtMillis = 0L;

              private LocationManager lm;
              private Location last;

              private long lastOk = 0L;
              private long lastRemoteCheck = 0L;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private final AtomicBoolean sending =
                      new AtomicBoolean(false);

              private final AtomicBoolean checking =
                      new AtomicBoolean(false);

              private volatile boolean ending = false;

              private final Runnable heartbeat =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (ending) {
                                  return;
                              }

                              long now =
                                      System.currentTimeMillis();

                              if (expiresAtMillis > 0
                                      && now >= expiresAtMillis) {

                                  finishExpired();
                                  return;
                              }

                              if (now - lastRemoteCheck
                                      >= 5000L) {

                                  validateRemoteAsync();
                              }

                              if (last != null
                                      && now - lastOk
                                      >= 10000L) {

                                  sendAsync(last);
                              }

                              handler.postDelayed(
                                      this,
                                      2000L);
                          }
                      };

              @Override
              public void onCreate() {

                  super.onCreate();

                  NotificationManager nm =
                          getSystemService(
                                  NotificationManager.class);

                  nm.createNotificationChannel(
                          new NotificationChannel(
                                  CH,
                                  "Seguimiento GPS piOca",
                                  NotificationManager.IMPORTANCE_LOW));
              }

              @Override
              public int onStartCommand(
                      Intent i,
                      int flags,
                      int startId) {

                  if (i != null) {

                      code =
                              norm(
                                      i.getStringExtra(
                                              "tracking"));

                      accessToken =
                              nz(
                                      i.getStringExtra(
                                              "access_token"));

                      refreshToken =
                              nz(
                                      i.getStringExtra(
                                              "refresh_token"));

                      clientName =
                              nz(
                                      i.getStringExtra(
                                              "client_name"));

                      expiresAtMillis =
                              parseTime(
                                      i.getStringExtra(
                                              "expires_at"));
                  }

                  Notification n =
                          new Notification.Builder(
                                  this,
                                  CH)
                                  .setContentTitle(
                                          "piOca · Seguimiento GPS activo")
                                  .setContentText(
                                          clientName == null
                                                  || clientName.trim().isEmpty()
                                                  ? "La ubicación se está enviando al cliente"
                                                  : "Enviando ubicación a " + clientName)
                                  .setSmallIcon(
                                          android.R.drawable.ic_menu_mylocation)
                                  .setOngoing(true)
                                  .setOnlyAlertOnce(true)
                                  .build();

                  startForeground(
                          1001,
                          n);

                  startLocations();

                  handler.removeCallbacks(
                          heartbeat);

                  handler.postDelayed(
                          heartbeat,
                          1000L);

                  return START_STICKY;
              }

              private void startLocations() {

                  lm =
                          (LocationManager)
                                  getSystemService(
                                          LOCATION_SERVICE);

                  if (checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      stopSelf();
                      return;
                  }

                  try {

                      lm.requestLocationUpdates(
                              LocationManager.GPS_PROVIDER,
                              5000L,
                              0f,
                              this,
                              Looper.getMainLooper());

                  } catch (Exception ignored) {
                  }

                  try {

                      lm.requestLocationUpdates(
                              LocationManager.NETWORK_PROVIDER,
                              10000L,
                              0f,
                              this,
                              Looper.getMainLooper());

                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onLocationChanged(
                      Location l) {

                  if (ending) {
                      return;
                  }

                  last = l;

                  if (expiresAtMillis > 0
                          && System.currentTimeMillis()
                          >= expiresAtMillis) {

                      finishExpired();
                      return;
                  }

                  if (System.currentTimeMillis()
                          - lastOk >= 5000L) {

                      sendAsync(l);
                  }
              }

              private void validateRemoteAsync() {

                  if (ending
                          || code == null
                          || code.isEmpty()
                          || accessToken == null
                          || accessToken.isEmpty()) {

                      return;
                  }

                  if (!checking.compareAndSet(
                          false,
                          true)) {

                      return;
                  }

                  lastRemoteCheck =
                          System.currentTimeMillis();

                  new Thread(() -> {

                      try {

                          RemoteState state =
                                  loadRemoteState(
                                          accessToken);

                          if (state == RemoteState.UNAUTHORIZED
                                  && refresh()) {

                              state =
                                      loadRemoteState(
                                              accessToken);
                          }

                          if (state == RemoteState.FINISHED) {

                              finishExpired();
                          }

                      } finally {

                          checking.set(false);
                      }

                  }).start();
              }

              private RemoteState loadRemoteState(
                      String token) {

                  HttpURLConnection c = null;

                  try {

                      String encodedCode =
                              URLEncoder.encode(
                                      code,
                                      "UTF-8");

                      URL url =
                              new URL(
                                      BASE
                                      + "/rest/v1/services"
                                      + "?select=status,expires_at"
                                      + "&tracking_code=eq."
                                      + encodedCode
                                      + "&limit=1");

                      c =
                              (HttpURLConnection)
                                      url.openConnection();

                      c.setRequestMethod(
                              "GET");

                      c.setConnectTimeout(
                              10000);

                      c.setReadTimeout(
                              10000);

                      c.setRequestProperty(
                              "apikey",
                              KEY);

                      c.setRequestProperty(
                              "Authorization",
                              "Bearer " + token);

                      int status =
                              c.getResponseCode();

                      if (status == 401) {
                          return RemoteState.UNAUTHORIZED;
                      }

                      if (status < 200
                              || status >= 300) {

                          return RemoteState.UNKNOWN;
                      }

                      String body =
                              readBody(
                                      c.getInputStream());

                      JSONArray arr =
                              new JSONArray(body);

                      if (arr.length() == 0) {
                          return RemoteState.FINISHED;
                      }

                      JSONObject row =
                              arr.getJSONObject(0);

                      String remoteStatus =
                              row.optString(
                                      "status",
                                      "");

                      long remoteExpiry =
                              parseTime(
                                      row.optString(
                                              "expires_at",
                                              ""));

                      if (!"active".equalsIgnoreCase(
                              remoteStatus)) {

                          return RemoteState.FINISHED;
                      }

                      if (remoteExpiry > 0
                              && System.currentTimeMillis()
                              >= remoteExpiry) {

                          return RemoteState.FINISHED;
                      }

                      if (remoteExpiry > 0) {
                          expiresAtMillis =
                                  remoteExpiry;
                      }

                      return RemoteState.ACTIVE;

                  } catch (Exception e) {

                      return RemoteState.UNKNOWN;

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private void sendAsync(
                      Location l) {

                  if (ending
                          || code == null
                          || code.isEmpty()
                          || accessToken == null
                          || accessToken.isEmpty()) {

                      return;
                  }

                  if (!sending.compareAndSet(
                          false,
                          true)) {

                      return;
                  }

                  new Thread(() -> {

                      try {

                          int r =
                                  send(
                                          l,
                                          accessToken);

                          if (r == 401
                                  && refresh()) {

                              r =
                                      send(
                                              l,
                                              accessToken);
                          }

                          if (r >= 200
                                  && r < 300) {

                              lastOk =
                                      System.currentTimeMillis();

                          } else if (
                                  r == 400
                                  || r == 403
                                  || r == 404) {

                              validateRemoteAsync();
                          }

                      } finally {

                          sending.set(false);
                      }

                  }).start();
              }

              private int send(
                      Location l,
                      String token) {

                  HttpURLConnection c = null;

                  try {

                      c =
                              (HttpURLConnection)
                                      new URL(
                                              BASE
                                              + "/rest/v1/rpc/"
                                              + "push_tracking_position")
                                      .openConnection();

                      c.setRequestMethod(
                              "POST");

                      c.setDoOutput(
                              true);

                      c.setConnectTimeout(
                              10000);

                      c.setReadTimeout(
                              10000);

                      c.setRequestProperty(
                              "apikey",
                              KEY);

                      c.setRequestProperty(
                              "Authorization",
                              "Bearer " + token);

                      c.setRequestProperty(
                              "Content-Type",
                              "application/json");

                      JSONObject b =
                              new JSONObject();

                      b.put(
                              "p_code",
                              code);

                      b.put(
                              "p_lat",
                              l.getLatitude());

                      b.put(
                              "p_lon",
                              l.getLongitude());

                      b.put(
                              "p_accuracy",
                              l.getAccuracy());

                      try (
                              OutputStream os =
                                      c.getOutputStream()) {

                          os.write(
                                  b.toString()
                                          .getBytes(
                                                  StandardCharsets.UTF_8));
                      }

                      int status =
                              c.getResponseCode();

                      String body =
                              readBody(
                                      status >= 400
                                              ? c.getErrorStream()
                                              : c.getInputStream());

                      if (status >= 200
                              && status < 300) {

                          String t =
                                  body == null
                                          ? ""
                                          : body.trim()
                                                  .toLowerCase();

                          if ("false".equals(t)
                                  || "null".equals(t)) {

                              validateRemoteAsync();
                          }
                      }

                      return status;

                  } catch (Exception e) {

                      return 0;

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private boolean refresh() {

                  if (refreshToken == null
                          || refreshToken.isEmpty()) {

                      return false;
                  }

                  HttpURLConnection c = null;

                  try {

                      c =
                              (HttpURLConnection)
                                      new URL(
                                              BASE
                                              + "/auth/v1/token"
                                              + "?grant_type=refresh_token")
                                      .openConnection();

                      c.setRequestMethod(
                              "POST");

                      c.setDoOutput(
                              true);

                      c.setConnectTimeout(
                              10000);

                      c.setReadTimeout(
                              10000);

                      c.setRequestProperty(
                              "apikey",
                              KEY);

                      c.setRequestProperty(
                              "Content-Type",
                              "application/json");

                      JSONObject b =
                              new JSONObject();

                      b.put(
                              "refresh_token",
                              refreshToken);

                      try (
                              OutputStream os =
                                      c.getOutputStream()) {

                          os.write(
                                  b.toString()
                                          .getBytes(
                                                  StandardCharsets.UTF_8));
                      }

                      if (c.getResponseCode() < 200
                              || c.getResponseCode() >= 300) {

                          return false;
                      }

                      JSONObject r =
                              new JSONObject(
                                      readBody(
                                              c.getInputStream()));

                      accessToken =
                              r.optString(
                                      "access_token",
                                      accessToken);

                      refreshToken =
                              r.optString(
                                      "refresh_token",
                                      refreshToken);

                      return accessToken != null
                              && !accessToken.isEmpty();

                  } catch (Exception e) {

                      return false;

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private synchronized void finishExpired() {

                  if (ending) {
                      return;
                  }

                  ending = true;

                  handler.removeCallbacks(
                          heartbeat);

                  if (lm != null) {

                      try {
                          lm.removeUpdates(
                                  this);
                      } catch (Exception ignored) {
                      }
                  }

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "pioca_tracking",
                                  MODE_PRIVATE);

                  prefs.edit()
                          .putBoolean(
                                  "pending_finished_dialog",
                                  true)
                          .putString(
                                  "finished_client_name",
                                  clientName == null
                                          ? ""
                                          : clientName)
                          .apply();

                  try {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE);

                  } catch (Exception ignored) {
                  }

                  stopSelf();
              }

              private static long parseTime(
                      String value) {

                  if (value == null
                          || value.trim().isEmpty()) {

                      return 0L;
                  }

                  try {

                      return Instant.parse(
                              value.trim())
                              .toEpochMilli();

                  } catch (Exception e) {

                      return 0L;
                  }
              }

              private static String readBody(
                      InputStream in)
                      throws Exception {

                  if (in == null) {
                      return "";
                  }

                  StringBuilder sb =
                          new StringBuilder();

                  int x;

                  while ((x = in.read()) != -1) {
                      sb.append(
                              (char)x);
                  }

                  return sb.toString();
              }

              private static String norm(
                      String s) {

                  return s == null
                          ? ""
                          : s.trim()
                                  .toUpperCase();
              }

              private static String nz(
                      String s) {

                  return s == null
                          ? ""
                          : s;
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(
                          heartbeat);

                  if (lm != null) {

                      try {
                          lm.removeUpdates(
                                  this);
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent i) {

                  return null;
              }

              private enum RemoteState {
                  ACTIVE,
                  FINISHED,
                  UNAUTHORIZED,
                  UNKNOWN
              }
          }
