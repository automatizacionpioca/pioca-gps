name: Compilar piOca Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Crear proyecto Android v3
        shell: bash
        run: |
          set -e
          mkdir -p android-pioca/app/src/main/java/ar/com/pioca/seguimiento
          mkdir -p android-pioca/app/src/main/res/values

          cat > android-pioca/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "piOca Seguimiento"
          include ":app"
          EOF

          cat > android-pioca/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.7.3" apply false }
          EOF

          cat > android-pioca/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "ar.com.pioca.seguimiento"
              compileSdk 35
              defaultConfig {
                  applicationId "ar.com.pioca.seguimiento"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "0.3-prueba"
              }
          }
          EOF

          cat > android-pioca/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">piOca Seguimiento</string></resources>
          EOF

          cat > android-pioca/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1769aa</item>
              <item name="android:statusBarColor">#1769aa</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > android-pioca/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:theme="@style/AppTheme" android:label="piOca Seguimiento" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".TrackingService" android:foregroundServiceType="location" android:exported="false"/>
            </application>
          </manifest>
          EOF

          cat > android-pioca/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java <<'EOF'
          package ar.com.pioca.seguimiento;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private static final String ADMIN = "https://automatizacionpioca.github.io/pioca-gps/admin.html";
              private static final String AUTH_KEY = "sb-apxrmkdegjnblkbyjsbp-auth-token";
              private WebView web;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);

                  web.addJavascriptInterface(new NativeBridge(), "PiocaNative");

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          boolean ok =
                                  checkSelfPermission(
                                          Manifest.permission.ACCESS_FINE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED;

                          callback.invoke(origin, ok, false);
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String scheme =
                                  uri.getScheme() == null
                                          ? ""
                                          : uri.getScheme();

                          if ("intent".equalsIgnoreCase(scheme)) {
                              try {
                                  startActivity(
                                          Intent.parseUri(
                                                  uri.toString(),
                                                  Intent.URI_INTENT_SCHEME));
                              } catch (Exception ignored) {
                              }
                              return true;
                          }

                          return false;
                      }

                      @Override
                      public void onPageFinished(
                              WebView view,
                              String url) {

                          super.onPageFinished(view, url);

                          Uri uri = Uri.parse(url);

                          if (url.contains("/pioca-gps/index.html")) {

                              String code =
                                      uri.getQueryParameter("tracking");

                              if (code != null
                                      && !code.trim().isEmpty()) {

                                  String safeCode =
                                          JSONObject.quote(
                                                  code.trim().toUpperCase());

                                  String js =
                                          "(function(){try{"
                                          + "var raw=localStorage.getItem("
                                          + JSONObject.quote(AUTH_KEY)
                                          + ");"
                                          + "if(!raw)return;"
                                          + "var s=JSON.parse(raw);"
                                          + "if(s&&s.access_token){"
                                          + "PiocaNative.startTracking("
                                          + safeCode
                                          + ",String(s.access_token||''),"
                                          + "String(s.refresh_token||''));"
                                          + "}"
                                          + "}catch(e){}})();";

                                  view.evaluateJavascript(js, null);
                              }
                          }

                          if (url.contains("/pioca-gps/admin.html")) {

                              view.evaluateJavascript(
                                      "(function(){try{"
                                      + "if(!localStorage.getItem('pioca_tracking_active'))"
                                      + "PiocaNative.stopTracking();"
                                      + "}catch(e){}})();",
                                      null);
                          }
                      }
                  });

                  requestRuntimePermissions();
                  web.loadUrl(ADMIN);
              }

              private void requestRuntimePermissions() {

                  if (Build.VERSION.SDK_INT >= 33) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              100);

                  } else {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              100);
                  }
              }

              public class NativeBridge {

                  @JavascriptInterface
                  public void startTracking(
                          String code,
                          String accessToken,
                          String refreshToken) {

                      runOnUiThread(() -> {

                          if (checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED) {

                              requestRuntimePermissions();
                              return;
                          }

                          Intent service =
                                  new Intent(
                                          MainActivity.this,
                                          TrackingService.class);

                          service.putExtra("tracking", code);
                          service.putExtra("access_token", accessToken);
                          service.putExtra("refresh_token", refreshToken);

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(service);
                          } else {
                              startService(service);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopTracking() {

                      runOnUiThread(() ->
                              stopService(
                                      new Intent(
                                              MainActivity.this,
                                              TrackingService.class)));
                  }
              }

              @Override
              public void onBackPressed() {

                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android-pioca/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java <<'EOF'
          package ar.com.pioca.seguimiento;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class TrackingService
                  extends Service
                  implements LocationListener {

              private static final String CH =
                      "pioca_tracking";

              private static final String BASE =
                      "https://apxrmkdegjnblkbyjsbp.supabase.co";

              private static final String KEY =
                      "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

              private volatile String code;
              private volatile String accessToken;
              private volatile String refreshToken;

              private LocationManager lm;
              private Location last;

              private long lastOk = 0L;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final AtomicBoolean sending =
                      new AtomicBoolean(false);

              private final Runnable heartbeat =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (last != null
                                      && System.currentTimeMillis()
                                      - lastOk >= 10000L) {

                                  sendAsync(last);
                              }

                              handler.postDelayed(
                                      this,
                                      2000L);
                          }
                      };

              @Override
              public void onCreate() {

                  super.onCreate();

                  NotificationManager nm =
                          getSystemService(
                                  NotificationManager.class);

                  nm.createNotificationChannel(
                          new NotificationChannel(
                                  CH,
                                  "Seguimiento GPS piOca",
                                  NotificationManager.IMPORTANCE_LOW));
              }

              @Override
              public int onStartCommand(
                      Intent i,
                      int flags,
                      int startId) {

                  if (i != null) {

                      code =
                              norm(
                                      i.getStringExtra("tracking"));

                      accessToken =
                              nz(
                                      i.getStringExtra("access_token"));

                      refreshToken =
                              nz(
                                      i.getStringExtra("refresh_token"));
                  }

                  Notification n =
                          new Notification.Builder(this, CH)
                                  .setContentTitle(
                                          "piOca · Seguimiento GPS activo")
                                  .setContentText(
                                          "La ubicación se está enviando al cliente")
                                  .setSmallIcon(
                                          android.R.drawable.ic_menu_mylocation)
                                  .setOngoing(true)
                                  .setOnlyAlertOnce(true)
                                  .build();

                  startForeground(1001, n);

                  startLocations();

                  handler.removeCallbacks(heartbeat);
                  handler.postDelayed(
                          heartbeat,
                          2000L);

                  return START_STICKY;
              }

              private void startLocations() {

                  lm =
                          (LocationManager)
                                  getSystemService(
                                          LOCATION_SERVICE);

                  if (checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      stopSelf();
                      return;
                  }

                  try {
                      lm.requestLocationUpdates(
                              LocationManager.GPS_PROVIDER,
                              5000L,
                              0f,
                              this,
                              Looper.getMainLooper());
                  } catch (Exception ignored) {
                  }

                  try {
                      lm.requestLocationUpdates(
                              LocationManager.NETWORK_PROVIDER,
                              10000L,
                              0f,
                              this,
                              Looper.getMainLooper());
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onLocationChanged(
                      Location l) {

                  last = l;

                  if (System.currentTimeMillis()
                          - lastOk >= 5000L) {

                      sendAsync(l);
                  }
              }

              private void sendAsync(
                      Location l) {

                  if (code == null
                          || code.isEmpty()
                          || accessToken == null
                          || accessToken.isEmpty()) {

                      return;
                  }

                  if (!sending.compareAndSet(
                          false,
                          true)) {

                      return;
                  }

                  new Thread(() -> {

                      try {

                          int r =
                                  send(
                                          l,
                                          accessToken);

                          if (r == 401
                                  && refresh()) {

                              r =
                                      send(
                                              l,
                                              accessToken);
                          }

                          if (r == 299) {
                              return;
                          }

                          if (r >= 200
                                  && r < 300) {

                              lastOk =
                                      System.currentTimeMillis();
                          }

                      } finally {

                          sending.set(false);
                      }

                  }).start();
              }

              private int send(
                      Location l,
                      String token) {

                  HttpURLConnection c = null;

                  try {

                      c =
                              (HttpURLConnection)
                                      new URL(
                                              BASE
                                              + "/rest/v1/rpc/"
                                              + "push_tracking_position")
                                      .openConnection();

                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);

                      c.setRequestProperty(
                              "apikey",
                              KEY);

                      c.setRequestProperty(
                              "Authorization",
                              "Bearer " + token);

                      c.setRequestProperty(
                              "Content-Type",
                              "application/json");

                      JSONObject b =
                              new JSONObject();

                      b.put(
                              "p_code",
                              code);

                      b.put(
                              "p_lat",
                              l.getLatitude());

                      b.put(
                              "p_lon",
                              l.getLongitude());

                      b.put(
                              "p_accuracy",
                              l.getAccuracy());

                      try (
                              OutputStream os =
                                      c.getOutputStream()) {

                          os.write(
                                  b.toString()
                                          .getBytes(
                                                  StandardCharsets.UTF_8));
                      }

                      int status =
                              c.getResponseCode();

                      StringBuilder responseBody =
                              new StringBuilder();

                      try (
                              InputStream in =
                                      status >= 400
                                              ? c.getErrorStream()
                                              : c.getInputStream()) {

                          if (in != null) {
                              int ch;
                              while ((ch = in.read()) != -1) {
                                  responseBody.append((char) ch);
                              }
                          }
                      }

                      /*
                        push_tracking_position devuelve TRUE
                        mientras el seguimiento es válido.
                        Si devuelve FALSE o NULL, el seguimiento
                        terminó/venció y detenemos el servicio nativo.
                      */
                      if (status >= 200 && status < 300) {

                          String bodyText =
                                  responseBody
                                          .toString()
                                          .trim()
                                          .toLowerCase();

                          if ("false".equals(bodyText)
                                  || "null".equals(bodyText)
                                  || bodyText.isEmpty()) {

                              stopSelf();
                              return 299;
                          }
                      }

                      return status;

                  } catch (Exception e) {

                      return 0;

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private boolean refresh() {

                  if (refreshToken == null
                          || refreshToken.isEmpty()) {

                      return false;
                  }

                  HttpURLConnection c = null;

                  try {

                      c =
                              (HttpURLConnection)
                                      new URL(
                                              BASE
                                              + "/auth/v1/token"
                                              + "?grant_type=refresh_token")
                                      .openConnection();

                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);

                      c.setRequestProperty(
                              "apikey",
                              KEY);

                      c.setRequestProperty(
                              "Content-Type",
                              "application/json");

                      JSONObject b =
                              new JSONObject();

                      b.put(
                              "refresh_token",
                              refreshToken);

                      try (
                              OutputStream os =
                                      c.getOutputStream()) {

                          os.write(
                                  b.toString()
                                          .getBytes(
                                                  StandardCharsets.UTF_8));
                      }

                      if (c.getResponseCode() < 200
                              || c.getResponseCode() >= 300) {

                          return false;
                      }

                      StringBuilder sb =
                              new StringBuilder();

                      try (
                              InputStream in =
                                      c.getInputStream()) {

                          int x;

                          while ((x = in.read()) != -1) {
                              sb.append((char)x);
                          }
                      }

                      JSONObject r =
                              new JSONObject(
                                      sb.toString());

                      accessToken =
                              r.optString(
                                      "access_token",
                                      accessToken);

                      refreshToken =
                              r.optString(
                                      "refresh_token",
                                      refreshToken);

                      return accessToken != null
                              && !accessToken.isEmpty();

                  } catch (Exception e) {

                      return false;

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private static String norm(
                      String s) {

                  return s == null
                          ? ""
                          : s.trim().toUpperCase();
              }

              private static String nz(
                      String s) {

                  return s == null
                          ? ""
                          : s;
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(
                          heartbeat);

                  if (lm != null) {
                      lm.removeUpdates(this);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent i) {

                  return null;
              }
          }
          EOF

      - name: Compilar APK debug
        working-directory: android-pioca
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android-pioca/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-prueba-v3.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-APK-v3
          path: piOca-Seguimiento-prueba-v3.apk
          retention-days: 30
