name: piOca Seguimiento B18 - DIAGNOSTICO OPTIMIZADO R67

# Construye B18 desde android-b17 y los 3 HTML estables, SIN modificarlos.
# Reutiliza el generador de telemetria existente de B17-DIAG en la primera
# compilacion y lo guarda en .github/scripts/b18_diag_base/ para futuros builds.
# No borrar B17-DIAG hasta que B18 compile y este guardado el generador.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pioca-b18-diag-r67
  cancel-in-progress: false

jobs:
  compilar-b18-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener B17 estable sin modificaciones
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node 22 para validar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperar generador de caja negra y crear base B17-DIAG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBASE'
          from pathlib import Path
          import base64,io,zipfile,re
          destino=Path('.github/scripts/b18_diag_base')
          nombres={'build_diag.py','DiagnosticTelemetry.java','diag_web.js'}
          if all((destino/n).is_file() and (destino/n).stat().st_size>0 for n in nombres):
              print('B18: fuentes diagnosticas independientes ya guardadas')
          else:
              fuente=Path('.github/workflows/compilar-pioca-B17-DIAG.yml')
              if not fuente.exists():
                  raise SystemExit('B18 primera compilacion: falta workflow B17-DIAG fuente. NO BORRAR todavia.')
              txt=fuente.read_text(encoding='utf-8')
              m=re.search(r"<<'B17_DIAG_ASSETS'\s*\n(.*?)\n\s*B17_DIAG_ASSETS",txt,re.S)
              if not m:
                  raise SystemExit('No se encontro el paquete original de caja negra B17-DIAG')
              payload=base64.b64decode(''.join(m.group(1).split()),validate=True)
              destino.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  if set(z.namelist())!=nombres:
                      raise SystemExit('Paquete diagnostico inesperado: no modificar la base')
                  z.extractall(destino)
              print('B18: generador de caja negra B17-DIAG recuperado para conservar')
          PYBASE
          python3 .github/scripts/b18_diag_base/build_diag.py
          test -s android-b17-diag/app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java
          test -s admin-diag.html
          test -s index-diag.html
          test -s cliente-diag.html

      - name: Aplicar optimizaciones B18 separadas sin tocar B17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYB18'
          from pathlib import Path
          import shutil,re,hashlib
          root=Path('.')
          b17=root/'android-b17'
          diag=root/'android-b17-diag'
          native=root/'android-b18-diag'
          assert b17.is_dir() and diag.is_dir(),'B17 base diagnostica ausente'
          if native.exists(): shutil.rmtree(native)
          shutil.copytree(diag,native)
          
          def replace_one(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit('B18 ancla '+label+' coincidencias='+str(n))
              return text.replace(old,new,1)
          
          def replace_pattern(text,pattern,new,label):
              matches=list(re.finditer(pattern,text,re.M))
              if len(matches)!=1:
                  raise SystemExit('B18 patron '+label+' coincidencias='+str(len(matches)))
              hit=matches[0]
              return text[:hit.start()]+new+text[hit.end():]
          
          for page in ('admin','index','cliente'):
              src=root/(page+'-diag.html')
              s=src.read_text(encoding='utf-8')
              for route in ('admin','index','cliente'):
                  s=s.replace(route+'-diag.html',route+'-b18-diag.html')
          
              if page=='index':
                  # Medir si el click llega al JS antes de intentar navegar.
                  anchor=r'btnVerSeguimiento\.addEventListener\(\s*"click",\s*abrirSeguimientoPreview\s*\);'
                  nuevo='''  // B18: medicion de toques sin alterar el seguimiento.
            btnVerSeguimiento.addEventListener('pointerdown',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('ui.preview_pointerdown',0,0); } catch(_){}
            },{passive:true});
            btnVerSeguimiento.addEventListener('click',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('ui.preview_click',0,0); } catch(_){}
              abrirSeguimientoPreview();
            });'''
                  s=replace_pattern(s,anchor,nuevo,'boton ver seguimiento')
                  assert 'cliente-b18-diag.html?id=' in s,'Preview no apunta a B18'
          
              if page=='cliente':
                  s=replace_one(s,'parametros.get("preview") === "1"',
                      '(parametros.get("preview") === "1" || parametros.get("preview") === "tecnico")',
                      'preview tecnico SIN heartbeat publico')
                  # El usuario vuelve con el retroceso nativo: no crear botones extras.
                  for boton in ('btnVolverPanelPreview','btnVolverPanelPreviewFinal'):
                      rgx=r'('+re.escape(boton)+r'\.classList\.toggle\(\s*"visible",\s*)esPreviewTecnico(\s*\))'
                      s,n=re.subn(rgx,r'\g<1>false\2',s)
                      esperado=2 if boton=='btnVolverPanelPreviewFinal' else 1
                      if n!=esperado: raise SystemExit('B18 vista tecnica boton inesperado: '+boton+' ('+str(n)+')')
          
                  # R67 conserva geometria y map matching. Se optimiza solo la capa
                  # de descargas, cache, reconstruccion y precarga.
                  s=replace_one(s,'  const r67SectoresMemoria = new Map();', '''  const r67FallasSector = new Map();
            const r67ReintentoSectorMs = new Map();
            let r67PrecargaUltimoId = null;
            let r67PrecargaUltimaMs = 0;
            let r67ReconstruccionTimer = null;
            function r67ProgramarReconstruccion(){
              if(r67ReconstruccionTimer !== null) return;
              r67ReconstruccionTimer=setTimeout(function(){
                r67ReconstruccionTimer=null;
                r67ReconstruirSegmentosActivos();
              },90);
            }
            const r67SectoresMemoria = new Map();''','variables R67')
                  anchor=r'if\s*\(r67SectoresEnCurso\.has\(id\)\)\s*\{\s*return r67SectoresEnCurso\.get\(id\);\s*\}'
                  nuevo='''if(r67SectoresEnCurso.has(id)){
                return r67SectoresEnCurso.get(id);
              }
              // B18: evitar tormentas de solicitudes cartograficas fallidas.
              const reintento=r67ReintentoSectorMs.get(id)||0;
              if(Date.now()<reintento){
                try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('cart.r67_backoff_skipped',1,0); } catch(_){}
                return Promise.reject(new Error('R67 reintento diferido'));
              }'''
                  s=replace_pattern(s,anchor,nuevo,'backoff R67')
                  anchor=r'r67SectoresMemoria\.set\(id,dato\);\s*r67RecortarMemoria\(\);\s*r67ReconstruirSegmentosActivos\(\);\s*resolver\(dato\);'
                  nuevo='''r67SectoresMemoria.set(id,dato);
                  r67RecortarMemoria();
                  r67FallasSector.delete(id);
                  r67ReintentoSectorMs.delete(id);
                  r67ProgramarReconstruccion();
                  resolver(dato);'''
                  s=replace_pattern(s,anchor,nuevo,'reconstruccion por lotes')
                  anchor=r"}\s*catch\(error\)\s*\{\s*console\.warn\('R67 sector no disponible; continúa R65\.',id,error\);\s*rechazar\(error\);\s*throw error;"
                  nuevo='''}catch(error){
                  const fallas=Math.min(5,(r67FallasSector.get(id)||0)+1);
                  const esperas=[0,2000,5000,15000,30000,60000];
                  const demora=esperas[fallas];
                  r67FallasSector.set(id,fallas);
                  r67ReintentoSectorMs.set(id,Date.now()+demora);
                  if(r67FallasSector.size>70){
                    const oldest=r67FallasSector.keys().next().value;
                    r67FallasSector.delete(oldest);
                    r67ReintentoSectorMs.delete(oldest);
                  }
                  try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('cart.r67_backoff_ms',demora,1); } catch(_){}
                  console.warn('R67 temporalmente no disponible; continúa R65.',id,error);
                  rechazar(error);
                  throw error;'''
                  s=replace_pattern(s,anchor,nuevo,'R67 error controlado')
                  anchor=r'r67SectorActualId\s*=\s*idx\.id;\s*r67CargarSector\(idx\.x,idx\.y,true\)\.catch\(\(\)=>\{\}\);\s*r67ProgramarPrecarga\(lat,lon,idx\);'
                  nuevo='''if(document.visibilityState === 'hidden') return;
              r67SectorActualId = idx.id;
              r67CargarSector(idx.x,idx.y,true).catch(()=>{});
              const ahora=Date.now();
              if(idx.id!==r67PrecargaUltimoId || ahora-r67PrecargaUltimaMs>=12000){
                r67PrecargaUltimoId=idx.id;
                r67PrecargaUltimaMs=ahora;
                r67ProgramarPrecarga(lat,lon,idx);
              }'''
                  s=replace_pattern(s,anchor,nuevo,'precarga acotada')
                  assert "ENDPOINT_SECTOR:'/__r67/sector'" in s,'R67 endpoint inalterado requerido'
                  assert 'ajustarPuntoVisualR67(' in s,'R67 matching conservado'
                  assert 'r67BuscarCandidato(' in s,'R67 geometria conservada'
          
              # Identificador B18 para distinguir la caja negra sin crear tablas.
              marcador="""<script>
            window.addEventListener('load',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('build.b18_diag',1,0); } catch(_){}
            },{once:true});
            </script>
            </body>"""
              assert s.count('</body>')==1,'No se encontro cierre HTML de '+page
              s=s.replace('</body>',marcador,1)
              destino=root/(page+'-b18-diag.html')
              destino.write_text(s,encoding='utf-8')
              print('B18 nueva vista:',destino,len(s))
          
          gradle=native/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=replace_one(g,'applicationId "ar.com.pioca.seguimiento.diag"',
              'applicationId "ar.com.pioca.seguimiento.b18diag"','id independiente')
          g,n=re.subn(r'\bversionCode\s+\d+','versionCode 18',g,count=1)
          assert n==1,'versionCode no encontrado'
          g=replace_one(g,'versionName "0.17-DIAG"','versionName "0.18-DIAG-R67"','versionName')
          gradle.write_text(g,encoding='utf-8')
          
          main=native/'app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java'
          m=main.read_text(encoding='utf-8')
          for route in ('admin','index','cliente'):
              assert route+'-diag.html' in m,'Ruta Android diagnóstica faltante '+route
              m=m.replace(route+'-diag.html',route+'-b18-diag.html')
          
          # La vista DIAG corre en github.io y la API R67 real vive en
          # trackingpioca.com. Interceptamos SOLO ese endpoint en la APK
          # para devolverlo al JS como recurso same-origin, sin CORS.
          # El cliente publico sigue en el origen oficial e intacto.
          proxy='''new WebViewClient() {
                        @Override
                        public android.webkit.WebResourceResponse shouldInterceptRequest(
                                android.webkit.WebView view,
                                android.webkit.WebResourceRequest request) {
                            android.net.Uri url=request==null ? null : request.getUrl();
                            if (url==null || !"automatizacionpioca.github.io".equalsIgnoreCase(url.getHost())
                                    || !"/__r67/sector".equals(url.getPath())) {
                                return super.shouldInterceptRequest(view,request);
                            }
                            java.net.HttpURLConnection conn=null;
                            try {
                                String query=url.getEncodedQuery();
                                String target="https://trackingpioca.com/__r67/sector"
                                  +(query==null || query.isEmpty()?"":"?"+query);
                                conn=(java.net.HttpURLConnection)new java.net.URL(target).openConnection();
                                conn.setRequestMethod("GET");
                                conn.setConnectTimeout(4500);
                                conn.setReadTimeout(6500);
                                conn.setUseCaches(true);
                                conn.setRequestProperty("Accept","application/json");
                                int status=conn.getResponseCode();
                                java.io.InputStream stream=status>=200 && status<400
                                    ? conn.getInputStream():conn.getErrorStream();
                                if(stream==null) throw new java.io.IOException("Respuesta vacia");
                                java.io.ByteArrayOutputStream out=new java.io.ByteArrayOutputStream();
                                try(java.io.InputStream input=stream){
                                    byte[] buffer=new byte[8192];
                                    int count;
                                    while((count=input.read(buffer))!=-1){
                                        out.write(buffer,0,count);
                                        if(out.size()>8000000) throw new java.io.IOException("Sector demasiado grande");
                                    }
                                }
                                java.util.Map<String,String> headers=new java.util.HashMap<>();
                                headers.put("Content-Type","application/json; charset=utf-8");
                                headers.put("Cache-Control","private, max-age=300");
                                return new android.webkit.WebResourceResponse(
                                  "application/json","UTF-8",status,
                                  status==200?"OK":"Sector unavailable",headers,
                                  new java.io.ByteArrayInputStream(out.toByteArray()));
                            }catch(Exception ex){
                                android.util.Log.w("piOcaB18R67","Sector fallido: "+ex.getClass().getSimpleName());
                                java.util.Map<String,String> headers=new java.util.HashMap<>();
                                headers.put("Cache-Control","no-store");
                                return new android.webkit.WebResourceResponse(
                                    "application/json","UTF-8",503,"Sector unavailable",headers,
                                    new java.io.ByteArrayInputStream("{}".getBytes(java.nio.charset.StandardCharsets.UTF_8)));
                            }finally{
                                if(conn!=null) conn.disconnect();
                            }
                        }
          '''
          m=replace_one(m,'new WebViewClient() {',proxy,'R67 puente nativo WebView')
          # Reanudar WebView conservando estado; NUNCA recargar pagina por fuerza.
          m=replace_one(m,'''        super.onResume();''','''        super.onResume();
                  if(web!=null) web.onResume();''','reanudar WebView')
          # Agrega pausa del motor visual, independiente del TrackingService.
          coincidencias=list(re.finditer(r'(?m)^([ \t]*)@Override[ \t]*\n([ \t]*)protected void onResume\(\) \{',m))
          if len(coincidencias)!=1:
              raise SystemExit('Ciclo de vida B18 inesperado: no intervenir')
          hit=coincidencias[0]
          indent_a,indent_b=hit.group(1),hit.group(2)
          pausa=(indent_a+'@Override\n'+indent_b+'protected void onPause(){\n'
                 +indent_b+'    if(web!=null) web.onPause();\n'
                 +indent_b+'    super.onPause();\n'
                 +indent_b+'}\n\n')
          m=m[:hit.start()]+pausa+m[hit.start():]
          main.write_text(m,encoding='utf-8')
          
          service=native/'app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java'
          t=service.read_text(encoding='utf-8')
          for marker in ('onLocationChanged(', 'maybeLatchArrivalAndFinish(', 'LocationManager.GPS_PROVIDER'):
              assert marker in t,'TrackingService B17 no valido: '+marker
          assert (native/'app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java').is_file()
          assert 'client_tracking_heartbeat' in (root/'cliente-b18-diag.html').read_text(encoding='utf-8')
          print('B18: caja negra preservada; R67 optimizado con cartografia REAL; B17 intacta')
          PYB18

      - name: Validar JS de B18 y aislamiento de B17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYJS'
          from pathlib import Path
          import re,subprocess,tempfile
          for name in ('admin-b18-diag.html','index-b18-diag.html','cliente-b18-diag.html'):
              html=Path(name).read_text(encoding='utf-8')
              fragments=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              assert fragments,name+' sin JavaScript'
              for js in fragments:
                  if not js.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js') as f:
                      f.write(js);f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
              print('JS correcto:',name)
          assert 'preview=tecnico' in Path('index-b18-diag.html').read_text(encoding='utf-8')
          assert 'parametros.get("preview") === "tecnico"' in Path('cliente-b18-diag.html').read_text(encoding='utf-8')
          PYJS
          git diff --exit-code -- android-b17 index.html admin.html cliente.html
          grep -q 'applicationId "ar.com.pioca.seguimiento.b18diag"' android-b18-diag/app/build.gradle
          grep -q 'versionName "0.18-DIAG-R67"' android-b18-diag/app/build.gradle
          test -s android-b18-diag/app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java

      - name: Compilar APK B18-DIAG
        shell: bash
        working-directory: android-b18-diag
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Preparar archivo instalable
        shell: bash
        run: |
          set -euo pipefail
          cp android-b18-diag/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-B18-DIAG.apk
          test -s piOca-Seguimiento-B18-DIAG.apk

      - name: Publicar APK B18-DIAG
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-B18-DIAG
          path: piOca-Seguimiento-B18-DIAG.apk
          retention-days: 30

      - name: Publicar solo vistas B18 y fuentes diagnosticas para proximas compilaciones
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-b18-diag.html index-b18-diag.html cliente-b18-diag.html
          git add .github/scripts/b18_diag_base/build_diag.py
          git add .github/scripts/b18_diag_base/DiagnosticTelemetry.java
          git add .github/scripts/b18_diag_base/diag_web.js
          if ! git diff --cached --quiet; then
            git commit -m 'B18-DIAG: cartografia R67 optimizada, vista tecnica corregida y caja negra preservada'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo 'B18 publicada; B17 estable no fue modificada.'
