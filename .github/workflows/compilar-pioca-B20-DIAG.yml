name: piOca Seguimiento B20 - Diagnostico, carga rapida y vertices R67

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pioca-b20-diag
  cancel-in-progress: false

jobs:
  compilar-b20-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener fuentes del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node 22 para validar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruir fuentes B19 de forma aislada sin compilar B19
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pioca-b20-venv
          /tmp/pioca-b20-venv/bin/python -m pip install --disable-pip-version-check --quiet pyyaml
          /tmp/pioca-b20-venv/bin/python - <<'PY'
          from pathlib import Path
          import yaml, subprocess
          origen=Path('.github/workflows/compilar-pioca-B19-DIAG-CORREGIDO.yml')
          if not origen.is_file():
              raise SystemExit('Falta el workflow B19 original. No se cambia ninguna version.')
          cfg=yaml.safe_load(origen.read_text(encoding='utf-8'))
          trabajos=cfg['jobs']
          pasos=next(iter(trabajos.values()))['steps']
          requeridos=[
              'Construir base diagnostica desde fuentes conservadas por B18',
              'Aplicar optimizaciones B18 separadas sin tocar B17',
              'B19 - panel persistente, regreso instantaneo y diagnostico HTTP R67'
          ]
          for nombre in requeridos:
              coincidencias=[p for p in pasos if p.get('name')==nombre]
              if len(coincidencias)!=1 or not coincidencias[0].get('run'):
                  raise SystemExit('B20: etapa B19 no encontrada: '+nombre)
              print('Preparando base:',nombre,flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',coincidencias[0]['run']],check=True)
          for archivo in ('admin-b19-diag.html','index-b19-diag.html','cliente-b19-diag.html'):
              assert Path(archivo).is_file(),archivo
          assert Path('android-b19-diag').is_dir()
          print('Base B19 generada en el runner, no publicada ni modificada en main.')
          PY

      - name: Generar B20 con fallback R63 y caja negra intacta
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_b20.py
          test -s admin-b20-diag.html
          test -s index-b20-diag.html
          test -s cliente-b20-diag.html
          test -s android-b20-diag/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java
          git diff --exit-code -- android-b17 index.html cliente.html admin.html

      - name: Compilar APK B20 DIAG
        shell: bash
        working-directory: android-b20-diag
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Preparar APK y validar el resultado
        shell: bash
        run: |
          set -euo pipefail
          cp android-b20-diag/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-B20-DIAG.apk
          test -s piOca-Seguimiento-B20-DIAG.apk
          grep -q 'applicationId "ar.com.pioca.seguimiento.b20diag"' android-b20-diag/app/build.gradle
          grep -q 'b20.vertex_r67_used' cliente-b20-diag.html
          grep -q 'b20.vertex_r63_fallback' cliente-b20-diag.html
          grep -q 'b20.share_total_ms' admin-b20-diag.html

      - name: Publicar APK B20 independiente
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-B20-DIAG
          path: piOca-Seguimiento-B20-DIAG.apk
          retention-days: 30

      - name: Publicar solamente las tres vistas B20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-b20-diag.html index-b20-diag.html cliente-b20-diag.html
          if ! git diff --cached --quiet; then
            git commit -m 'B20 DIAG: vertices R67 prioritarios, inicio rapido Maps y caja negra'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo 'B20 publicada; B17/B19 y cliente publico sin cambios.'
