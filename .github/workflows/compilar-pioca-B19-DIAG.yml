name: piOca Seguimiento B19 - DIAGNOSTICO WEBVIEW Y R67

# B19: genera sus propios HTML/APK desde B17 estable y la base diagnostica
# preservada por B18. No depende del workflow B17-DIAG eliminado.
# El GPS nativo, las formulas de ETA y los HTML de produccion permanecen intactos.
# Solo modifica B19: panel persistente con Preview superpuesto y trazas R67.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pioca-b19-diag-webview-r67
  cancel-in-progress: false

jobs:
  compilar-b19-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener B17 estable sin modificaciones
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node 22 para validar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir base diagnostica desde fuentes conservadas por B18
        shell: bash
        run: |
          set -euo pipefail
          for f in build_diag.py DiagnosticTelemetry.java diag_web.js; do
            test -s ".github/scripts/b18_diag_base/$f" || {
              echo "ERROR: falta fuente diagnostica $f guardada por B18" >&2
              exit 1
            }
          done
          python3 .github/scripts/b18_diag_base/build_diag.py
          test -s android-b17-diag/app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java
          test -s admin-diag.html
          test -s index-diag.html
          test -s cliente-diag.html

      - name: Aplicar optimizaciones B18 separadas sin tocar B17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYB18'
          from pathlib import Path
          import shutil,re,hashlib
          root=Path('.')
          b17=root/'android-b17'
          diag=root/'android-b17-diag'
          native=root/'android-b18-diag'
          assert b17.is_dir() and diag.is_dir(),'B17 base diagnostica ausente'
          if native.exists(): shutil.rmtree(native)
          shutil.copytree(diag,native)
          
          def replace_one(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit('B18 ancla '+label+' coincidencias='+str(n))
              return text.replace(old,new,1)
          
          def replace_pattern(text,pattern,new,label):
              matches=list(re.finditer(pattern,text,re.M))
              if len(matches)!=1:
                  raise SystemExit('B18 patron '+label+' coincidencias='+str(len(matches)))
              hit=matches[0]
              return text[:hit.start()]+new+text[hit.end():]
          
          for page in ('admin','index','cliente'):
              src=root/(page+'-diag.html')
              s=src.read_text(encoding='utf-8')
              for route in ('admin','index','cliente'):
                  s=s.replace(route+'-diag.html',route+'-b18-diag.html')
          
              if page=='index':
                  # Medir si el click llega al JS antes de intentar navegar.
                  anchor=r'btnVerSeguimiento\.addEventListener\(\s*"click",\s*abrirSeguimientoPreview\s*\);'
                  nuevo='''  // B18: medicion de toques sin alterar el seguimiento.
            btnVerSeguimiento.addEventListener('pointerdown',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('ui.preview_pointerdown',0,0); } catch(_){}
            },{passive:true});
            btnVerSeguimiento.addEventListener('click',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('ui.preview_click',0,0); } catch(_){}
              abrirSeguimientoPreview();
            });'''
                  s=replace_pattern(s,anchor,nuevo,'boton ver seguimiento')
                  assert 'cliente-b18-diag.html?id=' in s,'Preview no apunta a B18'
          
              if page=='cliente':
                  s=replace_one(s,'parametros.get("preview") === "1"',
                      '(parametros.get("preview") === "1" || parametros.get("preview") === "tecnico")',
                      'preview tecnico SIN heartbeat publico')
                  # El usuario vuelve con el retroceso nativo: no crear botones extras.
                  for boton in ('btnVolverPanelPreview','btnVolverPanelPreviewFinal'):
                      rgx=r'('+re.escape(boton)+r'\.classList\.toggle\(\s*"visible",\s*)esPreviewTecnico(\s*\))'
                      s,n=re.subn(rgx,r'\g<1>false\2',s)
                      esperado=2 if boton=='btnVolverPanelPreviewFinal' else 1
                      if n!=esperado: raise SystemExit('B18 vista tecnica boton inesperado: '+boton+' ('+str(n)+')')
          
                  # R67 conserva geometria y map matching. Se optimiza solo la capa
                  # de descargas, cache, reconstruccion y precarga.
                  s=replace_one(s,'  const r67SectoresMemoria = new Map();', '''  const r67FallasSector = new Map();
            const r67ReintentoSectorMs = new Map();
            let r67PrecargaUltimoId = null;
            let r67PrecargaUltimaMs = 0;
            let r67ReconstruccionTimer = null;
            function r67ProgramarReconstruccion(){
              if(r67ReconstruccionTimer !== null) return;
              r67ReconstruccionTimer=setTimeout(function(){
                r67ReconstruccionTimer=null;
                r67ReconstruirSegmentosActivos();
              },90);
            }
            const r67SectoresMemoria = new Map();''','variables R67')
                  anchor=r'if\s*\(r67SectoresEnCurso\.has\(id\)\)\s*\{\s*return r67SectoresEnCurso\.get\(id\);\s*\}'
                  nuevo='''if(r67SectoresEnCurso.has(id)){
                return r67SectoresEnCurso.get(id);
              }
              // B18: evitar tormentas de solicitudes cartograficas fallidas.
              const reintento=r67ReintentoSectorMs.get(id)||0;
              if(Date.now()<reintento){
                try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('cart.r67_backoff_skipped',1,0); } catch(_){}
                return Promise.reject(new Error('R67 reintento diferido'));
              }'''
                  s=replace_pattern(s,anchor,nuevo,'backoff R67')
                  anchor=r'r67SectoresMemoria\.set\(id,dato\);\s*r67RecortarMemoria\(\);\s*r67ReconstruirSegmentosActivos\(\);\s*resolver\(dato\);'
                  nuevo='''r67SectoresMemoria.set(id,dato);
                  r67RecortarMemoria();
                  r67FallasSector.delete(id);
                  r67ReintentoSectorMs.delete(id);
                  r67ProgramarReconstruccion();
                  resolver(dato);'''
                  s=replace_pattern(s,anchor,nuevo,'reconstruccion por lotes')
                  anchor=r"}\s*catch\(error\)\s*\{\s*console\.warn\('R67 sector no disponible; continúa R65\.',id,error\);\s*rechazar\(error\);\s*throw error;"
                  nuevo='''}catch(error){
                  const fallas=Math.min(5,(r67FallasSector.get(id)||0)+1);
                  const esperas=[0,2000,5000,15000,30000,60000];
                  const demora=esperas[fallas];
                  r67FallasSector.set(id,fallas);
                  r67ReintentoSectorMs.set(id,Date.now()+demora);
                  if(r67FallasSector.size>70){
                    const oldest=r67FallasSector.keys().next().value;
                    r67FallasSector.delete(oldest);
                    r67ReintentoSectorMs.delete(oldest);
                  }
                  try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('cart.r67_backoff_ms',demora,1); } catch(_){}
                  console.warn('R67 temporalmente no disponible; continúa R65.',id,error);
                  rechazar(error);
                  throw error;'''
                  s=replace_pattern(s,anchor,nuevo,'R67 error controlado')
                  anchor=r'r67SectorActualId\s*=\s*idx\.id;\s*r67CargarSector\(idx\.x,idx\.y,true\)\.catch\(\(\)=>\{\}\);\s*r67ProgramarPrecarga\(lat,lon,idx\);'
                  nuevo='''if(document.visibilityState === 'hidden') return;
              r67SectorActualId = idx.id;
              r67CargarSector(idx.x,idx.y,true).catch(()=>{});
              const ahora=Date.now();
              if(idx.id!==r67PrecargaUltimoId || ahora-r67PrecargaUltimaMs>=12000){
                r67PrecargaUltimoId=idx.id;
                r67PrecargaUltimaMs=ahora;
                r67ProgramarPrecarga(lat,lon,idx);
              }'''
                  s=replace_pattern(s,anchor,nuevo,'precarga acotada')
                  assert "ENDPOINT_SECTOR:'/__r67/sector'" in s,'R67 endpoint inalterado requerido'
                  assert 'ajustarPuntoVisualR67(' in s,'R67 matching conservado'
                  assert 'r67BuscarCandidato(' in s,'R67 geometria conservada'
          
              # Identificador B18 para distinguir la caja negra sin crear tablas.
              marcador="""<script>
            window.addEventListener('load',function(){
              try { if(window.__piocaDiagMetric) window.__piocaDiagMetric('build.b18_diag',1,0); } catch(_){}
            },{once:true});
            </script>
            </body>"""
              assert s.count('</body>')==1,'No se encontro cierre HTML de '+page
              s=s.replace('</body>',marcador,1)
              destino=root/(page+'-b18-diag.html')
              destino.write_text(s,encoding='utf-8')
              print('B18 nueva vista:',destino,len(s))
          
          gradle=native/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=replace_one(g,'applicationId "ar.com.pioca.seguimiento.diag"',
              'applicationId "ar.com.pioca.seguimiento.b18diag"','id independiente')
          g,n=re.subn(r'\bversionCode\s+\d+','versionCode 18',g,count=1)
          assert n==1,'versionCode no encontrado'
          g=replace_one(g,'versionName "0.17-DIAG"','versionName "0.18-DIAG-R67"','versionName')
          gradle.write_text(g,encoding='utf-8')
          
          main=native/'app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java'
          m=main.read_text(encoding='utf-8')
          for route in ('admin','index','cliente'):
              assert route+'-diag.html' in m,'Ruta Android diagnóstica faltante '+route
              m=m.replace(route+'-diag.html',route+'-b18-diag.html')
          
          # La vista DIAG corre en github.io y la API R67 real vive en
          # trackingpioca.com. Interceptamos SOLO ese endpoint en la APK
          # para devolverlo al JS como recurso same-origin, sin CORS.
          # El cliente publico sigue en el origen oficial e intacto.
          proxy='''new WebViewClient() {
                        @Override
                        public android.webkit.WebResourceResponse shouldInterceptRequest(
                                android.webkit.WebView view,
                                android.webkit.WebResourceRequest request) {
                            android.net.Uri url=request==null ? null : request.getUrl();
                            if (url==null || !"automatizacionpioca.github.io".equalsIgnoreCase(url.getHost())
                                    || !"/__r67/sector".equals(url.getPath())) {
                                return super.shouldInterceptRequest(view,request);
                            }
                            java.net.HttpURLConnection conn=null;
                            try {
                                String query=url.getEncodedQuery();
                                String target="https://trackingpioca.com/__r67/sector"
                                  +(query==null || query.isEmpty()?"":"?"+query);
                                conn=(java.net.HttpURLConnection)new java.net.URL(target).openConnection();
                                conn.setRequestMethod("GET");
                                conn.setConnectTimeout(4500);
                                conn.setReadTimeout(6500);
                                conn.setUseCaches(true);
                                conn.setRequestProperty("Accept","application/json");
                                int status=conn.getResponseCode();
                                java.io.InputStream stream=status>=200 && status<400
                                    ? conn.getInputStream():conn.getErrorStream();
                                if(stream==null) throw new java.io.IOException("Respuesta vacia");
                                java.io.ByteArrayOutputStream out=new java.io.ByteArrayOutputStream();
                                try(java.io.InputStream input=stream){
                                    byte[] buffer=new byte[8192];
                                    int count;
                                    while((count=input.read(buffer))!=-1){
                                        out.write(buffer,0,count);
                                        if(out.size()>8000000) throw new java.io.IOException("Sector demasiado grande");
                                    }
                                }
                                java.util.Map<String,String> headers=new java.util.HashMap<>();
                                headers.put("Content-Type","application/json; charset=utf-8");
                                headers.put("Cache-Control","private, max-age=300");
                                return new android.webkit.WebResourceResponse(
                                  "application/json","UTF-8",status,
                                  status==200?"OK":"Sector unavailable",headers,
                                  new java.io.ByteArrayInputStream(out.toByteArray()));
                            }catch(Exception ex){
                                android.util.Log.w("piOcaB18R67","Sector fallido: "+ex.getClass().getSimpleName());
                                java.util.Map<String,String> headers=new java.util.HashMap<>();
                                headers.put("Cache-Control","no-store");
                                return new android.webkit.WebResourceResponse(
                                    "application/json","UTF-8",503,"Sector unavailable",headers,
                                    new java.io.ByteArrayInputStream("{}".getBytes(java.nio.charset.StandardCharsets.UTF_8)));
                            }finally{
                                if(conn!=null) conn.disconnect();
                            }
                        }
          '''
          m=replace_one(m,'new WebViewClient() {',proxy,'R67 puente nativo WebView')
          # Reanudar WebView conservando estado; NUNCA recargar pagina por fuerza.
          m=replace_one(m,'''        super.onResume();''','''        super.onResume();
                  if(web!=null) web.onResume();''','reanudar WebView')
          # Agrega pausa del motor visual, independiente del TrackingService.
          coincidencias=list(re.finditer(r'(?m)^([ \t]*)@Override[ \t]*\n([ \t]*)protected void onResume\(\) \{',m))
          if len(coincidencias)!=1:
              raise SystemExit('Ciclo de vida B18 inesperado: no intervenir')
          hit=coincidencias[0]
          indent_a,indent_b=hit.group(1),hit.group(2)
          pausa=(indent_a+'@Override\n'+indent_b+'protected void onPause(){\n'
                 +indent_b+'    if(web!=null) web.onPause();\n'
                 +indent_b+'    super.onPause();\n'
                 +indent_b+'}\n\n')
          m=m[:hit.start()]+pausa+m[hit.start():]
          main.write_text(m,encoding='utf-8')
          
          service=native/'app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java'
          t=service.read_text(encoding='utf-8')
          for marker in ('onLocationChanged(', 'maybeLatchArrivalAndFinish(', 'LocationManager.GPS_PROVIDER'):
              assert marker in t,'TrackingService B17 no valido: '+marker
          assert (native/'app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java').is_file()
          assert 'client_tracking_heartbeat' in (root/'cliente-b18-diag.html').read_text(encoding='utf-8')
          print('B18: caja negra preservada; R67 optimizado con cartografia REAL; B17 intacta')
          PYB18

      - name: B19 - panel persistente, regreso instantaneo y diagnostico HTTP R67
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYB19'
          from pathlib import Path
          import re,shutil,hashlib
          root=Path('.')
          original=root/'android-b18-diag'
          native=root/'android-b19-diag'
          if native.exists(): shutil.rmtree(native)
          assert original.is_dir(), 'No se genero la base B18 a partir de B17 estable'
          shutil.copytree(original,native)

          def one(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit('B19 ancla '+label+' coincidencias='+str(n))
              return s.replace(old,new,1)

          def rx_one(s,pattern,new,label):
              out,n=re.subn(pattern,new,s,count=1,flags=re.M)
              if n!=1: raise SystemExit('B19 patron '+label+' coincidencias='+str(n))
              return out

          # El panel deja de navegar a otra pagina para abrir el Preview.
          # Un iframe en el mismo origen y una entrada pushState permiten que
          # el boton fisico ATRAS cierre el Preview sin recargar el panel.
          overlay_js=r"""
            // B19: panel persistente. El GPS Android continua independiente.
            let piocaB19PreviewActivo=false;
            let piocaB19PreviewMarco=null;
            window.piocaB19PreviewAbierto=false;
            function piocaB19Metrica(nombre,valor,fallo){
              try{if(window.__piocaDiagMetric)window.__piocaDiagMetric(nombre,valor,fallo?1:0)}catch(_){}
            }
            function piocaB19CerrarPreview(){
              if(!piocaB19PreviewActivo)return;
              const inicio=performance.now();
              piocaB19PreviewActivo=false;
              window.piocaB19PreviewAbierto=false;
              if(piocaB19PreviewMarco){
                piocaB19PreviewMarco.remove();
                piocaB19PreviewMarco=null;
              }
              try{sessionStorage.removeItem('pioca_preview_retorno_panel')}catch(_){}
              piocaB19Metrica('ui.preview_close_ms',performance.now()-inicio,false);
              // Sin navegar ni solicitar una reconstruccion del documento.
              setTimeout(function(){
                try{Promise.resolve(sincronizarServidor()).catch(function(){})}catch(_){}
              },0);
            }
            function piocaB19AbrirPreview(urlPreview){
              if(piocaB19PreviewActivo){
                piocaB19Metrica('ui.preview_double_tap_guard',1,false);
                return;
              }
              const t0=performance.now();
              piocaB19PreviewActivo=true;
              window.piocaB19PreviewAbierto=true;
              const capa=document.createElement('div');
              capa.id='piocaB19PreviewOverlay';
              capa.style.cssText='position:fixed;inset:0;z-index:2147483640;background:#0d1117;display:block;overflow:hidden';
              const esperando=document.createElement('div');
              esperando.style.cssText='position:absolute;top:43%;width:100%;text-align:center;color:#f4f5f6;font:600 16px system-ui,sans-serif;pointer-events:none';
              esperando.textContent='ABRIENDO SEGUIMIENTO...';
              const marco=document.createElement('iframe');
              marco.title='Preview tecnico piOca B19';
              marco.setAttribute('allow','geolocation');
              marco.setAttribute('loading','eager');
              marco.style.cssText='width:100%;height:100%;border:0;display:block;background:transparent';
              marco.addEventListener('load',function(){
                piocaB19Metrica('ui.preview_iframe_load_ms',performance.now()-t0,false);
                esperando.remove();
              },{once:true});
              marco.addEventListener('error',function(){
                piocaB19Metrica('ui.preview_iframe_error',1,true);
                esperando.textContent='No se pudo abrir el mapa';
              },{once:true});
              marco.src=urlPreview;
              capa.appendChild(marco);
              capa.appendChild(esperando);
              document.body.appendChild(capa);
              piocaB19PreviewMarco=capa;
              try{history.pushState({piocaB19Preview:true},'',location.href)}
              catch(e){piocaB19Metrica('ui.preview_history_error',1,true)}
              piocaB19Metrica('ui.preview_overlay_open_ms',performance.now()-t0,false);
              setTimeout(function(){
                if(piocaB19PreviewActivo && esperando.parentNode){
                  piocaB19Metrica('ui.preview_iframe_slow_8s',8000,true);
                }
              },8000);
            }
            window.addEventListener('popstate',function(){
              if(piocaB19PreviewActivo)piocaB19CerrarPreview();
            });
          """

          for page in ('admin','index','cliente'):
              input_file=root/(page+'-b18-diag.html')
              assert input_file.is_file(),str(input_file)
              s=input_file.read_text('utf-8')
              for route in ('admin','index','cliente'):
                  s=s.replace(route+'-b18-diag.html',route+'-b19-diag.html')
              if page=='index':
                  s=one(s,'  function abrirSeguimientoPreview(){',
                        overlay_js+'\n  function abrirSeguimientoPreview(){',
                        'colocar visor persistente')
                  s=rx_one(s,r'window\.location\.href\s*=\s*urlPreview\s*;',
                          'piocaB19AbrirPreview(urlPreview);',
                          'Preview sin navegacion principal')
                  s=one(s,'if(document.visibilityState === "visible") sincronizarServidor();',
                        'if(document.visibilityState === "visible" && !window.piocaB19PreviewAbierto) sincronizarServidor();',
                        'detener consultas redundantes detras de Preview')
                  s=one(s,'\'build.b18_diag\'','\'build.b19_diag\'',
                        'etiqueta caja negra B19')
                  s=one(s,'          document.visibilityState ===\n            "visible"\n        ){\n          pintarHoraCliente();',
                        '          document.visibilityState ===\n            "visible" &&\n          !window.piocaB19PreviewAbierto\n        ){\n          pintarHoraCliente();',
                        'reloj panel en pausa mientras Preview activo')
                  assert s.count('piocaB19AbrirPreview(urlPreview);')==1
                  assert s.count('history.pushState({piocaB19Preview:true}')==1
              if page=='cliente':
                  s=one(s,'const payload = await respuesta.json();',
                        'const payload = await respuesta.json().catch(function(err){'+
                        'try{if(window.__piocaDiagMetric)window.__piocaDiagMetric("cart.r67_json_parse_error",1,1)}catch(_){};'+
                        'throw err;});',
                        'identificar JSON R67 invalido')
                  s=one(s,"throw new Error('sector '+id+' sin geometría');",
                        "try{if(window.__piocaDiagMetric)window.__piocaDiagMetric('cart.r67_empty_geometry',1,1)}catch(_){};"+
                        "throw new Error('sector '+id+' sin geometría');",
                        'identificar geometria R67 vacia')
              (root/(page+'-b19-diag.html')).write_text(s,encoding='utf-8')
              print('B19 vista creada:',page,len(s))

          gradle=native/'app/build.gradle'
          g=gradle.read_text('utf-8')
          g=one(g,'applicationId "ar.com.pioca.seguimiento.b18diag"',
                'applicationId "ar.com.pioca.seguimiento.b19diag"','APK independiente')
          g=one(g,'versionName "0.18-DIAG-R67"',
                'versionName "0.19-DIAG-WEBVIEW-R67"','versionName')
          g=rx_one(g,r'\bversionCode\s+18\b','versionCode 19','versionCode')
          gradle.write_text(g,encoding='utf-8')

          manifest=native/'app/src/main/AndroidManifest.xml'
          x=manifest.read_text('utf-8')
          x=one(x,'android:label="piOca Seguimiento DIAG"',
                'android:label="piOca Seguimiento B19 DIAG"',
                'etiqueta APK B19')
          manifest.write_text(x,encoding='utf-8')

          main=native/'app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java'
          m=main.read_text('utf-8')
          for route in ('admin','index','cliente'):
              assert route+'-b18-diag.html' in m,'Falta ruta nativa B18 '+route
              m=m.replace(route+'-b18-diag.html',route+'-b19-diag.html')

          # En B18 se introdujo web.onPause/onResume. B19 recupera el ciclo
          # de vida B17 estable para aislar su posible efecto tras desbloquear.
          m=one(m,'if(web!=null) web.onResume();','/* B19: usar recuperacion Android nativa B17 */',
                'eliminar reanudacion WebView B18')
          m,n=re.subn(r'(?m)^\s*@Override\s*\n\s*protected void onPause\(\)\{\s*\n\s*if\(web!=null\) web\.onPause\(\);\s*\n\s*super\.onPause\(\);\s*\n\s*\}\s*\n',
                      '\n',m,count=1)
          if n!=1:raise SystemExit('B19 onPause B18 no hallado para revertir')

          # Trazar la fase exacta de la navegacion principal y su watchdog.
          m=one(m,'private void beginWebNavigation(String url) {',
             'private void beginWebNavigation(String url) {\n                  DiagnosticTelemetry.record("nav.main_start",0,false);',
             'inicio navegacion')
          m=one(m,'private void showWebRecovery(String reason) {',
             'private void showWebRecovery(String reason) {\n                  DiagnosticTelemetry.record("nav.recovery_dialog_ms",Math.min(120000,android.os.SystemClock.elapsedRealtime()-loadStartedAt),true);',
             'aviso recuperacion')
          m=one(m,'public void onBackPressed() {',
             'public void onBackPressed() {\n        DiagnosticTelemetry.record("nav.android_back",0,false);',
             'retroceso Android')

          # El proxy B18 no informa por que R67 falla. B19 SI registra
          # codigo HTTP, tipo de transporte y duracion sin recolectar URL,
          # coordenadas, informacion personal o contenido de respuesta.
          m=one(m,'java.net.HttpURLConnection conn=null;',
             'long b19R67Inicio=android.os.SystemClock.elapsedRealtime();\n                            java.net.HttpURLConnection conn=null;',
             'inicio puente R67')
          m=one(m,'int status=conn.getResponseCode();',
             'int status=conn.getResponseCode();\n                                DiagnosticTelemetry.record("cart.r67_native_http_code",status,status!=200);',
             'codigo respuesta sector')
          m=one(m,'java.io.InputStream stream=status>=200 && status<400',
             """String contentType=conn.getContentType();
                                if(status==200 && contentType!=null && !contentType.toLowerCase(java.util.Locale.ROOT).contains("json"))
                                  DiagnosticTelemetry.record("cart.r67_native_content_type",1,true);
                                java.io.InputStream stream=status>=200 && status<400""",
             'distinguir respuesta no JSON R67')
          m=one(m,'}catch(Exception ex){\n                                android.util.Log.w("piOcaB18R67"',
             """}catch(Exception ex){
                                if(ex instanceof java.net.SocketTimeoutException)
                                  DiagnosticTelemetry.record("cart.r67_native_timeout",1,true);
                                else if(ex instanceof java.net.UnknownHostException)
                                  DiagnosticTelemetry.record("cart.r67_native_dns_error",1,true);
                                else if(ex instanceof javax.net.ssl.SSLException)
                                  DiagnosticTelemetry.record("cart.r67_native_tls_error",1,true);
                                else
                                  DiagnosticTelemetry.record("cart.r67_native_transport_error",1,true);
                                android.util.Log.w("piOcaB19R67" """,
             'clasificar fallo del puente R67')
          m=one(m,'if(conn!=null) conn.disconnect();',
              """DiagnosticTelemetry.record("cart.r67_native_elapsed_ms",
                                  Math.min(120000,android.os.SystemClock.elapsedRealtime()-b19R67Inicio),false);
                                if(conn!=null) conn.disconnect();""",
              'tiempo de conexion R67')
          main.write_text(m,encoding='utf-8')

          # Verificar que todas las mejoras sean exclusivas de B19.
          stable=root/'android-b17/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java'
          actual=native/'app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java'
          assert stable.is_file() and actual.is_file()
          assert 'onLocationChanged(' in actual.read_text('utf-8')
          assert 'maybeLatchArrivalAndFinish(' in actual.read_text('utf-8')
          assert 'DiagnosticTelemetry.gps(' in actual.read_text('utf-8')
          assert (root/'cliente-b19-diag.html').read_text('utf-8').count('esPreviewTecnico')>2
          assert 'window.piocaB19PreviewAbierto' in (root/'index-b19-diag.html').read_text('utf-8')
          print('B19: panel persistente, retroceso sin recarga principal, clasificacion R67 y caja negra ampliada')
          PYB19

      - name: B19 - validar fuentes, JavaScript y aislamiento de produccion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYB19CHECK'
          from pathlib import Path
          import re,subprocess,tempfile
          for name in ('admin-b19-diag.html','index-b19-diag.html','cliente-b19-diag.html'):
              s=Path(name).read_text('utf-8')
              scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S)
              if not scripts: raise SystemExit('Falta JavaScript en '+name)
              for script in scripts:
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js') as f:
                      f.write(script); f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
              print('Validacion JS exitosa:',name)
          panel=Path('index-b19-diag.html').read_text('utf-8')
          client=Path('cliente-b19-diag.html').read_text('utf-8')
          native=Path('android-b19-diag/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java').read_text('utf-8')
          assert 'piocaB19AbrirPreview(urlPreview);' in panel
          assert 'history.pushState({piocaB19Preview:true}' in panel
          assert 'window.addEventListener(\'popstate\'' in panel
          assert 'preview=tecnico' in panel
          assert 'parametros.get("preview") === "tecnico"' in client
          assert 'cart.r67_native_http_code' in native
          assert 'if(web!=null) web.onPause();' not in native
          assert 'if(web!=null) web.onResume();' not in native
          assert 'new WebViewClient() {' in native
          PYB19CHECK
          git diff --exit-code -- android-b17 index.html cliente.html admin.html
          grep -q 'applicationId "ar.com.pioca.seguimiento.b19diag"' android-b19-diag/app/build.gradle
          grep -q 'versionName "0.19-DIAG-WEBVIEW-R67"' android-b19-diag/app/build.gradle
          test -s android-b19-diag/app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java

      - name: Validar JS de B18 y aislamiento de B17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYJS'
          from pathlib import Path
          import re,subprocess,tempfile
          for name in ('admin-b18-diag.html','index-b18-diag.html','cliente-b18-diag.html'):
              html=Path(name).read_text(encoding='utf-8')
              fragments=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              assert fragments,name+' sin JavaScript'
              for js in fragments:
                  if not js.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js') as f:
                      f.write(js);f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
              print('JS correcto:',name)
          assert 'preview=tecnico' in Path('index-b18-diag.html').read_text(encoding='utf-8')
          assert 'parametros.get("preview") === "tecnico"' in Path('cliente-b18-diag.html').read_text(encoding='utf-8')
          PYJS
          git diff --exit-code -- android-b17 index.html admin.html cliente.html
          grep -q 'applicationId "ar.com.pioca.seguimiento.b18diag"' android-b18-diag/app/build.gradle
          grep -q 'versionName "0.18-DIAG-R67"' android-b18-diag/app/build.gradle
          test -s android-b18-diag/app/src/main/java/ar/com/pioca/seguimiento/DiagnosticTelemetry.java

      - name: Compilar APK B19-DIAG
        shell: bash
        working-directory: android-b19-diag
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Preparar archivo instalable
        shell: bash
        run: |
          set -euo pipefail
          cp android-b19-diag/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-B19-DIAG.apk
          test -s piOca-Seguimiento-B19-DIAG.apk

      - name: Publicar APK B19-DIAG
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-B19-DIAG
          path: piOca-Seguimiento-B19-DIAG.apk
          retention-days: 30

      - name: Publicar solo vistas B19 independientes sin modificar produccion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-b19-diag.html index-b19-diag.html cliente-b19-diag.html
          if ! git diff --cached --quiet; then
            git commit -m 'B19-DIAG: panel persistente, diagnostico HTTP R67, sin tocar B17'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo 'B19 publicada; B17 estable y HTML de clientes no fueron modificados.'
