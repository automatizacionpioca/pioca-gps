name: piOca Seguimiento B17 - INTEGRAL

# B17 no depende de los workflows ni scripts históricos después de la
# primera ejecución satisfactoria: compila directamente android-b17/.
# La migración inicial usa una copia congelada y comprobada de B16.

on:
  workflow_dispatch:
    inputs:
      optimizar_paginas_web:
        description: 'Optimizar consultas del panel web (solo después de comprobar la APK)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pioca-b17-consolidado
  cancel-in-progress: false

jobs:
  compilar-b17:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Obtener repositorio y su historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Instalar Node para verificar scripts del panel
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Consolidar fuente nativa SOLO si aun no existe
        shell: bash
        env:
          # SHA verificado del repositorio de origen B16 el 04/11/2026.
          BASE_B16: a2c06ad7a9455b2623271808764ea25af456ae56
        run: |
          set -euo pipefail
          if test -f android-b17/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java && \
             test -f android-b17/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java && \
             test -f android-b17/app/build.gradle; then
            echo 'FUENTE B17 CONSOLIDADA: compilar sin usar parches ni scripts anteriores.'
            echo 'false' > /tmp/pioca-b17-migrado
            exit 0
          fi

          if test -e android-b17; then
            echo 'ERROR: android-b17 incompleto. No se sobrescribe; revisar el repositorio.' >&2
            exit 1
          fi

          echo 'PRIMERA COMPILACION: convertir una sola vez B16 verificada a codigo nativo B17.'
          mkdir -p /tmp/pioca-b17-origen
          git cat-file -e "${BASE_B16}^{commit}"
          git archive "${BASE_B16}" | tar -x -C /tmp/pioca-b17-origen

          cd /tmp/pioca-b17-origen
          python3 -m pip install --quiet pyyaml

          # Ejecuta la composición B15 histórica una única vez para obtener
          # el Android nativo final, SIN cambiar sus algoritmos de tracking.
          python3 .github/scripts/pioca_b16_ejecutar_base.py

          # Recupera la capa B16 exacta desde el generador original, sin
          # modificar ni publicar ninguno de los HTML de produccion.
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          import pioca_seguimiento_B16_fluidez_builder as b16
          Path('/tmp/pioca-b16-webview.py').write_text(
              b16.native_builder(), encoding='utf-8'
          )
          PY
          python3 /tmp/pioca-b16-webview.py

          # B17: consolidar el Android B16 sin alterar el motor GPS.
          # La unica mejora nativa es restaurar el controlador activo al recrearse la pantalla.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('android-pioca')
          main=root/'app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java'
          service=root/'app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java'
          gradle=root/'app/build.gradle'
          s=main.read_text(encoding='utf-8')
          svc_b16_sha=hashlib.sha256(service.read_bytes()).hexdigest()
          gps_fallback_b16=s.count('PiocaNative.startTracking(')
          if gps_fallback_b16!=1: raise SystemExit('B17: inicio GPS B16 inesperado')
          def one(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit('B17: ancla '+label+'='+str(s.count(old)))
              s=s.replace(old,new,1)
          one('private WebView web;', '''private WebView web;
                        // URL del panel/preview para que un reinicio de Activity no vuelva a cero.
                        private String ultimaPaginaPioca=ADMIN;
                        private boolean paginaPioca(String url){
                            if(url==null)return false;
                            return url.startsWith("https://automatizacionpioca.github.io/pioca-gps/admin.html")
                                || url.startsWith("https://automatizacionpioca.github.io/pioca-gps/index.html")
                                || url.startsWith("https://automatizacionpioca.github.io/pioca-gps/cliente.html")
                                || url.startsWith("https://trackingpioca.com/");
                        }''', 'remember URL')
          one('if (view == web) beginWebNavigation(url);', '''if(view == web){
                                        if(paginaPioca(url))ultimaPaginaPioca=url;
                                        beginWebNavigation(url);
                                    }''', 'page started')
          import re
          s,n=re.subn(r'web\.loadUrl\(\s*ADMIN\s*\);', '''String paginaGuardada=state==null ? null : state.getString("pioca_url_actual");
                            if(paginaPioca(paginaGuardada)) ultimaPaginaPioca=paginaGuardada;
                            web.loadUrl(ultimaPaginaPioca);''', s,count=1)
          if n!=1: raise SystemExit('B17: carga inicial B16 inesperada')
          one('protected void onResume() {', '''protected void onSaveInstanceState(Bundle state){
                            state.putString("pioca_url_actual", ultimaPaginaPioca);
                            super.onSaveInstanceState(state);
                        }
          
                        @Override
                        protected void onResume() {''', 'save state')
          # En B16 un crash del renderizador ofrece "SEGUIR ESPERANDO" aun
          # cuando web=null (pantalla irrecuperable). B17 ofrece RECUPERAR.
          one('loadDialogVisible = true;\n                  new AlertDialog.Builder(this)',
              """loadDialogVisible = true;
                   if (web == null) {
                       new AlertDialog.Builder(this)
                           .setTitle("piOca Seguimiento")
                           .setMessage("Android cerró la pantalla del seguimiento. El GPS nativo continúa funcionando. Reabrí el panel.")
                           .setCancelable(false)
                           .setPositiveButton("RECUPERAR", (d,which) -> {
                               loadDialogVisible=false;
                               recreate();
                           }).show();
                       return;
                   }
                   new AlertDialog.Builder(this)""", 'recuperar renderer sin WebView')
          # No borrar, sustituir ni modificar onPageFinished, bridge ni backend.
          assert s.count('PiocaNative.startTracking(')==gps_fallback_b16
          for mark in ('onRenderProcessGone(', 'startForegroundService(', 'onPageFinished(', 'PiocaNative.startTracking('):
              if mark not in s: raise SystemExit('B17: falta lógica heredada '+mark)
          main.write_text(s,encoding='utf-8')
          g=gradle.read_text(encoding='utf-8')
          if g.count('versionCode 16')!=1 or g.count('versionName "0.16-estabilidad-webview"')!=1:
              raise SystemExit('B17: versión B16 no encontrada')
          g=g.replace('versionCode 16','versionCode 17',1)
          g=g.replace('versionName "0.16-estabilidad-webview"','versionName "0.17-integral"',1)
          gradle.write_text(g,encoding='utf-8')
          assert hashlib.sha256(service.read_bytes()).hexdigest()==svc_b16_sha
          svc=service.read_text(encoding='utf-8')
          for mark in ('LocationManager.GPS_PROVIDER','LocationManager.NETWORK_PROVIDER',
                       'MIN_SEND_GUARD_MS','maybeRefreshRouteEta(',
                       'maybeLatchArrivalAndFinish(','ETA_PREAPPROACH_WINDOW_MS',
                       'TRACKING_AFTER_ARRIVAL_MS','onLocationChanged('):
              if mark not in svc: raise SystemExit('B17: falta '+mark)
          print('B17 verificada: TrackingService IDENTICO a B16; fallback GPS intacto')
          PY

          cp -a android-pioca "${GITHUB_WORKSPACE}/android-b17"
          echo 'true' > /tmp/pioca-b17-migrado

      - name: Verificar codigo fuente definitivo
        shell: bash
        run: |
          set -euo pipefail
          test -s android-b17/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java
          test -s android-b17/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java
          grep -q 'versionCode 17' android-b17/app/build.gradle
          grep -q 'versionName "0.17-integral"' android-b17/app/build.gradle
          grep -q 'onRenderProcessGone' android-b17/app/src/main/java/ar/com/pioca/seguimiento/MainActivity.java
          grep -q 'maybeLatchArrivalAndFinish' android-b17/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java

      - name: Compilar APK B17
        working-directory: android-b17
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon

      - name: Preparar APK descargable
        shell: bash
        run: |
          set -euo pipefail
          cp android-b17/app/build/outputs/apk/debug/app-debug.apk piOca-Seguimiento-B17-INTEGRAL.apk
          test -s piOca-Seguimiento-B17-INTEGRAL.apk

      - name: Optimizar consultas web en segundo plano (opcional)
        if: ${{ inputs.optimizar_paginas_web == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # No modificar NINGUNA rutina de cliente.html o cartografía R67.
          path=Path('index.html')
          s=path.read_text(encoding='utf-8')
          old='''    syncId =
                setInterval(
                  sincronizarServidor,
                  3000
                );'''
          new='''    // B17: el seguimiento GPS nativo sigue cuando esta pantalla está oculta.
              // No consumir 4G en lecturas del panel invisible; al volver se sincroniza.
              syncId = setInterval(function(){
                if(document.visibilityState === "visible") sincronizarServidor();
              }, 3000);'''
          if s.count(old)==1:
              s=s.replace(old,new,1)
          elif 'B17: el seguimiento GPS nativo sigue' not in s:
              raise SystemExit('B17: ancla index.html cambió')
          # Preconectar a los dos servicios de los que dependen las páginas,
          # para adelantar DNS/TLS cuando la red móvil es lenta.
          if 'rel="preconnect" href="https://cdn.jsdelivr.net"' not in s:
              if s.count('  <style>') != 1: raise SystemExit('B17: estilo index inesperado')
              s=s.replace('  <style>',
                  '  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>\n'
                  '  <link rel="preconnect" href="https://apxrmkdegjnblkbyjsbp.supabase.co" crossorigin>\n'
                  '  <style>',1)
          path.write_text(s,encoding='utf-8')
          path=Path('admin.html')
          s=path.read_text(encoding='utf-8')
          old='''    const {
                data:
                sessionData
              } =
                await supabaseClient.auth.getSession();
          
              if(
                !sessionData ||
                !sessionData.session
              ){
                return;
              }
          
              recuperacionEnCurso =
                true;
          
              try{'''
          new='''    recuperacionEnCurso = true;
              try{
                const {data:sessionData} = await supabaseClient.auth.getSession();
                if(!sessionData || !sessionData.session) return;'''
          if s.count(old)==1:
              s=s.replace(old,new,1)
          elif 'recuperacionEnCurso = true;\n    try{' not in s:
              raise SystemExit('B17: ancla admin.html cambió')
          if 'rel="preconnect" href="https://cdn.jsdelivr.net"' not in s:
              if s.count('  <style>') != 1: raise SystemExit('B17: estilo admin inesperado')
              s=s.replace('  <style>',
                  '  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>\n'
                  '  <link rel="preconnect" href="https://apxrmkdegjnblkbyjsbp.supabase.co" crossorigin>\n'
                  '  <style>',1)
          path.write_text(s,encoding='utf-8')
          print('B17: menos peticiones cuando el panel está oculto')
          PY
          # Validación de JS antes de publicar.
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for file in ('admin.html','index.html'):
              content=Path(file).read_text(encoding='utf-8')
              for js in re.findall(r'<script\b[^>]*>(.*?)</script\s*>',content,re.S|re.I):
                  if not js.strip():continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js') as temp:
                      temp.write(js);temp.flush()
                      subprocess.run(['node','--check',temp.name],check=True)
          print('B17: scripts JS válidos')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'B17: limitar consultas del panel oculto sin tocar GPS'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Guardar el CODIGO FUENTE B17 definitivo si fue la primera compilacion
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/pioca-b17-migrado)" = 'true'; then
            # Excluir únicamente salidas de compilación y caches transitorios.
            cat > android-b17/.gitignore <<'EOF'
          .gradle/
          build/
          **/build/
          .idea/
          *.iml
          local.properties
          EOF
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add android-b17
            git commit -m 'B17: codigo nativo consolidado y compilado, sin parches historicos'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Fuente B17 ya consolidada. No hay cambios en el repositorio.'
          fi

      - name: Publicar APK B17
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-APK-B17-INTEGRAL
          path: piOca-Seguimiento-B17-INTEGRAL.apk
          retention-days: 30
