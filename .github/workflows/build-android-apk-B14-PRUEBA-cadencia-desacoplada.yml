name: Compilar piOca Android APK B14 PRUEBA Cadencia Desacoplada

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generar proyecto base V7
        shell: bash
        run: |
          set -e
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          source = Path(".github/workflows/build-android-apk.yml")

          with source.open("r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          script = None

          for step in data["jobs"]["build"]["steps"]:
              name = str(step.get("name", ""))

              if name.startswith("Crear proyecto Android v7"):
                  script = step.get("run")
                  break

          if not script:
              raise SystemExit(
                  "ERROR: No encontré el bloque de generación V7 "
                  "en build-android-apk.yml"
              )

          Path("/tmp/pioca-genera-v7.sh").write_text(
              script,
              encoding="utf-8"
          )
          PY

          bash /tmp/pioca-genera-v7.sh

      - name: Aplicar V8 silencio No molestar
        run: |
          python3 .github/scripts/patch_android_v8_silencio.py

      - name: Aplicar V9 GPS cada 2 segundos
        run: |
          python3 .github/scripts/patch_android_v9_gps_2s.py

      - name: Aplicar B14 PRUEBA - desacoplar cadencia de lastOk
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android-pioca/app/build.gradle")
          service = Path(
              "android-pioca/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java"
          )

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit("ERROR B14 PRUEBA: " + label)
              return text.replace(old, new, 1)

          def re_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(
                  pattern,
                  repl,
                  text,
                  count=1,
                  flags=flags
              )
              if n != 1:
                  raise SystemExit("ERROR B14 PRUEBA: " + label)
              return out

          # ----------------------------------------------------------
          # VERSION
          # ----------------------------------------------------------
          t = gradle.read_text(encoding="utf-8")

          t = replace_once(
              t,
              "versionCode 9",
              "versionCode 14",
              "versionCode 9 -> 14"
          )

          t = replace_once(
              t,
              'versionName "0.9-estable-2s"',
              'versionName "0.14-prueba-cadencia-desacoplada"',
              "versionName B14 prueba"
          )

          gradle.write_text(t, encoding="utf-8")

          # ----------------------------------------------------------
          # TRACKING SERVICE
          # ----------------------------------------------------------
          t = service.read_text(encoding="utf-8")

          # Reloj independiente para la cadencia de salida.
          # lastOk sigue significando exclusivamente confirmación del servidor.
          t = re_once(
              t,
              r'(private long lastOk\s*=\s*0L;)',
              r'''\1

              /*
               * B14 PRUEBA:
               * reloj local de inicio de transmisión.
               * Desacopla la cadencia GPS de la latencia de respuesta de Supabase.
               */
              private long lastSendStarted = 0L;

              private static final long MIN_SEND_GUARD_MS = 1500L;''',
              "insertar lastSendStarted"
          )

          # En V9 el envío normal se habilita con now-lastOk >= 2000L.
          # B14 conserva GPS_PROVIDER=2000L pero usa un guard local de 1500 ms
          # para absorber jitter alrededor de 2 s y evitar el divisor por dos.
          pattern = r'if\s*\(\s*System\.currentTimeMillis\(\)\s*-\s*lastOk\s*>=\s*2000L\s*\)\s*\{\s*sendAsync\(\s*l\s*\);\s*\}'

          replacement = r'''long nowLocation =
                          System.currentTimeMillis();

                  if (

                          !sending.get()

                          && (

                                  lastSendStarted == 0L

                                  || nowLocation - lastSendStarted >= MIN_SEND_GUARD_MS

                          )

                  ) {


                      lastSendStarted =
                              nowLocation;


                      sendAsync(
                              l
                      );
                  }'''

          t = re_once(
              t,
              pattern,
              replacement,
              "desacoplar envío normal de lastOk",
              re.S
          )

          # ----------------------------------------------------------
          # VALIDACIONES DE SEGURIDAD
          # ----------------------------------------------------------
          checks = {
              "GPS principal sigue en 2 s": r'LocationManager\.GPS_PROVIDER,\s*2000L',
              "NETWORK respaldo sigue en 10 s": r'LocationManager\.NETWORK_PROVIDER,\s*10000L',
              "heartbeat respaldo sigue ligado a lastOk 10 s": r'last\s*!=\s*null\s*&&\s*now\s*-\s*lastOk\s*>=\s*10000L',
              "nuevo reloj lastSendStarted": r'private long lastSendStarted\s*=\s*0L;',
              "guard B14 1500 ms": r'MIN_SEND_GUARD_MS\s*=\s*1500L;',
              "protección sending sigue presente": r'!sending\.compareAndSet\(',
              "DND V8 sigue presente": r'maybeEnableDnd\(now\)'
          }

          for label, rx in checks.items():
              if not re.search(rx, t, re.S):
                  raise SystemExit("ERROR B14 PRUEBA: falta " + label)

          # El filtro normal V9 ya no debe depender de lastOk a 2 s.
          if re.search(
              r'System\.currentTimeMillis\(\)\s*-\s*lastOk\s*>=\s*2000L',
              t,
              re.S
          ):
              raise SystemExit(
                  "ERROR B14 PRUEBA: quedó activo el filtro normal lastOk >= 2000 ms"
              )

          service.write_text(t, encoding="utf-8")

          print(
              "B14 PRUEBA aplicada: GPS solicitado 2 s, "
              "cadencia de envío desacoplada de lastOk, "
              "guard local 1500 ms, heartbeat/NETWORK/DND intactos."
          )
          PY

      - name: Verificar configuración B14 PRUEBA
        shell: bash
        run: |
          set -e

          SERVICE="android-pioca/app/src/main/java/ar/com/pioca/seguimiento/TrackingService.java"
          GRADLE="android-pioca/app/build.gradle"

          grep -q 'versionCode 14' "$GRADLE"
          grep -q 'versionName "0.14-prueba-cadencia-desacoplada"' "$GRADLE"
          grep -q 'GPS_PROVIDER' "$SERVICE"
          grep -q '2000L' "$SERVICE"
          grep -q 'lastSendStarted' "$SERVICE"
          grep -q 'MIN_SEND_GUARD_MS = 1500L' "$SERVICE"
          grep -q 'NETWORK_PROVIDER' "$SERVICE"
          grep -q '10000L' "$SERVICE"
          grep -q 'maybeEnableDnd' "$SERVICE"

          echo "Configuración B14 PRUEBA verificada."

      - name: Compilar APK debug
        working-directory: android-pioca
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          cp \
            android-pioca/app/build/outputs/apk/debug/app-debug.apk \
            piOca-Seguimiento-B14-PRUEBA-cadencia-desacoplada.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Seguimiento-APK-B14-PRUEBA-cadencia-desacoplada
          path: piOca-Seguimiento-B14-PRUEBA-cadencia-desacoplada.apk
          retention-days: 30
