name: piOca R67 - PUBLICAR WORKER REAL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pioca-r67-cloudflare-publicacion
  cancel-in-progress: false

jobs:
  publicar-r67:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extraer y verificar el paquete R67
        shell: bash
        run: |
          set -euo pipefail
          ZIP='pioca-R67-worker-real-para-wrangler.zip'
          test -s "$ZIP" || { echo 'FALTA el ZIP R67 en la raiz del repositorio'; exit 1; }
          mkdir -p cloudflare-r67
          unzip -q "$ZIP" -d cloudflare-r67
          test -s cloudflare-r67/src/index.js
          test -s cloudflare-r67/public/index.html
          test -s cloudflare-r67/wrangler.toml
          node --check cloudflare-r67/src/index.js
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          file=Path('cloudflare-r67/wrangler.toml')
          raw=file.read_text(encoding='utf-8')
          config=tomllib.loads(raw)
          assert config.get('name')=='misty-river-903b', 'El nombre NO coincide con el Worker existente'
          assert config.get('main')=='./src/index.js', 'Script Worker no coincide'
          assert config.get('assets',{}).get('directory')=='./public', 'Falta carpeta de assets'
          assert '/__r67/*' in config.get('assets',{}).get('run_worker_first',[]), 'La ruta R67 no ejecutaria el Worker'
          worker=Path('cloudflare-r67/src/index.js').read_text(encoding='utf-8')
          assert "'/__r67/health'" in worker and "'/__r67/sector'" in worker, 'Faltan endpoints R67'
          assert 'env.ASSETS.fetch(request)' in worker, 'Falta la entrega de HTML estatico'
          # Mantener variables existentes y preservar el dominio ya configurado.
          if 'keep_vars' not in raw:
            raw=raw.replace('[assets]', 'keep_vars = true\n\n[assets]', 1)
          if '[[routes]]' not in raw:
            raw+='\n[[routes]]\npattern = "trackingpioca.com"\ncustom_domain = true\n'
          file.write_text(raw,encoding='utf-8')
          tomllib.loads(raw)  # Comprobar que el TOML final es valido
          print('Validado: Worker existente misty-river-903b, dominio trackingpioca.com, script y HTML conservados.')
          PY

      - name: Publicar Worker y assets en Cloudflare
        working-directory: cloudflare-r67
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Falta el secreto CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Falta el secreto CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.toml
