                   lon < Math.min(seg.lon1,seg.lon2)-margenLon ||
                   lon > Math.max(seg.lon1,seg.lon2)+margenLon){ continue; }
          
                const proy = r67ProyectarSobreSegmento(lat,lon,seg);''',
              'Segmentos largos y zoom')
          one('''      let score = proy.distancia;
          
                if(Number.isFinite(rumboMov)){''','''      /* A velocidad alta, una calle paralela/desconectada no puede
                   desplazar el pin si contradice fuertemente el rumbo confirmado. */
                if(Number.isFinite(rumboMov) && Number.isFinite(velocidadKmh) &&
                   velocidadKmh >= 40){
                  const difAlta=r67DiferenciaRumboEje(rumboMov,seg.rumbo);
                  const conectada=r67SegmentoActual &&
                    r67SegmentosConectados(seg,r67SegmentoActual);
                  if(difAlta > (conectada ? 72 : 48)){ continue; }
                }
          
                let score = proy.distancia;
          
                if(Number.isFinite(rumboMov)){''','Prioridad con rumbo a alta velocidad')
          one('''    if(!confirmado){
                return {
                  lat:latBase,
                  lon:lonBase,
                  filtrado:filtradoBase === true,
                  ajustadoR67:false
                };
              }
          
              return {
                lat:confirmado.lat,
                lon:confirmado.lon,
                filtrado:filtradoBase === true,''','''    if(!confirmado ||
                 /* La cartografía tiene prioridad, pero jamás un salto lateral
                    excesivo hacia una vía paralela o una rampa errónea. */
                 (Number.isFinite(latBase) && Number.isFinite(lonBase) &&
                  distanciaMetros(latBase,lonBase,confirmado.lat,confirmado.lon) > 30)){
                return {
                  lat:latBase,
                  lon:lonBase,
                  filtrado:filtradoBase === true,
                  ajustadoR67:false
                };
              }
          
              return {
                lat:confirmado.lat,
                lon:confirmado.lon,
                filtrado:false,''',
              'Seguridad al ajustar + prioridad visual')
          one('''      R67 añade después un map matching VISUAL (<40 km/h) contra una''',
              '''      R67 añade después un map matching VISUAL a todo régimen contra una''',
              'Comentario interno')
          
          CAMARA_B20 = '''
            /* ==========================================================
               B20 CARTOGRAFIA TOTAL + CAMARA SALIDA / 2026-11-09
               La salida visual es INDEPENDIENTE de T0, 50/300 m, expiración y ETA.
               Sólo nuevas posiciones GPS físicas confirmadas votan una salida.
               ========================================================== */
            const CAMARA_SALIDA_B20 = Object.freeze({
              DISTANCIA_ACTIVACION_M:65,
              AVANCE_MINIMO_LECTURA_M:4,
              LECTURAS_ACTIVACION:2,
              DISTANCIA_REGRESO_M:50,
              LECTURAS_REGRESO:2,
              ZOOM_MAXIMO_SALIDA:17,
              TRANSICION_MS:1350
            });
            let modoCamaraSalidaB20=false;
            let votosSalidaCamaraB20=0;
            let votosRegresoCamaraB20=0;
            let distanciaAnteriorCamaraB20=null;
            let camaraSalidaRafB20=null;
          
            function cancelarTransicionCamaraSalidaB20(){
              if(camaraSalidaRafB20!==null){
                cancelAnimationFrame(camaraSalidaRafB20);
                camaraSalidaRafB20=null;
              }
              try{
                if(mapa && mapa._map){
                  mapa._map.setOptions({isFractionalZoomEnabled:false});
                }
              }catch(_){}
            }
          
            /* Una sola animación de cámara, recalculada alrededor del pin REAL visible.
               El nivel de zoom no interviene en el map matching R67: sólo escala el mapa. */
            function iniciarTransicionCamaraSalidaB20(){
              cancelarTransicionCamaraSalidaB20();
              if(!mapa || !marcador || !mapa._map){return;}
              const gm=mapa._map;
              const inicioZoom=Number(gm.getZoom());
              if(!Number.isFinite(inicioZoom)){return;}
              const finalZoom=Math.min(inicioZoom,CAMARA_SALIDA_B20.ZOOM_MAXIMO_SALIDA);
              const inicioMs=performance.now();
              let ultimoZoomOrdenado=inicioZoom;
              let ultimoPintadoMs=0;
              try{gm.setOptions({isFractionalZoomEnabled:true});}catch(_){}
              function fotograma(t){
                if(!modoCamaraSalidaB20 || !mapa || !marcador){
                  cancelarTransicionCamaraSalidaB20();
                  return;
                }
                if(t-ultimoPintadoMs<28){
                  camaraSalidaRafB20=requestAnimationFrame(fotograma);
                  return;
                }
                ultimoPintadoMs=t;
                try{
                  const zoomLeido=Number(gm.getZoom());
                  /* Si el cliente modificó el zoom, su gesto tiene prioridad. */
                  if(Number.isFinite(zoomLeido) &&
                     Math.abs(zoomLeido-ultimoZoomOrdenado)>0.65){
                    cancelarTransicionCamaraSalidaB20();
                    return;
                  }
                  const tNormal=Math.max(0,Math.min(1,(t-inicioMs)/CAMARA_SALIDA_B20.TRANSICION_MS));
                  const ease=tNormal*tNormal*(3-2*tNormal);
                  const z=inicioZoom+(finalZoom-inicioZoom)*ease;
                  const pin=marcador.getLatLng();
                  const altoMapa=Number(mapa.getSize().y)||0;
                  const anchoMapa=Number(mapa.getSize().x)||0;
                  const altoPanel=piocaTrayectoPanel
                    ? piocaTrayectoPanel.getBoundingClientRect().height : 0;
                  const offsetY=Math.max(0,Math.min(altoPanel*0.50,altoMapa*0.32));
                  const rumbo=Number(typeof gm.getHeading==='function'?gm.getHeading():0)||0;
                  const centro=calcularCentroPuntoEnPantallaConRumbo(
                    Number(pin.lat),Number(pin.lng),z,anchoMapa*0.5,
                    altoMapa*0.5-offsetY,rumbo
                  );
                  if(centro){
                    if(typeof gm.moveCamera==='function'){
                      gm.moveCamera({center:{lat:Number(centro.lat),lng:Number(centro.lng)},zoom:z});
                    }else{
                      mapa.setView([Number(centro.lat),Number(centro.lng)],z);
                    }
                  }
                  ultimoZoomOrdenado=z;
                  if(tNormal<1){
                    camaraSalidaRafB20=requestAnimationFrame(fotograma);
                  }else{
                    camaraSalidaRafB20=null;
                    try{gm.setOptions({isFractionalZoomEnabled:false});}catch(_){}
                  }
                }catch(_){cancelarTransicionCamaraSalidaB20();}
              }
              camaraSalidaRafB20=requestAnimationFrame(fotograma);
            }
          
            function actualizarModoCamaraSalidaB20(distancia, llegoAntes, llegoAhora){
              if(!Number.isFinite(distancia)){return;}
              if(modoCamaraSalidaB20){
                if(distancia<=CAMARA_SALIDA_B20.DISTANCIA_REGRESO_M){
                  votosRegresoCamaraB20++;
                  if(votosRegresoCamaraB20>=CAMARA_SALIDA_B20.LECTURAS_REGRESO){
                    modoCamaraSalidaB20=false;
                    votosRegresoCamaraB20=0;
                    votosSalidaCamaraB20=0;
                    cancelarTransicionCamaraSalidaB20();
                    tramoZoomEtaActual=null;
                    encuadreProximidadEnclavado=true;
                    lecturasSalidaEncuadreProximidad=0;
                    ultimaLecturaSalidaEncuadreEvaluada=null;
                  }
                }else{
                  votosRegresoCamaraB20=0;
                }
              }else if(llegoAntes || llegoAhora){
                if(distancia>=CAMARA_SALIDA_B20.DISTANCIA_ACTIVACION_M &&
                   Number.isFinite(distanciaAnteriorCamaraB20) &&
                   distancia-distanciaAnteriorCamaraB20>=CAMARA_SALIDA_B20.AVANCE_MINIMO_LECTURA_M){
                  votosSalidaCamaraB20++;
                }else{
                  votosSalidaCamaraB20=0;
                }
                if(votosSalidaCamaraB20>=CAMARA_SALIDA_B20.LECTURAS_ACTIVACION){
                  modoCamaraSalidaB20=true;
                  votosSalidaCamaraB20=0;
                  /* Desarmar inmediatamente el encuadre dual anterior. */
                  encuadreProximidadEnclavado=false;
                  lecturasSalidaEncuadreProximidad=0;
                  ultimaLecturaSalidaEncuadreEvaluada=null;
                  desactivarEncuadreProximidad();
                  tramoZoomEtaActual='salida-b20';
                  iniciarTransicionCamaraSalidaB20();
                }
              }
              distanciaAnteriorCamaraB20=distancia;
            }
          
            function reiniciarCamaraSalidaB20(){
              modoCamaraSalidaB20=false;
              votosSalidaCamaraB20=0;
              votosRegresoCamaraB20=0;
              distanciaAnteriorCamaraB20=null;
              cancelarTransicionCamaraSalidaB20();
            }
          '''
          one('''    DISTANCIA_REARME_MARGEN_M:500
            });
          
            /*
              R44/R68''',
              '''    DISTANCIA_REARME_MARGEN_M:500
            });
          ''' + CAMARA_B20 + '''
            /*
              R44/R68''',
              'Inyección controlador de salida')
          one('''  function reiniciarEnclavamientoEncuadreProximidad(){
              encuadreProximidadEnclavado = false;''','''  function reiniciarEnclavamientoEncuadreProximidad(){
              reiniciarCamaraSalidaB20();
              encuadreProximidadEnclavado = false;''','Reiniciar estado cámara al terminar')
          one('''  function debeMantenerEncuadreProximidad(
              faltanMin
            ){
          
              const c =''','''  function debeMantenerEncuadreProximidad(
              faltanMin
            ){
          
              if(modoCamaraSalidaB20){return false;}
          
              const c =''','Deshabilitar encuadre dual mientras se aleja')
          one('''  function aplicarEncuadreProximidad(
              faltanMin,
              latForzada,
              lonForzada,
              forzar,
              sinAnimacionReanudacion
            ){
          
              if(''','''  function aplicarEncuadreProximidad(
              faltanMin,
              latForzada,
              lonForzada,
              forzar,
              sinAnimacionReanudacion
            ){
          
              if(modoCamaraSalidaB20){return false;}
          
              if(''','No animar domicilio durante salida')
          one('''  function actualizarZoomSegunEta(
              faltanMin
            ){
          
              /*''','''  function actualizarZoomSegunEta(
              faltanMin
            ){
          
              /* La ETA vencida no recupera el zoom del domicilio durante una salida. */
              if(modoCamaraSalidaB20){return;}
          
              /*''','No forzar zoom ETA cuando se aleja')
          one('''    ultimaDistanciaProximidad =
                distanciaAlDomicilio;
          
              /*''','''    ultimaDistanciaProximidad =
                distanciaAlDomicilio;
              const llegadaAntesParaCamaraB20=llegadaFisicaConfirmada;
          
              /*''','Conservar llegada anterior')
          one('''    zonaCercaConfirmada =
                siguiente.zonaCerca;
          
              /*''','''    zonaCercaConfirmada =
                siguiente.zonaCerca;
          
              actualizarModoCamaraSalidaB20(
                distanciaAlDomicilio,
                llegadaAntesParaCamaraB20,
                llegadaFisicaConfirmada
              );
          
              /*''','Cambiar cámara sólo con GPS nuevo confirmado')
          one('''  function aplicarZoomManualConCamionetaComoEje(
              zoomDestino
            ){
          
              if(''','''  function aplicarZoomManualConCamionetaComoEje(
              zoomDestino
            ){
          
              if(modoCamaraSalidaB20){cancelarTransicionCamaraSalidaB20();}
          
              if(''','Permitir zoom manual durante transición')
          one('''    opciones =
                opciones ||
                {};
          
              /*
                R53:''','''    opciones =
                opciones ||
                {};
          
              /* Una transición rAF gobierna sola la cámara durante el alejamiento. */
              if(modoCamaraSalidaB20 && camaraSalidaRafB20!==null){return;}
          
              /*
                R53:''','Exclusividad de cámara durante transición')
          
          assert 'VELOCIDAD_MAX_KMH:39.9' not in s
          assert 'B20 CARTOGRAFIA TOTAL + CAMARA SALIDA / 2026-11-09' in s
          assert s.count('modoCamaraSalidaB20')>=10
          assert 'b20.vertex_r67_late_tangent' in s
          assert 'piocaGoogleMapsCargado' in s
          assert 'HEMOS LLEGADO' in s
          assert 'r67ProyectarSobreSegmento' in s
          assert 'cliente-b20-diag.html' not in str(p) or True
          p.write_text(s,encoding='utf-8')
          print('OK. cliente-b20-diag.html corregido; %s caracteres.'%len(s))
          PY

      - name: Verificar JavaScript del cliente completo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('cliente-b20-diag.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.S|re.I)
          if len(scripts)<3: raise SystemExit('Faltan scripts; no se publica')
          for i,js in enumerate(scripts):
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(js); f.flush()
                  r=subprocess.run(['node','--check',f.name], capture_output=True,text=True)
                  if r.returncode: raise SystemExit(f'Script {i} invalido: {r.stderr}')
          print(f'OK: {len(scripts)} bloques JavaScript validados; HTML {len(html)} caracteres')
          PY

      - name: Publicar solo cliente-b20-diag.html (sin APK)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cliente-b20-diag.html
          if git diff --cached --quiet; then
            echo 'El archivo ya tenia la correccion. Sin cambios.'
          else
            git commit -m 'B20: R67 todas velocidades y camara de salida suave'
            git push origin HEAD:main
          fi
