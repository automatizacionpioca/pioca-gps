name: B20 DIAG - Corregir cartografia y salida (sin compilar)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b20-correccion-cliente
  cancel-in-progress: false

jobs:
  corregir-cliente-b20:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo actual
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Aplicar R67 a todas las velocidades + salida suave
        shell: bash
        run: |
          python3 - cliente-b20-diag.html <<'PY'
          #!/usr/bin/env python3
          """piOca B20 – R67 a todo régimen y cámara de alejamiento. Sólo HTML cliente.
          Uso: python3 b20_cartografia_salida_apply.py [ruta/cliente-b20-diag.html]
          Anclas estrictas. En caso de versión diferente aborta sin sobrescribir.
          """
          from pathlib import Path
          import sys, re
          
          p = Path(sys.argv[1]) if len(sys.argv)>1 else Path('cliente-b20-diag.html')
          s = p.read_text(encoding='utf-8')
          if 'B20 CARTOGRAFIA TOTAL + CAMARA SALIDA / 2026-11-09' in s:
              print('Ya estaba corregido; no se modifica.')
              sys.exit(0)
          
          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: esperaba 1 coincidencia, obtuve {n}. Sin cambios.')
              s = s.replace(old, new, 1)
          
          one('''     - R67 sólo corrige la POSICIÓN VISUAL del pin por debajo de 40 km/h.''',
              '''     - R67 corrige la POSICIÓN VISUAL a CUALQUIER velocidad si hay vía confiable.''',
              'Principio cartográfico')
          one('''    VELOCIDAD_MAX_KMH:39.9,
          ''','''    /* Sin límite por velocidad: prevalece la geometría vial confiable. */
          ''','Quitar límite 39,9')
          one('''      !Number.isFinite(velocidadKmh) ||
                velocidadKmh >= R67_MAP_MATCH.VELOCIDAD_MAX_KMH ||
                r67SegmentosViales.length === 0''','''      r67SegmentosViales.length === 0''','Habilitar R67 a cualquier velocidad')
          one('''      if(Math.abs(lat-seg.latMid) > 0.00042){ continue; }
                if(Math.abs(lon-seg.lonMid) > 0.00055){ continue; }
          
                const proy = r67ProyectarSobreSegmento(lat,lon,seg);''','''      /* B20 CARTOGRAFIA TOTAL: no eliminar una vía larga por su punto medio.
                   El índice espacial ya seleccionó candidatos; se verifica el tramo completo. */
                const margenLat=0.00030, margenLon=0.00035;
