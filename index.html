<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca® Rastreo</title>


  <style>

    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      box-sizing:border-box;
    }


    .panel{
      max-width:520px;
      margin:0 auto;
      background:#fff;
      padding:22px;
      border-radius:14px;
      box-sizing:border-box;
      border:1px solid #ddd;
    }


    .titulo{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:6px;
    }


    .subtitulo{
      text-align:center;
      font-size:14px;
      color:#555;
      margin-bottom:20px;
    }


    #bloqueGPS{
      display:none;
    }


    #bloqueDenegado{
      display:none;
      text-align:center;
      padding:20px 10px;
    }


    .denegadoTitulo{
      font-size:17px;
      font-weight:700;
      margin-bottom:7px;
    }


    .denegadoTexto{
      font-size:14px;
      color:#666;
    }


    #trackingBox{
      padding:10px;
      background:#eef5fb;
      border-radius:8px;
      text-align:center;
      font-weight:700;
      margin-bottom:14px;
      font-size:14px;
      letter-spacing:.5px;
    }


    #gpsEstado{
      background:#eee;
      padding:14px 10px;
      border-radius:8px;
      text-align:center;
      font-weight:700;
      font-size:16px;
      margin-bottom:18px;
    }


    button{
      width:100%;
      padding:16px 10px;
      border:0;
      border-radius:8px;
      color:#fff;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-bottom:10px;
    }


    #gpsIniciar{
      background:#1769aa;
    }


    #gpsDetener{
      background:#333;
      display:none;
    }


    .datos{
      font-size:15px;
      line-height:2;
      color:#333;
    }


    #gpsError{
      display:none;
      margin-top:15px;
      padding:12px;
      background:#fff1f1;
      border:1px solid #e4aaaa;
      border-radius:8px;
      font-size:13px;
      line-height:1.5;
    }

  </style>

</head>


<body>


<div class="panel">

  <div class="titulo">
    piOca®
  </div>


  <div class="subtitulo">
    Rastreo de visita
  </div>


  <!-- ACCESO DENEGADO -->

  <div id="bloqueDenegado">

    <div class="denegadoTitulo">
      Acceso no autorizado
    </div>

    <div class="denegadoTexto">
      Esta función no se encuentra disponible.
    </div>

  </div>


  <!-- GPS -->

  <div id="bloqueGPS">

    <div id="trackingBox">
      Seguimiento: -
    </div>


    <div id="gpsEstado">
      GPS detenido
    </div>


    <button
      id="gpsIniciar"
      type="button">
      INICIAR RASTREO
    </button>


    <button
      id="gpsDetener"
      type="button">
      DETENER RASTREO
    </button>


    <div class="datos">

      <div>
        <strong>Latitud:</strong>
        <span id="gpsLat">-</span>
      </div>

      <div>
        <strong>Longitud:</strong>
        <span id="gpsLon">-</span>
      </div>

      <div>
        <strong>Precisión:</strong>
        <span id="gpsAcc">-</span>
      </div>

      <div>
        <strong>Última posición:</strong>
        <span id="gpsHora">-</span>
      </div>

      <div>
        <strong>Actualizaciones GPS:</strong>
        <span id="gpsCantidad">0</span>
      </div>

      <div>
        <strong>Último envío:</strong>
        <span id="gpsEnvio">-</span>
      </div>

      <div>
        <strong>Envíos:</strong>
        <span id="gpsEnvios">0</span>
      </div>

    </div>


    <div id="gpsError"></div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

(async function(){


  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const bloqueGPS =
    document.getElementById(
      "bloqueGPS"
    );


  const bloqueDenegado =
    document.getElementById(
      "bloqueDenegado"
    );


  const trackingBox =
    document.getElementById(
      "trackingBox"
    );


  const iniciar =
    document.getElementById(
      "gpsIniciar"
    );


  const detener =
    document.getElementById(
      "gpsDetener"
    );


  const estado =
    document.getElementById(
      "gpsEstado"
    );


  const lat =
    document.getElementById(
      "gpsLat"
    );


  const lon =
    document.getElementById(
      "gpsLon"
    );


  const acc =
    document.getElementById(
      "gpsAcc"
    );


  const hora =
    document.getElementById(
      "gpsHora"
    );


  const cantidadTxt =
    document.getElementById(
      "gpsCantidad"
    );


  const envioTxt =
    document.getElementById(
      "gpsEnvio"
    );


  const enviosTxt =
    document.getElementById(
      "gpsEnvios"
    );


  const errorBox =
    document.getElementById(
      "gpsError"
    );


  let watchId = null;

  let cantidad = 0;

  let envios = 0;

  let ultimoEnvio = 0;

  let ultimaPosicion = null;

  let detenidoManual = false;

  let enviando = false;

  let trackingCode = null;


  function negarAcceso(){

    bloqueGPS.style.display =
      "none";

    bloqueDenegado.style.display =
      "block";

  }


  function permitirAcceso(){

    bloqueDenegado.style.display =
      "none";

    bloqueGPS.style.display =
      "block";

  }


  function mostrarError(texto){

    errorBox.textContent =
      texto;

    errorBox.style.display =
      "block";

  }


  function ocultarError(){

    errorBox.textContent =
      "";

    errorBox.style.display =
      "none";

  }


  /*
    -------------------------------------------------------
    VALIDAMOS SESION + SEGUIMIENTO
    -------------------------------------------------------
  */

  async function validarAcceso(){


    const {
      data:
      sessionData
    } =

      await supabaseClient
      .auth
      .getSession();


    if(
      !sessionData ||
      !sessionData.session
    ){

      negarAcceso();

      return false;

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    trackingCode =
      params.get(
        "tracking"
      );


    if(!trackingCode){

      trackingCode =
        localStorage.getItem(
          "pioca_tracking_code"
        );

    }


    if(!trackingCode){

      negarAcceso();

      return false;

    }


    trackingCode =
      trackingCode
      .trim()
      .toUpperCase();


    /*
      Esta consulta está protegida
      por RLS.

      Sólo puede ver services
      creados por el usuario logueado.
    */

    const {
      data,
      error
    } =

      await supabaseClient

      .from("services")

      .select(
        "tracking_code,status,expires_at"
      )

      .eq(
        "tracking_code",
        trackingCode
      )

      .maybeSingle();


    if(
      error ||
      !data
    ){

      negarAcceso();

      return false;

    }


    if(
      data.status !==
      "active"
    ){

      negarAcceso();

      return false;

    }


    if(
      Date.now() >=
      new Date(
        data.expires_at
      ).getTime()
    ){

      negarAcceso();

      return false;

    }


    trackingBox.textContent =
      "Seguimiento: " +
      trackingCode;


    permitirAcceso();


    return true;

  }


  /*
    -------------------------------------------------------
    ENVIO SEGURO A SUPABASE
    -------------------------------------------------------
  */

  async function enviarPosicion(
    posicion,
    intento = 0
  ){


    if(
      !posicion ||
      !trackingCode
    ){

      return;

    }


    if(
      enviando &&
      intento === 0
    ){

      return;

    }


    enviando =
      true;


    try{


      const {
        data,
        error
      } =

        await supabaseClient
        .rpc(
          "push_tracking_position",
          {

            p_code:
              trackingCode,

            p_lat:
              posicion.coords.latitude,

            p_lon:
              posicion.coords.longitude,

            p_accuracy:
              posicion.coords.accuracy

          }
        );


      if(
        error ||
        data !== true
      ){

        throw new Error(
          "Seguimiento no autorizado o finalizado."
        );

      }


      enviando =
        false;


      envios++;


      enviosTxt.textContent =
        envios;


      envioTxt.textContent =

        new Date()
        .toLocaleTimeString(
          "es-AR"
        );


      ocultarError();


    }

    catch(error){


      enviando =
        false;


      if(
        detenidoManual
      ){

        return;

      }


      /*
        Si el backend rechazó
        el seguimiento,
        dejamos de enviar.
      */

      if(
        String(
          error.message
        )
        .includes(
          "finalizado"
        )
      ){

        detenerRastreo();

        negarAcceso();

        return;

      }


      /*
        Microcorte:
        reintentos 2 / 4 / 8 segundos.
      */

      if(
        intento < 3
      ){

        const tiempos =
          [
            2000,
            4000,
            8000
          ];


        mostrarError(
          "Conexión interrumpida. Reintentando..."
        );


        setTimeout(

          function(){

            if(
              !detenidoManual
            ){

              enviarPosicion(
                ultimaPosicion,
                intento + 1
              );

            }

          },

          tiempos[
            intento
          ]

        );


      }else{


        mostrarError(
          "Sin conexión. El rastreo continuará intentando automáticamente."
        );

      }

    }

  }


  /*
    -------------------------------------------------------
    GPS
    -------------------------------------------------------
  */

  function iniciarRastreo(){


    if(
      watchId !== null
    ){

      return;

    }


    detenidoManual =
      false;


    estado.textContent =
      "Solicitando ubicación...";


    estado.style.background =
      "#fff3cd";


    watchId =

      navigator.geolocation
      .watchPosition(


        function(posicion){


          ultimaPosicion =
            posicion;


          cantidad++;


          lat.textContent =

            posicion.coords
            .latitude
            .toFixed(6);


          lon.textContent =

            posicion.coords
            .longitude
            .toFixed(6);


          acc.textContent =

            Math.round(
              posicion.coords
              .accuracy
            ) +
            " metros";


          hora.textContent =

            new Date()
            .toLocaleTimeString(
              "es-AR"
            );


          cantidadTxt.textContent =
            cantidad;


          estado.textContent =
            "🟢 GPS ACTIVO";


          estado.style.background =
            "#dff5e1";


          iniciar.style.display =
            "none";


          detener.style.display =
            "block";


          const ahora =
            Date.now();


          if(
            ahora -
            ultimoEnvio
            >= 5000
          ){

            ultimoEnvio =
              ahora;


            enviarPosicion(
              posicion,
              0
            );

          }

        },


        function(){


          if(
            detenidoManual
          ){

            return;

          }


          mostrarError(
            "GPS momentáneamente sin posición. Reintentando..."
          );


          if(
            watchId !== null
          ){

            navigator.geolocation
            .clearWatch(
              watchId
            );


            watchId =
              null;

          }


          setTimeout(

            function(){

              if(
                !detenidoManual
              ){

                iniciarRastreo();

              }

            },

            3000

          );

        },


        {

          enableHighAccuracy:
            true,

          maximumAge:
            1000,

          timeout:
            10000

        }

      );

  }


  function detenerRastreo(){


    detenidoManual =
      true;


    if(
      watchId !== null
    ){

      navigator.geolocation
      .clearWatch(
        watchId
      );


      watchId =
        null;

    }


    estado.textContent =
      "GPS detenido";


    estado.style.background =
      "#eeeeee";


    iniciar.style.display =
      "block";


    detener.style.display =
      "none";

  }


  iniciar.addEventListener(
    "click",
    iniciarRastreo
  );


  detener.addEventListener(
    "click",
    detenerRastreo
  );


  window.addEventListener(

    "online",

    function(){

      if(
        !detenidoManual &&
        ultimaPosicion
      ){

        enviarPosicion(
          ultimaPosicion,
          0
        );

      }

    }

  );


  const acceso =
    await validarAcceso();


  if(!acceso){

    negarAcceso();

  }


})();

</script>

</body>

</html>
