<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>piOca GPS</title>

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#fff;
      box-sizing:border-box;
    }

    #pioca-gps{
      max-width:520px;
      margin:0 auto;
      padding:22px;
      border:1px solid #d9d9d9;
      border-radius:14px;
      box-sizing:border-box;
      background:#fff;
    }

    .titulo{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:8px;
    }

    .subtitulo{
      text-align:center;
      font-size:15px;
      color:#444;
      margin-bottom:20px;
    }

    #gpsEstado{
      background:#eee;
      padding:14px 10px;
      border-radius:8px;
      text-align:center;
      font-weight:700;
      font-size:16px;
      margin-bottom:18px;
    }

    .boton{
      width:100%;
      padding:16px 10px;
      border:0;
      border-radius:8px;
      color:#fff;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-bottom:10px;
    }

    #gpsIniciar{
      background:#1769aa;
    }

    #gpsDetener{
      background:#333;
      display:none;
    }

    .datos{
      font-size:15px;
      line-height:2;
      color:#333;
    }

    #gpsError{
      display:none;
      margin-top:15px;
      padding:12px;
      background:#fff1f1;
      border:1px solid #e4aaaa;
      border-radius:8px;
      font-size:13px;
    }
  </style>
</head>

<body>

<div id="pioca-gps">

  <div class="titulo">piOca®</div>

  <div class="subtitulo">
    PRUEBA GPS + SUPABASE
  </div>

  <div id="gpsEstado">
    GPS detenido
  </div>

  <button id="gpsIniciar" class="boton" type="button">
    INICIAR RASTREO
  </button>

  <button id="gpsDetener" class="boton" type="button">
    DETENER RASTREO
  </button>

  <div class="datos">

    <div>
      <strong>Latitud:</strong>
      <span id="gpsLat">-</span>
    </div>

    <div>
      <strong>Longitud:</strong>
      <span id="gpsLon">-</span>
    </div>

    <div>
      <strong>Precisión:</strong>
      <span id="gpsAcc">-</span>
    </div>

    <div>
      <strong>Última posición:</strong>
      <span id="gpsHora">-</span>
    </div>

    <div>
      <strong>Actualizaciones GPS:</strong>
      <span id="gpsCantidad">0</span>
    </div>

    <div>
      <strong>Último envío:</strong>
      <span id="gpsEnvio">-</span>
    </div>

    <div>
      <strong>Envíos a Supabase:</strong>
      <span id="gpsEnvios">0</span>
    </div>

  </div>

  <div id="gpsError"></div>

</div>

<script>
(function(){

  var SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";

  var SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";

  var watchId = null;

  var cantidad = 0;
  var envios = 0;

  var ultimoEnvio = 0;
  var ultimaPosicion = null;

  var enviando = false;
  var detenidoManual = false;

  var iniciar =
    document.getElementById("gpsIniciar");

  var detener =
    document.getElementById("gpsDetener");

  var estado =
    document.getElementById("gpsEstado");

  var lat =
    document.getElementById("gpsLat");

  var lon =
    document.getElementById("gpsLon");

  var acc =
    document.getElementById("gpsAcc");

  var hora =
    document.getElementById("gpsHora");

  var cantidadTxt =
    document.getElementById("gpsCantidad");

  var envioTxt =
    document.getElementById("gpsEnvio");

  var enviosTxt =
    document.getElementById("gpsEnvios");

  var errorBox =
    document.getElementById("gpsError");


  function mostrarError(texto){

    errorBox.innerHTML = texto;
    errorBox.style.display = "block";

  }


  function limpiarError(){

    errorBox.innerHTML = "";
    errorBox.style.display = "none";

  }


  function enviarSupabase(position, intento){

    if(!position){
      return;
    }

    if(typeof intento === "undefined"){
      intento = 0;
    }

    if(enviando && intento === 0){
      return;
    }

    enviando = true;

    var datos = {

      latitude:
        position.coords.latitude,

      longitude:
        position.coords.longitude,

      accuracy:
        position.coords.accuracy

    };


    fetch(
      SUPABASE_URL + "/rest/v1/gps_test",
      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:
          JSON.stringify(datos)

      }
    )

    .then(function(respuesta){

      if(!respuesta.ok){

        throw new Error(
          "Supabase respondió " +
          respuesta.status
        );

      }

      enviando = false;

      envios++;

      enviosTxt.innerHTML =
        envios;

      envioTxt.innerHTML =
        new Date()
        .toLocaleTimeString("es-AR");

      limpiarError();

    })

    .catch(function(error){

      enviando = false;

      if(
        detenidoManual
      ){
        return;
      }

      if(
        intento < 3
      ){

        var espera;

        if(intento === 0){
          espera = 2000;
        }

        if(intento === 1){
          espera = 4000;
        }

        if(intento === 2){
          espera = 8000;
        }

        mostrarError(
          "Conexión interrumpida. Reintentando..."
        );

        setTimeout(
          function(){

            if(!detenidoManual){

              enviarSupabase(
                ultimaPosicion,
                intento + 1
              );

            }

          },
          espera
        );

      }else{

        mostrarError(
          "Sin conexión. El rastreo sigue activo y volverá a intentar."
        );

      }

    });

  }


  function iniciarGPS(){

    if(watchId !== null){
      return;
    }

    detenidoManual = false;

    estado.innerHTML =
      "Solicitando ubicación...";

    estado.style.background =
      "#fff3cd";


    watchId =
      navigator.geolocation.watchPosition(

        function(position){

          ultimaPosicion =
            position;

          cantidad++;

          lat.innerHTML =
            position.coords.latitude
            .toFixed(6);

          lon.innerHTML =
            position.coords.longitude
            .toFixed(6);

          acc.innerHTML =
            Math.round(
              position.coords.accuracy
            ) + " metros";

          hora.innerHTML =
            new Date()
            .toLocaleTimeString("es-AR");

          cantidadTxt.innerHTML =
            cantidad;


          estado.innerHTML =
            "🟢 GPS ACTIVO";

          estado.style.background =
            "#dff5e1";


          iniciar.style.display =
            "none";

          detener.style.display =
            "block";


          var ahora =
            Date.now();


          if(
            ahora - ultimoEnvio
            >= 5000
          ){

            ultimoEnvio =
              ahora;

            enviarSupabase(
              position,
              0
            );

          }

        },


        function(error){

          if(detenidoManual){
            return;
          }

          mostrarError(
            "GPS momentáneamente sin posición. Reintentando..."
          );

          if(watchId !== null){

            navigator.geolocation
            .clearWatch(watchId);

            watchId = null;

          }

          setTimeout(
            function(){

              if(!detenidoManual){
                iniciarGPS();
              }

            },
            3000
          );

        },


        {
          enableHighAccuracy:true,
          maximumAge:1000,
          timeout:10000
        }

      );

  }


  iniciar.addEventListener(
    "click",
    function(){

      if(!navigator.geolocation){

        estado.innerHTML =
          "❌ GPS no disponible";

        estado.style.background =
          "#ffe0e0";

        return;

      }


      cantidad = 0;
      envios = 0;

      ultimoEnvio = 0;
      ultimaPosicion = null;

      cantidadTxt.innerHTML = "0";
      enviosTxt.innerHTML = "0";
      envioTxt.innerHTML = "-";

      limpiarError();

      iniciarGPS();

    }
  );


  detener.addEventListener(
    "click",
    function(){

      detenidoManual = true;

      if(watchId !== null){

        navigator.geolocation
        .clearWatch(watchId);

        watchId = null;

      }


      estado.innerHTML =
        "GPS detenido";

      estado.style.background =
        "#eeeeee";


      iniciar.style.display =
        "block";

      detener.style.display =
        "none";

    }
  );


  window.addEventListener(
    "online",
    function(){

      if(
        !detenidoManual &&
        ultimaPosicion
      ){

        mostrarError(
          "Conexión recuperada. Reanudando envío..."
        );

        enviarSupabase(
          ultimaPosicion,
          0
        );

      }

    }
  );

})();
</script>

</body>
</html>
