<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>piOca Seguimiento</title>

  <style>

    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      box-sizing:border-box;
    }

    .panel{
      max-width:520px;
      margin:0 auto;
      background:#fff;
      padding:22px;
      border:1px solid #ddd;
      border-radius:14px;
      box-sizing:border-box;
    }

    .titulo{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:6px;
    }

    .subtitulo{
      text-align:center;
      font-size:14px;
      color:#555;
      margin-bottom:20px;
    }

    #bloqueGPS{
      display:none;
    }

    #bloqueDenegado{
      display:none;
      text-align:center;
      padding:25px 10px;
    }

    #trackingBox{
      padding:10px;
      background:#eef5fb;
      border-radius:8px;
      text-align:center;
      font-weight:700;
      margin-bottom:14px;
    }

    #gpsEstado{
      padding:14px 10px;
      background:#fff3cd;
      border-radius:8px;
      text-align:center;
      font-size:16px;
      font-weight:700;
      margin-bottom:18px;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:8px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
    }

    button:disabled{
      opacity:.55;
      cursor:default;
    }

    #btnWhatsapp{
      background:#2d7a38;
      color:#fff;
      display:none;
    }

    #btnFinalizar{
      background:#333;
      color:#fff;
    }

    #btnReactivar{
      background:#1769aa;
      color:#fff;
      display:none;
    }

    .datos{
      font-size:14px;
      line-height:2;
      color:#333;
    }

    #horaClienteBox{
      margin-top:18px;
      padding:16px;
      border:1px solid #cfdceb;
      border-radius:12px;
      background:#f5f9fd;
      text-align:center;
    }

    .horaClienteTitulo{
      font-size:12px;
      font-weight:700;
      color:#54687a;
      text-transform:uppercase;
      letter-spacing:.3px;
    }

    #horaCliente{
      font-size:28px;
      font-weight:700;
      color:#1769aa;
      margin:6px 0 2px;
    }

    .horaClienteTexto{
      font-size:13px;
      color:#555;
    }

    #controlesHora{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    #controlesHora button{
      flex:1;
      width:auto;
      margin-top:0;
      padding:11px 8px;
      font-size:14px;
    }

    #btnRestar5{
      background:#eceff2;
      color:#333;
      border:1px solid #d0d4d8;
    }

    #btnSumar5{
      background:#1769aa;
      color:#fff;
    }

    #horaEstado{
      display:none;
      margin-top:10px;
      font-size:12px;
      line-height:1.4;
    }

    #gpsError{
      display:none;
      margin-top:14px;
      padding:12px;
      background:#fff1f1;
      border:1px solid #e4aaaa;
      border-radius:8px;
      font-size:13px;
    }

  </style>

</head>


<body>


<div class="panel">

  <div class="titulo">
    piOca
  </div>

  <div class="subtitulo">
    Seguimiento activo
  </div>


  <div id="bloqueDenegado">

    <strong>
      Acceso no autorizado
    </strong>

  </div>


  <div id="bloqueGPS">

    <div id="trackingBox">
      Seguimiento: -
    </div>

    <div id="gpsEstado">
      Iniciando GPS...
    </div>


    <div class="datos">

      <div>
        <strong>Latitud:</strong>
        <span id="gpsLat">-</span>
      </div>

      <div>
        <strong>Longitud:</strong>
        <span id="gpsLon">-</span>
      </div>

      <div>
        <strong>Precisión:</strong>
        <span id="gpsAcc">-</span>
      </div>

      <div>
        <strong>Última posición:</strong>
        <span id="gpsHora">-</span>
      </div>

      <div>
        <strong>Último envío:</strong>
        <span id="gpsEnvio">-</span>
      </div>

      <div>
        <strong>Envíos:</strong>
        <span id="gpsEnvios">0</span>
      </div>

    </div>


    <div id="horaClienteBox">

      <div class="horaClienteTitulo">
        EL CLIENTE ESTÁ VIENDO
      </div>

      <div id="horaCliente">
        --:--
      </div>

      <div class="horaClienteTexto">
        Hora estimada de llegada
      </div>

      <div id="controlesHora">

        <button
          id="btnRestar5"
          type="button">
          − 5 min
        </button>

        <button
          id="btnSumar5"
          type="button">
          + 5 min
        </button>

      </div>

      <div id="horaEstado"></div>

    </div>


    <button
      id="btnReactivar"
      type="button">
      📍 REACTIVAR GPS
    </button>


    <button
      id="btnWhatsapp"
      type="button">
      💬 ENVIAR SEGUIMIENTO POR WHATSAPP
    </button>


    <button
      id="btnFinalizar"
      type="button">
      ⛔ FINALIZAR SEGUIMIENTO
    </button>


    <div id="gpsError"></div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

(async function(){


  const SUPABASE_URL =
    "https://apxrmkdegjnblkbyjsbp.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const bloqueGPS =
    document.getElementById(
      "bloqueGPS"
    );


  const bloqueDenegado =
    document.getElementById(
      "bloqueDenegado"
    );


  const trackingBox =
    document.getElementById(
      "trackingBox"
    );


  const estado =
    document.getElementById(
      "gpsEstado"
    );


  const lat =
    document.getElementById(
      "gpsLat"
    );


  const lon =
    document.getElementById(
      "gpsLon"
    );


  const acc =
    document.getElementById(
      "gpsAcc"
    );


  const hora =
    document.getElementById(
      "gpsHora"
    );


  const envioHora =
    document.getElementById(
      "gpsEnvio"
    );


  const enviosTxt =
    document.getElementById(
      "gpsEnvios"
    );


  const btnWhatsapp =
    document.getElementById(
      "btnWhatsapp"
    );


  const btnFinalizar =
    document.getElementById(
      "btnFinalizar"
    );


  const btnReactivar =
    document.getElementById(
      "btnReactivar"
    );


  const errorBox =
    document.getElementById(
      "gpsError"
    );


  const horaCliente =
    document.getElementById(
      "horaCliente"
    );


  const btnRestar5 =
    document.getElementById(
      "btnRestar5"
    );


  const btnSumar5 =
    document.getElementById(
      "btnSumar5"
    );


  const horaEstado =
    document.getElementById(
      "horaEstado"
    );


  let trackingCode = null;

  let serviceId = null;

  let watchId = null;

  let heartbeatId = null;

  let envios = 0;

  let ultimoEnvio = 0;

  let ultimaPosicion = null;

  let enviando = false;

  let seguimientoFinalizado =
    false;

  let llegadaClienteMs =
    null;

  let modificandoHora =
    false;


  const nombreCliente =
    localStorage.getItem(
      "pioca_client_name"
    ) || "";


  const telefonoCliente =
    localStorage.getItem(
      "pioca_client_phone"
    ) || "";


  const linkCliente =
    localStorage.getItem(
      "pioca_client_link"
    ) || "";


  const informacionAdicional =
    localStorage.getItem(
      "pioca_additional_info"
    ) || "";


  function mostrarError(
    texto
  ){

    errorBox.textContent =
      texto;

    errorBox.style.display =
      "block";

  }


  function ocultarError(){

    errorBox.textContent =
      "";

    errorBox.style.display =
      "none";

  }


  function mostrarEstadoHora(
    texto,
    ok
  ){

    horaEstado.textContent =
      texto;

    horaEstado.style.display =
      "block";

    horaEstado.style.color =
      ok
        ? "#2d7a38"
        : "#b00020";

  }


  function negarAcceso(){

    bloqueGPS.style.display =
      "none";

    bloqueDenegado.style.display =
      "block";

  }


  function formatearHora(
    fechaMs
  ){

    if(
      !fechaMs ||
      !Number.isFinite(
        fechaMs
      )
    ){

      return "--:--";
    }


    return new Date(
      fechaMs
    )
    .toLocaleTimeString(
      "es-AR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  function pintarHoraCliente(){

    horaCliente.textContent =
      formatearHora(
        llegadaClienteMs
      );

  }


  async function actualizarVencimientoNativo(
    nuevoVenceIso
  ){

    localStorage.setItem(
      "pioca_tracking_expires_at",
      nuevoVenceIso
    );


    if(
      window.PiocaNative &&
      typeof window.PiocaNative.startTracking ===
        "function"
    ){

      try{

        const {
          data
        } =
          await supabaseClient.auth
          .getSession();


        if(
          data &&
          data.session
        ){

          window.PiocaNative
          .startTracking(
            trackingCode,
            String(
              data.session.access_token ||
              ""
            ),
            String(
              data.session.refresh_token ||
              ""
            ),
            nombreCliente,
            nuevoVenceIso
          );

        }

      }catch(e){
      }

    }

  }


  async function inicializarHoraCliente(
    servicio
  ){

    if(
      servicio.client_arrival
    ){

      llegadaClienteMs =
        new Date(
          servicio.client_arrival
        )
        .getTime();

      pintarHoraCliente();

      return true;
    }


    if(
      !servicio.estimated_arrival
    ){

      mostrarEstadoHora(
        "No se pudo obtener la hora estimada.",
        false
      );

      return false;
    }


    const baseMs =
      new Date(
        servicio.estimated_arrival
      )
      .getTime();


    if(
      !Number.isFinite(
        baseMs
      )
    ){

      mostrarEstadoHora(
        "La hora estimada no es válida.",
        false
      );

      return false;
    }


    const nuevaLlegadaMs =
      baseMs +
      5 * 60 * 1000;


    const nuevoVenceMs =
      nuevaLlegadaMs +
      20 * 60 * 1000;


    const nuevaLlegadaIso =
      new Date(
        nuevaLlegadaMs
      )
      .toISOString();


    const nuevoVenceIso =
      new Date(
        nuevoVenceMs
      )
      .toISOString();


    const {
      error
    } =
      await supabaseClient
      .from(
        "services"
      )
      .update({

        client_arrival:
          nuevaLlegadaIso,

        expires_at:
          nuevoVenceIso

      })
      .eq(
        "id",
        serviceId
      );


    if(
      error
    ){

      mostrarEstadoHora(
        "No se pudo preparar la hora para el cliente.",
        false
      );

      return false;
    }


    llegadaClienteMs =
      nuevaLlegadaMs;


    pintarHoraCliente();


    await actualizarVencimientoNativo(
      nuevoVenceIso
    );


    return true;

  }


  async function moverHoraCliente(
    minutos
  ){

    if(
      modificandoHora ||
      seguimientoFinalizado ||
      !serviceId ||
      !llegadaClienteMs
    ){

      return;
    }


    modificandoHora =
      true;


    btnRestar5.disabled =
      true;

    btnSumar5.disabled =
      true;

    horaEstado.style.display =
      "none";


    const nuevaLlegadaMs =
      llegadaClienteMs +
      minutos * 60 * 1000;


    const nuevoVenceMs =
      nuevaLlegadaMs +
      20 * 60 * 1000;


    const nuevaLlegadaIso =
      new Date(
        nuevaLlegadaMs
      )
      .toISOString();


    const nuevoVenceIso =
      new Date(
        nuevoVenceMs
      )
      .toISOString();


    const {
      error
    } =
      await supabaseClient
      .from(
        "services"
      )
      .update({

        client_arrival:
          nuevaLlegadaIso,

        expires_at:
          nuevoVenceIso

      })
      .eq(
        "id",
        serviceId
      )
      .eq(
        "status",
        "active"
      );


    if(
      error
    ){

      mostrarEstadoHora(
        "No se pudo actualizar la hora.",
        false
      );

    }else{

      llegadaClienteMs =
        nuevaLlegadaMs;


      pintarHoraCliente();


      await actualizarVencimientoNativo(
        nuevoVenceIso
      );


      mostrarEstadoHora(
        "✓ Hora actualizada. El cliente ya ve " +
        formatearHora(
          llegadaClienteMs
        ),
        true
      );

    }


    btnRestar5.disabled =
      false;

    btnSumar5.disabled =
      false;

    modificandoHora =
      false;

  }


  function telefonoWhatsAppArgentina(
    numero
  ){

    let n =
      String(
        numero || ""
      )
      .replace(
        /\D/g,
        ""
      );


    if(
      n.startsWith(
        "549"
      )
    ){
      return n;
    }


    if(
      n.startsWith(
        "54"
      )
    ){
      return n;
    }


    if(
      n.startsWith(
        "0"
      )
    ){
      n =
        n.substring(
          1
        );
    }


    return "549" + n;

  }


  function abrirWhatsApp(){


    if(
      !telefonoCliente ||
      !linkCliente
    ){

      mostrarError(
        "No están disponibles los datos del cliente."
      );

      return;
    }


    const saludo =
      "\uD83D\uDC4B";


    const tecnico =
      "\uD83D\uDC68\u200D\uD83D\uDD27";


    const ubicacion =
      "\uD83D\uDCCD";


    let mensaje =

      saludo +
      " Hola " +
      nombreCliente +
      "." +

      "\n\n" +

      tecnico +
      " El técnico de piOca ya se encuentra en camino." +

      "\n\n" +

      "Podés seguir nuestra llegada en tiempo real." +

      "\n\n" +

      ubicacion +
      " *Ver ubicación de la camioneta:*" +

      "\n" +

      linkCliente;


    if(
      informacionAdicional.trim() !==
      ""
    ){

      mensaje +=

        "\n\n" +

        "\u2139\uFE0F" +
        " *Información adicional:*" +

        "\n" +

        informacionAdicional.trim();

    }


    mensaje +=

      "\n\n" +

      "_Este es un mensaje automático y no es necesario responderlo._";


    const numero =
      telefonoWhatsAppArgentina(
        telefonoCliente
      );


    const texto =
      encodeURIComponent(
        mensaje
      );


    const ua =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera;


    if(
      /android/i.test(
        ua
      )
    ){

      window.location.href =

        "intent://send" +

        "?phone=" +
        numero +

        "&text=" +
        texto +

        "#Intent;" +

        "scheme=whatsapp;" +

        "package=com.whatsapp.w4b;" +

        "end";


      return;

    }


    window.location.href =

      "https://wa.me/" +
      numero +
      "?text=" +
      texto;

  }


  async function validarAcceso(){


    const {
      data:
      sessionData
    } =
      await supabaseClient.auth
      .getSession();


    if(
      !sessionData ||
      !sessionData.session
    ){

      negarAcceso();

      return false;
    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    trackingCode =
      params.get(
        "tracking"
      );


    if(
      !trackingCode
    ){

      trackingCode =
        localStorage.getItem(
          "pioca_tracking_code"
        );

    }


    if(
      !trackingCode
    ){

      negarAcceso();

      return false;
    }


    trackingCode =
      trackingCode
      .trim()
      .toUpperCase();


    const {
      data,
      error
    } =
      await supabaseClient
      .from(
        "services"
      )
      .select(
        "id,tracking_code,status,expires_at,estimated_arrival,client_arrival"
      )
      .eq(
        "tracking_code",
        trackingCode
      )
      .maybeSingle();


    if(
      error ||
      !data
    ){

      negarAcceso();

      return false;
    }


    if(
      data.status !==
        "active" ||
      Date.now() >=
      new Date(
        data.expires_at
      )
      .getTime()
    ){

      negarAcceso();

      return false;
    }


    serviceId =
      data.id;


    trackingBox.textContent =
      "Seguimiento: " +
      trackingCode;


    bloqueDenegado.style.display =
      "none";


    bloqueGPS.style.display =
      "block";


    await inicializarHoraCliente(
      data
    );


    return true;

  }


  async function enviarPosicion(
    posicion,
    intento
  ){


    if(
      !posicion ||
      seguimientoFinalizado
    ){
      return;
    }


    intento =
      intento || 0;


    if(
      enviando &&
      intento === 0
    ){
      return;
    }


    enviando =
      true;


    try{


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "push_tracking_position",
          {

            p_code:
              trackingCode,

            p_lat:
              posicion.coords.latitude,

            p_lon:
              posicion.coords.longitude,

            p_accuracy:
              posicion.coords.accuracy

          }
        );


      if(
        error ||
        data !== true
      ){

        throw new Error(
          "Seguimiento no disponible."
        );

      }


      enviando =
        false;


      envios++;


      enviosTxt.textContent =
        envios;


      envioHora.textContent =

        new Date()
        .toLocaleTimeString(
          "es-AR"
        );


      if(
        envios >= 1
      ){

        btnWhatsapp.style.display =
          "block";

      }


      ocultarError();


    }

    catch(error){


      enviando =
        false;


      if(
        seguimientoFinalizado
      ){
        return;
      }


      if(
        intento < 3
      ){

        const tiempos =
          [
            2000,
            4000,
            8000
          ];


        mostrarError(
          "Conexión interrumpida. Reintentando..."
        );


        setTimeout(

          function(){

            enviarPosicion(
              ultimaPosicion,
              intento + 1
            );

          },

          tiempos[
            intento
          ]

        );


      }else{


        mostrarError(
          "Sin conexión. Se seguirá intentando automáticamente."
        );

      }

    }

  }


  function iniciarHeartbeat(){


    if(
      heartbeatId !== null
    ){
      return;
    }


    heartbeatId =

      setInterval(

        function(){


          if(
            seguimientoFinalizado ||
            !ultimaPosicion
          ){

            return;

          }


          const ahora =
            Date.now();


          if(
            ahora -
            ultimoEnvio
            >= 10000
          ){

            ultimoEnvio =
              ahora;


            enviarPosicion(
              ultimaPosicion,
              0
            );

          }

        },

        2000

      );

  }


  function detenerHeartbeat(){


    if(
      heartbeatId !== null
    ){

      clearInterval(
        heartbeatId
      );


      heartbeatId =
        null;

    }

  }


  function iniciarGPS(){


    if(
      seguimientoFinalizado ||
      watchId !== null
    ){

      return;

    }


    if(
      !navigator.geolocation
    ){

      estado.textContent =
        "GPS no disponible";


      btnReactivar.style.display =
        "block";


      return;

    }


    estado.textContent =
      "Obteniendo ubicación...";


    estado.style.background =
      "#fff3cd";


    btnReactivar.style.display =
      "none";


    watchId =

      navigator.geolocation
      .watchPosition(


        function(
          posicion
        ){


          ultimaPosicion =
            posicion;


          lat.textContent =

            posicion.coords
            .latitude
            .toFixed(
              6
            );


          lon.textContent =

            posicion.coords
            .longitude
            .toFixed(
              6
            );


          acc.textContent =

            Math.round(
              posicion.coords
              .accuracy
            ) +
            " metros";


          hora.textContent =

            new Date()
            .toLocaleTimeString(
              "es-AR"
            );


          estado.textContent =
            "🟢 GPS ACTIVO";


          estado.style.background =
            "#dff5e1";


          const ahora =
            Date.now();


          if(
            envios === 0 ||
            ahora -
            ultimoEnvio
            >= 5000
          ){

            ultimoEnvio =
              ahora;


            enviarPosicion(
              posicion,
              0
            );

          }

        },


        function(){


          if(
            watchId !== null
          ){

            navigator.geolocation
            .clearWatch(
              watchId
            );


            watchId =
              null;

          }


          estado.textContent =
            "GPS interrumpido";


          estado.style.background =
            "#ffe0e0";


          btnReactivar.style.display =
            "block";


          setTimeout(

            function(){

              if(
                !seguimientoFinalizado
              ){

                iniciarGPS();

              }

            },

            3000

          );

        },


        {

          enableHighAccuracy:
            true,

          maximumAge:
            1000,

          timeout:
            10000

        }

      );


    iniciarHeartbeat();

  }


  async function finalizarSeguimiento(){


    seguimientoFinalizado =
      true;


    if(
      watchId !== null
    ){

      navigator.geolocation
      .clearWatch(
        watchId
      );


      watchId =
        null;

    }


    detenerHeartbeat();


    const {
      error
    } =
      await supabaseClient
      .from(
        "services"
      )
      .update({

        status:
          "finished",

        finished_at:
          new Date()
          .toISOString()

      })
      .eq(
        "id",
        serviceId
      );


    if(
      error
    ){

      seguimientoFinalizado =
        false;


      mostrarError(
        "No se pudo finalizar el seguimiento."
      );


      iniciarHeartbeat();


      return;

    }


    localStorage.removeItem(
      "pioca_tracking_code"
    );


    localStorage.removeItem(
      "pioca_tracking_active"
    );


    localStorage.removeItem(
      "pioca_client_name"
    );


    localStorage.removeItem(
      "pioca_client_phone"
    );


    localStorage.removeItem(
      "pioca_client_link"
    );


    localStorage.removeItem(
      "pioca_additional_info"
    );


    localStorage.removeItem(
      "pioca_tracking_expires_at"
    );


    window.location.href =
      "admin.html";

  }


  btnWhatsapp.addEventListener(
    "click",
    abrirWhatsApp
  );


  btnFinalizar.addEventListener(
    "click",
    finalizarSeguimiento
  );


  btnReactivar.addEventListener(
    "click",
    iniciarGPS
  );


  btnRestar5.addEventListener(
    "click",
    function(){

      moverHoraCliente(
        -5
      );

    }
  );


  btnSumar5.addEventListener(
    "click",
    function(){

      moverHoraCliente(
        5
      );

    }
  );


  const acceso =
    await validarAcceso();


  if(
    acceso
  ){

    iniciarGPS();

  }


})();

</script>

</body>

</html>
