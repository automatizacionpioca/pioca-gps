<!-- B20 DIAG / Ajuste visual sin recompilar APK. Pegar justo antes de </body>. -->
<style id="b20-ajuste-gps-compacto">
  /* Un solo semáforo grande a la derecha; sin vehículo ni punto a la izquierda. */
  #gpsEstado {
    display:flex;
    align-items:center;
    min-height:65px;
    padding:15px 76px 15px 17px !important;
    font-size:12.5px;
    line-height:1.3;
    white-space:nowrap;
  }
  #gpsEstado::before { display:none !important; content:none !important; }
  #gpsEstado::after {
    content:"";
    position:absolute;
    top:50%;
    right:18px;
    transform:translateY(-50%);
    display:block;
    width:42px;
    height:42px;
    border:5px solid #f2f6fc;
    border-radius:50%;
    background:#a2b1c0 !important;
    background-image:none !important;
    box-shadow:0 0 0 2px rgba(80,105,133,.18);
    filter:none !important;
    pointer-events:none;
    box-sizing:border-box;
  }
  #gpsEstado.b20GpsOn::after {
    background:#18bf5d !important;
    border-color:#def9e7;
    animation:b20SemaforoPremium 1.45s ease-in-out infinite;
  }
  @keyframes b20SemaforoPremium {
    0%,100% { box-shadow:0 0 0 2px rgba(23,174,85,.26),0 0 0 4px rgba(20,182,91,.12); opacity:1; }
    50% { box-shadow:0 0 0 3px rgba(23,174,85,.22),0 0 0 13px rgba(24,190,89,.15); opacity:.77; }
  }
  /* Tres datos: precisión, última posición y transmisión, siempre alineados. */
  .datos { padding:3px 11px !important; margin-bottom:12px; }
  .datos > div {
    grid-template-columns:max-content minmax(0,1fr) !important;
    gap:7px !important;
    padding:9px 0 !important;
    min-height:38px;
  }
  .datos > div:nth-child(-n+3) { display:none !important; }
  .datos strong { font-size:11.5px !important; white-space:nowrap; font-weight:750; }
  .datos span {
    font-size:11.5px !important;
    max-width:none !important;
    min-width:0;
    white-space:nowrap;
    overflow-wrap:normal !important;
    text-align:right;
    letter-spacing:-.12px;
  }
  @media(max-width:390px) {
    #gpsEstado { padding-right:69px !important; font-size:11.5px; min-height:61px; }
    #gpsEstado::after { right:14px; width:38px; height:38px; }
    .datos { padding:3px 8px !important; }
    .datos > div { gap:5px !important; padding:8px 0 !important; min-height:36px; }
    .datos strong,.datos span { font-size:10.5px !important; letter-spacing:-.18px; }
  }
  @media(prefers-reduced-motion:reduce) { #gpsEstado.b20GpsOn::after { animation:none; } }
</style>
<script id="b20-limpiar-indicadores-duplicados">
(function(){
  'use strict';
  function instalar(id){
    const el=document.getElementById(id);
    if(!el)return;
    const limpiar=function(){
      const antes=el.textContent||'';
      const despues=antes.replace(/^\s*(?:🟢|🟡|🔴|🟠|⚪)\s*/u,'');
      if(despues!==antes)el.textContent=despues;
    };
    new MutationObserver(limpiar).observe(el,{childList:true,characterData:true,subtree:true});
    limpiar();
  }
  function iniciar(){instalar('gpsEstado');instalar('gpsEnvios');}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});
  else iniciar();
})();
</script>
